# Cloudflare Worker config for the Library games worker
# (currently deployed as black-field-f5e8.bozhetarnikmatthew.workers.dev).
#
# Deploy / update:
#   npm install -g wrangler   # or: npx wrangler
#   wrangler login            # once, in your Cloudflare account
#   wrangler secret put GITHUB_REPO    # then GITHUB_TOKEN (see README)
#   wrangler deploy          # from this directory
#
# Secrets are NEVER stored in this file — set them with `wrangler secret put`.

name = "black-field-f5e8"
main = "worker.js"
compatibility_date = "2026-01-01"

# Optional: serve the /Library/book/<id> page from a static assets binding
# instead of SITE_ORIGIN. If you use this, upload the site's Library/book
# assets and keep SITE_ORIGIN unset.
# [assets]
# directory = "./assets"
# binding = "ASSETS"
