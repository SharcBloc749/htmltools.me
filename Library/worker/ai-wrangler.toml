# Cloudflare Worker config for the Studio AI worker
# (currently deployed as aged-heart-d9b9.bozhetarnikmatthew.workers.dev).
#
# Deploy / update:
#   npx wrangler login
#   wrangler secret put <NAME>   # for each secret in README.md
#   npx wrangler deploy -c ai-wrangler.toml   # from this directory
#
# Bindings:
#   KV namespace "AI_QUOTA" must be bound (wrangler.toml [kv_namespaces]).

name = "aged-heart-d9b9"
main = "ai-worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "AI_QUOTA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
