    <!-- Structured data -->
    <script type="application/ld+json">

    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* ---- 3D scene (background) ----
         Sized taller than the viewport so the embed's corner badge
         ("Built with Hana") renders below the visible area. */
      iframe.scene {
        position: fixed;
        top: -100px;
        left: 0;
        width: 100%;
        height: calc(100% + 200px);
        display: block;
        border: 0;
        z-index: 0;
      }

      /* ---- Overlay: wordmark on top, CTA below the logo ---- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 7vh 24px 9vh;
        pointer-events: none; /* let the scene stay interactive */
        font-family: "IBM Plex Mono", "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        color: #f5f5f7;
        user-select: none;
        filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.85));
        animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 12px;
      }

      .mark-fallback {
        display: none;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        place-items: center;
        border: 3px solid #f5f5f7;
        border-radius: 12px;
        color: #f5f5f7;
        font-weight: 700;
        font-size: 15px;
      }

      .brand-name {
        font-size: clamp(26px, 3.8vw, 40px);
        font-weight: 600;
        letter-spacing: 0.1em;
        line-height: 1;
      }

      /* ".me" completes the wordmark once the intro animation settles (~3s) */
      .tld {
        display: inline-block;
        color: rgba(245, 245, 247, 0.85);
        animation: revealIn 1s 3s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .explore-btn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 32px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(10, 10, 12, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f5f5f7;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-decoration: none;
        white-space: nowrap;
        transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        /* appears after the ~3s intro, then breathes with a soft glow */
        animation:
          revealIn 0.9s 3s cubic-bezier(0.16, 1, 0.3, 1) both,
          glowPulse 3.4s 4.1s ease-in-out infinite;
      }

      .explore-btn .arrow {
        display: inline-block;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .explore-btn:hover {
        background: #f5f5f7;
        color: #050505;
        border-color: #f5f5f7;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.18);
        animation-play-state: paused;
      }

      .explore-btn:hover .arrow {
        transform: translateX(4px);
      }

      .explore-btn:active {
        transform: scale(0.97);
      }

      /* ---- Credit ---- */
      .made-by {
        position: fixed;
        right: 18px;
        bottom: 14px;
        z-index: 4;
        font-family: "IBM Plex Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
        pointer-events: none;
        user-select: none;
        animation: revealIn 1s 3.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-20px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0);     filter: blur(0); }
      }

      @keyframes revealIn {
        from { opacity: 0; visibility: hidden; transform: translateY(10px); filter: blur(6px); }
        to   { opacity: 1; visibility: visible; transform: translateY(0);   filter: blur(0); }
      }

      @keyframes glowPulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
          border-color: rgba(255, 255, 255, 0.22);
        }
        50% {
          box-shadow: 0 0 22px rgba(255, 255, 255, 0.25), 0 0 55px rgba(255, 255, 255, 0.1);
          border-color: rgba(255, 255, 255, 0.55);
        }
      }

      @media (max-width: 560px) {
        .overlay { padding: 6vh 16px 8vh; }
        .brand { gap: 12px; }
        .brand-mark { width: 42px; height: 42px; }
        .explore-btn { padding: 14px 24px; font-size: 12px; }
        .made-by { right: 14px; bottom: 12px; font-size: 9px; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .tld, .explore-btn, .made-by { opacity: 1; visibility: visible; }
      }
    </style>
  </head>
  <body>
    <iframe
      class="scene"
      src="https://my.spline.design/typographicechomotioncopycopy-LZVnfGjEa1zfM3NOJXCHT4Uv-0Xo/?t=1789912512381"
      frameborder="0"
      title="HTMLTools animated logo"
    ></iframe>

    <div class="overlay">
      <div class="brand">
        <div class="brand-mark">
          <img
            src="https://htmltools.me/logo3.png"
            alt="HTMLTools logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <span class="mark-fallback">&lt;HT&gt;</span>
        </div>
        <span class="brand-name">HTMLTools<span class="tld">.me</span></span>
      </div>

      <a class="explore-btn" href="https://htmltools.me/Tools">
        Explore the Tools
        <span class="arrow">&rarr;</span>
      </a>
    </div>

    <span class="made-by">Made by Matthew</span>
