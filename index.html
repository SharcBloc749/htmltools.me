
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTMLTools</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* ---- 3D accordion scene (background) ---- */
      iframe.scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        z-index: 0;
      }

      /* ---- Black patch hiding the "Built with Hana" badge (bottom-right) ---- */
      .badge-cover {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 240px;
        height: 80px;
        background: #000;
        z-index: 2;
        pointer-events: none;
      }

      /* ---- Overlay: wordmark on top, CTA below the logo ---- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 7vh 24px 9vh;
        pointer-events: none; /* let the accordion scene stay interactive */
        font-family: "IBM Plex Mono", "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        color: #f5f5f7;
        user-select: none;
        filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.85));
        animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 12px;
      }

      .mark-fallback {
        display: none;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        place-items: center;
        border: 3px solid #f5f5f7;
        border-radius: 12px;
        color: #f5f5f7;
        font-weight: 700;
        font-size: 15px;
      }

      .brand-name {
        font-size: clamp(26px, 3.8vw, 40px);
        font-weight: 600;
        letter-spacing: 0.1em;
        line-height: 1;
      }

      .explore-btn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 32px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(10, 10, 12, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f5f5f7;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-decoration: none;
        white-space: nowrap;
        transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        animation: fadeInUp 1s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .explore-btn .arrow {
        display: inline-block;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .explore-btn:hover {
        background: #f5f5f7;
        color: #050505;
        border-color: #f5f5f7;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.18);
      }

      .explore-btn:hover .arrow {
        transform: translateX(4px);
      }

      .explore-btn:active {
        transform: scale(0.97);
      }

      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-20px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0);     filter: blur(0); }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
        to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
      }

      @media (max-width: 560px) {
        .overlay { padding: 6vh 16px 8vh; }
        .brand { gap: 12px; }
        .brand-mark { width: 42px; height: 42px; }
        .explore-btn { padding: 14px 24px; font-size: 12px; }
        .badge-cover { width: 180px; height: 64px; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <iframe
      class="scene"
      src="https://my.spline.design/verticalaccordioncopycopy-UO7mKgBoZPbAKgpr56UCJrdC-Z7B/"
      frameborder="0"
      title="HTMLTools animated logo"
    ></iframe>

    <!-- Covers the "Built with Hana" badge rendered by the embed -->
    <div class="badge-cover"></div>

    <div class="overlay">
      <div class="brand">
        <div class="brand-mark">
          <img
            src="https://htmltools.me/logo3.png"
            alt="HTMLTools logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <span class="mark-fallback">&lt;HT&gt;</span>
        </div>
        <span class="brand-name">HTMLTools</span>
      </div>

      <a class="explore-btn" href="https://htmltools.me/Tools">
        Explore the Tools
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </body>
</html>
