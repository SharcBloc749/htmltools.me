<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ChatGPT — HTMLTools</title>
<link rel="icon" type="image/png" href="https://htmltools.me/logo3.png"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0c;--surface:#111214;--panel:#18191c;--panel2:#202226;
  --border:#26282c;--border2:#303338;--borderhi:#454952;
  --tx:#ececec;--tx2:#9a9ba0;--tx3:#5c5e64;
  --white:#fff;--wfg:#0c0c0c;
  --accent:#10a37f;--accenthi:#1abc94;--accentdim:rgba(16,163,127,.12);
  --green:#16a34a;--greenhi:#22c55e;
  --red:#dc2626;--redhi:#ef4444;
  --r:8px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-full:999px;
  --nav-h:52px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 6px 24px rgba(0,0,0,.35);
  --shadow-pop:0 10px 40px rgba(0,0,0,.5);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(16,163,127,.25);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--borderhi);}

/* ── NAV ── */
nav{height:var(--nav-h);background:linear-gradient(180deg,#0e0e0e,#0c0c0c);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:9px;padding-right:14px;margin-right:6px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:28px;height:28px;border-radius:9px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.06);}
.nav-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.nav-name{font-size:.82rem;font-weight:600;color:var(--tx);letter-spacing:-.01em;}
.nav-spacer{flex:1;}
.nav-user{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--tx3);}
.nav-user-email{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);}

/* ── LAYOUT ── */
.viewport{flex:1;display:flex;overflow:hidden;}
.sidebar{width:264px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.sb-section{font-size:.65rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin:10px 0 3px;padding:0 4px;}
.sb-new{width:100%;height:36px;background:var(--white);color:var(--wfg);border:none;border-radius:var(--r-md);font-family:var(--font);font-size:.82rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,opacity .12s;box-shadow:var(--shadow-sm);}
.sb-new:hover{opacity:.9;transform:translateY(-1px);}
.sb-new:active{transform:translateY(0);}
.sb-conv{padding:8px 10px;border-radius:var(--r);font-size:.8rem;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .13s;border:1px solid transparent;user-select:none;position:relative;}
.sb-conv:hover{background:var(--panel);color:var(--tx);}
.sb-conv:hover .sb-conv-del{display:flex;}
.sb-conv.active{background:var(--panel2);border-color:var(--border2);color:var(--tx);box-shadow:inset 2px 0 0 var(--accent);}
.sb-conv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.sb-conv-del{display:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:transparent;border:none;color:var(--tx3);flex-shrink:0;font-size:.72rem;transition:all .13s;}
.sb-conv-del:hover{background:rgba(220,38,38,.15);color:var(--redhi);}
.sb-empty{color:var(--tx3);font-size:.78rem;font-style:italic;padding:8px 4px;}
.btn{background:var(--panel);border:1px solid var(--border2);color:var(--tx2);padding:0 12px;border-radius:var(--r);font-size:.78rem;font-weight:500;font-family:var(--font);transition:all .13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:29px;}
.btn:hover{background:var(--panel2);border-color:var(--borderhi);color:var(--tx);}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-prim{background:var(--white);color:var(--wfg);border-color:var(--white);font-weight:600;}
.btn-prim:hover{opacity:.88;background:var(--white);border-color:var(--white);color:var(--wfg);}
.btn-danger{color:var(--redhi);border-color:rgba(220,38,38,.2);background:transparent;}
.btn-danger:hover{background:rgba(220,38,38,.08);border-color:var(--redhi);}
.btn-full{width:100%;justify-content:center;height:34px;font-size:.82rem;}

/* ── AUTH ── */
.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(16,163,127,.06),transparent 60%);}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:400px;overflow:hidden;box-shadow:var(--shadow-pop);}
.auth-hdr{padding:24px 26px 16px;border-bottom:1px solid var(--border);}
.auth-hdr-brand{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.auth-hdr-mark{width:32px;height:32px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow-sm);}
.auth-hdr-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.auth-hdr h2{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;}
.auth-hdr p{font-size:.78rem;color:var(--tx3);margin-top:4px;}
.auth-body{padding:20px 26px;display:flex;flex-direction:column;gap:13px;}
.auth-foot{padding:14px 26px;border-top:1px solid var(--border);font-size:.75rem;color:var(--tx3);text-align:center;}
.auth-foot a{color:var(--accenthi);text-decoration:none;cursor:pointer;font-weight:500;}
.auth-foot a:hover{text-decoration:underline;}
.auth-err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:9px 11px;font-size:.75rem;color:var(--redhi);display:none;}
.auth-err.show{display:block;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:2px 0;}
.auth-divider span{font-size:.68rem;color:var(--tx3);white-space:nowrap;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-google-btn{width:100%;height:37px;background:var(--panel);border:1px solid var(--border2);color:var(--tx2);border-radius:var(--r);font-family:var(--font);font-size:.8rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .13s;}
.auth-google-btn:hover{border-color:var(--borderhi);color:var(--tx);background:var(--panel2);}
.auth-google-btn svg{flex-shrink:0;}
label.lbl{display:block;font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:5px;}
input.inp,textarea.inp{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.84rem;padding:0 11px;height:34px;border-radius:var(--r);outline:none;transition:border-color .13s,box-shadow .13s;-webkit-appearance:none;}
input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentdim);}
input.inp::placeholder,textarea.inp::placeholder{color:var(--tx3);}

/* ── CHAT ── */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chat-scroll{flex:1;overflow-y:auto;}
.chat-inner{max-width:760px;margin:0 auto;padding:28px 20px 12px;display:flex;flex-direction:column;gap:26px;}
.msg{display:flex;flex-direction:column;gap:6px;max-width:100%;}
.msg-user{align-items:flex-end;}
.msg-bot{align-items:flex-start;}
.msg-bubble{border-radius:var(--r-lg);padding:11px 15px;font-size:.88rem;line-height:1.68;}
.msg-user .msg-bubble{background:var(--panel2);border:1px solid var(--border2);color:var(--tx);max-width:75%;box-shadow:var(--shadow-sm);}
.msg-bot .msg-bubble{background:transparent;color:var(--tx);padding:2px 2px;max-width:100%;}
.msg-bubble p{margin:0 0 10px;}
.msg-bubble p:last-child{margin-bottom:0;}
.msg-bubble strong{color:var(--white);font-weight:600;}
.msg-bubble em{font-style:italic;}
.msg-bubble code{font-family:var(--mono);font-size:.85em;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1.5px 6px;color:var(--accenthi);}
.msg-bubble ul,.msg-bubble ol{margin:0 0 10px;padding-left:22px;}
.msg-bubble li{margin-bottom:3px;}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{font-weight:700;margin:16px 0 9px;letter-spacing:-.01em;}
.msg-bubble h1{font-size:1.08rem;}
.msg-bubble h2{font-size:1rem;}
.msg-bubble h3{font-size:.92rem;}
.msg-bubble h1:first-child,.msg-bubble h2:first-child,.msg-bubble h3:first-child{margin-top:0;}
.msg-bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.msg-bubble table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:.83rem;border-radius:var(--r);overflow:hidden;}
.msg-bubble th,.msg-bubble td{border:1px solid var(--border2);padding:7px 10px;text-align:left;}
.msg-bubble th{background:var(--panel2);font-weight:600;color:var(--tx);}
.msg-bubble a{color:#7fc4ff;text-decoration:underline;text-underline-offset:2px;}

/* code blocks with copy/download */
.code-block{position:relative;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-md);margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow-sm);}
.code-block-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 14px;background:var(--panel2);border-bottom:1px solid var(--border);}
.code-block-lang{font-family:var(--mono);font-size:.72rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;}
.code-block-actions{display:flex;gap:4px;}
.code-action-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid transparent;color:var(--tx2);font-size:.72rem;font-family:var(--font);font-weight:500;padding:4px 9px;border-radius:6px;transition:all .13s;}
.code-action-btn:hover{background:var(--panel);border-color:var(--border2);color:var(--tx);}
.code-action-btn svg{flex-shrink:0;}
.code-action-btn.copied{color:var(--accenthi);}
.code-block pre{background:transparent;border:none;border-radius:0;padding:13px 15px;overflow-x:auto;margin:0;}
.code-block pre code{background:none;border:none;padding:0;font-size:.79rem;line-height:1.7;color:var(--tx2);font-family:var(--mono);}

.msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
.msg:hover .msg-actions{opacity:1;}
.msg-action-btn{width:26px;height:26px;border-radius:7px;background:transparent;border:none;color:var(--tx3);display:flex;align-items:center;justify-content:center;font-size:.74rem;transition:all .13s;}
.msg-action-btn:hover{background:var(--panel2);color:var(--tx);}
.msg-role-icon{width:24px;height:24px;border-radius:8px;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow-sm);}
.msg-role-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.msg-bot-hdr{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
.msg-bot-hdr span{font-size:.72rem;font-weight:600;color:var(--tx3);}
.typing-dots{display:flex;gap:4px;padding:7px 2px;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.3s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.18s;}
.typing-dots span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;}
.empty-chat-mark{width:52px;height:52px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow-md);}
.empty-chat-mark img{width:100%;height:100%;object-fit:cover;}
.empty-chat h2{font-size:1.15rem;font-weight:600;letter-spacing:-.02em;color:var(--tx2);}

.composer-wrap{border-top:1px solid var(--border);padding:16px 20px 18px;flex-shrink:0;background:linear-gradient(0deg,#0c0c0c,rgba(12,12,12,.4));}
.composer-inner{max-width:760px;margin:0 auto;}
.composer{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-lg);display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 16px;transition:border-color .13s,box-shadow .13s;}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentdim);}
.composer textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--tx);font-family:var(--font);font-size:.88rem;line-height:1.5;max-height:160px;padding:6px 0;}
.composer textarea::placeholder{color:var(--tx3);}
.composer-send{width:32px;height:32px;border-radius:50%;background:var(--white);color:var(--wfg);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.composer-send:hover{opacity:.85;transform:scale(1.04);}
.composer-send:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.composer-hint{text-align:center;font-size:.68rem;color:var(--tx3);margin-top:9px;}
.err-banner{max-width:760px;margin:0 auto 10px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:9px 13px;font-size:.76rem;color:var(--redhi);}

#app-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:.76rem;color:var(--tx3);}
#app-loading.hidden{display:none;}
.spin{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

footer{padding:6px 16px;font-size:.7rem;color:var(--tx3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);}
footer strong{color:var(--tx2);font-weight:500;}
footer .dot{color:var(--borderhi);}

@media(max-width:720px){
  .sidebar{position:fixed;left:0;top:var(--nav-h);bottom:0;z-index:90;transform:translateX(-100%);transition:transform .18s;box-shadow:2px 0 24px rgba(0,0,0,.45);}
  .sidebar.open{transform:translateX(0);}
  .msg-user .msg-bubble{max-width:88%;}
}
</style>
</head>

  <div class="nav-user">
    <div class="nav-mark" style="width:24px;height:24px;border-radius:7px;"><img src="https://htmltools.me/logo3.png" alt="HTMLTools"/></div>
    <span class="nav-user-email" id="nav-email"></span>
    <button class="btn btn-danger" id="signout-btn" style="height:27px;font-size:.72rem;">Sign out</button>
  </div>
</nav>

<!-- AUTH PAGE -->
<div id="auth-page" style="display:none;flex:1;overflow:hidden;">
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-hdr">
        <div class="auth-hdr-brand">
          <div class="auth-hdr-mark"><img src="https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg" alt="ChatGPT"/></div>
          <span style="font-size:.82rem;font-weight:600;color:var(--tx2);">ChatGPT</span>
        </div>
        <h2 id="auth-title">Sign in</h2>
        <p id="auth-subtitle">Continue to your conversations</p>
      </div>
      <div class="auth-body">
        <div class="auth-err" id="auth-err"></div>
        <button class="auth-google-btn" id="google-signin-btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or use email</span></div>
        <div>
          <label class="lbl">Email</label>
          <input class="inp" type="email" id="auth-email" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div>
          <label class="lbl">Password</label>
          <input class="inp" type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn btn-prim btn-full" id="auth-submit-btn" style="height:36px;font-size:.84rem;">Sign in</button>
      </div>
      <div class="auth-foot" id="auth-switch-text">
        Don't have an account? <a id="auth-switch-link">Create one</a>
      </div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" style="display:none;flex:1;overflow:hidden;">
  <div class="viewport">
    <div class="sidebar" id="sidebar">
      <button class="sb-new" id="btn-new-chat">+ New chat</button>
      <div class="sb-section">Conversations</div>
      <div id="conv-list"><div class="sb-empty">No conversations yet.</div></div>
    </div>
    <div class="content">
      <div class="chat-wrap">
        <div class="chat-scroll" id="chat-scroll">
          <div class="empty-chat" id="empty-chat">
            <div class="empty-chat-mark"><img src="https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg" alt="ChatGPT"/></div>
            <h2>Ready when you are.</h2>
          </div>
          <div class="chat-inner" id="chat-inner" style="display:none;"></div>
        </div>
        <div class="composer-wrap">
          <div class="err-banner" id="err-banner" style="display:none;"></div>
          <div class="composer-inner">
            <div class="composer">
              <textarea id="composer-input" placeholder="Ask anything" rows="1"></textarea>
              <button class="composer-send" id="composer-send" disabled>&#8593;</button>
            </div>
            <div class="composer-hint">ChatGPT can make mistakes. Check important info.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer><strong>HTML Tools</strong><span class="dot">·</span><span>ChatGPT</span><span class="dot">·</span><span>built by Matthew</span></footer>

// ── UTILS ──
function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId(len) {
  var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', s = '';
  var arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  for (var i = 0; i < len; i++) s += chars[arr[i] % chars.length];
  return s;
}

// map language identifier -> file extension for downloads
var LANG_EXT = {
  html:'html', htm:'html', xml:'xml', css:'css', js:'js', javascript:'js',
  json:'json', ts:'ts', typescript:'ts', py:'py', python:'py', java:'java',
  c:'c', cpp:'cpp', 'c++':'cpp', csharp:'cs', cs:'cs', php:'php', rb:'rb',
  ruby:'rb', go:'go', rs:'rs', rust:'rs', sh:'sh', bash:'sh', shell:'sh',
  sql:'sql', yaml:'yml', yml:'yml', md:'md', markdown:'md', txt:'txt'
};

// ── MARKDOWN RENDERER ──
// Lightweight markdown -> HTML. Handles: **bold**, *italic*, `code`,
// ```code blocks``` (rendered with a header + copy/download actions),
// literal <br> tags, \n line breaks, headings, lists, tables, links, hr.
// Escapes HTML first so nothing user-provided or model-provided can
// inject markup outside of what we explicitly render.
var _codeStore = {}; // id -> raw code, used by copy/download handlers
var _codeStoreSeq = 0;

function renderMarkdown(src) {
  if (!src) return '';
  var text = esc(src);

  // Restore literal <br> the model might emit as text (already escaped above
  // to &lt;br&gt;) back into real line breaks.
  text = text.replace(/&lt;br\s*\/?&gt;/gi, '\n');

  // Extract fenced code blocks first so inner content isn't touched by other rules.
  var codeBlocks = [];
  text = text.replace(/```([a-zA-Z0-9+#]*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    var idx = codeBlocks.length;
    codeBlocks.push({ lang: (lang||'').toLowerCase(), code: code.replace(/\n$/,'') });
    return '\u0000CODEBLOCK' + idx + '\u0000';
  });

  var lines = text.split('\n');
  var html = [];
  var i = 0;
  var inList = null; // 'ul' | 'ol' | null
  var tableBuf = [];

  function closeList() {
    if (inList) { html.push('</' + inList + '>'); inList = null; }
  }
  function flushTable() {
    if (!tableBuf.length) return;
    var rows = tableBuf.filter(function(r){ return !/^\s*\|?[\s:|-]+\|?\s*$/.test(r); });
    var out = '<table>';
    rows.forEach(function(r, ri) {
      var cells = r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){ return inlineFmt(c.trim()); });
      out += '<tr>' + cells.map(function(c){ return (ri===0?'<th>':'<td>') + c + (ri===0?'</th>':'</td>'); }).join('') + '</tr>';
    });
    out += '</table>';
    html.push(out);
    tableBuf = [];
  }
  function inlineFmt(s) {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  for (i = 0; i < lines.length; i++) {
    var line = lines[i];

    var cbMatch = line.trim().match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if (cbMatch) {
      closeList(); flushTable();
      var idx = parseInt(cbMatch[1]);
      html.push(renderCodeBlock(codeBlocks[idx].lang, codeBlocks[idx].code));
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line)) {
      tableBuf.push(line);
      continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (/^\s*---+\s*$/.test(line) || /^\s*\*\*\*+\s*$/.test(line)) {
      closeList();
      html.push('<hr>');
      continue;
    }

    var h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      closeList();
      var lvl = h[1].length;
      html.push('<h' + lvl + '>' + inlineFmt(h[2]) + '</h' + lvl + '>');
      continue;
    }

    var ol = line.match(/^\s*\d+\.\s+(.*)$/);
    var ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); html.push('<ol>'); inList = 'ol'; }
      html.push('<li>' + inlineFmt(ol[1]) + '</li>');
      continue;
    }
    if (ul) {
      if (inList !== 'ul') { closeList(); html.push('<ul>'); inList = 'ul'; }
      html.push('<li>' + inlineFmt(ul[1]) + '</li>');
      continue;
    }
    closeList();

    if (line.trim() === '') {
      html.push('');
      continue;
    }

    html.push('<p>' + inlineFmt(line) + '</p>');
  }
  closeList(); flushTable();

  // Collapse consecutive empty markers, join.
  return html.filter(function(l){ return l !== ''; }).join('\n');
}

function renderCodeBlock(lang, code) {
  var storeId = 'cb' + (_codeStoreSeq++);
  _codeStore[storeId] = code;
  var ext = LANG_EXT[lang] || (lang ? lang : 'txt');
  var label = lang ? lang : 'text';
  return (
    '<div class="code-block" data-store-id="'+storeId+'">' +
      '<div class="code-block-hdr">' +
        '<span class="code-block-lang">'+esc(label)+'</span>' +
        '<div class="code-block-actions">' +
          '<button class="code-action-btn code-copy-btn" data-store-id="'+storeId+'" title="Copy">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            '<span>Copy</span>' +
          '</button>' +
          '<button class="code-action-btn code-download-btn" data-store-id="'+storeId+'" data-ext="'+esc(ext)+'" title="Download">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            '<span>Download</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<pre><code>' + esc(code) + '</code></pre>' +
    '</div>'
  );
}

// Delegated click handling for copy/download buttons (works for dynamically inserted content)
document.addEventListener('click', function(e) {
  var copyBtn = e.target.closest('.code-copy-btn');
  if (copyBtn) {
    var id = copyBtn.dataset.storeId;
    var code = _codeStore[id] || '';
    navigator.clipboard.writeText(code).then(function() {
      var span = copyBtn.querySelector('span');
      var prevText = span.textContent;
      copyBtn.classList.add('copied');
      span.textContent = 'Copied!';
      setTimeout(function(){ copyBtn.classList.remove('copied'); span.textContent = prevText; }, 1400);
    }).catch(function(){});
    return;
  }
  var dlBtn = e.target.closest('.code-download-btn');
  if (dlBtn) {
    var id2 = dlBtn.dataset.storeId;
    var code2 = _codeStore[id2] || '';
    var ext = dlBtn.dataset.ext || 'txt';
    var blob = new Blob([code2], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'code.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
});

// ── AUTOSIZE TEXTAREA ──
var composerInput = document.getElementById('composer-input');
var composerSend  = document.getElementById('composer-send');
composerInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  composerSend.disabled = !this.value.trim();
});
composerInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (this.value.trim()) sendMessage();
  }
});
composerSend.addEventListener('click', function() { if (composerInput.value.trim()) sendMessage(); });

// ── STATE ──
var currentUser = null;
var conversations = [];
var activeConvId = null;
var isSending = false;

// ── AUTH STATE ──
auth.onAuthStateChanged(function(user) {
  document.getElementById('app-loading').classList.add('hidden');
  if (user) {
    currentUser = user;
    document.getElementById('auth-page').style.display = 'none';
    document.getElementById('main-app').style.display  = 'flex';
    document.getElementById('main-nav').style.display  = 'flex';
    document.getElementById('nav-email').textContent   = user.email || user.displayName || 'Signed in';
    loadConversations();
  } else {
    currentUser = null;
    document.getElementById('auth-page').style.display = 'flex';
    document.getElementById('main-app').style.display  = 'none';
    document.getElementById('main-nav').style.display  = 'none';
  }
});

// ── AUTH UI ──
var authMode = 'signin';
function setAuthMode(mode) {
  authMode = mode;
  var errEl = document.getElementById('auth-err');
  errEl.classList.remove('show'); errEl.textContent = '';
  if (mode === 'signup') {
    document.getElementById('auth-title').textContent      = 'Create your account';
    document.getElementById('auth-subtitle').textContent   = 'Start chatting in seconds';
    document.getElementById('auth-submit-btn').textContent = 'Create account';
    document.getElementById('auth-switch-text').innerHTML  = 'Already have an account? <a id="auth-switch-link">Sign in</a>';
  } else {
    document.getElementById('auth-title').textContent      = 'Sign in';
    document.getElementById('auth-subtitle').textContent   = 'Continue to your conversations';
    document.getElementById('auth-submit-btn').textContent = 'Sign in';
    document.getElementById('auth-switch-text').innerHTML  = "Don't have an account? <a id=\"auth-switch-link\">Create one</a>";
  }
  document.getElementById('auth-switch-link').addEventListener('click', function(){
    setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
  });
}
document.getElementById('auth-submit-btn').addEventListener('click', async function() {
  var email = document.getElementById('auth-email').value.trim();
  var pass  = document.getElementById('auth-password').value;
  var errEl = document.getElementById('auth-err');
  errEl.classList.remove('show');
  if (!email || !pass) { errEl.textContent='Please enter your email and password.'; errEl.classList.add('show'); return; }
  this.disabled = true;
  this.textContent = authMode === 'signup' ? 'Creating account…' : 'Signing in…';
  try {
    if (authMode === 'signup') await auth.createUserWithEmailAndPassword(email, pass);
    else                       await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    var map = {
      'auth/wrong-password':'Incorrect email or password.','auth/user-not-found':'Incorrect email or password.',
      'auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'An account with this email already exists.',
      'auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Please enter a valid email address.',
      'auth/too-many-requests':'Too many attempts. Please wait and try again.'
    };
    errEl.textContent = map[e.code] || 'Authentication failed. Please try again.';
    errEl.classList.add('show');
    this.disabled = false;
    this.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
  }
});
document.getElementById('auth-email').addEventListener('keydown',    function(e){ if(e.key==='Enter') document.getElementById('auth-password').focus(); });
document.getElementById('auth-password').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('auth-submit-btn').click(); });
document.getElementById('auth-switch-link').addEventListener('click', function(){ setAuthMode(authMode==='signin'?'signup':'signin'); });
document.getElementById('google-signin-btn').addEventListener('click', async function() {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      var errEl = document.getElementById('auth-err');
      errEl.textContent = e.message || 'Google sign-in failed.'; errEl.classList.add('show');
    }
  }
});
document.getElementById('signout-btn').addEventListener('click', async function() {
  await auth.signOut();
  conversations = []; activeConvId = null;
  document.getElementById('conv-list').innerHTML = '<div class="sb-empty">No conversations yet.</div>';
  showEmptyChat();
});

// ── SIDEBAR TOGGLE (mobile) ──
var sidebarToggle = document.getElementById('sidebar-toggle-btn');
function checkMobile() {
  var mobile = window.innerWidth <= 720;
  sidebarToggle.style.display = mobile ? 'flex' : 'none';
  if (!mobile) document.getElementById('sidebar').classList.remove('open');
}
window.addEventListener('resize', checkMobile);
checkMobile();
sidebarToggle.addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
});

// ── FIREBASE DATA ──
function userPath() { return 'chatgpt_users/' + currentUser.uid + '/conversations'; }

async function loadConversations() {
  try {
    var snap = await db.ref(userPath()).get();
    conversations = [];
    if (snap.exists()) snap.forEach(function(c){
      var v = c.val();
      v.messages = v.messages || [];
      conversations.push(v);
    });
    conversations.sort(function(a,b){ return (b.updated||b.created||0)-(a.updated||a.created||0); });
    renderSidebar();
    showEmptyChat();
  } catch(e) { console.error('Failed to load conversations', e); }
}

async function persistConversation(conv) {
  var toSave = {
    id: conv.id,
    title: conv.title || 'New chat',
    messages: conv.messages || [],
    created: conv.created || Date.now(),
    updated: Date.now(),
    uid: currentUser.uid
  };
  await db.ref(userPath() + '/' + conv.id).set(toSave);
  var i = conversations.findIndex(function(c){return c.id===conv.id;});
  if (i>=0) conversations[i]=toSave; else conversations.unshift(toSave);
  conversations.sort(function(a,b){ return (b.updated||b.created||0)-(a.updated||a.created||0); });
  return toSave;
}

// ── SIDEBAR RENDER ──
function renderSidebar() {
  var list = document.getElementById('conv-list');
  if (!conversations.length) { list.innerHTML='<div class="sb-empty">No conversations yet.</div>'; return; }
  list.innerHTML = conversations.map(function(c){
    return '<div class="sb-conv'+(c.id===activeConvId?' active':'')+'" data-id="'+c.id+'">' +
      '<span class="sb-conv-name">'+esc(c.title||'New chat')+'</span>' +
      '<button class="sb-conv-del" data-id="'+c.id+'" title="Delete">&#10005;</button>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.sb-conv').forEach(function(el){
    el.addEventListener('click', function(e){
      if (e.target.classList.contains('sb-conv-del')) return;
      var c = conversations.find(function(x){return x.id===el.dataset.id;});
      if (c) { activeConvId=c.id; renderSidebar(); showConversation(c); document.getElementById('sidebar').classList.remove('open'); }
    });
  });
  list.querySelectorAll('.sb-conv-del').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      var id = btn.dataset.id;
      if (!confirm('Delete this conversation?')) return;
      try {
        await db.ref(userPath()+'/'+id).remove();
        conversations = conversations.filter(function(c){return c.id!==id;});
        if (activeConvId === id) { activeConvId = null; showEmptyChat(); }
        renderSidebar();
      } catch(err) { console.error(err); }
    });
  });
}

// ── CHAT VIEW ──
function showEmptyChat() {
  document.getElementById('empty-chat').style.display = 'flex';
  document.getElementById('chat-inner').style.display = 'none';
  document.getElementById('chat-inner').innerHTML = '';
}

function showConversation(conv) {
  document.getElementById('empty-chat').style.display = 'none';
  var inner = document.getElementById('chat-inner');
  inner.style.display = 'flex';
  inner.style.flexDirection = 'column';
  inner.innerHTML = '';
  (conv.messages || []).forEach(function(m) { appendMessageEl(m.role, m.content); });
  scrollChatToBottom();
}

function scrollChatToBottom() {
  var sc = document.getElementById('chat-scroll');
  sc.scrollTop = sc.scrollHeight;
}

function appendMessageEl(role, content) {
  var inner = document.getElementById('chat-inner');
  inner.style.display = 'flex';
  document.getElementById('empty-chat').style.display = 'none';

  var msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-bot');

  if (role === 'assistant') {
    var hdr = document.createElement('div');
    hdr.className = 'msg-bot-hdr';
    hdr.innerHTML = '<div class="msg-role-icon"><img src="https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg" alt=""/></div><span>ChatGPT</span>';
    msg.appendChild(hdr);
  }

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(content);
  msg.appendChild(bubble);

  var actions = document.createElement('div');
  actions.className = 'msg-actions';
  var copyBtn = document.createElement('button');
  copyBtn.className = 'msg-action-btn';
  copyBtn.title = 'Copy';
  copyBtn.innerHTML = '&#128203;';
  copyBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(content).then(function(){
      copyBtn.innerHTML = '&#10003;';
      setTimeout(function(){ copyBtn.innerHTML = '&#128203;'; }, 1200);
    }).catch(function(){});
  });
  actions.appendChild(copyBtn);
  msg.appendChild(actions);

  inner.appendChild(msg);
  return msg;
}

function appendTypingIndicator() {
  var inner = document.getElementById('chat-inner');
  var msg = document.createElement('div');
  msg.className = 'msg msg-bot';
  msg.id = 'typing-indicator';
  msg.innerHTML =
    '<div class="msg-bot-hdr"><div class="msg-role-icon"><img src="https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg" alt=""/></div><span>ChatGPT</span></div>' +
    '<div class="typing-dots"><span></span><span></span><span></span></div>';
  inner.appendChild(msg);
  scrollChatToBottom();
}
function removeTypingIndicator() {
  var el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function showChatError(text) {
  var el = document.getElementById('err-banner');
  el.textContent = text;
  el.style.display = 'block';
}
function hideChatError() {
  document.getElementById('err-banner').style.display = 'none';
}

// ── NEW CHAT ──
document.getElementById('btn-new-chat').addEventListener('click', function() {
  activeConvId = null;
  renderSidebar();
  showEmptyChat();
  hideChatError();
  document.getElementById('sidebar').classList.remove('open');
  composerInput.focus();
});

// ── SEND MESSAGE ──
async function sendMessage() {
  if (isSending) return;
  var text = composerInput.value.trim();
  if (!text) return;
  hideChatError();

  composerInput.value = '';
  composerInput.style.height = 'auto';
  composerSend.disabled = true;
  isSending = true;

  var isNewConv = !activeConvId;
  var conv;
  if (isNewConv) {
    conv = {
      id: genId(20),
      title: text.length > 48 ? text.slice(0,48).trim() + '…' : text,
      messages: [],
      created: Date.now()
    };
    activeConvId = conv.id;
  } else {
    conv = conversations.find(function(c){ return c.id === activeConvId; });
  }

  conv.messages.push({ role: 'user', content: text, ts: Date.now() });
  appendMessageEl('user', text);
  scrollChatToBottom();
  appendTypingIndicator();

  // Persist user message immediately so it's never lost even if the reply fails.
  try { conv = await persistConversation(conv); } catch(e) { console.error('Save failed', e); }
  renderSidebar();

  try {
    var history = conv.messages.map(function(m){ return { role: m.role, content: m.content }; });
    var res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    var data = await res.json();
    removeTypingIndicator();

    if (!res.ok || data.error) {
      showChatError(data.error || ('Request failed (' + res.status + ')'));
      isSending = false;
      composerSend.disabled = !composerInput.value.trim();
      return;
    }

    var reply = data.output_text || '';
    if (!reply) {
      showChatError('The assistant returned an empty response. Try again.');
      isSending = false;
      composerSend.disabled = !composerInput.value.trim();
      return;
    }

    conv.messages.push({ role: 'assistant', content: reply, ts: Date.now() });
    appendMessageEl('assistant', reply);
    scrollChatToBottom();
    try { conv = await persistConversation(conv); } catch(e) { console.error('Save failed', e); }
    renderSidebar();
  } catch(err) {
    removeTypingIndicator();
    showChatError('Network error: ' + err.message);
  }

  isSending = false;
  composerSend.disabled = !composerInput.value.trim();
  composerInput.focus();
}
</script>
