<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#17150f;--surface:#1e1b14;--panel:#25211a;--panel2:#2c2820;
  --border:#38332a;--border2:#453f33;--borderhi:#5c5445;
  --tx:#ede8dd;--tx2:#a89f8c;--tx3:#6b6355;
  --paper:#f3efe4;--ink:#17150f;
  --white:#f3efe4;--wfg:#17150f;
  --mark:#c1462f;--markhi:#d85639;
  --green:#4c6b4f;--greenhi:#5e8062;
  --red:#a8402c;--redhi:#c1462f;
  --r:2px;--r-md:3px;--r-lg:4px;--r-xl:5px;
  --nav-h:50px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --display:'Fraunces','IBM Plex Sans',serif;
  --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;overflow:hidden;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(237,232,221,.035) 1px, transparent 0);
  background-size:20px 20px;
}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(193,70,47,.35);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--borderhi);}

/* ── NAV: registration-mark brand, mono tabs like frame-counter labels ── */
nav{height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:4px;flex-shrink:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:8px;padding-right:14px;margin-right:6px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:22px;height:22px;border-radius:2px;overflow:hidden;flex-shrink:0;border:1px solid var(--border2);}
.nav-mark img{width:22px;height:22px;object-fit:contain;display:block;}
.nav-name{font-size:.72rem;font-weight:600;color:var(--tx2);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
.nav-tab{padding:5px 11px;border-radius:var(--r);font-size:.72rem;font-weight:600;font-family:var(--mono);letter-spacing:.02em;color:var(--tx3);cursor:pointer;transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid transparent;user-select:none;min-height:29px;background:transparent;text-transform:uppercase;}
.nav-tab:hover{color:var(--tx2);background:var(--panel);}
.nav-tab.active{color:var(--mark);background:transparent;border-color:var(--border);border-bottom:1.5px solid var(--mark);border-radius:0;}
.nav-spacer{flex:1;}
.nav-user{display:flex;align-items:center;gap:9px;font-size:.72rem;color:var(--tx3);font-family:var(--mono);}
.nav-user-email{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-pill{font-size:.6rem;font-weight:700;letter-spacing:.08em;color:var(--wfg);background:var(--mark);padding:2px 6px;border-radius:2px;text-transform:uppercase;font-family:var(--mono);}

.btn{background:transparent;border:1px solid var(--border2);color:var(--tx2);padding:0 11px;border-radius:var(--r);font-size:.75rem;font-weight:500;font-family:var(--mono);letter-spacing:.01em;transition:all .12s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;height:28px;}
.btn:hover{background:var(--panel);border-color:var(--borderhi);color:var(--tx);}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-prim{background:var(--mark);color:var(--paper);border-color:var(--mark);font-weight:600;}
.btn-prim:hover{background:var(--markhi);border-color:var(--markhi);color:var(--paper);}
.btn-danger{color:var(--redhi);border-color:rgba(168,64,44,.35);background:transparent;}
.btn-danger:hover{background:rgba(168,64,44,.1);border-color:var(--redhi);}
.btn-full{width:100%;justify-content:center;height:36px;font-size:.8rem;}
.lib-header{padding:26px 26px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.lib-header h1{font-family:var(--display);font-size:1.7rem;font-weight:600;letter-spacing:-.01em;margin-bottom:4px;color:var(--paper);}
.lib-header p{font-size:.8rem;color:var(--tx3);margin-bottom:16px;max-width:520px;line-height:1.55;}
.search-row{display:flex;gap:8px;max-width:420px;}
.search-input-wrap{position:relative;flex:1;}
.search-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;}
input.search-inp{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.82rem;padding:0 10px 0 32px;height:33px;border-radius:var(--r);outline:none;transition:border-color .13s;}
input.search-inp:focus{border-color:var(--mark);}
input.search-inp::placeholder{color:var(--tx3);}
.lib-count{font-size:.68rem;color:var(--tx3);margin-top:10px;font-family:var(--mono);letter-spacing:.02em;text-transform:uppercase;}

.lib-body{flex:1;overflow-y:auto;padding:22px 26px 40px;}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px;max-width:1400px;}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:70px 20px;text-align:center;color:var(--tx3);}
.lib-empty h3{font-family:var(--display);font-size:1.05rem;color:var(--tx2);font-weight:600;}
.lib-empty p{font-size:.76rem;max-width:280px;line-height:1.6;}

/* Card reads like an index/proof card: paper thumb, mono caption strip, corner tick */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s, transform .15s;position:relative;}
.card:hover{border-color:var(--mark);transform:translateY(-2px);}
.card::after{content:'';position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--border) transparent transparent;transition:border-color .15s;}
.card:hover::after{border-color:transparent var(--mark) transparent transparent;}
.card-thumb{position:relative;width:100%;aspect-ratio:1000/562;overflow:hidden;background:var(--paper);}
.card-thumb-inner{width:1000px;height:562px;transform:scale(var(--sc,0.23));transform-origin:top left;position:relative;}
.card-info{padding:10px 12px 11px;border-top:1px solid var(--border);}
.card-name{font-family:var(--display);font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;color:var(--tx);}
.card-owner{font-size:.63rem;color:var(--tx3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.card-tag{font-size:.6rem;color:var(--tx3);background:var(--panel2);border:1px solid var(--border);padding:2px 7px;border-radius:99px;font-family:var(--mono);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(12,10,7,.88);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:24px;}
.modal-bg.open{display:flex;}
.viewer-modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);width:100%;max-width:960px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .15s cubic-bezier(.22,1,.36,1);}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.viewer-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.viewer-title-wrap{flex:1;min-width:0;}
.viewer-title{font-family:var(--display);font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper);}
.viewer-sub{font-size:.68rem;color:var(--tx3);margin-top:2px;font-family:var(--mono);}
.viewer-close{background:transparent;border:1px solid var(--border2);color:var(--tx3);cursor:pointer;font-size:1rem;width:26px;height:26px;border-radius:var(--r);line-height:1;transition:all .13s;}
.viewer-close:hover{color:var(--paper);border-color:var(--mark);}
.viewer-body{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:15px;}
.viewer-frame-wrap{width:100%;max-width:760px;}
.viewer-frame{position:relative;width:100%;aspect-ratio:1000/562;border-radius:var(--r-md);overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.55);border:1px solid var(--border);background:var(--paper);}
.viewer-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.viewer-thumb{width:110px;aspect-ratio:1000/562;border-radius:2px;overflow:hidden;border:1.5px solid var(--border2);cursor:pointer;position:relative;transition:border-color .13s;background:var(--paper);}
.viewer-thumb:hover{border-color:var(--tx3);}
.viewer-thumb.active{border-color:var(--mark);}
.viewer-thumb-inner{width:1000px;height:562px;transform:scale(.11);transform-origin:top left;position:relative;}
.viewer-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.viewer-admin-info{font-size:.66rem;color:var(--tx3);font-family:var(--mono);}
.viewer-admin-info b{color:#c99a7a;}
.viewer-actions{display:flex;gap:6px;}

.slide-scene{position:absolute;inset:0;width:100%;height:100%;}
.slide-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8% 9%;}
.slide-eyebrow{font-size:.72em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:.6em;opacity:.85;}
.slide-heading{font-size:2.1em;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin-bottom:.3em;}
.slide-body{font-size:1em;line-height:1.55;max-width:80%;}
.slide-stat{font-size:3.4em;font-weight:700;line-height:1;letter-spacing:-.02em;margin-bottom:.15em;}
.slide-list{display:flex;flex-direction:column;gap:.5em;margin-top:.3em;}
.slide-list-item{display:flex;align-items:center;gap:.5em;font-size:1.05em;font-weight:500;}
.slide-list-dot{width:.5em;height:.5em;border-radius:50%;flex-shrink:0;}
.slide-cols{display:flex;gap:1.5em;margin-top:.3em;}
.slide-col{flex:1;font-size:.95em;line-height:1.55;}
.slide-icon-scatter{position:absolute;inset:0;pointer-events:none;}
.slide-icon-scatter svg{position:absolute;opacity:.5;}

#app-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:.75rem;color:var(--tx3);}
#app-loading.hidden{display:none;}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--tx3);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border2);padding:7px 14px;border-radius:var(--r-md);font-size:.78rem;font-weight:500;z-index:9999;opacity:0;transition:all .2s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
footer{padding:5px 14px;font-size:.68rem;color:var(--tx3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);}
footer strong{color:var(--tx2);font-weight:500;}
footer .dot{color:var(--borderhi);}
</style>
</head>

<script>

function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var _toastTimer;
function showToast(msg, dur) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){t.classList.remove('show');}, dur||2200);

function loadGoogleFont(fontName) {
  if (!fontName) return;
  var id = 'gf-' + fontName.replace(/[^a-z0-9]/gi,'-');
  if (document.getElementById(id)) return;
  var link = document.createElement('link');
  link.id = id; link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fontName).replace(/%20/g,'+') + ':wght@400;500;600;700&display=swap';
  document.head.appendChild(link);
}

// ── SLIDE RENDERING (shared logic, identical to generator page) ──
function renderSlideHTML(theme, slide, sceneSvg, icons) {
  var bg = theme.background, tx1 = theme.text_primary, tx2 = theme.text_secondary;
  var a1 = theme.accent_1, a2 = theme.accent_2;
  var headFont = theme.heading_font || 'IBM Plex Sans';
  var bodyFont = theme.body_font || 'IBM Plex Sans';

  var iconScatter = '';
  if (!sceneSvg && icons && icons.length) {
    var positions = [
      {t:'8%',l:'82%',s:'9%'},{t:'68%',l:'88%',s:'7%'},{t:'42%',l:'92%',s:'6%'},
      {t:'85%',l:'78%',s:'8%'},{t:'20%',l:'70%',s:'5%'},{t:'55%',l:'75%',s:'6%'}
    ];
    iconScatter = '<div class="slide-icon-scatter">' + icons.slice(0,6).map(function(ic, i){
      var p = positions[i % positions.length];
      var svg = ic.svg.replace(/width="[^"]*"/,'').replace(/height="[^"]*"/,'')
        .replace('<svg', '<svg width="100%" height="100%" style="color:'+(i%2?a2:a1)+'"');
      return '<div style="position:absolute;top:'+p.t+';left:'+p.l+';width:'+p.s+';height:'+p.s+';">'+svg+'</div>';
    }).join('') + '</div>';
  }
  var scene = sceneSvg ? '<div class="slide-scene">'+sceneSvg+'</div>' : '';

  var inner = '';
  if (slide.layout === 'title') {
    inner = '<div class="slide-eyebrow" style="color:'+a1+'">'+esc(slide.eyebrow)+'</div>'+
      '<div class="slide-heading" style="color:'+tx1+';font-family:\''+headFont+'\',serif;font-size:2.6em;">'+esc(slide.heading)+'</div>'+
      '<div class="slide-body" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;">'+esc(slide.body)+'</div>';
  } else if (slide.layout === 'stat') {
    inner = '<div class="slide-eyebrow" style="color:'+a1+'">'+esc(slide.eyebrow)+'</div>'+
      '<div class="slide-stat" style="color:'+a2+';font-family:\''+headFont+'\',serif;">'+esc(slide.heading)+'</div>'+
      '<div class="slide-body" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;">'+esc(slide.body)+'</div>';
  } else if (slide.layout === 'quote') {
    inner = '<div class="slide-heading" style="color:'+tx1+';font-family:\''+headFont+'\',serif;font-style:italic;">&#8220;'+esc(slide.heading)+'&#8221;</div>'+
      '<div class="slide-body" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;">'+esc(slide.body)+'</div>';
  } else if (slide.layout === 'list') {
    var items = (slide.body||'').split('|').map(function(s){return s.trim();}).filter(Boolean);
    inner = '<div class="slide-eyebrow" style="color:'+a1+'">'+esc(slide.eyebrow)+'</div>'+
      '<div class="slide-heading" style="color:'+tx1+';font-family:\''+headFont+'\',serif;">'+esc(slide.heading)+'</div>'+
      '<div class="slide-list">'+items.map(function(it,i){
        return '<div class="slide-list-item" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;"><div class="slide-list-dot" style="background:'+(i%2?a2:a1)+'"></div>'+esc(it)+'</div>';
      }).join('')+'</div>';
  } else if (slide.layout === 'two_column') {
    var halves = (slide.body||'').split('||').map(function(s){return s.trim();});
    inner = '<div class="slide-eyebrow" style="color:'+a1+'">'+esc(slide.eyebrow)+'</div>'+
      '<div class="slide-heading" style="color:'+tx1+';font-family:\''+headFont+'\',serif;">'+esc(slide.heading)+'</div>'+
      '<div class="slide-cols">'+halves.map(function(h,i){
        return '<div class="slide-col" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;border-left:2px solid '+(i%2?a2:a1)+';padding-left:.8em;">'+esc(h)+'</div>';
      }).join('')+'</div>';
  } else {
    inner = '<div class="slide-eyebrow" style="color:'+a1+'">'+esc(slide.eyebrow)+'</div>'+
      '<div class="slide-heading" style="color:'+tx1+';font-family:\''+headFont+'\',serif;">'+esc(slide.heading)+'</div>'+
      '<div class="slide-body" style="color:'+tx2+';font-family:\''+bodyFont+'\',sans-serif;">'+esc(slide.body)+'</div>';
  }

  return '<div style="position:absolute;inset:0;background:'+bg+';">'+scene+iconScatter+
    '<div class="slide-content">'+inner+'</div></div>';
}

// ── PPTX EXPORT (real editable pptx, built client-side with pptxgenjs) ──
// Identical logic to the generator page — kept in sync so a deck downloads
// the same way whether it's downloaded fresh or later from the Library.
var PPTX_W = 10, PPTX_H = 5.625;
function hexNoHash(h) { return (h || '000000').toString().replace('#', '').toUpperCase(); }

function svgToPngDataUrl(svgString, width, height) {
  return new Promise(function(resolve){
    try {
      var svg64 = btoa(unescape(encodeURIComponent(svgString)));
      var img = new Image();
      img.onload = function(){
        try {
          var canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/png'));
        } catch(e) {
          console.error('svgToPngDataUrl: canvas render/export failed', e);
          resolve(null);
        }
      };
      img.onerror = function(e){
        console.error('svgToPngDataUrl: image failed to load from SVG data URL', e);
        resolve(null);
      };
      img.src = 'data:image/svg+xml;base64,' + svg64;
    } catch(e) {
      console.error('svgToPngDataUrl: setup failed', e);
      resolve(null);
    }
  });
}

async function addSlideToPptx(pptx, theme, slide, sceneSvg, icons) {
  var s = pptx.addSlide({ masterName: (theme && theme.name || 'Theme') + ' Master' });
  s.background = { color: hexNoHash(theme && theme.background) };

  // Defensive: normalize slide fields so a missing/malformed field can
  // never silently produce a slide with no text at all.
  slide = slide || {};
  var slideEyebrow = (typeof slide.eyebrow === 'string') ? slide.eyebrow : '';
  var slideHeading = (typeof slide.heading === 'string' && slide.heading.trim()) ? slide.heading : (slide.title || 'Untitled slide');
  var slideBody = (typeof slide.body === 'string') ? slide.body : '';
  var slideLayout = (typeof slide.layout === 'string') ? slide.layout : 'default';

  theme = theme || {};
  var tx1 = hexNoHash(theme.text_primary), tx2 = hexNoHash(theme.text_secondary);
  var a1 = hexNoHash(theme.accent_1), a2 = hexNoHash(theme.accent_2);
  var headFont = theme.heading_font || 'Calibri';
  var bodyFont = theme.body_font || 'Calibri';

  if (sceneSvg) {
    var scenePng = await svgToPngDataUrl(sceneSvg, 1600, 899);
    if (scenePng) s.addImage({ data: scenePng, x: 0, y: 0, w: PPTX_W, h: PPTX_H });
  } else if (icons && icons.length) {
    var positions = [
      {t:.08,l:.82,sz:.09},{t:.68,l:.88,sz:.07},{t:.42,l:.92,sz:.06},
      {t:.85,l:.78,sz:.08},{t:.20,l:.70,sz:.05},{t:.55,l:.75,sz:.06}
    ];
    for (var i = 0; i < Math.min(icons.length, 6); i++) {
      var p = positions[i % positions.length];
      var tint = (i % 2) ? theme.accent_2 : theme.accent_1;
      var coloredSvg = icons[i].svg.replace(/<svg/, '<svg style="color:' + tint + '"');
      var iconPng = await svgToPngDataUrl(coloredSvg, 256, 256);
      if (iconPng) {
        var sizeIn = p.sz * PPTX_W;
        s.addImage({ data: iconPng, x: p.l * PPTX_W, y: p.t * PPTX_H, w: sizeIn, h: sizeIn, transparency: 50 });
      }
    }
  }

  var padX = PPTX_W * 0.09, padY = PPTX_H * 0.08;
  var contentW = PPTX_W - padX * 2;
  var contentX = padX;

  if (slideLayout === 'title') {
    s.addText(slideEyebrow, { x: contentX, y: padY + 0.6, w: contentW, h: 0.4, fontFace: bodyFont, fontSize: 13, bold: true, color: a1, charSpacing: 2 });
    s.addText(slideHeading, { x: contentX, y: padY + 1.0, w: contentW * 0.85, h: 1.6, fontFace: headFont, fontSize: 40, bold: true, color: tx1, valign: 'top' });
    s.addText(slideBody, { x: contentX, y: padY + 2.7, w: contentW * 0.8, h: 1.0, fontFace: bodyFont, fontSize: 15, color: tx2, valign: 'top' });
  } else if (slideLayout === 'stat') {
    s.addText(slideEyebrow, { x: contentX, y: padY + 0.6, w: contentW, h: 0.4, fontFace: bodyFont, fontSize: 13, bold: true, color: a1, charSpacing: 2 });
    s.addText(slideHeading, { x: contentX, y: padY + 1.0, w: contentW * 0.8, h: 1.5, fontFace: headFont, fontSize: 54, bold: true, color: a2, valign: 'top' });
    s.addText(slideBody, { x: contentX, y: padY + 2.8, w: contentW * 0.75, h: 0.9, fontFace: bodyFont, fontSize: 15, color: tx2, valign: 'top' });
  } else if (slideLayout === 'quote') {
    s.addText('\u201C' + (slideHeading) + '\u201D', { x: contentX, y: padY + 1.0, w: contentW * 0.85, h: 1.8, fontFace: headFont, fontSize: 30, italic: true, color: tx1, valign: 'top' });
    s.addText(slideBody, { x: contentX, y: padY + 3.0, w: contentW * 0.75, h: 0.8, fontFace: bodyFont, fontSize: 15, color: tx2, valign: 'top' });
  } else if (slideLayout === 'list') {
    s.addText(slideEyebrow, { x: contentX, y: padY + 0.5, w: contentW, h: 0.4, fontFace: bodyFont, fontSize: 13, bold: true, color: a1, charSpacing: 2 });
    s.addText(slideHeading, { x: contentX, y: padY + 0.9, w: contentW * 0.8, h: 0.8, fontFace: headFont, fontSize: 28, bold: true, color: tx1, valign: 'top' });
    var items = (slideBody).split('|').map(function(t){ return t.trim(); }).filter(Boolean);
    var listRuns = items.map(function(it){
      return { text: it, options: { bullet: { code: '25CF', indent: 18 }, color: tx2, fontFace: bodyFont, fontSize: 16, bold: true, breakLine: true, paraSpaceAfter: 10 } };
    });
    s.addText(listRuns, { x: contentX, y: padY + 1.9, w: contentW * 0.7, h: 1.8, valign: 'top', margin: 0 });
  } else if (slideLayout === 'two_column') {
    s.addText(slideEyebrow, { x: contentX, y: padY + 0.5, w: contentW, h: 0.4, fontFace: bodyFont, fontSize: 13, bold: true, color: a1, charSpacing: 2 });
    s.addText(slideHeading, { x: contentX, y: padY + 0.9, w: contentW * 0.85, h: 0.8, fontFace: headFont, fontSize: 28, bold: true, color: tx1, valign: 'top' });
    var halves = (slideBody).split('||').map(function(t){ return t.trim(); });
    var colW = (contentW * 0.85 - 0.3) / 2;
    halves.slice(0,2).forEach(function(half, i){
      var colX = contentX + i * (colW + 0.3);
      var lineColor = (i % 2) ? a2 : a1;
      s.addShape('line', { x: colX, y: padY + 2.0, w: 0, h: 1.6, line: { color: lineColor, width: 1.5 } });
      s.addText(half, { x: colX + 0.15, y: padY + 2.0, w: colW - 0.15, h: 1.6, fontFace: bodyFont, fontSize: 14, color: tx2, valign: 'top' });
    });
  } else {
    s.addText(slideEyebrow, { x: contentX, y: padY + 0.5, w: contentW, h: 0.4, fontFace: bodyFont, fontSize: 13, bold: true, color: a1, charSpacing: 2 });
    s.addText(slideHeading, { x: contentX, y: padY + 0.9, w: contentW * 0.8, h: 0.9, fontFace: headFont, fontSize: 28, bold: true, color: tx1, valign: 'top' });
    s.addText(slideBody, { x: contentX, y: padY + 2.0, w: contentW * 0.72, h: 1.6, fontFace: bodyFont, fontSize: 15, color: tx2, valign: 'top' });
  }
}

// pptxgenjs 3.12.0 has two known defects that trigger PowerPoint's "repair"
// dialog and strip content on open (see gitbrent/PptxGenJS#1449, #1443):
//   1. [Content_Types].xml registers one slideMaster <Override> per slide
//      instead of per actual master file, so it references files that
//      don't exist in the package (e.g. slideMaster2.xml, slideMaster3.xml
//      for a 4-slide deck with only one real master).
//   2. The auto-generated notesMaster1.xml contains 6 placeholder shapes
//      that PowerPoint considers malformed; it silently strips them during
//      its repair pass, which is what triggers the dialog in the first
//      place.
// We patch the generated zip ourselves before download so PowerPoint never
// has a reason to show the repair dialog or discard slide content.
async function repairPptxZip(arrayBuffer) {
  if (typeof JSZip === 'undefined') {
    // Can't repair without JSZip — return the original bytes rather than fail the whole download.
    return arrayBuffer;
  }
  var zip = await JSZip.loadAsync(arrayBuffer);

  var notesMasterPath = 'ppt/notesMasters/notesMaster1.xml';
  if (zip.file(notesMasterPath)) {
    var xml = await zip.file(notesMasterPath).async('string');
    xml = xml.replace(/(<p:spTree>)[\s\S]*?(<\/p:spTree>)/, function(match, open, close){
      var grpMatch = match.match(/<p:nvGrpSpPr>[\s\S]*?<\/p:nvGrpSpPr><p:grpSpPr>[\s\S]*?<\/p:grpSpPr>/);
      return open + (grpMatch ? grpMatch[0] : '') + close;
    });
    zip.file(notesMasterPath, xml);
  }

  var ctPath = '[Content_Types].xml';
  if (zip.file(ctPath)) {
    var ct = await zip.file(ctPath).async('string');
    var masterFiles = {};
    var mastersFolder = zip.folder('ppt/slideMasters');
    if (mastersFolder) {
      mastersFolder.forEach(function(relPath){
        if (/^slideMaster\d+\.xml$/.test(relPath)) masterFiles[relPath] = true;
      });
    }
    ct = ct.replace(/<Override PartName="\/ppt\/slideMasters\/([^"]+)"[^>]*\/>/g, function(match, filename){
      return masterFiles[filename] ? match : '';
    });
    zip.file(ctPath, ct);
  }

  return zip.generateAsync({ type: 'arraybuffer' });
}

async function buildPptx(entry) {
  if (typeof PptxGenJS === 'undefined') {
    throw new Error('PPTX library failed to load — check your connection and try again.');
  }
  var pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_16x9';
  pptx.title = entry.name || 'SlidesAI Deck';

  // pptxgenjs auto-generates one anonymous master named "DEFAULT" with no
  // background/objects if defineSlideMaster is never called — that's the
  // blank thumbnail PowerPoint's Layout panel was showing. Defining a real
  // named master (matched to the theme background) makes that panel show an
  // actual populated layout, and gives every slide a defined base to
  // inherit from instead of an empty placeholder.
  var theme = entry.theme;
  pptx.defineSlideMaster({
    title: (theme.name || 'Theme') + ' Master',
    background: { color: hexNoHash(theme.background) },
    objects: [],
  });

  for (var i = 0; i < entry.theme.slides.length; i++) {
    await addSlideToPptx(pptx, entry.theme, entry.theme.slides[i], entry.scenes[i], entry.iconsBySlide[i]);
  }
  var fname = (entry.name || 'deck').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.pptx';

  var rawBuffer = await pptx.write({ outputType: 'arraybuffer' });
  var finalBuffer = await repairPptxZip(rawBuffer);

  var blob = new Blob([finalBuffer], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// ── AUTH STATE (viewing the Library requires being signed in, matching the rest of HTMLTools) ──
var currentUser = null;
var isAdmin = false;
var libraryEntries = [];

auth.onAuthStateChanged(function(user) {
  document.getElementById('app-loading').classList.add('hidden');
  if (user) {
    currentUser = user;
    isAdmin = ADMIN_EMAILS.indexOf((user.email||'').toLowerCase()) !== -1;
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('main-nav').style.display = 'flex';
    document.getElementById('nav-email').textContent  = user.email || user.displayName || 'Signed in';
    document.getElementById('admin-pill').style.display = isAdmin ? 'inline-block' : 'none';
    loadLibrary();
  } else {
    window.location.href = '/SlidesAI/Login?redirect=' + encodeURIComponent('/SlidesAI/Library');
  }
});
document.getElementById('signout-btn').addEventListener('click', async function() {
  await auth.signOut();
  window.location.href = '/SlidesAI/Login';
});

async function loadLibrary() {
  document.getElementById('lib-count').textContent = 'Loading…';
  try {
    var snap = await db.ref('slidesai_library').get();
    libraryEntries = [];
    if (snap.exists()) snap.forEach(function(c){ libraryEntries.push(c.val()); });
    libraryEntries.sort(function(a,b){ return (b.created||0)-(a.created||0); });
    renderGrid(libraryEntries);
  } catch(e) {
    document.getElementById('lib-count').textContent = 'Failed to load library.';
  }
}

function renderGrid(entries) {
  var grid = document.getElementById('lib-grid');
  document.getElementById('lib-count').textContent = entries.length + ' template' + (entries.length===1?'':'s');
  if (!entries.length) {
    grid.innerHTML = '';
    grid.parentElement.insertAdjacentHTML('afterbegin', '');
    document.querySelector('.lib-body').innerHTML =
      '<div class="lib-empty"><h3>No templates yet</h3><p>Generate a deck and it will show up here for everyone to browse.</p></div>';
    return;
  }
  if (!document.getElementById('lib-grid')) {
    document.querySelector('.lib-body').innerHTML = '<div class="lib-grid" id="lib-grid"></div>';
  }
  grid = document.getElementById('lib-grid');
  grid.innerHTML = entries.map(function(e){
    var theme = e.theme;
    var titleSlide = theme.slides[0];
    var tags = (e.keywords||[]).slice(0,3);
    return '<div class="card" data-id="'+e.id+'">' +
      '<div class="card-thumb"><div class="card-thumb-inner" id="grid-thumb-'+e.id+'"></div></div>' +
      '<div class="card-info">' +
        '<div class="card-name">'+esc(e.name)+'</div>' +
        (isAdmin ? '<div class="card-owner">'+esc(e.ownerEmail||'unknown')+'</div>' : '') +
        '<div class="card-tags">'+tags.map(function(t){return '<span class="card-tag">'+esc(t)+'</span>';}).join('')+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
  entries.forEach(function(e){
    var theme = e.theme;
    var el = document.getElementById('grid-thumb-'+e.id);
    if (el) {
      el.innerHTML = renderSlideHTML(theme, theme.slides[0], e.scenes[0], e.iconsBySlide[0]);
      loadGoogleFont(theme.heading_font);
      loadGoogleFont(theme.body_font);
    }
  });
  grid.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click', function(){ openViewer(el.dataset.id); });
  });
}

// ── SEARCH ──
document.getElementById('search-input').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  if (!q) { renderGrid(libraryEntries); return; }
  var filtered = libraryEntries.filter(function(e){
    if ((e.name||'').toLowerCase().indexOf(q) !== -1) return true;
    return (e.keywords||[]).some(function(k){ return k.indexOf(q) !== -1; });
  });
  renderGrid(filtered);
});

// ── VIEWER MODAL ──
var viewerEntry = null;
var viewerSlideIdx = 0;

function openViewer(id) {
  var entry = libraryEntries.find(function(e){ return e.id === id; });
  if (!entry) return;
  viewerEntry = entry;
  viewerSlideIdx = 0;
  document.getElementById('viewer-title').textContent = entry.name;
  document.getElementById('viewer-sub').textContent = entry.mood || '';
  document.getElementById('viewer-delete-btn').style.display = isAdmin ? 'inline-flex' : 'none';
  document.getElementById('viewer-admin-info').innerHTML = isAdmin
    ? 'Generated by <b>'+esc(entry.ownerEmail||'unknown')+'</b>'
    : '';
  renderViewerThumbs();
  renderViewerSlide();
  document.getElementById('viewer-bg').classList.add('open');
}
function renderViewerThumbs() {
  var wrap = document.getElementById('viewer-thumbs');
  wrap.innerHTML = viewerEntry.theme.slides.map(function(s,i){
    return '<div class="viewer-thumb'+(i===viewerSlideIdx?' active':'')+'" data-i="'+i+'"><div class="viewer-thumb-inner" id="vthumb-'+i+'"></div></div>';
  }).join('');
  viewerEntry.theme.slides.forEach(function(s,i){
    document.getElementById('vthumb-'+i).innerHTML = renderSlideHTML(viewerEntry.theme, s, viewerEntry.scenes[i], viewerEntry.iconsBySlide[i]);
  });
  wrap.querySelectorAll('.viewer-thumb').forEach(function(el){
    el.addEventListener('click', function(){
      viewerSlideIdx = parseInt(el.dataset.i);
      renderViewerThumbs();
      renderViewerSlide();
    });
  });
}
function renderViewerSlide() {
  var s = viewerEntry.theme.slides[viewerSlideIdx];
  document.getElementById('viewer-frame').innerHTML = renderSlideHTML(viewerEntry.theme, s, viewerEntry.scenes[viewerSlideIdx], viewerEntry.iconsBySlide[viewerSlideIdx]);
}
function closeViewer() { document.getElementById('viewer-bg').classList.remove('open'); viewerEntry = null; }
document.getElementById('viewer-close').addEventListener('click', closeViewer);
document.getElementById('viewer-bg').addEventListener('click', function(e){ if (e.target === this) closeViewer(); });

document.getElementById('viewer-download-btn').addEventListener('click', async function(){
  if (!viewerEntry) return;
  this.disabled = true;
  this.textContent = 'Building .pptx…';
  try {
    await buildPptx(viewerEntry);
    showToast('Deck downloaded as .pptx');
  } catch(e) {
    console.error('buildPptx failed:', e);
    showToast('Failed to build .pptx: ' + (e && e.message ? e.message : 'unknown error'));
  } finally {
    this.disabled = false;
    this.textContent = '\u2193 Download PPTX';
  }
});

document.getElementById('viewer-delete-btn').addEventListener('click', async function(){
  if (!viewerEntry || !isAdmin) return;
  if (!confirm('Delete "'+viewerEntry.name+'" from the Library? This cannot be undone.')) return;
  try {
    await db.ref('slidesai_library/' + viewerEntry.id).remove();
    libraryEntries = libraryEntries.filter(function(e){ return e.id !== viewerEntry.id; });
    closeViewer();
    renderGrid(libraryEntries);
    showToast('Removed from Library.');
  } catch(e) {
    showToast('Failed to delete.');
  }
});
</script>
