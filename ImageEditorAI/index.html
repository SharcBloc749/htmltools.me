<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Image Editor</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2c3038;
    --text: #e8e9ec;
    --dim: #8a8f98;
    --accent: #ffb020;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--dim); font-size: 0.9rem; margin: 0 0 1.75rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--dim);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  textarea, select {
    width: 100%;
    background: #0f1114;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 0.75rem;
    border-radius: 7px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  select { appearance: none; cursor: pointer; }
  textarea:focus, select:focus { outline: 1px solid var(--accent); }
  .field { margin-bottom: 0.9rem; }
  .field:last-child { margin-bottom: 0; }
  .action-desc {
    font-size: 0.82rem;
    color: var(--dim);
    margin: 0.4rem 0 0;
    line-height: 1.4;
  }
  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
  }
  .drop.has-image { border-style: solid; padding: 0.5rem; }
  .drop img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin: 0 auto; }
  button {
    background: var(--accent);
    color: #1a1400;
    border: none;
    font-weight: 600;
    padding: 0.75rem 1.1rem;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.95rem;
    width: 100%;
    margin-top: 1rem;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 0.85rem; color: var(--dim); margin-top: 0.75rem; min-height: 1.2em; white-space: pre-wrap; word-break: break-word; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--good); }
  .result img { width: 100%; border-radius: 8px; margin-top: 0.5rem; }
  a.dl {
    display: inline-block;
    margin-top: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Image Editor</h1>
  <p class="sub">Upload a photo, pick an action, and let AI do the rest.</p>

  <div class="panel">
    <label>Image</label>
    <div class="drop" id="dropZone">Click to choose an image, or drag one here</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="panel">
    <div class="field">
      <label for="action">Action</label>
      <select id="action">
        <option value="search_replace">Search &amp; Replace — find an object by description, replace it</option>
        <option value="erase">Erase Object — remove the subject (uses image transparency as mask)</option>
        <option value="search_recolor">Search &amp; Recolor — find an object, change its color</option>
        <option value="remove_bg">Remove Background — cut out the subject, transparent background</option>
      </select>
      <p class="action-desc" id="actionDesc"></p>
    </div>

    <div class="field" id="searchPromptField">
      <label id="searchPromptLabel" for="searchPrompt">What to find</label>
      <textarea id="searchPrompt" rows="1" placeholder="e.g. people in the background"></textarea>
    </div>

    <div class="field" id="promptField">
      <label id="promptLabel" for="prompt">What it should become</label>
      <textarea id="prompt" rows="2" placeholder="e.g. empty sidewalk, plain background"></textarea>
    </div>

    <button id="editBtn" disabled>Edit image</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel result" id="resultPanel" style="display:none;">
    <label>Result</label>
    <img id="resultImg" alt="Edited result">
    <br>
    <a class="dl" id="downloadLink" download="edited.png">Download image</a>
  </div>
</div>

<script>
// Backend — fixed, users never see or touch this.
const API_ENDPOINT = "https://aged-bird-46da.bozhetarnikmatthew.workers.dev/";

const ACTION_INFO = {
  search_replace: {
    desc: "Describe the object to find, and what it should be replaced with.",
    searchLabel: "What to find",
    searchPlaceholder: "e.g. people in the background",
    promptLabel: "What it should become",
    promptPlaceholder: "e.g. empty sidewalk, plain background",
    needsSearch: true,
    needsPrompt: true,
  },
  erase: {
    desc: "Removes content based on the image's transparent areas. Works best on images that already have a transparent region (e.g. from Remove Background) marking what to erase.",
    needsSearch: false,
    needsPrompt: false,
  },
  search_recolor: {
    desc: "Describe the object to find, and the new color/description for it.",
    searchLabel: "What to find",
    searchPlaceholder: "e.g. jacket",
    promptLabel: "New color / look",
    promptPlaceholder: "e.g. bright red jacket",
    needsSearch: true,
    needsPrompt: true,
  },
  remove_bg: {
    desc: "Automatically isolates the main subject and makes the background transparent. No prompt needed.",
    needsSearch: false,
    needsPrompt: false,
  },
};

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const editBtn = document.getElementById('editBtn');
const statusEl = document.getElementById('status');
const resultPanel = document.getElementById('resultPanel');
const resultImg = document.getElementById('resultImg');
const downloadLink = document.getElementById('downloadLink');
const actionSelect = document.getElementById('action');
const actionDesc = document.getElementById('actionDesc');
const searchPromptField = document.getElementById('searchPromptField');
const searchPromptLabel = document.getElementById('searchPromptLabel');
const searchPromptInput = document.getElementById('searchPrompt');
const promptField = document.getElementById('promptField');
const promptLabel = document.getElementById('promptLabel');
const promptInput = document.getElementById('prompt');

let selectedImageDataUrl = null;

function updateActionUI() {
  const info = ACTION_INFO[actionSelect.value];
  actionDesc.textContent = info.desc;

  searchPromptField.style.display = info.needsSearch ? 'block' : 'none';
  if (info.needsSearch) {
    searchPromptLabel.textContent = info.searchLabel;
    searchPromptInput.placeholder = info.searchPlaceholder;
  }

  promptField.style.display = info.needsPrompt ? 'block' : 'none';
  if (info.needsPrompt) {
    promptLabel.textContent = info.promptLabel;
    promptInput.placeholder = info.promptPlaceholder;
  }
}
actionSelect.addEventListener('change', updateActionUI);
updateActionUI();

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => e.preventDefault());
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    selectedImageDataUrl = e.target.result;
    dropZone.classList.add('has-image');
    dropZone.innerHTML = `<img src="${selectedImageDataUrl}" alt="preview">`;
    editBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

editBtn.addEventListener('click', async () => {
  if (!selectedImageDataUrl) return;

  const action = actionSelect.value;
  const info = ACTION_INFO[action];
  const prompt = promptInput.value.trim();
  const searchPrompt = searchPromptInput.value.trim();

  if (info.needsSearch && !searchPrompt) {
    setStatus('Please describe what to find in the image.', 'err');
    return;
  }
  if (info.needsPrompt && !prompt) {
    setStatus('Please describe what you want to see.', 'err');
    return;
  }

  editBtn.disabled = true;
  resultPanel.style.display = 'none';
  setStatus('Sending to the AI — this can take 10-30 seconds...', '');

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: selectedImageDataUrl,
        action,
        prompt: info.needsPrompt ? prompt : undefined,
        searchPrompt: info.needsSearch ? searchPrompt : undefined,
      })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      let msg = 'Failed: ' + (data.error || res.statusText);
      if (data.detail) msg += '\n\n' + JSON.stringify(data.detail, null, 2);
      setStatus(msg, 'err');
      editBtn.disabled = false;
      return;
    }

    if (data.image) {
      resultImg.src = data.image;
      downloadLink.href = data.image;
      resultPanel.style.display = 'block';
      setStatus('Done.', 'ok');
    } else {
      setStatus('Unexpected response from server.', 'err');
    }
  } catch (err) {
    setStatus('Network error: ' + err.message, 'err');
  } finally {
    editBtn.disabled = false;
  }
});
</script>
</body>
</html>
