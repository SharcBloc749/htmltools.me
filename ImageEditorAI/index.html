<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Image Editor</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2c3038;
    --text: #e8e9ec;
    --dim: #8a8f98;
    --accent: #ffb020;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--dim); font-size: 0.9rem; margin: 0 0 1.75rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--dim);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  textarea {
    width: 100%;
    background: #0f1114;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 0.75rem;
    border-radius: 7px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
  }
  .drop.has-image { border-style: solid; padding: 0.5rem; }
  .drop img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin: 0 auto; }
  button {
    background: var(--accent);
    color: #1a1400;
    border: none;
    font-weight: 600;
    padding: 0.75rem 1.1rem;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.95rem;
    width: 100%;
    margin-top: 1rem;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 0.85rem; color: var(--dim); margin-top: 0.75rem; min-height: 1.2em; white-space: pre-wrap; word-break: break-word; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--good); }
  .result img { width: 100%; border-radius: 8px; margin-top: 0.5rem; }
  a.dl {
    display: inline-block;
    margin-top: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Image Editor</h1>
  <p class="sub">Upload a photo, describe the edit, and let AI do the rest.</p>

  <div class="panel">
    <label>Image</label>
    <div class="drop" id="dropZone">Click to choose an image, or drag one here</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="panel">
    <label for="prompt">What should change?</label>
    <textarea id="prompt" rows="2" placeholder="Remove the people in the background">Remove the people in the background</textarea>
    <button id="editBtn" disabled>Edit image</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel result" id="resultPanel" style="display:none;">
    <label>Result</label>
    <img id="resultImg" alt="Edited result">
    <br>
    <a class="dl" id="downloadLink" download="edited.png">Download image</a>
  </div>
</div>

<script>
// Backend — fixed, users never see or touch this.
const API_ENDPOINT = "https://aged-bird-46da.bozhetarnikmatthew.workers.dev/";

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const editBtn = document.getElementById('editBtn');
const statusEl = document.getElementById('status');
const resultPanel = document.getElementById('resultPanel');
const resultImg = document.getElementById('resultImg');
const downloadLink = document.getElementById('downloadLink');

let selectedImageDataUrl = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => e.preventDefault());
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    selectedImageDataUrl = e.target.result;
    dropZone.classList.add('has-image');
    dropZone.innerHTML = `<img src="${selectedImageDataUrl}" alt="preview">`;
    editBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

editBtn.addEventListener('click', async () => {
  if (!selectedImageDataUrl) return;
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { setStatus('Please describe the edit you want.', 'err'); return; }

  editBtn.disabled = true;
  resultPanel.style.display = 'none';
  setStatus('Sending to the AI — this can take 10-30 seconds...', '');

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: selectedImageDataUrl, prompt })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      let msg = 'Failed: ' + (data.error || res.statusText);
      if (data.detail) msg += '\n\n' + JSON.stringify(data.detail, null, 2);
      setStatus(msg, 'err');
      editBtn.disabled = false;
      return;
    }

    if (data.image) {
      resultImg.src = data.image;
      downloadLink.href = data.image;
      resultPanel.style.display = 'block';
      setStatus('Done.', 'ok');
    } else {
      setStatus('Unexpected response from server.', 'err');
    }
  } catch (err) {
    setStatus('Network error: ' + err.message, 'err');
  } finally {
    editBtn.disabled = false;
  }
});
</script>
</body>
</html>
