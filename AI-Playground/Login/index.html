
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — HTMLTOOLS AI Playground</title>
  <link rel="icon" href="https://htmltools.me/logo3.png"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
    :root {
      --bg: #070709; --surface: #101013; --elev: #16161a;
      --border: rgba(255,255,255,.08); --white: #f5f5f7; --muted: #8e8e96; --dim: #54545d;
      --font-sans: "DM Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --font-serif: "Lora", Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--white);
      font-family: var(--font-sans); display: grid; place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; opacity: .045;
      background-image: linear-gradient(to right, rgba(255,255,255,.8) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.8) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, black 40%, transparent 95%);
    }
    .glow {
      position: fixed; top: -180px; left: 50%; transform: translateX(-50%);
      width: 740px; height: 500px; pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,.065), transparent 70%);
      filter: blur(50px);
    }
    .wrap { width: min(440px, calc(100% - 32px)); position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px;
      font-family: var(--font-mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
    .brand-mark { width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); overflow: hidden; }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; }
    h1 { font-family: var(--font-serif); font-weight: 400; font-size: 32px; letter-spacing: -.04em; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: #0b0b0e; color: var(--white); font-family: var(--font-sans); font-size: 14px; outline: none;
    }
    input:focus { border-color: rgba(255,255,255,.38); }
    .btn {
      width: 100%; margin-top: 18px; padding: 12px; border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px; background: #fff; color: #070709; font-family: var(--font-mono);
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; cursor: pointer;
    }
    .btn:disabled { opacity: .5; }
    .ghost {
      width: 100%; margin-top: 10px; padding: 12px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--white); cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px; font-size: 13px; font-family: var(--font-sans);
    }
    .ghost:hover { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.04); }
    .or { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 11px; font-family: var(--font-mono); margin: 16px 0 6px; letter-spacing: .12em; text-transform: uppercase; }
    .or:before, .or:after { content: ""; height: 1px; flex: 1; background: var(--border); }
    .switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
    .switch a { color: var(--white); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .err { color: #cfcfcf; min-height: 18px; margin-top: 10px; font-size: 13px; }
    a.back { display: block; text-align: center; margin-top: 18px; color: var(--dim); font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
    a.back:hover { color: var(--white); }
  </style>
</head>
<body>
  <div class="bg-grid"></div><div class="glow"></div>
  <div class="wrap">
    <a class="brand" href="/AI-Playground/">
      <div class="brand-mark"><img src="https://htmltools.me/logo3.png" alt=""/></div>
      <span>HTMLTOOLS</span>
    </a>
    <div class="card">
      <h1 id="title">Welcome back</h1>
      <p class="sub" id="sub">Sign in to keep every conversation on your account. No two-step verification.</p>
      <form id="form">
        <label>Email</label>
        <input id="email" type="email" required autocomplete="email"/>
        <label>Password</label>
        <input id="password" type="password" required minlength="6" autocomplete="current-password"/>
        <div class="err" id="err"></div>
        <button class="btn" id="submit" type="submit">Sign in</button>
      </form>
      <div class="or">or</div>
      <button class="ghost" id="google" type="button">Continue with Google</button>
      <div class="switch"><span id="switchText">Need an account?</span> <a id="toggle">Create one</a></div>
    </div>
    <a class="back" href="/AI-Playground/">← Back to playground</a>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    var FB_CONFIG = {
      apiKey: "AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s",
      authDomain: "website-encryption-htmltools.firebaseapp.com",
      databaseURL: "https://website-encryption-htmltools-default-rtdb.firebaseio.com",
      projectId: "website-encryption-htmltools",
      storageBucket: "website-encryption-htmltools.firebasestorage.app",
      messagingSenderId: "211271935323",
      appId: "1:211271935323:web:1abb9d416087ea89c0e67e"
    };
    firebase.initializeApp(FB_CONFIG);
    var auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    var mode = "in";
    document.getElementById("toggle").onclick = function () {
      mode = mode === "in" ? "up" : "in";
      document.getElementById("title").textContent = mode === "in" ? "Welcome back" : "Create account";
      document.getElementById("sub").textContent = mode === "in"
        ? "Sign in to keep every conversation on your account. No two-step verification."
        : "Email and password only. Conversations sync to this account.";
      document.getElementById("submit").textContent = mode === "in" ? "Sign in" : "Create account";
      document.getElementById("switchText").textContent = mode === "in" ? "Need an account?" : "Already have an account?";
      document.getElementById("toggle").textContent = mode === "in" ? "Create one" : "Sign in";
    };
    document.getElementById("form").onsubmit = async function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var btn = document.getElementById("submit");
      err.textContent = ""; btn.disabled = true;
      try {
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        if (mode === "in") await auth.signInWithEmailAndPassword(email, password);
        else await auth.createUserWithEmailAndPassword(email, password);
      } catch (ex) {
        err.textContent = String(ex.message || ex).replace("Firebase:", "").trim();
        btn.disabled = false;
      }
    };
    document.getElementById("google").onclick = async function () {
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (ex) { document.getElementById("err").textContent = String(ex.message || ex).replace("Firebase:", "").trim(); }
    };
    auth.onAuthStateChanged(function (user) {
      if (!user) return;
      var next = new URLSearchParams(location.search).get("next") || "/AI-Playground/";
      location.replace(next);
    });
  </script>
</body>
</html>
