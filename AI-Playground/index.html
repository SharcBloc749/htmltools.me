
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI Playground — HTMLTOOLS</title>
  <link rel="icon" href="https://htmltools.me/logo3.png"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap");
    :root {
      --bg:#070709; --surface:#101013; --elev:#16161a; --hover:#1a1a20;
      --border:rgba(255,255,255,.08); --white:#f5f5f7; --muted:#8e8e96; --dim:#54545d;
      --sans:"DM Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --serif:"Lora",Georgia,serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    body{display:flex;flex-direction:column;overflow:hidden}
    a{color:inherit;text-decoration:none}
    button,textarea{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
    .grid{position:fixed;inset:0;pointer-events:none;opacity:.045;z-index:0;
      background-image:linear-gradient(to right,rgba(255,255,255,.8) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.8) 1px,transparent 1px);
      background-size:52px 52px;mask-image:radial-gradient(ellipse 80% 60% at 50% 20%,#000 40%,transparent 95%)}
    .glow{position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:740px;height:500px;pointer-events:none;z-index:0;
      background:radial-gradient(circle,rgba(255,255,255,.065),transparent 70%);filter:blur(50px)}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);
      background:rgba(7,7,9,.78);backdrop-filter:blur(16px);position:relative;z-index:2}
    .brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
    .mark{width:38px;height:38px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}
    .mark img{width:100%;height:100%;object-fit:cover}
    nav{display:flex;gap:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    nav a:hover{color:#fff}
    .layout{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0;position:relative;z-index:1}
    .side{border-right:1px solid var(--border);background:#09090c;display:flex;flex-direction:column}
    .side h3{padding:18px 16px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    .list{flex:1;overflow:auto;padding:0 10px 16px}
    .item{display:block;padding:10px;border-radius:10px;margin-bottom:4px}
    .item:hover{background:var(--hover)}
    .item .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .m{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
    .stage{display:flex;flex-direction:column;min-width:0}
    .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 8% 12px}
    .kicker{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:5px 14px 5px 8px;
      font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:22px;width:fit-content}
    .kicker b{background:rgba(255,255,255,.1);border-radius:999px;padding:2px 7px;color:#fff;font-size:9px}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,72px);letter-spacing:-.05em;line-height:.95;margin-bottom:14px}
    h1 em{font-style:italic;color:#9898a3}
    .lead{color:var(--muted);max-width:520px}
    .composer{padding:0 8% 32px}
    .box{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:14px;max-width:820px}
    .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
    .model-wrap{position:relative}
    .model-btn{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:#0c0c10}
    .model-btn img{width:18px;height:18px;border-radius:4px;object-fit:cover}
    .info{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);display:inline-grid;place-items:center;font-size:10px;color:var(--muted);position:relative}
    .info:hover::after{content:attr(data-tip);position:absolute;left:20px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#1b1b22;border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;z-index:40}
    .menu{display:none;position:absolute;bottom:44px;left:0;width:300px;max-height:360px;overflow:auto;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:6px;z-index:20}
    .menu.open{display:block}
    .menu button{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-align:left}
    .menu button:hover{background:var(--hover)}
    .menu img{width:20px;height:20px;border-radius:4px;object-fit:cover}
    .pill{padding:7px 12px;border:1px solid var(--border);border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .pill.on{background:#fff;color:#070709;border-color:#fff}
    textarea{width:100%;min-height:72px;resize:none;outline:none;line-height:1.5}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border)}
    .send{padding:10px 18px;border-radius:999px;background:#fff;color:#070709;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
    .send:disabled{opacity:.4}
    .thumb{max-width:160px;border-radius:10px;border:1px solid var(--border);margin:6px 0}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;padding:10px 16px;border-radius:999px;background:#1b1b22;border:1px solid rgba(255,255,255,.25);font-family:var(--mono);font-size:11px;z-index:50;transition:.3s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.side{display:none}.hero,.composer{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <header>
    <a class="brand" href="/AI-Playground/"><div class="mark"><img src="https://htmltools.me/logo3.png" alt=""/></div><span>HTMLTOOLS</span></a>
    <nav><a href="https://htmltools.me/Main">Main ↗</a><a href="/AI-Playground/Login/" id="acct">Sign in</a></nav>
  </header>
  <div class="layout">
    <aside class="side">
      <h3>Your threads</h3>
      <div class="list" id="list"><div class="item"><div class="m">Sign in to see history</div></div></div>
    </aside>
    <main class="stage">
      <div class="hero">
        <div class="kicker"><b>PLAYGROUND</b> Start a private thread</div>
        <h1>Ask anything.<br><em>Pick a model.</em></h1>
        <p class="lead">The first message opens a conversation ID only you can open. Continue it at /AI-Playground/Chat/ID.</p>
      </div>
      <div class="composer">
        <div class="box">
          <div class="tools">
            <div class="model-wrap">
              <button class="model-btn" id="modelBtn" type="button">
                <img id="modelLogo" alt=""/><span id="modelName">Gemini 3.6 Flash</span>
                <span class="info" id="modelTip" data-tip="text & image → text">!</span>
              </button>
              <div class="menu" id="menu"></div>
            </div>
            <button class="pill" id="deep" type="button">Deep research</button>
          </div>
          <div id="previews"></div>
          <textarea id="input" placeholder="Message HTMLTOOLS…"></textarea>
          <div class="row">
            <div><button class="icon" id="attach" type="button">＋</button><input id="file" type="file" accept="image/*" hidden/></div>
            <button class="send" id="send" type="button">Start conversation</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const FB_CONFIG = { apiKey:"AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s", authDomain:"website-encryption-htmltools.firebaseapp.com", databaseURL:"https://website-encryption-htmltools-default-rtdb.firebaseio.com", projectId:"website-encryption-htmltools", storageBucket:"website-encryption-htmltools.firebasestorage.app", messagingSenderId:"211271935323", appId:"1:211271935323:web:1abb9d416087ea89c0e67e" };
    const MODELS = [
      {key:"gemini-3.6-flash",name:"Gemini 3.6 Flash",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"gemini-3.5-flash",name:"Gemini 3.5 Flash",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"gemini-3.5-flash-lite",name:"Gemini 3.5 Flash Lite",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"claude-haiku-4.5",name:"Claude Haiku 4.5",vision:true,logo:"https://htmltools.me/claudelogo.png"},
      {key:"claude-sonnet-4.6",name:"Claude Sonnet 4.6",vision:true,logo:"https://htmltools.me/claudelogo.png"},
      {key:"openai.gpt-oss-120b",name:"GPT-OSS 120B",vision:false,logo:"https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg"},
      {key:"deepseek.v3.2",name:"DeepSeek V3.2",vision:false,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/deepseek-logo-icon.png"},
      {key:"deepseek.v3.1",name:"DeepSeek V3.1",vision:false,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/deepseek-logo-icon.png"},
      {key:"zai.glm-4.7-flash",name:"GLM 4.7 Flash",vision:false,logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/Z.ai_%28company_logo%29.svg/3840px-Z.ai_%28company_logo%29.svg.png"},
      {key:"xai.grok-4.3",name:"Grok 4.3",vision:true,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/grok-icon.png"},
      {key:"qwen.qwen3-coder-next",name:"Qwen3 Coder Next",vision:false,logo:"https://vectorseek.com/wp-content/uploads/2025/01/Qwen-Ai-Logo-PNG-Vector.png"},
      {key:"llama-3.3-70b",name:"Llama 3.3 70B",vision:false,logo:""},
      {key:"llama-4-scout",name:"Llama 4 Scout",vision:true,logo:""},
      {key:"gemma-4-26b",name:"Gemma 4 26B",vision:true,logo:""}
    ];
    function ph(n){return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#16161a"/><text x="32" y="40" text-anchor="middle" fill="#f5f5f7" font-size="26">'+(n[0]||"M")+"</text></svg>")}
    function tip(m){return m.vision?"text & image → text":"text → text"}
    function logo(m){return m.logo||ph(m.name)}
    function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
    firebase.initializeApp(FB_CONFIG);
    const auth=firebase.auth(), db=firebase.database();
    let user=null, model=MODELS[0], deep=false, images=[];
    function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
    function setModel(m){model=m;document.getElementById("modelName").textContent=m.name;document.getElementById("modelLogo").src=logo(m);document.getElementById("modelTip").setAttribute("data-tip",tip(m))}
    document.getElementById("menu").innerHTML=MODELS.map(m=>`<button type="button" data-key="${m.key}"><img src="${logo(m)}" alt=""/><span>${m.name}</span><span class="info" data-tip="${tip(m)}">!</span></button>`).join("");
    document.getElementById("menu").onclick=e=>{const b=e.target.closest("button");if(!b)return;setModel(MODELS.find(x=>x.key===b.dataset.key));document.getElementById("menu").classList.remove("open")};
    document.getElementById("modelBtn").onclick=()=>document.getElementById("menu").classList.toggle("open");
    document.getElementById("deep").onclick=function(){deep=!deep;this.classList.toggle("on",deep)};
    document.getElementById("attach").onclick=()=>document.getElementById("file").click();
    document.getElementById("file").onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{images=[{mime:f.type,data:String(r.result).split(",")[1]}];document.getElementById("previews").innerHTML=`<img class="thumb" src="${r.result}" alt=""/>`};r.readAsDataURL(f);this.value=""};
    setModel(model);
    async function loadList(){if(!user)return;const snap=await db.ref("users/"+user.uid+"/conversations").once("value");const val=snap.val()||{};const items=Object.entries(val).map(([id,v])=>({id,...v})).sort((a,b)=>(b.updated||0)-(a.updated||0));document.getElementById("list").innerHTML=items.map(c=>`<a class="item" href="/AI-Playground/Chat/${c.id}/"><div class="t">${esc(c.title||"Untitled")}</div><div class="m">${esc(c.model||"")}</div></a>`).join("")||`<div class="item"><div class="m">No threads yet</div></div>`}
    async function start(){
      if(!user){location.href="/AI-Playground/Login/?next="+encodeURIComponent("/AI-Playground/");return}
      const text=document.getElementById("input").value.trim();
      if(!text&&!images.length){toast("Write a message first");return}
      const id="c_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
      const content=[];if(text)content.push({type:"text",text});images.forEach(im=>content.push({type:"image",mime:im.mime,data:im.data}));
      const userMsg={role:"user",content:content.length===1&&content[0].type==="text"?text:content};
      await db.ref("users/"+user.uid+"/conversations/"+id).set({owner:user.uid,title:(text||"Image").slice(0,60),model:model.key,deep:deep,pending:true,messages:[userMsg],created:Date.now(),updated:Date.now()});
      location.href="/AI-Playground/Chat/"+id+"/";
    }
    document.getElementById("send").onclick=start;
    document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();start()}});
    auth.onAuthStateChanged(u=>{user=u;document.getElementById("acct").textContent=u?(u.email||"Account"):"Sign in";if(u)loadList()});
  </script>
</body>
</html>
