<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Chat — HTMLTOOLS AI Playground</title>
  <link rel="icon" href="https://htmltools.me/logo3.png"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap");

    :root {
      --bg: #070709;
      --surface: #0e0e12;
      --surface-elev: #141419;
      --elev: #181820;
      --hover: #1e1e27;
      --active: #262632;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --border-strong: rgba(255, 255, 255, 0.28);
      --white: #f5f5f7;
      --pure-white: #ffffff;
      --muted: #8e8e96;
      --dim: #54545d;
      --sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --serif: "Lora", Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, textarea, input {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
      user-select: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Sidebar */
    .side {
      width: 290px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: #09090c;
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .side-h {
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #000;
      display: grid;
      place-items: center;
    }

    .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .side-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .side-actions {
      padding: 12px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .new-btn {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      color: var(--white);
      transition: all 0.18s ease;
    }

    .new-btn:hover {
      background: var(--pure-white);
      color: #070709;
      border-color: var(--pure-white);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.12);
    }

    .search-wrap {
      position: relative;
      margin: 0 14px 8px;
    }

    .search-input {
      width: 100%;
      padding: 7px 10px 7px 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--white);
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.05);
    }

    .search-input::placeholder {
      color: var(--dim);
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: var(--dim);
      pointer-events: none;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      text-align: left;
    }

    .item:hover {
      background: var(--hover);
      color: var(--white);
    }

    .item.on {
      background: var(--surface-elev);
      color: var(--white);
      border-color: var(--border);
    }

    .item.on::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--white);
      border-radius: 0 3px 3px 0;
    }

    .item-body {
      flex: 1;
      min-width: 0;
    }

    .item .t {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .item .m-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .item .m {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item .m-time {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--dim);
    }

    .item-del {
      opacity: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--dim);
      transition: all 0.15s ease;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .item:hover .item-del {
      opacity: 0.7;
    }

    .item-del:hover {
      opacity: 1 !important;
      color: #ff5555;
      background: rgba(255, 85, 85, 0.12);
    }

    .foot {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #08080a;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .user-av {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--hover);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--white);
      flex-shrink: 0;
    }

    .user-name {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .signout-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .signout-btn:hover {
      color: var(--white);
      background: var(--hover);
    }

    /* Main Section */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background: radial-gradient(1100px 360px at 50% -12%, rgba(255, 255, 255, 0.035), transparent);
    }

    /* Top Bar */
    .top {
      height: 64px;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
      background: rgba(7, 7, 9, 0.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 40;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      place-items: center;
      color: var(--white);
    }

    .model-wrap {
      position: relative;
    }

    .model-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--white);
      transition: all 0.18s ease;
    }

    .model-btn:hover {
      background: var(--hover);
      border-color: var(--border-hover);
    }

    .model-btn-logo-wrap {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #121217;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .model-btn-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Header model logo spin indicator */
    .model-btn.thinking .model-btn-logo-wrap img {
      animation: spin 1s linear infinite;
    }

    .model-btn .chevron {
      width: 14px;
      height: 14px;
      color: var(--dim);
      transition: transform 0.2s;
    }

    .model-wrap.open .chevron {
      transform: rotate(180deg);
    }

    .tag-vision {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Model Menu Dropdown */
    .menu {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      width: 360px;
      max-height: 480px;
      background: var(--elev);
      border: 1px solid var(--border-hover);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.4);
      z-index: 100;
      overflow-y: auto;
      padding: 8px;
      animation: menuFade 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes menuFade {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu.open {
      display: block;
    }

    .menu-group-label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 8px 10px 4px;
      font-weight: 600;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      text-align: left;
      transition: background 0.14s;
    }

    .menu-item:hover {
      background: var(--hover);
    }

    .menu-item.selected {
      background: var(--active);
    }

    .menu-item img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #111;
      border: 1px solid var(--border);
    }

    .menu-item-info {
      flex: 1;
      min-width: 0;
    }

    .menu-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--white);
    }

    .menu-item-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      margin-top: 1px;
    }

    /* Top Right Controls */
    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.active {
      color: var(--white);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.2s;
    }

    .status-badge.active .status-dot {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .pill-btn {
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s ease;
    }

    .pill-btn:hover {
      color: var(--white);
      border-color: var(--border-hover);
    }

    .pill-btn.on {
      background: var(--pure-white);
      color: #070709;
      border-color: var(--pure-white);
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(255, 255, 255, 0.18);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
    }

    .pill-btn.on .pill-dot {
      background: #070709;
    }

    /* Messages Area */
    .msgs {
      flex: 1;
      overflow-y: auto;
      padding: 30px 8% 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 16px;
      animation: msgIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      justify-content: flex-end;
    }

    .msg.user .bubble {
      background: var(--surface-elev);
      border: 1px solid var(--border-hover);
      border-radius: 18px 18px 4px 18px;
      padding: 14px 18px;
      max-width: 82%;
    }

    .msg.user .who {
      display: none;
    }

    .msg.user .body {
      font-size: 15px;
      line-height: 1.6;
    }

    /* Model Avatar & Spinning Animation */
    .av {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #111116;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .av-fallback {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    /* Spinning when thinking */
    .av.spin, .av.thinking {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.16);
    }

    .av.spin img, .av.thinking img {
      animation: avSpin 1.1s linear infinite;
      transform-origin: center center;
    }

    @keyframes avSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bubble {
      flex: 1;
      min-width: 0;
    }

    .msg.assistant .bubble {
      padding-bottom: 2px;
    }

    .msg.assistant .who {
      color: #a4a4ae;
    }

    .who {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .body {
      font-size: 15.5px;
      line-height: 1.7;
      word-break: break-word;
      color: #ebebee;
    }

    .body p {
      margin: 0 0 0.85em;
    }
    .body p:last-child {
      margin-bottom: 0;
    }

    .body h1, .body h2, .body h3, .body h4 {
      font-family: var(--serif);
      font-weight: 400;
      color: #fff;
      letter-spacing: -0.02em;
      margin: 1.2em 0 0.45em;
      line-height: 1.3;
    }
    .body h1 { font-size: 1.65em; }
    .body h2 { font-size: 1.4em; }
    .body h3 { font-size: 1.2em; }
    .body h4 { font-size: 1.05em; font-family: var(--sans); font-weight: 600; }

    .body ul, .body ol {
      margin: 0.4em 0 0.9em 1.4em;
    }
    .body li {
      margin: 0.3em 0;
    }

    .body hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 1.3em 0;
    }

    .body em {
      font-style: italic;
      color: #d6d6dc;
    }

    .body strong {
      font-weight: 600;
      color: #fff;
    }

    .body code {
      font-family: var(--mono);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #f0f0f3;
    }

    .body blockquote {
      border-left: 3px solid var(--border-strong);
      padding-left: 14px;
      margin: 0.8em 0;
      color: var(--muted);
      font-style: italic;
    }

    /* Markdown Tables */
    .body table.mdtable {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 18px;
      font-size: 13.5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .body table.mdtable th, .body table.mdtable td {
      border: 1px solid var(--border);
      padding: 9px 12px;
      text-align: left;
    }

    .body table.mdtable th {
      background: rgba(255, 255, 255, 0.04);
      font-weight: 600;
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--white);
    }

    .body table.mdtable tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.015);
    }

    /* Collapsible Thinking Process Box */
    .think {
      margin: 0 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .think:hover {
      border-color: var(--border-hover);
    }

    .think summary {
      list-style: none;
      cursor: pointer;
      padding: 9px 14px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .think summary::-webkit-details-marker {
      display: none;
    }

    .think-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
    }

    .dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.25;
      animation: blink 1.2s infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.2s; }
    .dots i:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.9); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    .think pre {
      padding: 0 14px 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Code Blocks */
    .codebox {
      margin: 14px 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #09090d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .codebox .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: #0d0d12;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;

    function phSvg(n) {
      const letter = (n || "M")[0].toUpperCase();
      return "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#141419"/><text x="32" y="42" text-anchor="middle" fill="#f5f5f7" font-family="sans-serif" font-weight="600" font-size="28">' + letter + '</text></svg>'
      );
    }

    function logo(m) {
      return (m && m.logo) ? m.logo : phSvg(m ? m.name : "M");
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function inline(s) {
      s = esc(s);
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__(.+?)__/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^\w*])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }

    function md(src) {
      const fences = [];
      let raw = String(src || "").replace(/\r\n/g, "\n").replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        fences.push({ lang: lang || "text", code });
        return "\n%%FENCE" + (fences.length - 1) + "%%\n";
      });

      const lines = raw.split("\n");
      const out = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const fm = line.match(/^%%FENCE(\d+)%%$/);
        if (fm) {
          const b = fences[+fm[1]];
          const id = "cb_" + Math.random().toString(36).slice(2, 8);
          out.push(
            `<div class="codebox">` +
              `<div class="bar">` +
                `<em>${esc(b.lang)}</em>` +
                `<span>` +
                  `<button type="button" onclick="copyCode('${id}')">Copy</button>` +
                  `<button type="button" onclick="dlCode('${id}','${esc(b.lang)}')">Download</button>` +
                `</span>` +
              `</div>` +
              `<pre id="${id}">${esc(b.code)}</pre>` +
            `</div>`
          );
          continue;
        }

        const h = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
        if (h) {
          out.push("<h" + h[1].length + ">" + inline(h[2].replace(/#+\s*$/, "")) + "</h" + h[1].length + ">");
          continue;
        }

        if (/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          out.push("<hr/>");
          continue;
        }

        if (/^\s*>+\s*(.*)$/.test(line)) {
          out.push("<blockquote>" + inline(line.replace(/^\s*>+\s*/, "")) + "</blockquote>");
          continue;
        }

        if (/^\s*\|.+\|/.test(line)) {
          const rows = [];
          while (i < lines.length && /^\s*\|/.test(lines[i])) {
            const cells = lines[i].replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
            if (!/^\s*\|?\s*:?-{3,}/.test(lines[i])) rows.push(cells);
            i++;
          }
          i--;
          if (rows.length) {
            let t = "<table class='mdtable'>";
            t += "<thead><tr>" + rows[0].map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead>";
            if (rows.length > 1) {
              t += "<tbody>" + rows.slice(1).map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody>";
            }
            t += "</table>";
            out.push(t);
          }
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
            i++;
          }
          i--;
          out.push("<ul>" + items.map(t => "<li>" + inline(t) + "</li>").join("") + "</ul>");
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
            i++;
          }
          i--;
          out.push("<ol>" + items.map(t => "<li>" + inline(t) + "</li>").join("") + "</ol>");
          continue;
        }

        if (!line.trim()) {
          out.push("");
          continue;
        }

        out.push("<p>" + inline(line) + "</p>");
      }

      return out.join("");
    }

    window.copyCode = function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.innerText).then(() => {
        const btn = el.parentElement.querySelector("button");
        if (btn) {
          const orig = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => { btn.textContent = orig; }, 1800);
        }
      });

    window.dlCode = function(id, lang) {
      const el = document.getElementById(id);
      if (!el) return;
      const extMap = {
        html: "html", htm: "html", javascript: "js", js: "js",
        css: "css", python: "py", py: "py", json: "json",
        typescript: "ts", ts: "ts", markdown: "md", md: "md",
        sh: "sh", bash: "sh", sql: "sql", text: "txt"
      };
      const ext = extMap[String(lang || "").toLowerCase()] || "txt";

    // Only use the high-use message for actual capacity/rate-limit failures.
    // Invalid model, unsupported feature, authentication, and network errors get
    // a neutral message instead of incorrectly blaming model traffic.
    function friendlyModelError(raw) {
      const text = String(raw || "").toLowerCase();
      const isBusy = /\b(?:429|503)\b|rate[- ]?limit|too many requests|overload|capacity|high use|high demand|temporarily unavailable|service unavailable|try again later|\bbusy\b/.test(text);
      return isBusy ? MODEL_BUSY_MESSAGE : MODEL_GENERIC_ERROR_MESSAGE;
    }

    function timeAgo(ts) {
      if (!ts) return "";
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return "Just now";
      if (diff < 3600) return Math.floor(diff / 60) + "m ago";
      if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
      return Math.floor(diff / 86400) + "d ago";
    }

    async function loadList() {
      if (!user) return;
      const generation = ++listLoadGeneration;
      try {
        const snap = await db.ref("users/" + user.uid + "/conversations").once("value");
        if (generation !== listLoadGeneration) return;
        const val = snap.val() || {};
        conversationsCache = Object.entries(val)
          .filter(([, v]) => v && typeof v === "object")
          .map(([id, v]) => ({ id, ...v }))
          .sort((a, b) => (b.updated || 0) - (a.updated || 0));
        renderList(conversationsCache);
      } catch (_) {}
    }

    function renderList(items) {
      const countEl = document.getElementById("convCount");
      if (countEl) countEl.textContent = items.length + " thread" + (items.length === 1 ? "" : "s");

      const listEl = document.getElementById("list");
      if (!items.length) {
        listEl.innerHTML = `<div class="item" style="cursor:default;opacity:0.5"><div class="m">No conversations yet</div></div>`;

        const listedModel = c.modelName || MODELS.find(m => m.key === c.model)?.name || c.model || "";
        return `

        (c.title && c.title.toLowerCase().includes(q)) ||
        (c.model && c.model.toLowerCase().includes(q))
      );
      renderList(filtered);
    };

    function payload(sourceThread = thread) {
      return sourceThread.map(m => ({ role: m.role, content: m.content }));
    }

    function conversationTitle(text, hasImages) {
      const clean = String(text || "")
        .replace(/\s+/g, " ")
        .trim();
      const base = clean || (hasImages ? "Image prompt" : "New conversation");
      return base.length > 72 ? base.slice(0, 69).trimEnd() + "…" : base;
    }

    function saveConversation(id, patch) {
      if (!user || !id) return Promise.resolve();
      return db.ref("users/" + user.uid + "/conversations/" + id).update(patch);

    function setStatus(text, isActive) {

      else b.classList.remove("active");

    /**
     * Run model with instant streaming and resilient error handling.
     * Guaranteed to reset busy state and clear animations in finally block.
     */
    async function runModel(modelOverride = model, threadOverride = thread, convIdOverride = convId, deepOverride = deep) {
      if (busy) return;
      busy = true;

      // Capture the model, conversation id, and message array for this request.
      // This prevents a late response from overwriting another conversation if
      // the user switches threads while generation is still running.
      const requestModel = modelOverride;
      const requestConvId = convIdOverride;
      const requestThread = threadOverride;
      const requestDeep = deepOverride;

      document.getElementById("send").disabled = true;
      document.getElementById("stopBtn").style.display = "flex";
      setStatus("Thinking", true);

      const wrap = addMsgDOM(requestModel.name, "", null, true, requestModel);
      const avEl = wrap.querySelector(".av");
      if (avEl) avEl.classList.add("spin");

      document.getElementById("modelBtn").classList.add("thinking");

      const thinkBox = wrap.querySelector(".think");
      const thinkPre = wrap.querySelector(".think pre");
      const bodyEl = wrap.querySelector(".body");

      let acc = "";
      let think = "";
      let modelError = false;
      abortController = new AbortController();

      try {
        const token = await user.getIdToken();
        const res = await fetch(API + "/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            model: requestModel.key,
            messages: payload(requestThread),
            deepResearch: requestDeep
          }),
          signal: abortController.signal
        });

        if (!res.ok) {
          const t = await res.text();
          throw new Error("API error (" + res.status + "): " + t.slice(0, 400));
        }

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += dec.decode(value, { stream: true });
          buf = buf.replace(/\r\n/g, "\n");
          let idx;

          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const chunk = buf.slice(0, idx);
            buf = buf.slice(idx + 2);

            for (const line of chunk.split("\n")) {
              if (!line.startsWith("data:")) continue;
              const rawData = line.slice(5).trim();
              if (!rawData || rawData === "[DONE]") continue;

              let j;
              try { j = JSON.parse(rawData); } catch { continue; }

              if (j.type === "error") {
                modelError = true;
                think = "";
                thinkBox.hidden = true;
                thinkBox.open = false;
                acc = friendlyModelError(j.error);
                bodyEl.innerHTML = md(acc);
                continue;
              }

              if (modelError) continue;

              if (j.type === "thinking" && j.text) {
                think += j.text;
                thinkBox.hidden = false;
                thinkBox.open = true;
                thinkPre.textContent = think;
                document.getElementById("msgs").scrollTop = 1e9;
              }

              if (j.type === "delta" && j.text) {
                if (!acc) {
                  setStatus("Writing", true);
                  if (think) {
                    thinkBox.querySelector("summary .think-left").innerHTML = "Thought process";
                    thinkBox.open = false;
                  }
                }
                acc += j.text;
                bodyEl.innerHTML = md(acc);
                document.getElementById("msgs").scrollTop = 1e9;
              }
            }
          }
        }
      } catch (err) {
        if (err.name === "AbortError") {
          acc += (acc ? "\n\n" : "") + "_Generation stopped._";
        } else {
          think = "";
          thinkBox.hidden = true;
          thinkBox.open = false;
          acc = friendlyModelError(err.message);
        }
        bodyEl.innerHTML = md(acc);
      } finally {
        if (avEl) avEl.classList.remove("spin");
        document.getElementById("modelBtn").classList.remove("thinking");

        if (!think) thinkBox.hidden = true;
        if (!acc) {
          acc = MODEL_GENERIC_ERROR_MESSAGE;
          bodyEl.innerHTML = md(acc);
        }

        requestThread.push({
          role: "assistant",
          content: acc,
          model: requestModel.key,
          modelName: requestModel.name
        });

        // Persist only this request's conversation. Never replace its title or
        // first-selected model when later messages use another model.
        if (requestConvId && user) {
          try {
            await saveConversation(requestConvId, {
              pending: false,
              messages: requestThread,
              deep: requestDeep,
              updated: Date.now()
            });
          } catch (_) {}
        }

        // If the user stayed on this conversation, keep the active thread in
        // sync. If they switched away, the captured array above is still saved.
        if (convId === requestConvId) thread = requestThread;

        busy = false;
        abortController = null;
        document.getElementById("send").disabled = false;
        document.getElementById("stopBtn").style.display = "none";
        setStatus("Ready", false);
        loadList();
      }
    }

    // Stop button
    document.getElementById("stopBtn").onclick = () => {
      if (abortController) {
        abortController.abort();
      }
    };

    /**
     * Send user message immediately without blocking on Firebase writes.
     */
    async function send() {
      const text = document.getElementById("input").value.trim();
      if (!text && !pendingImages.length) return;
      if (busy) return;

      const imgs = pendingImages.slice();
      pendingImages = [];
      renderPreviews();

      const inputEl = document.getElementById("input");
      inputEl.value = "";
      inputEl.style.height = "auto";

      const isFirstPrompt = !thread.some(m => m.role === "user");
      const selectedModel = model;
      const content = [];
      if (text) content.push({ type: "text", text });
      imgs.forEach(im => content.push({ type: "image", mime: im.mime, data: im.data, url: im.url }));

      const userMsg = {
        role: "user",
        content: content.length === 1 && content[0].type === "text" ? text : content
      };

      thread.push(userMsg);

      const emptyEl = document.getElementById("msgs").querySelector(".empty");
      if (emptyEl) emptyEl.remove();
      addMsgDOM("You", md(text || "(image)"), imgs, false);

      if (!convId) {
        convId = "c_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        window.history.pushState(null, "", "/AI-Playground/Chat/" + convId + "/");
      }

      const selectedThread = thread;
      const selectedConversationId = convId;
      const selectedDeep = deep;

      if (user) {
        const patch = {
          owner: user.uid,
          messages: selectedThread,
          updated: Date.now(),
          pending: true,
          deep: selectedDeep
        };

        // The first prompt permanently establishes the title and the model
        // shown for this conversation. Later turns cannot rename or reassign it.
        if (isFirstPrompt) {
          patch.title = conversationTitle(text, imgs.length > 0);
          patch.model = selectedModel.key;
          patch.modelName = selectedModel.name;
        }

        saveConversation(selectedConversationId, patch).catch(err => console.error("Firebase update error:", err));
      }

      runModel(selectedModel, selectedThread, selectedConversationId, selectedDeep);
    }

    document.getElementById("send").onclick = send;

    document.getElementById("input").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    /**
     * Load a conversation with retry to eliminate race conditions on redirect.
     */
    async function loadConversation(id) {
      const generation = ++conversationLoadGeneration;
      convId = id;
      window.history.pushState(null, "", "/AI-Playground/Chat/" + id + "/");

      const msgsBox = document.getElementById("msgs");
      msgsBox.innerHTML = `
        <div class="skeleton-loader">
          <div class="spinner-ring"></div>
          <span>Loading conversation…</span>
        </div>
      `;

      let v = null;
      let retries = 5;

      while (retries > 0) {
        try {
          const snap = await db.ref("users/" + user.uid + "/conversations/" + id).once("value");
          v = snap.val();
          if (v) break;
        } catch (_) {}

        retries--;
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 400));
        }
      }

      if (generation !== conversationLoadGeneration || convId !== id) return;

      if (!v) {
        msgsBox.innerHTML = `
          <div class="empty">
            <h2>Conversation not found</h2>
            <p>This thread does not exist or may have been deleted.</p>
            <button class="new-btn" style="max-width:200px;margin:20px auto" onclick="startNewChat()">Start a new chat</button>
          </div>
        `;
        return;
      }

      // Realtime Database can return a numeric-keyed object instead of an
      // array after edits; normalize it so every saved turn is restored.
      thread = Array.isArray(v.messages) ? v.messages : Object.values(v.messages || {});
      deep = !!v.deep;
      document.getElementById("deep").classList.toggle("on", deep);

      const m = MODELS.find(x => x.key === v.model);
      if (m) setModel(m);

      renderThread();
      loadList();

      // If pending on load (e.g. redirected from home page), run immediately!
      if (generation === conversationLoadGeneration && convId === id && v.pending && thread.length && thread[thread.length - 1].role === "user") {
        runModel();
      }
    }

    // Auth & Init
    auth.onAuthStateChanged(async u => {
      if (!u) {
        location.href = "/AI-Playground/Login/?next=" + encodeURIComponent(location.pathname);
        return;
      }

      user = u;
      const email = u.email || "Account";
      document.getElementById("userEmail").textContent = email;
      document.getElementById("userAv").textContent = (email[0] || "U").toUpperCase();

      renderModelMenu();
      setModel(model);

      convId = pathId();

      if (convId) {
        await loadConversation(convId);
      } else {
        // No conversation ID in path: start fresh chat view cleanly
        startNewChat();
      }

      await loadList();
    });
  </script>
</body>
</html>
