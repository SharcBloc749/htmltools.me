<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Chat — HTMLTOOLS AI Playground</title>
  <link rel="icon" href="https://htmltools.me/logo3.png"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap");
    :root{--bg:#070709;--surface:#101013;--elev:#16161a;--hover:#1a1a20;--border:rgba(255,255,255,.08);--white:#f5f5f7;--muted:#8e8e96;--dim:#54545d;--sans:"DM Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--serif:"Lora",Georgia,serif}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button,textarea{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
    body{display:flex}
    .side{width:292px;flex-shrink:0;border-right:1px solid var(--border);background:#09090c;display:flex;flex-direction:column}
    .side-h{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
    .mark{width:34px;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}.mark img{width:100%;height:100%;object-fit:cover}
    .new{margin:14px 16px;padding:11px;border:1px solid var(--border);border-radius:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
    .new:hover{background:#fff;color:#070709}
    .list{flex:1;overflow:auto;padding:0 10px}
    .item{display:block;padding:11px 12px;border-radius:10px;margin-bottom:4px}
    .item:hover,.item.on{background:var(--hover)}
    .item .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .m{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}
    .foot{padding:14px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
    .main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(900px 280px at 50% -10%,rgba(255,255,255,.04),transparent)}
    .top{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;background:rgba(7,7,9,.72);backdrop-filter:blur(14px)}
    .model-wrap{position:relative}
    .model-btn{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
    .model-btn img{width:20px;height:20px;border-radius:4px;object-fit:cover}
    .info{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:10px;color:var(--muted);position:relative}
    .info:hover::after{content:attr(data-tip);position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#1b1b22;border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;z-index:20}
    .menu{display:none;position:absolute;top:46px;left:0;width:340px;max-height:440px;overflow:auto;background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:6px;z-index:30;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .menu.open{display:block}
    .menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;text-align:left}
    .menu button:hover{background:var(--hover)}.menu img{width:22px;height:22px;border-radius:4px;object-fit:cover}
    .pill{padding:8px 14px;border:1px solid var(--border);border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .pill.on{background:#fff;color:#070709;border-color:#fff}
    .msgs{flex:1;overflow:auto;padding:32px 8% 16px}
    .msg{max-width:780px;margin:0 auto 26px;display:flex;gap:14px}
    .av{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:#121216;flex-shrink:0;overflow:hidden;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
    .av img{width:100%;height:100%;object-fit:cover}
    .av.spin img{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bubble{flex:1;min-width:0}
    .who{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
    .body{font-size:15.5px;line-height:1.7;word-break:break-word}
    .body p{margin:0 0 .75em}
    .body h1,.body h2,.body h3,.body h4{font-family:var(--serif);font-weight:500;letter-spacing:-.03em;margin:1.1em 0 .4em;line-height:1.25}
    .body h1{font-size:1.6em}.body h2{font-size:1.35em}.body h3{font-size:1.18em}
    .body ul,.body ol{margin:.4em 0 .9em 1.2em}
    .body li{margin:.2em 0}
    .body hr{border:0;border-top:1px solid var(--border);margin:1.1em 0}
    .body em{font-style:italic;color:#d5d5dc}
    .body strong{font-weight:600}
    .body code{font-family:var(--mono);font-size:13px;background:#121216;padding:1px 5px;border-radius:4px}
    .think{margin:0 0 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);overflow:hidden}
    .think summary{list-style:none;cursor:pointer;padding:10px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
    .think summary::-webkit-details-marker{display:none}
    .dots{display:inline-flex;gap:4px}
    .dots i{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.25;animation:blink 1.1s infinite}
    .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
    @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
    .think pre{padding:0 14px 12px;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;max-height:180px;overflow:auto}
    .codebox{margin:12px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0c0c10}
    .codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .codebox .bar button{border:1px solid var(--border);border-radius:999px;padding:4px 10px;margin-left:6px}
    .codebox .bar button:hover{background:#fff;color:#070709}
    .codebox pre{margin:0;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre}
    .thumb{max-width:220px;border-radius:10px;border:1px solid var(--border);margin:8px 8px 8px 0}
    .composer{padding:14px 8% 24px}
    .box{max-width:780px;margin:0 auto;border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:12px 14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    textarea{width:100%;min-height:58px;max-height:180px;resize:none;outline:none}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border)}
    .send{padding:9px 18px;border-radius:999px;background:#fff;color:#070709;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
    .send:disabled{opacity:.4}
    .empty{text-align:center;padding:90px 20px;color:var(--muted);max-width:560px;margin:0 auto}
    .empty h2{font-family:var(--serif);font-weight:400;font-size:40px;color:#fff;margin-bottom:10px;letter-spacing:-.03em}
    .status{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
    @media(max-width:800px){.side{display:none}.msgs,.composer{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <aside class="side">
    <div class="side-h"><a class="mark" href="/AI-Playground/"><img src="https://htmltools.me/logo3.png" alt=""/></a><span>Playground</span></div>
    <a class="new" href="/AI-Playground/">＋ New conversation</a>
    <div class="list" id="list"></div>
    <div class="foot" id="foot">…</div>
  </aside>
  <section class="main">
    <div class="top">
      <div class="model-wrap">
        <button class="model-btn" id="modelBtn" type="button">
          <img id="modelLogo" alt=""/><span id="modelName">Gemini 3.6 Flash</span>
          <span class="info" id="modelTip" data-tip="text & image → text">!</span>
        </button>
        <div class="menu" id="menu"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="status" id="status"></span>
        <button class="pill" id="deep" type="button">Deep research</button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="box">
        <div id="previews"></div>
        <textarea id="input" placeholder="Continue the thread…" rows="2"></textarea>
        <div class="row">
          <div><button class="icon" id="attach" type="button">＋</button><input id="file" type="file" accept="image/*" hidden/></div>
          <button class="send" id="send" type="button">Send</button>
        </div>
      </div>
    </div>
  </section>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const API="https://htmltools-me-ai-playground.bozhetarnikmatthew.workers.dev";
    const FB_CONFIG={apiKey:"AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s",authDomain:"website-encryption-htmltools.firebaseapp.com",databaseURL:"https://website-encryption-htmltools-default-rtdb.firebaseio.com",projectId:"website-encryption-htmltools",storageBucket:"website-encryption-htmltools.firebasestorage.app",messagingSenderId:"211271935323",appId:"1:211271935323:web:1abb9d416087ea89c0e67e"};
    const MODELS=[
      {key:"gemini-3.6-flash",name:"Gemini 3.6 Flash",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"gemini-3.5-flash",name:"Gemini 3.5 Flash",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"gemini-3.5-flash-lite",name:"Gemini 3.5 Flash Lite",vision:true,logo:"https://htmltools.me/geminilogo.png"},
      {key:"claude-haiku-4.5",name:"Claude Haiku 4.5",vision:true,logo:"https://htmltools.me/claudelogo.png"},
      {key:"claude-sonnet-4.6",name:"Claude Sonnet 4.6",vision:true,logo:"https://htmltools.me/claudelogo.png"},
      {key:"openai.gpt-oss-120b",name:"GPT-OSS 120B",vision:false,logo:"https://static.vecteezy.com/system/resources/previews/021/059/825/non_2x/chatgpt-logo-chat-gpt-icon-on-green-background-free-vector.jpg"},
      {key:"deepseek.v3.2",name:"DeepSeek V3.2",vision:false,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/deepseek-logo-icon.png"},
      {key:"deepseek.v3.1",name:"DeepSeek V3.1",vision:false,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/deepseek-logo-icon.png"},
      {key:"zai.glm-4.7-flash",name:"GLM 4.7 Flash",vision:false,logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/Z.ai_%28company_logo%29.svg/3840px-Z.ai_%28company_logo%29.svg.png"},
      {key:"xai.grok-4.3",name:"Grok 4.3",vision:true,logo:"https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/grok-icon.png"},
      {key:"qwen.qwen3-coder-next",name:"Qwen3 Coder Next",vision:false,logo:"https://vectorseek.com/wp-content/uploads/2025/01/Qwen-Ai-Logo-PNG-Vector.png"},
      {key:"llama-3.3-70b",name:"Llama 3.3 70B",vision:false,logo:""},
      {key:"llama-4-scout",name:"Llama 4 Scout",vision:true,logo:""},
      {key:"gemma-4-26b",name:"Gemma 4 26B",vision:true,logo:""}
    ];
    function ph(n){return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#16161a"/><text x="32" y="40" text-anchor="middle" fill="#f5f5f7" font-size="26">'+(n[0]||"M")+"</text></svg>")}
    function tip(m){return m.vision?"text & image → text":"text → text"}
    function logo(m){return m.logo||ph(m.name)}
    function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
    function md(text){
      const blocks=[];
      let s=String(text||"").replace(/```(\w+)?\n([\s\S]*?)```/g,(_,lang,code)=>{const i=blocks.length;blocks.push({lang:lang||"text",code});return "\0B"+i+"\0"});
      s=esc(s);
      s=s.replace(/^###### (.*)$/gm,"<h6>$1</h6>").replace(/^##### (.*)$/gm,"<h5>$1</h5>").replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
      s=s.replace(/^---+$/gm,"<hr/>");
      s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
      s=s.replace(/(^|[^\*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
      s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
      s=s.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>");
      s=s.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,(m)=>"<ul>"+m+"</ul>");
      s=s.replace(/\0B(\d+)\0/g,(_,i)=>{const b=blocks[+i];const id="cb"+i+Math.random().toString(36).slice(2,6);return `<div class="codebox"><div class="bar"><em>${esc(b.lang)}</em><span><button type="button" onclick="copyCode('${id}')">Copy</button><button type="button" onclick="dlCode('${id}','${esc(b.lang)}')">Download</button></span></div><pre id="${id}">${esc(b.code)}</pre></div>`});
      s=s.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br/>");
      return "<p>"+s+"</p>";
    }
    window.copyCode=id=>navigator.clipboard.writeText(document.getElementById(id).innerText);
    window.dlCode=(id,lang)=>{const ext={html:"html",javascript:"js",js:"js",css:"css",python:"py",json:"json"}[lang]||"txt";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([document.getElementById(id).innerText],{type:"text/plain"}));a.download="snippet."+ext;a.click()};

    firebase.initializeApp(FB_CONFIG);
    const auth=firebase.auth(), db=firebase.database();
    let user=null, convId=null, model=MODELS[0], deep=false, pendingImages=[], thread=[], busy=false;

    function pathId(){const p=location.pathname.replace(/\/+$/,"").split("/");const i=p.indexOf("Chat");if(i>=0&&p[i+1]&&p[i+1]!=="index.html")return p[i+1];return null}
    function setModel(m){model=m;document.getElementById("modelName").textContent=m.name;document.getElementById("modelLogo").src=logo(m);document.getElementById("modelTip").setAttribute("data-tip",tip(m))}
    document.getElementById("menu").innerHTML=MODELS.map(m=>`<button type="button" data-key="${m.key}"><img src="${logo(m)}" alt=""/><span>${m.name}</span><span class="info" data-tip="${tip(m)}">!</span></button>`).join("");
    document.getElementById("menu").onclick=e=>{const b=e.target.closest("button");if(!b)return;setModel(MODELS.find(x=>x.key===b.dataset.key));document.getElementById("menu").classList.remove("open")};
    document.getElementById("modelBtn").onclick=()=>document.getElementById("menu").classList.toggle("open");
    document.getElementById("deep").onclick=function(){deep=!deep;this.classList.toggle("on",deep)};
    document.getElementById("attach").onclick=()=>document.getElementById("file").click();
    document.getElementById("file").onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingImages=[{mime:f.type,data:String(r.result).split(",")[1]}];document.getElementById("previews").innerHTML=`<img class="thumb" src="${r.result}" alt=""/>`};r.readAsDataURL(f);this.value=""};
    setModel(model);

    function addMsg(role, html, imgs, isModel){
      const el=document.createElement("div");el.className="msg";
      const av=isModel?`<div class="av"><img src="${logo(model)}" alt=""/></div>`:`<div class="av">YOU</div>`;
      el.innerHTML=`${av}<div class="bubble"><div class="who">${esc(role)}</div><div class="think" hidden><summary>Thinking <span class="dots"><i></i><i></i><i></i></span></summary><pre></pre></div><div class="body">${html||""}</div></div>`;
      if(imgs)imgs.forEach(im=>{const img=document.createElement("img");img.className="thumb";img.src="data:"+im.mime+";base64,"+im.data;el.querySelector(".body").prepend(img)});
      document.getElementById("msgs").appendChild(el);document.getElementById("msgs").scrollTop=1e9;
      return el;
    }
    function renderThread(){
      const box=document.getElementById("msgs");box.innerHTML="";
      if(!thread.length){box.innerHTML=`<div class="empty"><h2>Continue.</h2><p>This thread is private to your account. Send a message to keep going.</p></div>`;return}
      thread.forEach(m=>{
        if(m.role==="user"){
          const text=typeof m.content==="string"?m.content:((m.content||[]).find(p=>p.type==="text")||{text:""}).text;
          const imgs=Array.isArray(m.content)?m.content.filter(p=>p.type==="image"):[];
          addMsg("You",md(text||"(image)"),imgs,false);
        } else addMsg(m.modelName||"Assistant",md(m.content),null,true);
      });
    }
    async function loadList(){
      const snap=await db.ref("users/"+user.uid+"/conversations").once("value");
      const val=snap.val()||{};
      const items=Object.entries(val).map(([id,v])=>({id,...v})).sort((a,b)=>(b.updated||0)-(a.updated||0));
      document.getElementById("list").innerHTML=items.map(c=>`<a class="item ${c.id===convId?"on":""}" href="/AI-Playground/Chat/${c.id}/"><div class="t">${esc(c.title||"Untitled")}</div><div class="m">${esc(c.model||"")}</div></a>`).join("");
    }
    function payload(){return thread.map(m=>({role:m.role,content:m.content}))}

    async function runModel(){
      if(busy)return;busy=true;document.getElementById("send").disabled=true;
      document.getElementById("status").textContent="Thinking";
      const wrap=addMsg(model.name,"",null,true);
      const thinkBox=wrap.querySelector(".think");
      const thinkPre=wrap.querySelector(".think pre");
      const bodyEl=wrap.querySelector(".body");
      thinkBox.hidden=false;thinkBox.open=true;
      let acc="", think="";
      try{
        const token=await user.getIdToken();
        const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({model:model.key,messages:payload(),deepResearch:deep})});
        if(!r.ok){const t=await r.text();throw new Error("Worker "+r.status+": "+t.slice(0,500))}
        const reader=r.body.getReader();const dec=new TextDecoder();let buf="";
        while(true){
          const {done,value}=await reader.read();if(done)break;
          buf+=dec.decode(value,{stream:true});
          const parts=buf.split("\n\n");buf=parts.pop()||"";
          for(const p of parts){
            const line=p.split("\n").find(l=>l.startsWith("data:"));if(!line)continue;
            let j;try{j=JSON.parse(line.slice(5).trim())}catch{continue}
            if(j.type==="thinking"&&j.text){think+=j.text;thinkPre.textContent=think;document.getElementById("msgs").scrollTop=1e9}
            if(j.type==="delta"&&j.text){
              if(!acc){document.getElementById("status").textContent="Writing";thinkBox.querySelector("summary").innerHTML="Thought process";}
              acc+=j.text;bodyEl.innerHTML=md(acc);document.getElementById("msgs").scrollTop=1e9;
            }
            if(j.type==="error")acc+=(acc?"\n\n":"")+j.error;
          }
        }
      }catch(e){acc+=(acc?"\n\n":"")+String(e.message||e);bodyEl.innerHTML=md(acc)}
      av.classList.remove("spin");
      if(!think) thinkBox.hidden=true; else thinkBox.open=false;
      if(!acc) bodyEl.innerHTML=md("_No response. Redeploy the worker and try again._");
      thread.push({role:"assistant",content:acc,model:model.key,modelName:model.name});
      await db.ref("users/"+user.uid+"/conversations/"+convId).update({pending:false,messages:thread,model:model.key,updated:Date.now()});
      busy=false;document.getElementById("send").disabled=false;document.getElementById("status").textContent="";loadList();
    }

    async function send(){
      const text=document.getElementById("input").value.trim();
      if(!text&&!pendingImages.length)return;
      const imgs=pendingImages.slice();pendingImages=[];document.getElementById("previews").innerHTML="";document.getElementById("input").value="";
      const content=[];if(text)content.push({type:"text",text});imgs.forEach(im=>content.push({type:"image",mime:im.mime,data:im.data}));
      const userMsg={role:"user",content:content.length===1&&content[0].type==="text"?text:content};
      thread.push(userMsg);
      document.getElementById("msgs").querySelector(".empty")?.remove();
      addMsg("You",md(text||"(image)"),imgs,false);
      await db.ref("users/"+user.uid+"/conversations/"+convId).update({messages:thread,updated:Date.now(),title:(text||"Image").slice(0,60),model:model.key,owner:user.uid});
      await runModel();
    }
    document.getElementById("send").onclick=send;
    document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});

    auth.onAuthStateChanged(async u=>{
      if(!u){location.href="/AI-Playground/Login/?next="+encodeURIComponent(location.pathname);return}
      user=u;document.getElementById("foot").textContent=u.email||u.uid;
      convId=pathId();
