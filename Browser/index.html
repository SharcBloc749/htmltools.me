<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161b22'/%3E%3Ctext x='16' y='21' font-size='11' text-anchor='middle' fill='%2358a6ff' font-family='monospace'%3EHT%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }

    display: inline-flex; align-items: center; gap: 6px;
    background: #0d1117; color: #8b949e;

  }

  nav { display: flex; gap: 4px; }

    background: #21262d; color: #e6edf3; border: 1px solid #30363d;

    flex: 1; background: #0d1117; color: #e6edf3;

  }

<body>
  <header>

  <noscript>HTMLTools Browser needs JavaScript.</noscript>
  <script>
// HTMLTools Browser — app (auto-built single file)
const BACKEND = "https://htmltools-browser-nqv1xw3k6rph.htmltools-browser.deno.net";
const KEY = "htmltools-change-me-9f2k";
const SEARCH = "https://www.bing.com/search?q=";
// HTMLTools Browser — URL codec.
// A proxied URL looks like:  <prefix>~/<base64url(xor-scrambled URL)>
// Example (site root):       /~/aHR0cHM6...  (well, scrambled, not plain b64)
// The XOR keeps the encoding compact and hides the destination from casual
// URL inspection. The service worker decodes it before calling the backend.


function xorStr(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    out += String.fromCharCode(s.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length));
  }
  return out;
}

function b64urlEncode(s) {
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(s) {
  let b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  return atob(b);
}

/**
 * Encode an absolute http(s) URL into a proxied path.
 * @param {string} url    absolute URL, e.g. https://example.com/page
 * @param {string} prefix base path of the app, e.g. '/' or '/browser/'
 */
function encodeUrl(url, prefix = '/') {
  const p = prefix.endsWith('/') ? prefix : prefix + '/';
  return p + '~/' + b64urlEncode(xorStr(encodeURIComponent(url)));
}

/**
 * Decode a proxied path back into the target URL.
 * Tolerates any prefix; returns null for non-proxied paths.
 * Self-heals double-wrapped URLs (~/~/…) that buggy site scripts produce:
 * if the decoded value is itself a proxied path, unwrap again (max 3x).
 */
function decodeUrl(part) {
  const i = part.indexOf('~/');
  if (i === -1) return null;
  return decodeBlob(part.slice(i + 2));
}

/** Decode a raw blob (the part after ~/). Query-string form uses this. */
function decodeBlob(tail) {
  if (!tail) return null;
  if (!tail) return null;
  let out = null;
  for (let n = 0; n < 3 && tail; n++) {
    try {
      out = decodeURIComponent(xorStr(b64urlDecode(tail)));
    } catch {
      return null;
    }
    if (typeof out !== 'string' || !/^https?:/i.test(out)) return out === null ? null : out;
    // already a clean http(s) URL that is NOT itself wrapped? done.
    const j = out.indexOf('/~/');
    if (j === -1) return out;
    // Looks double-wrapped: try peeling one layer; if the peel doesn't
    // decode cleanly, treat the original as legit (sites CAN contain /~/).
    const peeled = out.slice(j + 3);
    let inner = null;
    try {
      inner = decodeURIComponent(xorStr(b64urlDecode(peeled)));
    } catch {
      return out;
    }
    if (typeof inner !== 'string' || !/^https?:/i.test(inner)) return out;
    tail = peeled;
  }
  return out;
}

/**
 * Query-string form: path stays short (/~/?u=…) so the browser's service
 * worker never skips the request for URL-length reasons on navigations.
 */
function encodeUrlQ(url, prefix = '/') {
  const p = prefix.endsWith('/') ? prefix : prefix + '/';
  return p + '~/?u=' + b64urlEncode(xorStr(encodeURIComponent(url)));
}

// HTMLTools Browser — launcher UI with tabs.



const $ = (s) => document.querySelector(s);
const framesEl = $('#frames');
const tabsEl = $('#tabs');
const bar = $('#url');
const statusEl = $('#status');
const BASE = new URL('./', location.href).pathname;
const DEBUG_URL = BASE + '~/__ht/debug';

const PLACEHOLDER = BACKEND.indexOf('htmltools-proxy.deno.dev') !== -1;
const enc = (u) => encodeUrlQ(u, BASE);
const dec = (p) => decodeUrl(p);

function banner(msg, isErr = true) {
  statusEl.textContent = msg;
  statusEl.style.color = isErr ? '#ff7b72' : '#7ee787';
}

function normalize(input) {
  let v = input.trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) || /^localhost(:\d+)?/.test(v)) return 'https://' + v;
  return SEARCH + encodeURIComponent(v);
}

// ── tabs ─────────────────────────────────────────────────────────────────
let tabs = [];
let activeId = null;
let tabSeq = 0;

function currentBackend() {
  return localStorage.getItem('ht-backend') || BACKEND;
}
function backendConfigured() {
  return !!localStorage.getItem('ht-backend') || !PLACEHOLDER;
}

function createTab(src, activate = true) {
  const id = 't' + ++tabSeq;
  const iframe = document.createElement('iframe');
  iframe.title = 'tab ' + id;
  iframe.name = 'htframe-' + id; // target for parent-initiated POST navigation
  iframe.src = 'about:blank';
  if (src && src !== 'about:blank') queueMicrotask(() => loadIntoFrame(tab, src));
  framesEl.appendChild(iframe);

  const el = document.createElement('div');
  el.className = 'tab';
  el.innerHTML = '<span class="t">New tab</span><button class="x" title="Close tab">\u00d7</button>';
  tabsEl.appendChild(el);

  const tab = { id, iframe, el, title: 'New tab', realUrl: src && src !== 'about:blank' ? dec(new URL(src, location.href).pathname) : '' };
  tabs.push(tab);

  el.addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('x')) return;
    activateTab(id);
  });
  el.querySelector('.x').addEventListener('click', () => closeTab(id));
  iframe.addEventListener('load', () => onFrameLoad(tab));

  if (activate) activateTab(id);
  return tab;
}

function activateTab(id) {
  activeId = id;
  for (const t of tabs) {
    const on = t.id === id;
    t.iframe.style.display = on ? '' : 'none';
    t.el.classList.toggle('active', on);
  }
  const t = tabs.find((x) => x.id === id);
  bar.value = t && t.realUrl ? t.realUrl : '';
}

function closeTab(id) {
  const i = tabs.findIndex((t) => t.id === id);
  if (i === -1) return;
  const t = tabs[i];
  t.iframe.remove();
  t.el.remove();
  tabs.splice(i, 1);
  if (!tabs.length) {
    createTab('about:blank');
    return;
  }
  if (activeId === id) activateTab(tabs[Math.max(0, i - 1)].id);
}

function activeTab() {
  return tabs.find((t) => t.id === activeId);
}

function onFrameLoad(tab) {
  let real = '';
  let title = '';
  try {
    const href = tab.iframe.contentWindow.location.href;
    // real navigations decode from the frame URL; painted frames (doc.write)
    // sit on the app's own URL, so fall back to the last URL we painted
    real = decodeProxiedUrl(href) || (tab._want ? decodeProxiedUrl(tab._want) : '');
    if (real) {
      try { title = tab.iframe.contentDocument.title || ''; } catch {}
    }
  } catch {}
  tab.realUrl = real;
  if (!title && real) {
    try { title = new URL(real).hostname.replace(/^www\./, ''); } catch {}
  }
  tab.title = title || 'New tab';
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = real || tab.title;
  if (tab.id === activeId) bar.value = real;
}



// Does this URL point at our proxied engine (path or query form)?
function isProx(u) {
  if (typeof u !== 'string') return false;
  return u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0;
}

// Decode a proxied URL (path or ?u= form) back to its real address,
// carrying any foreign outer params (form fields) into the result.
function decodeProxiedUrl(str) {
  try {
    const u = new URL(str, location.href);
    let real = dec(u.pathname) || decodeBlob(u.searchParams.get('u') || '') || '';
    if (real) {
      const extra = [...u.searchParams].filter(([k]) => k !== 'u' && k !== 'rdr' && k !== 'rdrig');
      if (extra.length) {
        try {
          const ru = new URL(real);
          for (const [k, v] of extra) ru.searchParams.set(k, v);
          real = ru.href;
        } catch {}
      }
    }
    return real;
  } catch {
    return '';
  }
}

// Paint a proxied page into a tab WITHOUT navigating the iframe. Chrome stops
// dispatching iframe NAVIGATIONS to the service worker after certain pages
// (Bing) have loaded, but it never stops dispatching fetches — so we fetch the
// proxied URL through the SW and document.write() the result. Sub-resources
// inside still load normally through the SW.
async function loadIntoFrame(tab, proxiedUrl, opts) {
  tab._want = proxiedUrl;
  let resp;
  try {
    resp = await fetch(
      proxiedUrl,
      Object.assign({ headers: { 'x-ht-nav': '1' } }, opts || {})
    );
  } catch (e) {
    tab.iframe.src = proxiedUrl; // last resort: let the browser try
    return;
  }
  const finalUrl = resp.url || proxiedUrl; // post-redirect address for the bar
  tab._want = finalUrl; // keep the tab's "last painted address" accurate
  const ctype = (resp.headers && resp.headers.get('content-type')) || '';
  if (/^text\/html|application\/xhtml/i.test(ctype) || ctype === '') {
    const html = await resp.text();
    const doc = tab.iframe.contentDocument;
    doc.open();
    doc.write(html);
    doc.close();
    const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    let title = m ? m[1].replace(/\s+/g, ' ').trim().slice(0, 60) : '';
    const real = decodeProxiedUrl(finalUrl);
    if (!title && real) { try { title = new URL(real).hostname.replace(/^www\./, ''); } catch {} }
    tab.title = title || 'New tab';
    tab.realUrl = real;
    tab.el.querySelector('.t').textContent = tab.title;
    tab.el.title = real || tab.title;
    if (tab.id === activeId) bar.value = real;
    // If this frame tree is "tainted" its own subresource requests never
    // reach the service worker — re-fetch them from the app context.
    setTimeout(async () => {
      if (tab._want !== finalUrl || !tab.iframe.contentDocument) return;
      if (await frameIsTainted(tab)) {
        tab._tainted = true;
        await pumpOnce(tab);
      }
    }, 250);
  } else {
    // non-HTML navigation target (download, image, pdf): try a real navigation
    tab.iframe.src = proxiedUrl;
  }
}


// ── resource pump ────────────────────────────────────────────────────────
// In "tainted" frame trees Chrome stops dispatching the FRAME's own requests
// to the service worker (subresource loads 404). The app document is immune,
// so we re-fetch failed subresources from here and swap them in (blob URLs
// for images, inline scripts for external JS). Cheap probe decides per tab.
const blobCache = new Map();
async function frameIsTainted(tab) {
  try {
    const w = tab.iframe.contentWindow;
    const r = await w.fetch(DEBUG_URL);
    const t = await r.text();
    return t.trim()[0] !== '[';
  } catch {
    return true;
  }
}
async function pumpOnce(tab) {
  let doc;
  try { doc = tab.iframe.contentDocument; } catch { return; }
  if (!doc || !doc.body) return;
  const seen = tab._pumped || (tab._pumped = new Set());
  const jobs = [];
  const grab = async (u) => {
    if (blobCache.has(u)) return blobCache.get(u);
    const p = fetch(u)
      .then(async (r) => {
        if (!r.ok) throw new Error('bad status');
        const b = await r.blob();
        const url = URL.createObjectURL(b);
        blobCache.set(u, url);
        return url;
      })
      .catch(() => null);
    blobCache.set(u, p);
    return p;
  };
  for (const img of [...doc.images]) {
    const src = img.getAttribute('src') || '';
    if (!isProx(src) || seen.has(src)) continue;
    if (img.complete && img.naturalWidth > 0) { seen.add(src); continue; }
    seen.add(src);
    jobs.push(
      grab(src).then((url) => { if (url) img.src = url; }).catch(() => {})
    );
    if (jobs.length >= 20) break;
  }
  for (const s of [...doc.querySelectorAll('script[src]')]) {
    const src = s.getAttribute('src') || '';
    if (!isProx(src) || seen.has(src)) continue;
    seen.add(src);
    jobs.push(
      grab(src).then(async (url) => {
        if (!url) return;
        const b = await (await fetch(url)).blob();
        const txt = await b.text();
        const n = doc.createElement('script');
        n.textContent = txt;
        s.parentNode.replaceChild(n, s);
      }).catch(() => {})
    );
    if (jobs.length >= 32) break;
  }
  if (jobs.length) await Promise.all(jobs).catch(() => {});
}

// Watchdog: Chrome sometimes routes a same-origin child navigation straight to
// the network (skipping the service worker), so the frame lands on the host's
// raw 404 page ("Error response"). Re-driving the exact same URL from the app
// (parent) makes Chrome dispatch it to the service worker again. Also catches
// Bing's anti-bot heartbeat which reloads its own frame with &rdr=1 appended.
setInterval(() => {
  for (const t of tabs) {
    if (t._tainted) pumpOnce(t).catch(() => {});
    let doc = null;
    let href = '';
    try { doc = t.iframe.contentDocument; href = t.iframe.contentWindow.location.href; } catch {}
    if (!doc || !href || href.indexOf(location.origin) !== 0) continue;
    const isRaw404 = doc.title === 'Error response' || /Error code:\s*404/.test(doc.body && doc.body.textContent || '');
    if (isRaw404) {
      const u = new URL(href, location.href);
      let clean = u.pathname + u.search.replace(/([?&])rdr=1&?/, '$1').replace(/([?&])rdrig=[^&]*&?/g, '$1').replace(/[?&]$/, '');
      if (u.search.indexOf('u=') === -1) continue; // non-proxied raw 404: leave it
      const last = t._lastGood && t._lastGood !== href ? t._lastGood : clean;
      t._retries = (t._retries || 0) + 1;
      if (t._retries <= 5) {
        t.iframe.src = last;
      } else if (t._retries === 6) {
        // give up quietly; show the friendly scrambled page instead of raw 404
        t.iframe.src = clean;
      }
    } else if (doc.title && doc.title !== 'Error response') {
      t._lastGood = href;
      t._retries = 0;
    }
  }
}, 900);

function navigate(value) {
  const target = normalize(value);
  if (!target) return;
  let t = activeTab();
  if (!t) t = createTab('about:blank');
  loadIntoFrame(t, enc(target));
  t.title = 'Loading\u2026';
  t.el.querySelector('.t').textContent = t.title;
}

// Proxied pages route ALL of their navigations through us (clicks, forms,
// window.open) — parent-initiated iframe navigation is the reliable path
// through the engine; frame-initiated ones can silently bypass it.
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  // pages send either path-only (/~/…) or fully-resolved (http(s)://…/~/…) URLs
  const isProxiedHere = (u) =>
    typeof u === 'string' &&
    (u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0);

  const tabByWindow = () => tabs.find((t) => t.iframe.contentWindow === e.source);

  if (d.__htNewTab && isProxiedHere(d.url)) {
    createTab(d.url);
  } else if (d.__htNav) {
    // runtime posts { __htNav: "<proxied url>" }; older builds posted
    // { __htNav: true, url } — accept both shapes
    const navUrl = typeof d.__htNav === 'string' ? d.__htNav : d.url;
    if (!isProxiedHere(navUrl)) return;
    const t = tabByWindow() || activeTab();
    if (t) loadIntoFrame(t, navUrl).catch(() => {});
  } else if (d.__htNavPost && isProxiedHere(d.url) && d.fields && typeof d.fields === 'object') {
    const t = tabByWindow() || activeTab();
    if (t) {
      const body = new URLSearchParams();
      for (const k of Object.keys(d.fields)) body.append(k, d.fields[k]);
      loadIntoFrame(t, d.url, { method: 'POST', body });
    }
  }
});

// ── backend settings (gear) ──────────────────────────────────────────────
function openSettings() {
  let ov = $('#ht-settings');
  if (ov) { ov.style.display = 'flex'; const i = $('#ht-backend-input'); i && i.focus(); return; }
  ov = document.createElement('div');
  ov.id = 'ht-settings';
  ov.style.cssText =
    'position:fixed;inset:0;background:rgba(1,4,9,.8);display:flex;align-items:center;justify-content:center;z-index:99';
  ov.innerHTML =
    '<div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;max-width:440px;width:92%">' +
    '<div style="font-weight:700;margin-bottom:6px">Backend URL</div>' +
    '<div style="color:#8b949e;font-size:12.5px;line-height:1.5;margin-bottom:10px">Paste your Deno Deploy URL ' +
    '(the one that shows <code>{"service":"htmltools-proxy"\u2026}</code>). One time only \u2014 it\u2019s remembered.</div>' +
    '<input id="ht-backend-input" type="url" placeholder="https://your-app.deno.dev" spellcheck="false" ' +
    'style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px 10px;font-size:13px;outline:none">' +
    '<div id="ht-backend-err" style="color:#ff7b72;font-size:12px;min-height:16px;margin-top:6px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">' +
    '<button id="ht-backend-cancel" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 14px;cursor:pointer">Cancel</button>' +
    '<button id="ht-backend-save" style="background:#238636;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600">Save</button>' +
    '</div></div>';
  document.body.appendChild(ov);
  const input = $('#ht-backend-input');
  const err = $('#ht-backend-err');
  input.value = localStorage.getItem('ht-backend') || '';
  input.focus();
  $('#ht-backend-cancel').onclick = () => { ov.style.display = 'none'; };
  const save = () => {
    const u = input.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\/[\w.-]+(:\d+)?(\/.*)?$/.test(u)) {
      err.textContent = 'That doesn\u2019t look like a URL \u2014 it should start with https://';
      return;
    }
    localStorage.setItem('ht-backend', u);
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'backend', url: u });
    }
    ov.style.display = 'none';
    banner('Backend saved \u2014 engine ready. Type a URL and hit Enter.', false);
  };
  $('#ht-backend-save').onclick = save;
  input.onkeydown = (e2) => { if (e2.key === 'Enter') save(); };
}

// ── boot ─────────────────────────────────────────────────────────────────
async function init() {
  if (!('serviceWorker' in navigator)) {
    banner('This browser has no service worker support \u2014 the engine can\u2019t run here.');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', {});
    const send = () => {
      if (reg.active) reg.active.postMessage({ type: 'backend', url: currentBackend() });
    };
    if (reg.active) send();
    navigator.serviceWorker.addEventListener('controllerchange', send);
    send();
  } catch (e) {
    banner('Service worker failed to register: ' + e.message);
    return;
  }
  createTab('about:blank');

  $('#go').addEventListener('submit', (e) => {
    e.preventDefault();
    navigate(bar.value);
  });
  $('#back').addEventListener('click', () => {
    const t = activeTab();
    try { t && t.iframe.contentWindow.history.back(); } catch {}
  });
  $('#fwd').addEventListener('click', () => {
    const t = activeTab();
    try { t && t.iframe.contentWindow.history.forward(); } catch {}
  });
  $('#reload').addEventListener('click', () => {
    const t = activeTab();
    if (t && t.iframe.src && t.iframe.src !== 'about:blank') {
      t.iframe.src = t.iframe.src; // re-set = parent-initiated reload
    }
  });
  $('#home').addEventListener('click', () => {
    const t = activeTab();
    if (t) { t.iframe.src = 'about:blank'; bar.value = ''; }
  });
  $('#gear').addEventListener('click', openSettings);
  $('#newtab').addEventListener('click', () => createTab('about:blank'));

  const q = new URLSearchParams(location.search).get('q');
  if (q) navigate(q);

  if (!backendConfigured()) {
    banner('One-time setup: click \u2699 and paste your Deno Deploy backend URL.');
    openSettings();
  } else {
    banner('Engine ready \u2014 type a URL and hit Enter.', false);
  }
}
