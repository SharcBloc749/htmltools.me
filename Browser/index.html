<style>
  :root {
    color-scheme: dark;
    --strip: #0b0b0b; --bar: #1a1a1a; --omni: #2a2a2a; --omni-h: #333; --hover: rgba(255,255,255,.10); --press: rgba(255,255,255,.16);
    --text: #f4f4f4; --muted: #a0a0a0; --line: #2e2e2e; --accent: #ffffff; --pop: #202020; --pop-line: #3a3a3a;
    --tab-h: 36px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: var(--strip); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 20px; height: 20px; fill: currentColor; display: block; flex: none; }

  /* ── tab strip ─────────────────────────────────────────── */
  #tabstrip { display: flex; align-items: flex-end; height: 42px; padding: 6px 8px 0 8px; gap: 4px; background: var(--strip); }
  #brand { display: flex; align-items: center; gap: 7px; height: var(--tab-h); padding: 0 8px 4px 2px; font-weight: 600; letter-spacing: .1px; color: var(--text); flex: none; }
  #brand img { width: 20px; height: 20px; border-radius: 5px; }
  #tabs { display: flex; flex: 0 1 auto; min-width: 0; width: calc(var(--n, 1) * 240px); max-width: calc(100% - 210px); height: var(--tab-h); align-items: flex-end; transition: width .22s var(--ease); }
  .tab {
    position: relative; flex: 0 1 240px; min-width: 38px; height: var(--tab-h);
    display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; margin-right: -1px;
    border-radius: 10px 10px 0 0; color: var(--muted); cursor: default; overflow: visible;
    transition: background .15s, color .15s, opacity .18s; animation: tabin .22s var(--ease);
  }
  @keyframes tabin { from { opacity: 0; transform: translateY(6px); } }
  .tab.closing { flex-basis: 0 !important; min-width: 0 !important; opacity: 0; padding: 0; overflow: hidden; transition: flex-basis .16s var(--ease), opacity .12s; }
  .tab::after { content: ""; position: absolute; right: 0; top: 9px; bottom: 9px; width: 1px; background: #3a3a3a; transition: opacity .15s; }
  .tab:hover { background: rgba(255,255,255,.07); color: #ddd; }
  .tab:hover::after, .tab.active::after, .tab:hover + .tab::after { opacity: 0; }
  .tab.active { background: var(--bar); color: var(--text); min-width: 96px; z-index: 2; }
  .tab.active::before, .tab.active::after { opacity: 1; }
  .tab.active::after { content: ""; position: absolute; top: auto; bottom: 0; right: -8px; left: auto; width: 8px; height: 8px; background: radial-gradient(circle at 100% 0, transparent 8px, var(--bar) 8.5px); }
  .tab.active::before { content: ""; position: absolute; bottom: 0; left: -8px; width: 8px; height: 8px; background: radial-gradient(circle at 0 0, transparent 8px, var(--bar) 8.5px); }
  .tab .fav { width: 16px; height: 16px; flex: none; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #111; background: #d8d8d8; overflow: hidden; }
  .tab .fav img { width: 16px; height: 16px; object-fit: contain; display: block; }
  .tab .fav.spin { background: none; border: 2px solid #555; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; -webkit-mask-image: linear-gradient(90deg,#000 calc(100% - 14px),transparent); mask-image: linear-gradient(90deg,#000 calc(100% - 14px),transparent); }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: inherit; padding: 0; transition: background .12s; }
  .tab .x svg { width: 14px; height: 14px; }
  .tab .x:hover { background: var(--press); }
  .tab.compact:not(.active) .x { display: none; }
  .tab.tiny .t { display: none; }
  .tab.tiny { padding: 0; justify-content: center; }
  .tab.tiny.active .x { display: none; }
  .tab.drag { opacity: .5; }
  #newtab { flex: none; width: 28px; height: 28px; margin: 0 0 4px 4px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; transition: background .15s, color .15s; }
  #newtab:hover { background: var(--hover); color: var(--text); }
  #newtab svg { width: 18px; height: 18px; }
  #tabfill { flex: 1; }

  /* ── toolbar ───────────────────────────────────────────── */
  #toolbar { position: relative; display: flex; align-items: center; gap: 2px; height: 42px; padding: 0 8px; background: var(--bar); z-index: 3; }
  .tb { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: #e6e6e6; padding: 0; transition: background .12s, opacity .12s; position: relative; }
  .tb:hover:not(:disabled) { background: var(--hover); }
  .tb:active:not(:disabled) { background: var(--press); }
  .tb:disabled { opacity: .32; cursor: default; }
  .tb .badge { position: absolute; right: 3px; top: 3px; min-width: 8px; height: 8px; border-radius: 4px; background: #fff; display: none; }
  .tb.has-badge .badge { display: block; }
  #go { flex: 1; min-width: 0; margin: 0 6px; }
  #omni { position: relative; display: flex; align-items: center; height: 32px; border-radius: 16px; background: var(--omni); padding: 0 4px; transition: background .15s, box-shadow .15s; }
  #omni:hover { background: var(--omni-h); }
  #omni:focus-within { background: #0e0e0e; box-shadow: 0 0 0 2px #fff; }
  #siteinfo { width: 26px; height: 26px; border: 0; background: rgba(255,255,255,.07); border-radius: 50%; display: grid; place-items: center; color: #ddd; padding: 0; flex: none; margin-right: 4px; }
  #siteinfo:hover { background: var(--hover); }
  #siteinfo svg { width: 15px; height: 15px; }
  #url { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; user-select: text; }
  #url::placeholder { color: var(--muted); }
  #omni .tb { width: 26px; height: 26px; }
  #omni .tb svg { width: 18px; height: 18px; }
  #star.on { color: #fff; }
  #install { display: none; height: 24px; margin: 0 4px 0 2px; padding: 0 11px; border: 0; border-radius: 12px; background: #fff; color: #000; font-weight: 600; font-size: 12px; white-space: nowrap; }
  #install:hover { background: #ddd; }
  #install.show { display: block; }
  #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #progress.on { opacity: 1; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: #fff; animation: prog 1.1s ease-in-out infinite; }
  @keyframes prog { from { left: -35%; } to { left: 100%; } }

  /* ── bookmarks bar ─────────────────────────────────────── */
  #bmbar { display: flex; align-items: center; height: 32px; padding: 0 8px; gap: 2px; background: var(--bar); border-bottom: 1px solid var(--line); overflow: hidden; position: relative; z-index: 3; }
  #bmbar.hidden { display: none; }
  #bmlist { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow: hidden; }
  .bm { display: flex; align-items: center; gap: 6px; height: 26px; max-width: 170px; padding: 0 9px; border: 0; border-radius: 13px; background: transparent; color: #ddd; font-size: 12.5px; flex: none; white-space: nowrap; }
  .bm:hover { background: var(--hover); }
  .bm .bf { width: 16px; height: 16px; border-radius: 4px; background: #d8d8d8; color: #111; font-size: 10px; font-weight: 700; display: grid; place-items: center; overflow: hidden; flex: none; }
  .bm .bf img { width: 16px; height: 16px; object-fit: contain; }
  .bm span.bt { overflow: hidden; text-overflow: ellipsis; }
  #bmmore, #bmall { flex: none; }
  #bmmore { width: 26px; height: 26px; }
  #bmall { color: #ccc; font-size: 12.5px; height: 26px; padding: 0 10px; border: 0; background: transparent; border-radius: 13px; margin-left: 4px; }
  #bmall:hover { background: var(--hover); }

  /* ── viewport ──────────────────────────────────────────── */
  main { flex: 1; position: relative; background: #0a0a0a; min-height: 0; }
  #frames { position: absolute; inset: 0; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #frames iframe.int { background: #0a0a0a; }
  #status { display: none; }

  /* ── popups / menus ────────────────────────────────────── */
  .menu, .pop { position: fixed; z-index: 1000; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.6); padding: 6px; min-width: 220px; animation: pop .14s var(--ease); user-select: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; height: 32px; padding: 0 12px; border: 0; background: transparent; border-radius: 7px; text-align: left; color: var(--text); font-size: 13px; }
  .mi:hover:not(:disabled) { background: var(--hover); }
  .mi:disabled { opacity: .4; cursor: default; }
  .mi .ic { width: 18px; height: 18px; display: grid; place-items: center; color: #ccc; flex: none; }
  .mi .ic svg { width: 18px; height: 18px; }
  .mi .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .sc { color: var(--muted); font-size: 12px; }
  .msep { height: 1px; background: var(--pop-line); margin: 5px 4px; }
  .mhead { padding: 8px 12px 6px; color: var(--muted); font-size: 11.5px; letter-spacing: .3px; text-transform: uppercase; }
  .sw { position: relative; width: 34px; height: 18px; border-radius: 9px; background: #4a4a4a; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #ddd; transition: transform .15s var(--ease), background .15s; }
  .sw.on { background: #fff; } .sw.on::after { transform: translateX(16px); background: #000; }
  .pop h4 { margin: 4px 6px 10px; font-size: 14px; }
  .pop label { display: block; margin: 6px 6px 3px; color: var(--muted); font-size: 11.5px; }
  .pop input[type=text] { width: calc(100% - 12px); margin: 0 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--pop-line); background: #121212; color: var(--text); font-size: 13px; outline: 0; user-select: text; }
  .pop input[type=text]:focus { border-color: #fff; }
  .pop .row { display: flex; gap: 8px; justify-content: flex-end; margin: 12px 6px 4px; }
  .btn { height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--pop-line); background: transparent; color: var(--text); font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.pri { background: #fff; color: #000; border-color: #fff; }
  .btn.pri:hover { background: #ddd; }
  #suggest { position: absolute; left: 0; right: 0; top: 36px; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.6); padding: 6px; display: none; z-index: 1001; }
  #suggest.show { display: block; }
  #suggest .mi { height: 34px; }
  #suggest .mi.sel { background: var(--hover); }
  #suggest .mi .sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  #scrim { position: fixed; inset: 0; z-index: 999; display: none; }
  #scrim.show { display: block; }
  #modal { position: fixed; inset: 0; z-index: 1100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  #modal.show { display: flex; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  #modal .card { background: var(--pop); border: 1px solid var(--pop-line); border-radius: 16px; padding: 22px; width: min(480px, 92vw); max-height: 86vh; overflow: auto; box-shadow: 0 24px 70px rgba(0,0,0,.7); animation: pop .18s var(--ease); user-select: text; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); z-index: 1200; background: #f4f4f4; color: #000; padding: 10px 18px; border-radius: 22px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); max-width: 90vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #zoombtn { display: none; height: 24px; margin: 0 2px; padding: 0 9px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: var(--text); font-size: 12px; font-weight: 600; }
  #zoombtn:hover { background: var(--hover); }
  #zoombtn.show { display: block; }
  #notice { display: none; align-items: center; gap: 14px; padding: 7px 16px; background: #1b1b1b; border-bottom: 1px solid var(--line); color: #d6d6d6; font-size: 12.5px; position: relative; z-index: 3; }
  #notice.show { display: flex; }
  #notice span { flex: 1; line-height: 1.4; }
  #notice button { border: 1px solid var(--pop-line); background: transparent; color: var(--text); border-radius: 13px; height: 24px; padding: 0 12px; font-size: 12px; }
  #notice button:hover { background: var(--hover); }
  .tab.pinned { flex: 0 0 38px !important; min-width: 38px !important; max-width: 38px; padding: 0; justify-content: center; }
  .tab.pinned .t, .tab.pinned .x { display: none !important; }
  .mi .sub { color: var(--muted); font-size: 12px; margin-left: 8px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zrow { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 6px 0 12px; font-size: 13px; }
  .zrow .lb { flex: 1; }
  .zrow .zv { min-width: 44px; text-align: center; color: var(--text); }
  .zb { height: 26px; min-width: 28px; border: 1px solid var(--pop-line); background: transparent; color: var(--text); border-radius: 13px; padding: 0; display: grid; place-items: center; font-size: 14px; }
  .zb:hover { background: var(--hover); }
  .zb svg { width: 16px; height: 16px; }
  #findbar { position: fixed; right: 20px; z-index: 50; display: none; align-items: center; gap: 2px; height: 42px; padding: 0 6px 0 14px; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.55); }
  #findbar.show { display: flex; animation: pop .14s var(--ease); }
  #findbar input { width: 190px; height: 28px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; user-select: text; }
  #findbar .fc { color: var(--muted); font-size: 12px; min-width: 44px; text-align: right; padding-right: 6px; border-right: 1px solid var(--pop-line); margin-right: 4px; }
  #findbar .tb { width: 28px; height: 28px; }
  #findbar .tb svg { width: 18px; height: 18px; }
  .chk { display: flex; gap: 12px; align-items: flex-start; padding: 10px 6px; cursor: pointer; border-radius: 8px; font-size: 13.5px; }
  .chk:hover { background: var(--hover); }
  .chk input { accent-color: #fff; width: 16px; height: 16px; margin: 2px 0 0; flex: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
</style>

//   • built-ins  : ad & tracker blocker, force dark mode (run inside the engine)
//   • userscripts: Tampermonkey-style scripts (paste code with a // ==UserScript== header)
//   • packages   : Chrome extensions (.crx/.zip or straight from the Chrome Web Store). Their
//                  CONTENT SCRIPTS + CSS run on matching pages with a small `chrome.*` shim.
//                  Background pages / service workers / popups cannot run inside a web page.
// The list lives in localStorage; the engine (sw.js) gets a copy and injects it into pages.

const EXT_KEY = 'ht-ext-v1';
const BUILTINS = [
  { id: 'adblock', name: 'Ad & tracker blocker', desc: 'Blocks ad networks, trackers and common ad slots on every page you open.' },
  { id: 'cookies', name: 'Hide cookie banners', desc: 'Hides most cookie and consent pop-ups so pages are not covered.' },
  { id: 'dark', name: 'Force dark mode', desc: 'Turns bright websites dark. Pictures and video keep their natural colours.' },
];

function loadExt() {
  try {
    const s = JSON.parse(localStorage.getItem(EXT_KEY) || 'null');
    if (s && typeof s === 'object') return { flags: s.flags || {}, list: Array.isArray(s.list) ? s.list : [] };
  } catch (e) {}
  return { flags: {}, list: [] };
}
let extState = loadExt();

// Extension code and files can be megabytes, far more than localStorage holds. The heavy parts
// (scripts, files, manifest) live in IndexedDB; localStorage keeps only light metadata.
const HEAVY = ['cs', 'files', 'manifest'];
let extPayload = {}; // extension id -> { cs, files, manifest }
function appDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('htbrowser-app', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  const db = await appDb();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function kvPut(k, v) {
  const db = await appDb();
  return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
}
function lightenExt(e) {
  if (e.cs || e.files || e.manifest) {
    extPayload[e.id] = { cs: e.cs || [], files: e.files || null, manifest: e.manifest || null };
    e.hostList = [...new Set([].concat(...(e.cs || []).map((c) => c.matches || [])))];
    for (const k of HEAVY) delete e[k];
    return true;
  }
  return false;
}
function persistPayloads() {
  for (const id of Object.keys(extPayload)) if (!extState.list.some((e) => e.id === id)) delete extPayload[id];
  kvPut('payloads', extPayload).catch(() => toast('Could not save the extension on this device.'));
}
const extPayloadReady = kvGet('payloads').then((p) => {
  if (p && typeof p === 'object') extPayload = p;
  let moved = false; // extensions saved by older builds kept everything in localStorage
  for (const e of extState.list) if (lightenExt(e)) moved = true;
  if (moved) { persistPayloads(); try { localStorage.setItem(EXT_KEY, JSON.stringify(extState)); } catch (e) {} }
}).catch(() => {});

function saveExt() {
  try { localStorage.setItem(EXT_KEY, JSON.stringify(extState)); }
  catch (e) { toast('Storage is full — remove an extension first.'); return false; }
  persistPayloads();
  pushExtConf();
  if (typeof refreshInternal === 'function') refreshInternal(['extensions']);
  return true;
}

function extConf() {
  return {
    adblock: !!extState.flags.adblock,
    dark: !!extState.flags.dark,
    cookies: !!extState.flags.cookies,
    exts: extState.list.filter((e) => e.enabled).map((e) => ({
      id: e.id, name: e.name, kind: e.kind, shim: !!e.shim,
      files: (extPayload[e.id] || e).files || null, manifest: (extPayload[e.id] || e).manifest || null, cs: (extPayload[e.id] || e).cs || [],
    })),
  };
}
function pushExtConf() {
  extPayloadReady.then(sendExtConf);
}
function sendExtConf() {
  const msg = { type: 'ext', conf: extConf() };
  try {
    const sw = navigator.serviceWorker;
    if (!sw) return;
    if (sw.controller) sw.controller.postMessage(msg);
    sw.ready.then((r) => { if (r.active) r.active.postMessage(msg); }).catch(() => {});
  } catch (e) {}
}

// ── userscripts ──────────────────────────────────────────────────────────
function parseUserscript(code) {
  const meta = { name: '', desc: '', version: '', match: [], exclude: [], runAt: 'document_end' };
  const m = /\/\/\s*==UserScript==([\s\S]*?)\/\/\s*==\/UserScript==/.exec(code);
  if (m) {
    for (const line of m[1].split('\n')) {
      const r = /^\s*\/\/\s*@(\S+)\s+(.*?)\s*$/.exec(line);
      if (!r) continue;
      const k = r[1].toLowerCase(), v = r[2];
      if (k === 'name' && !meta.name) meta.name = v;
      else if (k === 'description' && !meta.desc) meta.desc = v;
      else if (k === 'version') meta.version = v;
      else if (k === 'match' || k === 'include') meta.match.push(v);
      else if (k === 'exclude' || k === 'exclude-match') meta.exclude.push(v);
      else if (k === 'run-at') meta.runAt = v.replace(/-/g, '_');
    }
  }
  return meta;
}

function addUserscript(code, opts) {
  opts = opts || {};
  const meta = parseUserscript(code);
  const matches = (opts.matches && opts.matches.length ? opts.matches : meta.match);
  const ext = {
    id: 'us' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    kind: 'userscript', enabled: true, shim: false,
    name: (opts.name || meta.name || 'Untitled userscript').slice(0, 80),
    version: meta.version || '', desc: meta.desc || '',
    icon: '',
    cs: [{ matches: matches.length ? matches : ['<all_urls>'], excludes: meta.exclude, js: code, css: '', runAt: meta.runAt || 'document_end', allFrames: false }],
  };
  lightenExt(ext);
  extState.list.push(ext);
  return saveExt() ? ext : null;
}

// ── zip / crx reading (no libraries: DecompressionStream does the inflating) ─
async function inflateRaw(u8) {
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(buf) {
  const u8 = new Uint8Array(buf);
  let start = 0;
  const dv0 = new DataView(buf);
  if (u8[0] === 0x43 && u8[1] === 0x72 && u8[2] === 0x32 && u8[3] === 0x34) { // "Cr24"
    const ver = dv0.getUint32(4, true);
    if (ver === 3) start = 12 + dv0.getUint32(8, true);
    else if (ver === 2) start = 16 + dv0.getUint32(8, true) + dv0.getUint32(12, true);
  }
  const z = u8.subarray(start);
  const dv = new DataView(z.buffer, z.byteOffset, z.byteLength);
  let eocd = -1;
  for (let i = z.length - 22; i >= Math.max(0, z.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('This file is not a zip/crx package.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(z.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (name.endsWith('/')) continue;
    const ln = dv.getUint16(off + 26, true), le = dv.getUint16(off + 28, true);
    const data = z.subarray(off + 30 + ln + le, off + 30 + ln + le + csize);
    files[name] = { method, data };
  }
  const get = async (name) => {
    const f = files[name];
    if (!f) return null;
    return f.method === 0 ? f.data : f.method === 8 ? inflateRaw(f.data) : null;
  };
  return { names: Object.keys(files), get };
}

const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', ico: 'image/x-icon',
  css: 'text/css', json: 'application/json', html: 'text/html', woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf', otf: 'font/otf', mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav' };
function toDataUri(u8, ext) {
  let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return 'data:' + (MIME[ext] || 'application/octet-stream') + ';base64,' + btoa(bin);
}
function joinPath(dir, rel) {
  if (/^(data:|https?:|\/\/)/i.test(rel)) return null;
  const parts = (rel.charAt(0) === '/' ? rel.slice(1) : dir + rel).split('/');
  const out = [];
  for (const s of parts) { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  return out.join('/');
}

// Read a package and describe it (nothing is installed yet).
async function readPackage(buf) {
  const zip = await readZip(buf);
  const dec = new TextDecoder();
  const mf = await zip.get('manifest.json');
  if (!mf) throw new Error('No manifest.json inside — not a Chrome extension.');
  const manifest = JSON.parse(dec.decode(mf).replace(/^\uFEFF/, ''));

  let msgs = null;
  const loc = manifest.default_locale || 'en';
  for (const l of [loc, 'en', 'en_US']) {
    const m = await zip.get('_locales/' + l + '/messages.json');
    if (m) { try { msgs = JSON.parse(dec.decode(m).replace(/^\uFEFF/, '')); break; } catch (e) {} }
  }
  const tr = (s) => {
    if (typeof s !== 'string') return '';
    const m = /^__MSG_(.+)__$/.exec(s);
    if (!m) return s;
    if (msgs) { const k = Object.keys(msgs).find((x) => x.toLowerCase() === m[1].toLowerCase()); if (k && msgs[k].message) return msgs[k].message; }
    return m[1];
  };

  // embeddable files (images / css / fonts / json) so chrome.runtime.getURL() and css url() work
  const files = {};
  let budget = 450 * 1024;
  for (const n of zip.names) {
    const ext = (n.split('.').pop() || '').toLowerCase();
    if (!MIME[ext] || /^_locales\//.test(n)) continue;
    const d = await zip.get(n);
    if (!d || d.length > 150 * 1024 || d.length > budget) continue;
    budget -= d.length;
    files[n] = toDataUri(d, ext);
  }

  const cs = [];
  for (const c of manifest.content_scripts || []) {
    let js = '', css = '';
    for (const f of c.js || []) { const d = await zip.get(f.replace(/^\//, '')); if (d) js += '\n' + dec.decode(d) + '\n;'; }
    for (const f of c.css || []) {
      const d = await zip.get(f.replace(/^\//, ''));
      if (!d) continue;
      const dir = f.indexOf('/') >= 0 ? f.replace(/^\//, '').replace(/[^/]*$/, '') : '';
      css += '\n' + dec.decode(d).replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, (m0, q, u) => {
        const p = joinPath(dir, u.trim());
        return p && files[p] ? 'url(' + files[p] + ')' : m0;
      });
    }
    if (!js && !css) continue;
    cs.push({
      matches: c.matches || [], excludes: c.exclude_matches || [], js, css,
      runAt: c.run_at || 'document_idle', allFrames: !!c.all_frames, world: c.world || 'ISOLATED',
    });
  }

  // icon
  let icon = '';
  const icons = manifest.icons || (manifest.action && manifest.action.default_icon) || (manifest.browser_action && manifest.browser_action.default_icon) || {};
  if (typeof icons === 'string') { const p = icons.replace(/^\//, ''); if (files[p]) icon = files[p]; }
  else {
    const sizes = Object.keys(icons).map(Number).filter(Boolean).sort((a, b) => b - a);
    for (const sz of sizes) { const p = String(icons[sz]).replace(/^\//, ''); if (files[p]) { icon = files[p]; break; } }
  }

  const notes = [];
  if (manifest.background) notes.push('Its background service is not supported, so features that rely on it will not work.');
  const perms = [].concat(manifest.permissions || [], manifest.host_permissions || []);
  if (perms.some((p) => /declarativeNetRequest|webRequest/.test(p))) notes.push('Blocking or changing network requests is not supported. For ad blocking, use the built-in Ad & tracker blocker.');
  if (manifest.action && manifest.action.default_popup || manifest.browser_action && manifest.browser_action.default_popup) notes.push('Toolbar popups are not supported.');

  const hosts = [];
  for (const c of cs) for (const m of c.matches) if (hosts.indexOf(m) < 0) hosts.push(m);
  return {
    name: tr(manifest.name) || 'Extension', version: manifest.version || '', desc: tr(manifest.description),
    icon, cs, files, notes, hosts,
    manifest: { name: tr(manifest.name), version: manifest.version, manifest_version: manifest.manifest_version },
  };
}

function installPackage(pkg, storeId) {
  if (storeId) extState.list = extState.list.filter((e) => e.storeId !== storeId);
  const ext = {
    id: 'cx' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    kind: 'crx', enabled: true, shim: true, storeId: storeId || '',
    name: pkg.name, version: pkg.version, desc: pkg.desc, icon: pkg.icon,
    cs: pkg.cs, files: pkg.files, manifest: pkg.manifest, hosts: pkg.hosts, notes: pkg.notes,
  };
  lightenExt(ext);
  extState.list.push(ext);

function removeExt(id) {
  extState.list = extState.list.filter((e) => e.id !== id);
  delete extPayload[id];
  saveExt();
}
function setExtEnabled(id, on) {
  const e = extState.list.find((x) => x.id === id);

// ── Chrome Web Store ─────────────────────────────────────────────────────
function webStoreId(u) {
  const m = /^https?:\/\/(?:chromewebstore\.google\.com\/detail\/(?:[^/?#]+\/)?|chrome\.google\.com\/webstore\/detail\/(?:[^/?#]+\/)?)([a-p]{32})(?:[/?#]|$)/i.exec(u || '');
  return m ? m[1].toLowerCase() : '';
}
async function fetchStorePackage(id) {
  const crx = 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=131.0.0.0&acceptformat=crx3&x=' +
    encodeURIComponent('id=' + id + '&uc');
  let r;
  try { r = await fetch(enc(crx)); } catch (e) { throw new Error('Could not reach the engine. Try again in a moment.'); }
  if (r.status === 204 || r.status === 404) throw new Error('The Chrome Web Store does not offer this extension for download any more.');
  if (!r.ok) throw new Error('Download failed (' + r.status + ').');
  const buf = await r.arrayBuffer();
  const head = new Uint8Array(buf, 0, 4);
  if (!(head[0] === 0x43 && head[1] === 0x72 && head[2] === 0x32 && head[3] === 0x34)) throw new Error('The Web Store did not return an extension file for this ID.');
  return buf;
}

function renderSuggest() {
  const q = bar.value.trim();
  const s = $('#suggest');
  if (!q || document.activeElement !== bar || q === (activeTab() && (activeTab().realUrl || (activeTab().internal ? 'htmltools://' + activeTab().internal : '')))) { hideSuggest(); return; }
  const lq = q.toLowerCase();
  const isUrl = /^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q) || /^htmltools:\/\//i.test(q);
  const items = [{ v: q, ic: isUrl ? 'globe' : 'search', label: q, sub: isUrl ? 'Go to address' : 'Search ' + currentEngine().name }];
  const seen = new Set();
  for (const b of bookmarks) {
    if (items.length > 3) break;
    if (b.title.toLowerCase().includes(lq) || b.url.toLowerCase().includes(lq)) { items.push({ v: b.url, ic: 'star', label: b.title, sub: b.url }); seen.add(normUrl(b.url)); }
  }
  for (const x of histList) {
    if (items.length > 7) break;
    if (seen.has(normUrl(x.u))) continue;
    if (x.u.toLowerCase().includes(lq) || (x.t || '').toLowerCase().includes(lq)) { items.push({ v: x.u, ic: 'clock', label: x.t || x.u, sub: x.u }); seen.add(normUrl(x.u)); }
  }
  sugItems = items; sugSel = -1;
  s.innerHTML = '';
  items.forEach((it, i) => {
    const b = h('div', { class: 'mi', role: 'option' }, h('span', { class: 'ic', html: icon(it.ic) }), h('span', { class: 'lb', text: it.label }), h('span', { class: 'sub', text: it.sub === it.label ? '' : it.sub }));
    b.style.cursor = 'pointer';
    b.addEventListener('mousedown', (e) => { e.preventDefault(); bar.value = it.v; hideSuggest(); navigate(it.v); bar.blur(); });
    s.append(b);
  });
  s.classList.add('show');
}
function moveSug(d) {
  if (!sugItems.length) return;
  sugSel += d;
  if (sugSel >= sugItems.length) sugSel = -1;
  if (sugSel < -1) sugSel = sugItems.length - 1;
  [...$('#suggest').children].forEach((c, i) => c.classList.toggle('sel', i === sugSel));
  if (sugSel >= 0) bar.value = sugItems[sugSel].v;
}

// ── menus ────────────────────────────────────────────────────────────────
function mainMenu() {
  const bmOn = localStorage.getItem('ht-bmbar') !== '0';
  showMenu([
    { label: 'New tab', ic: 'plus', sc: 'Ctrl+T', fn: () => createTab('about:blank') },
    { label: 'Reopen closed tab', ic: 'reload', sc: 'Ctrl+Shift+T', off: !closedTabs.length, fn: reopenClosedTab },
    { label: 'Search tabs…', ic: 'search', sc: 'Ctrl+Shift+A', fn: openTabSearch },
    { sep: true },
    { label: 'Bookmark this page', ic: 'star', sc: 'Ctrl+D', fn: toggleStar },
    { label: 'Show bookmarks bar', toggle: bmOn, keep: true, sc: 'Ctrl+Shift+B', fn: () => { localStorage.setItem('ht-bmbar', localStorage.getItem('ht-bmbar') === '0' ? '1' : '0'); renderBmBar(); } },
    { label: 'Bookmarks', ic: 'bookmark', fn: () => openInternal('bookmarks') },
    { label: 'History', ic: 'clock', sc: '', fn: () => openInternal('history') },
    { label: 'Extensions', ic: 'puzzle', fn: () => openInternal('extensions') },
    { sep: true },
    { zoom: true },
    { label: 'Find in page…', ic: 'search', sc: 'Ctrl+F', fn: openFind },
    { label: 'Print…', ic: 'print', sc: 'Ctrl+P', fn: printActive },
    { sep: true },
    { label: 'Clear browsing data…', ic: 'trash', sc: 'Ctrl+Shift+Del', fn: openClearData },
    { label: 'Customize new tab', ic: 'image', fn: () => openInternal('newtab', { customize: true }) },
    { label: 'Settings', ic: 'settings', fn: () => openInternal('settings') },
    { sep: true },
    { label: APP_NAME + ' ' + (window.__HT_EXPECT_SW__ || ''), off: true },
  ], $('#gear'), true);
}
function extMenu() {
  const items = [{ head: 'Extensions' }];
  for (const b of BUILTINS) items.push({ label: b.name, toggle: !!extState.flags[b.id], keep: true, fn: (v) => { extState.flags[b.id] = !!v; saveExt(); toast(b.name + (v ? ' on — reload the page to apply' : ' off'), 2200); } });
  if (extState.list.length) items.push({ sep: true });
  for (const e of extState.list) items.push({ label: e.name, img: e.icon || '', ic: e.icon ? '' : 'puzzle', toggle: !!e.enabled, keep: true, fn: (v) => setExtEnabled(e.id, v) });
  items.push({ sep: true }, { label: 'Manage extensions', ic: 'settings', fn: () => openInternal('extensions') });
  showMenu(items, $('#extbtn'), true);
}
function siteMenu() {
  const t = activeTab();
  const u = t && t.realUrl;
  showMenu(u ? [
    { head: hostOf(u) },
    { label: /^https:/i.test(u) ? 'Loaded through the HTMLTools engine' : 'Connection is not encrypted', off: true },
    { label: 'Copy address', ic: 'copy', fn: () => { try { navigator.clipboard.writeText(u); toast('Address copied'); } catch (e) {} } },
  ] : [{ head: APP_NAME }, { label: 'This is a built-in page', off: true }], $('#siteinfo'));
}

// ── keyboard shortcuts (also attached inside each page frame) ─────────────
function reloadActive() {
  const t = activeTab();
  if (!t) return;
  if (t.loading) { t._loadSeq = (t._loadSeq || 0) + 1; t.loading = false; syncUI(); return; }
  if (t.internal) { showInternal(t, t.internal, { noHist: true }); return; }
  if (t._want) { t._histNav = true; loadIntoFrame(t, t._want).catch(() => {}); }
}
function gotoHist(t, idx) {
  if (!t || idx < 0 || idx >= t.hist.length) return;
  t.hidx = idx;
  const e = t.hist[idx];
  if (/^htmltools:\/\//.test(e)) showInternal(t, e.slice(12), { noHist: true });
  else { t._histNav = true; loadIntoFrame(t, e).catch(() => {}); }
  syncUI();
}
function kb(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key;
  let used = true;
  if (ctrl && !e.shiftKey && (k === 't' || k === 'T')) createTab('about:blank');
  else if (ctrl && !e.shiftKey && (k === 'w' || k === 'W')) { const t = activeTab(); t && closeTab(t.id); }
  else if ((ctrl && (k === 'l' || k === 'L')) || (e.altKey && (k === 'd' || k === 'D')) || k === 'F6') { bar.focus(); bar.select(); }
  else if (ctrl && !e.shiftKey && (k === 'd' || k === 'D')) toggleStar();
  else if ((ctrl && !e.shiftKey && (k === 'r' || k === 'R')) || k === 'F5') reloadActive();
  else if (e.altKey && k === 'ArrowLeft') { const t = activeTab(); t && gotoHist(t, t.hidx - 1); }
  else if (e.altKey && k === 'ArrowRight') { const t = activeTab(); t && gotoHist(t, t.hidx + 1); }
  else if (ctrl && k === 'Tab') { const i = tabs.findIndex((t) => t.id === activeId); const n = tabs.length; activateTab(tabs[(i + (e.shiftKey ? n - 1 : 1)) % n].id); }
  else if (ctrl && e.shiftKey && (k === 'b' || k === 'B')) { localStorage.setItem('ht-bmbar', localStorage.getItem('ht-bmbar') === '0' ? '1' : '0'); renderBmBar(); }
  else if (ctrl && /^[1-9]$/.test(k)) { const i = k === '9' ? tabs.length - 1 : +k - 1; if (tabs[i]) activateTab(tabs[i].id); }
  else if (ctrl && !e.shiftKey && (k === 'f' || k === 'F')) openFind();
  else if (ctrl && !e.shiftKey && (k === 'p' || k === 'P')) printActive();
  else if (ctrl && !e.altKey && (k === '+' || k === '=')) zoomBy(1);
  else if (ctrl && !e.altKey && (k === '-' || k === '_')) zoomBy(-1);
  else if (ctrl && k === '0') zoomBy(0);
  else if (ctrl && e.shiftKey && (k === 't' || k === 'T')) reopenClosedTab();
  else if (ctrl && e.shiftKey && (k === 'a' || k === 'A')) openTabSearch();
  else if (ctrl && e.shiftKey && (k === 'Delete' || k === 'Backspace')) openClearData();
  else if (k === 'Escape') { closePops(); closeModal(); if (findOpen()) closeFind(); used = false; }
  else used = false;
  if (used) { e.preventDefault(); e.stopPropagation(); }
}

// ── wire the chrome up (called once from init) ───────────────────────────
function initChrome() {
  paintIcons();
  $('#scrim').addEventListener('mousedown', closePops);
  $('#scrim').addEventListener('contextmenu', (e) => { e.preventDefault(); closePops(); });
  $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', kb, true);
  $('#newtab').addEventListener('click', () => createTab('about:blank'));
  $('#back').addEventListener('click', () => { const t = activeTab(); t && gotoHist(t, t.hidx - 1); });
  $('#fwd').addEventListener('click', () => { const t = activeTab(); t && gotoHist(t, t.hidx + 1); });
  $('#reload').addEventListener('click', reloadActive);
  $('#home').addEventListener('click', () => { const t = activeTab(); if (t) showInternal(t, 'newtab'); });
  $('#star').addEventListener('click', toggleStar);
  $('#extbtn').addEventListener('click', extMenu);
  $('#zoombtn').addEventListener('click', () => showMenu([{ zoom: true }], $('#zoombtn'), true));
  applyEngineLabels();
  $('#gear').addEventListener('click', mainMenu);
  $('#siteinfo').addEventListener('click', siteMenu);
  $('#bmall').addEventListener('click', () => openInternal('bookmarks'));
  $('#bmmore').addEventListener('click', (e) => {
    const over = $('#bmmore')._over || [];
    showMenu(over.map((b) => ({ label: b.title, fn: () => openUrl(b.url) })), $('#bmmore'), true);
  });
  $('#install').addEventListener('click', () => { const t = activeTab(); const id = t && webStoreId(t.realUrl); if (id) installFromStore(id); });

  let justFocused = false;
  bar.addEventListener('focus', () => { justFocused = true; });
  bar.addEventListener('mouseup', (e) => { if (justFocused) { e.preventDefault(); bar.select(); } justFocused = false; });
  bar.addEventListener('blur', () => { justFocused = false; });
  bar.addEventListener('input', renderSuggest);
  bar.addEventListener('blur', () => setTimeout(hideSuggest, 120));
  bar.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSug(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSug(-1); }
    else if (e.key === 'Escape') {
      const t = activeTab();
      if ($('#suggest').classList.contains('show')) hideSuggest();
      else { bar.value = t ? (t.realUrl || (t.internal ? 'htmltools://' + t.internal : '')) : ''; bar.blur(); }
    }
  });
  new ResizeObserver(() => layoutTabs()).observe($('#tabs'));
  new ResizeObserver(() => fitBm()).observe($('#bmbar'));
  window.addEventListener('resize', () => { closePops(); layoutTabs(); });
  renderBmBar();
  setInterval(syncUI, 700);
}

// The Web Store greys out "Add to Chrome" in other browsers. Wake it up and make it install here.
function hookStoreButton(tab, id) {
  try {
    const d = tab.iframe.contentDocument;
    for (const b of d.querySelectorAll('button')) {
      if (!/^\s*Add to Chrome\s*$/i.test(b.textContent || '') && !b._htStore) continue;
      b.removeAttribute('disabled'); b.removeAttribute('aria-disabled'); b.disabled = false;
      b.style.cssText = 'background:#0b57d0!important;color:#fff!important;cursor:pointer!important;pointer-events:auto!important';
      if (!b._htStore) {
        b._htStore = true;
        b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); installFromStore(id); }, true);
      }
      const span = [...b.querySelectorAll('span')].find((s) => /Add to Chrome/i.test(s.textContent) && !s.children.length);
      if (span) span.textContent = 'Add to HTMLTools';
    }
  } catch (e) {}
}

// ── extension install UI ─────────────────────────────────────────────────
function confirmInstall(pkg, storeId) {
  const can = pkg.cs && pkg.cs.length;
  const node = h('div', null,
    h('div', { style: 'display:flex;gap:14px;align-items:center;margin-bottom:12px' },
      h('div', { style: 'width:48px;height:48px;border-radius:12px;background:#333;display:grid;place-items:center;overflow:hidden;flex:none', html: pkg.icon ? '<img src="' + esc(pkg.icon) + '" width="48" height="48">' : icon('puzzle') }),
      h('div', null, h('div', { text: (can ? 'Add “' : '“') + pkg.name + '”' + (can ? '?' : ''), style: 'font-size:16px;font-weight:600' }), h('div', { text: pkg.version ? 'Version ' + pkg.version : '', style: 'color:#a0a0a0;font-size:12px' }))),
    pkg.desc ? h('p', { text: pkg.desc, style: 'margin:0 0 12px;color:#ccc;line-height:1.5' }) : null,
    can ? h('div', { style: 'margin:0 0 10px;color:#ccc;line-height:1.5' }, h('b', { text: 'It will run on: ' }), pkg.hosts.map((x) => (x === '<all_urls>' || x === '*://*/*' ? 'all websites' : x)).filter((x, i, a) => a.indexOf(x) === i).slice(0, 5).join(', ') + (pkg.hosts.length > 5 ? ' … and ' + (pkg.hosts.length - 5) + ' more' : '')) : null,
    ...pkg.notes.map((n) => h('p', { text: n, style: 'margin:0 0 8px;color:#e0e0e0;font-size:12.5px;line-height:1.5;background:#1d1d1d;border-left:3px solid #8a8a8a;padding:8px 10px;border-radius:4px 8px 8px 4px' })),
    !can ? h('p', { text: 'This extension has no page scripts, so there is nothing it can do inside a web page here. It depends on features that only exist in desktop Chrome.', style: 'color:#ccc;line-height:1.5' }) : null,
    h('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-top:16px' },
      h('button', { class: 'btn', type: 'button', text: can ? 'Cancel' : 'OK', onclick: closeModal }),
      can ? h('button', { class: 'btn pri', type: 'button', text: 'Add extension', onclick: () => { closeModal(); const e = installPackage(pkg, storeId); if (e) toast('Added “' + pkg.name + '”. Reload open pages to use it.', 3600); } }) : null));
  showModal(node);
}
async function installFromStore(id) {
  toast('Downloading extension…', 12000);
  try {
    const pkg = await readPackage(await fetchStorePackage(id));
    $('#toast').classList.remove('show');
    confirmInstall(pkg, id);
  } catch (e) { toast(e.message || String(e), 5200); }
}
function pickPackageFile() {
  const inp = h('input', { type: 'file', accept: '.crx,.zip', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    try { confirmInstall(await readPackage(await f.arrayBuffer())); }
    catch (e) { toast('Could not read that file: ' + (e.message || e), 5200); }
  });
  document.body.append(inp);
  inp.click();
}

  { id: 'paper', name: 'Soft white', css: 'radial-gradient(1000px 600px at 50% 0,#3a3a3a,transparent 70%),linear-gradient(180deg,#151515,#0a0a0a)' },
  { id: 'black', name: 'Pure black', css: '#000' },
];
const WALL_DATA_KEY = 'ht-wall-data';
function getWall() {
  try { const w = JSON.parse(localStorage.getItem('ht-wall') || 'null'); if (w && typeof w === 'object') return w; } catch (e) {}
  return { type: 'preset', v: 'aurora', dim: 0.2 };
}
function setWall(w) {
  try { localStorage.setItem('ht-wall', JSON.stringify(w)); } catch (e) { toast('Storage is full.'); }
  refreshInternal(['newtab']);
}
function wallCss(w) {
  if (w.type === 'preset') { const p = WALL_PRESETS.find((x) => x.id === w.v); return p ? p.css : ''; }
  if (w.type === 'data') { const d = localStorage.getItem(WALL_DATA_KEY); return d ? 'url("' + d + '") center/cover no-repeat' : ''; }
  if (w.type === 'url' && /^https?:\/\//i.test(w.v || '')) return 'url("' + w.v.replace(/["\\\s]/g, (c) => encodeURIComponent(c)) + '") center/cover no-repeat';
  return '';
}
async function fileToWallpaper(file) {
  const bmp = await createImageBitmap(file);
  let scale = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
  for (const q of [0.86, 0.72, 0.58, 0.45]) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const uri = c.toDataURL('image/jpeg', q);
    if (uri.length < 3200000) return uri;
    scale *= 0.78;
  }
  throw new Error('That picture is too large.');
}

// ── frame plumbing ───────────────────────────────────────────────────────
function internalShell(name) {
  const p = PAGES[name] || PAGES.newtab;
  return '<!doctype html><meta charset="utf-8"><title>' + esc(p.title) + '</title><style>' + PAGE_CSS + '</style><body class="' + (name === 'newtab' ? 'nt' : '') + '"><div id="root"></div>';

async function showInternal(tab, name, opts) {
  opts = opts || {};

  tab._want = '';
  tab._loadSeq = (tab._loadSeq || 0) + 1;
  tab.loading = false;
  tab.internal = name;
  tab.realUrl = '';
  tab.title = PAGES[name].title;
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = 'htmltools://' + name;
  if (!opts.noHist) pushHist(tab, 'htmltools://' + name);
  let f = tab.iframe;
  if (!opts.reuse) {
    f = await makeFrame(tab);
    if (!tabs.includes(tab) || tab.internal !== name) { f.remove(); return; }
    const old = tab.iframe;
    tab.iframe = f;
    f.addEventListener('load', () => onFrameLoad(tab));
    f.style.visibility = '';
    old.remove();
  }
  f.classList.add('int');
  f.srcdoc = internalShell(name);
  if (tab.id === activeId) { bar.value = 'htmltools://' + name; }

}
function openInternal(name, opts) {
  const t = activeTab();
  let tab;
  if (t && t.internal === 'newtab') { tab = t; if (opts && opts.customize) tab._customize = true; showInternal(t, name); }
  else { tab = createTab('htmltools://' + name); if (opts && opts.customize) tab._customize = true; }
  return tab;
}
function renderInternal(tab) {
  let doc;
  try { doc = tab.iframe.contentDocument; } catch (e) { return; }
  const root = doc && doc.getElementById('root');
  if (!root) return;
  root.innerHTML = '';
  const name = tab.internal;
  try {
    ({ newtab: buildNewtab, bookmarks: buildBookmarks, history: buildHistory, extensions: buildExtensions, settings: buildSettings }[name])(doc, root, tab);
  } catch (e) { root.textContent = 'Could not draw this page: ' + e.message; }
  try { tab.iframe.contentWindow.addEventListener('keydown', kb, true); } catch (e) {}
}
function refreshInternal(names) {
  for (const t of tabs) if (t.internal && (!names || names.indexOf(t.internal) >= 0)) {
    try { if (t.iframe.contentDocument.getElementById('root')) renderInternal(t); } catch (e) {}
  }
}

// ── htmltools://newtab ───────────────────────────────────────────────────
function buildNewtab(doc, root, tab) {
  const w = getWall();
  const wp = h('div', { class: 'wp' });
  const css = wallCss(w);
  if (css) wp.style.background = css;
  const dim = h('div', { class: 'dim' });

  const input = h('input', { type: 'text', placeholder: 'Search ' + currentEngine().name + ' or type a URL', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Search ' + currentEngine().name });

    input,
    h('button', { class: 'go', type: 'submit', title: 'Search', html: '<svg viewBox="0 0 24 24"><path d="' + ICONS.fwd + '"/></svg>' }));
  form.addEventListener('submit', (e) => { e.preventDefault(); const q = input.value.trim(); if (q) navigate(q); });

  const tiles = h('div', { class: 'tiles' });
  for (const b of bookmarks.slice(0, 8)) {
    const ic = h('span', { class: 'ic' });
    const t = h('button', { class: 'tile', type: 'button', title: b.url }, ic, h('span', { class: 'lb', text: b.title }));
    paintFav(ic, b.url);
    t.addEventListener('click', (e) => openUrl(b.url, e.ctrlKey || e.metaKey));
    tiles.append(t);
  }
  const center = h('div', { class: 'center' },
    h('div', { class: 'logo' }, h('img', { src: LOGO, alt: '' }), h('b', { text: APP_NAME })),
    form, tiles);

  // customize panel
  const panel = h('div', { class: 'panel' });
  const cust = h('button', { class: 'cust', type: 'button', html: '<svg viewBox="0 0 24 24"><path d="' + ICONS.image + '"/></svg>Customize' });
  const open = (v) => panel.classList.toggle('open', v);
  cust.addEventListener('click', () => open(!panel.classList.contains('open')));
  panel.append(h('button', { class: 'x', type: 'button', text: '×', onclick: () => open(false) }), h('h3', { text: 'Customize this page' }), h('div', { class: 'muted small', text: 'Pick a wallpaper for htmltools://newtab' }));
  panel.append(h('label', { text: 'Wallpaper' }));
  const grid = h('div', { class: 'grid' });
  for (const p of WALL_PRESETS) {
    const th = h('div', { class: 'th' + (w.type === 'preset' && w.v === p.id ? ' sel' : ''), title: p.name }, h('span', { text: p.name }));
    th.style.background = p.css;
    th.addEventListener('click', () => setWall({ type: 'preset', v: p.id, dim: w.dim }));
    grid.append(th);
  }
  panel.append(grid);
  const file = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
  file.addEventListener('change', async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    try {
      const uri = await fileToWallpaper(f);
      localStorage.setItem(WALL_DATA_KEY, uri);
      setWall({ type: 'data', v: 'upload', dim: w.dim == null ? 0.3 : w.dim });
    } catch (e) { toast(e.message || 'Could not use that picture.', 4000); }
  });
  panel.append(file, h('button', { class: 'btn', type: 'button', text: 'Upload a picture from this device…', onclick: () => file.click() }));
  const url = h('input', { type: 'text', placeholder: 'or paste an image address (https://…)', spellcheck: 'false', value: w.type === 'url' ? w.v : '' });
  panel.append(url, h('button', { class: 'btn', type: 'button', text: 'Use this image', onclick: () => { const v = url.value.trim(); if (/^https?:\/\//i.test(v)) setWall({ type: 'url', v, dim: w.dim == null ? 0.3 : w.dim }); else toast('Paste a full image address starting with https://'); } }));
  panel.append(h('label', { text: 'Darken wallpaper' }));

  rng.addEventListener('input', () => { dim.style.opacity = String(rng.value / 100); });
  rng.addEventListener('change', () => { const nw = Object.assign({}, getWall(), { dim: rng.value / 100 }); try { localStorage.setItem('ht-wall', JSON.stringify(nw)); } catch (e) {} });
  panel.append(rng, h('button', { class: 'btn', type: 'button', text: 'Reset to default', onclick: () => { try { localStorage.removeItem(WALL_DATA_KEY); } catch (e) {} setWall({ type: 'preset', v: 'aurora', dim: 0.2 }); } }));

  root.append(wp, dim, center, cust, panel);

  wrap.append(q);
  const list = h('div', { style: 'margin-top:16px' });
  const draw = () => {
    list.innerHTML = '';
    const f = q.value.trim().toLowerCase();
    const arr = bookmarks.filter((b) => !f || b.title.toLowerCase().includes(f) || b.url.toLowerCase().includes(f));
    if (!arr.length) { list.append(h('div', { class: 'empty', text: bookmarks.length ? 'No bookmarks match.' : 'No bookmarks yet. Click the ☆ star in the address bar on any page.' })); return; }
    for (const b of arr) {
      const ic = h('div', { class: 'ic' });

        h('div', { class: 'body' }, h('div', { class: 'nm', text: b.title }), h('div', { class: 'ds', text: b.url })),

  const list = h('div', { style: 'margin-top:16px' });

// ── tabs ─────────────────────────────────────────────────────────────────
let tabs = [];
let activeId = null;
let tabSeq = 0;


// Chrome does NOT hand the service worker to about:blank iframes, so every
// request made by a page painted into one (CSS, JS, images) bypassed the proxy
// and hit the host's 404 page. srcdoc frames ARE controlled, so tabs use them.
const BLANK_DOC = '<!doctype html><meta charset="utf-8"><title>New tab</title><body style="margin:0;background:#fff">';
function armFrame(tab) {
  tab.ready = new Promise((res) => {
    const h = () => { tab.iframe.removeEventListener('load', h); res(); };
    tab.iframe.addEventListener('load', h);
    setTimeout(res, 3000);
  });
  tab.iframe.srcdoc = BLANK_DOC;
}

function createTab(src, activate = true) {
  const id = 't' + ++tabSeq;
  const iframe = document.createElement('iframe');
  iframe.title = 'tab ' + id;
  iframe.name = 'htframe-' + id; // target for parent-initiated POST navigation
  framesEl.appendChild(iframe);

  const el = makeTabEl(id);
  tabsEl.appendChild(el);

  const internalName = src && /^htmltools:\/\//i.test(src) ? src.slice(12).replace(/[\/?#].*$/, '').toLowerCase() : (!src || src === 'about:blank' ? 'newtab' : '');
  const tab = { id, iframe, el, title: 'New Tab', internal: '', loading: false, realUrl: !internalName && src ? dec(new URL(src, location.href).pathname) : '' };
  tabs.push(tab);
  tab.hist = []; tab.hidx = -1;
  if (!internalName) armFrame(tab); // (internal pages set srcdoc exactly once — a second assignment mid-load is dropped)
  iframe.addEventListener('load', () => onFrameLoad(tab));

  if (activate) activateTab(id);
  if (internalName) showInternal(tab, internalName, { reuse: true });
  else if (src) queueMicrotask(() => loadIntoFrame(tab, src));
  layoutTabs();
  return tab;
}

function activateTab(id) {
  activeId = id;
  for (const t of tabs) {
    const on = t.id === id;
    t.iframe.style.display = on ? '' : 'none';
    t.el.classList.toggle('active', on);
  }
  const t = tabs.find((x) => x.id === id);
  bar.value = t ? (t.realUrl || (t.internal ? 'htmltools://' + t.internal : '')) : '';
  if (t) { try { t.el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} }
  layoutTabs();
  syncUI();

  if (t && t.internal === 'newtab') { try { const i = t.iframe.contentDocument.querySelector('input'); i && i.focus(); } catch (e) {} }
}

function closeTab(id, quick) {
  const i = tabs.findIndex((t) => t.id === id);
  if (i === -1) return;
  const t = tabs[i];
  rememberClosed(t);
  tabs.splice(i, 1);
  t._loadSeq = (t._loadSeq || 0) + 1;
  t.iframe.remove();
  const finish = () => { t.el.remove(); layoutTabs(); syncUI(); };
  if (quick) finish(); else { t.el.classList.add('closing'); setTimeout(finish, 170); }
  if (!tabs.length) {
    createTab('about:blank');
    return;
  }
  if (activeId === id) activateTab(tabs[Math.max(0, i - 1)].id);
}

function activeTab() {
  return tabs.find((t) => t.id === activeId);
}

function onFrameLoad(tab) {
  if (tab.internal) {
    // a built-in page (htmltools://…): draw it into the frame
    tab.realUrl = '';
    tab.title = (PAGES[tab.internal] || PAGES.newtab).title;
    tab.el.querySelector('.t').textContent = tab.title;
    if (tab.id === activeId) bar.value = 'htmltools://' + tab.internal;
    renderInternal(tab);
    syncUI();
    return;
  }
  let real = '';
  let title = '';
  try {
    const href = tab.iframe.contentWindow.location.href;
    // real navigations decode from the frame URL; painted frames (doc.write)
    // sit on the app's own URL, so fall back to the last URL we painted
    real = (tab._want ? decodeProxiedUrl(tab._want) : '') || decodeProxiedUrl(href);
    if (real) {
      try { title = tab.iframe.contentDocument.title || ''; } catch {}
    }
  } catch {}
  tab.realUrl = real;
  if (!title && real) {
    try { title = new URL(real).hostname.replace(/^www\./, ''); } catch {}
  }
  tab.title = title || 'New Tab';
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = real || tab.title;
  if (tab.id === activeId) bar.value = real;
  try { tab.iframe.contentWindow.addEventListener('keydown', kb, true); } catch {}
  attachFrameFeatures(tab);
  if (tab.id === activeId) closeFind();

}



// Does this URL point at our proxied engine (path or query form)?
function isProx(u) {
  if (typeof u !== 'string') return false;
  return u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0;
}

// Decode a proxied URL (path or ?u= form) back to its real address,
// carrying any foreign outer params (form fields) into the result.
function decodeProxiedUrl(str) {
  try {
    const u = new URL(str, location.href);
    let real = dec(u.pathname) || decodeBlob(u.searchParams.get('u') || '') || '';
    if (real) {
      const extra = [...u.searchParams].filter(([k]) => k !== 'u' && k !== 'rdr' && k !== 'rdrig');
      if (extra.length) {
        try {
          const ru = new URL(real);
          for (const [k, v] of extra) ru.searchParams.set(k, v);
          real = ru.href;
        } catch {}
      }
    }
    return real;
  } catch {
    return '';
  }
}

// Paint a proxied page into a tab WITHOUT navigating the iframe. Chrome stops
// dispatching iframe NAVIGATIONS to the service worker after certain pages
// (Bing) have loaded, but it never stops dispatching fetches — so we fetch the
// proxied URL through the SW and document.write() the result. Sub-resources
// inside still load normally through the SW.
let engineWasDown = false;

// True when a response is our host's own 404 page — i.e. the request slipped
// past a dead/absent engine and the raw site answered. Never paint that page.
function looksLikeHost404(text) {
  const head = text.slice(0, 6000).toUpperCase();
  return head.includes('RETURN HOME') && head.includes('404');
}

// The engine was unreachable. When it comes back (worker claims the page),
// re-drive whatever the tab was trying to load — automatically.
function scheduleEngineRetry() {
  const retry = () => {
    if (!engineWasDown || !navigator.serviceWorker.controller) return;
    const t = activeTab();
    if (t && t._want) {
      engineWasDown = false;
      banner('Engine ready \u2713', false);
      loadIntoFrame(t, t._want).catch(() => {});
    }
  };
  setTimeout(retry, 2500);
  setTimeout(retry, 6000);
}

async function loadIntoFrame(tab, proxiedUrl, opts) {
  tab.loading = true;
  const p = _loadIntoFrame(tab, proxiedUrl, opts);
  const my = tab._loadSeq;
  try { return await p; } finally { if (tab._loadSeq === my) { tab.loading = false; try { syncUI(); } catch (e) {} } }
}

async function _loadIntoFrame(tab, proxiedUrl, opts) {
  tab._want = proxiedUrl;
  const my = tab._loadSeq = (tab._loadSeq || 0) + 1;
  let resp;
  try {
    resp = await fetch(
      proxiedUrl,
      Object.assign({ headers: { 'x-ht-nav': '1' } }, opts || {})
    );
  } catch (e) {
    engineWasDown = true;
    banner('Engine is waking up\u2026 one moment.');
    scheduleEngineRetry();
    return;
  }
  if (my !== tab._loadSeq) return; // a newer navigation superseded this one
  const finalUrl = resp.url || proxiedUrl; // post-redirect address for the bar
  tab._want = finalUrl; // keep the tab's "last painted address" accurate
  const ctype = (resp.headers && resp.headers.get('content-type')) || '';
  const isHTML = /^text\/html|application\/xhtml/i.test(ctype) || ctype === '';
  if (isHTML && !resp.ok) {
    const body = await resp.text();
    if (looksLikeHost404(body)) {
      engineWasDown = true;
      banner('Engine is waking up\u2026 one moment.');
      tab.title = 'Waking up\u2026';
      tab.el.querySelector('.t').textContent = tab.title;
      scheduleEngineRetry();
      return;
    }
    await paintHtml(tab, finalUrl, body); // a real 404 page from the target site
    return;
  }
  if (isHTML) {
    await paintHtml(tab, finalUrl, await resp.text());

    const esc = text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    await paintHtml(tab, finalUrl, '<!doctype html><meta charset="utf-8"><title>' + (decodeProxiedUrl(finalUrl) || 'Text').replace(/[<&]/g, '') + '</title>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;margin:14px;color:#111">' + esc + '</pre>');

    // image / pdf / download: hand the bytes over as a blob (works for POST results too)

      a.href = bu;
      const m = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(resp.headers.get('content-disposition') || '');

    tab.iframe = f;
    tab.internal = '';
    f.addEventListener('load', () => onFrameLoad(tab));
    f.src = bu;
    f.style.visibility = '';
    old.remove();
    tab.realUrl = decodeProxiedUrl(finalUrl) || '';

const absUrl = (u) => { try { return new URL(u, location.href).href; } catch { return u; } };
function pushHist(tab, u) {
  u = absUrl(u);

  tab.hist.splice(tab.hidx + 1);
  tab.hist.push(u);
  tab.hidx = tab.hist.length - 1;
}

// Every page gets a FRESH iframe. Re-using one via document.open() keeps the
// previous page's timers/sockets/globals alive (sites "freeze", the runtime
// never re-initialises, listeners get wiped). A new window = a clean page.
function makeFrame(tab) {
  return new Promise((resolve) => {
    const f = document.createElement('iframe');
    f.title = 'tab ' + tab.id;
    f.name = 'htframe-' + tab.id;
    f.style.display = tab.iframe.style.display;
    f.style.visibility = 'hidden';
    const done = () => { f.removeEventListener('load', done); resolve(f); };
    f.addEventListener('load', done);
    setTimeout(done, 3000);
    f.srcdoc = BLANK_DOC;
    framesEl.appendChild(f);
  });
}

async function paintHtml(tab, finalUrl, html) {
  const f = await makeFrame(tab);
  if (tab._want !== finalUrl || !tabs.includes(tab)) { f.remove(); return; }

  if (tab._histNav) { tab._histNav = false; }
  else pushHist(tab, finalUrl);

  tab.iframe = f;
  tab.internal = '';
  f.addEventListener('load', () => onFrameLoad(tab));
  const doc = f.contentDocument;
  doc.open();
  // defer.js (shinsenter) — used by Coolmath and many Drupal/WordPress sites — kicks off on
  // `pageshow`, which fires while our document.write() painting is still parsing, i.e. before
  // its <script type=deferjs> elements exist. They then never run (dead countdowns, blank
  // games). Once the page has loaded, re-run the loader if anything is still waiting.
  const deferKick = () => {
    let n = 0;
    const iv = setInterval(() => {
      n++;

  tab.title = title || 'New tab';
  tab.realUrl = real;
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = real || tab.title;

  setTimeout(() => { if (tab._want === finalUrl) pumpOnce(tab).catch(() => {}); }, 150);

// ── resource pump ────────────────────────────────────────────────────────
// In "tainted" frame trees Chrome stops dispatching the FRAME's own requests
// to the service worker, and after a few seconds even blob/data image loads
// inside the frame stop decoding. Two-phase repair:
//   Phase 1 (the race): immediately after paint, re-fetch every broken image
//     from the immune app context and swap in blob URLs — loads that start
//     in the first ~2s still succeed.
//   Phase 2 (canvas): anything still broken afterwards gets PAINTED — the
//     app decodes the image, draws it onto a canvas inside the frame, and
//     the canvas replaces the <img>. Works no matter how tainted the tree.
const blobCache = new Map();
function grabBlob(u) {
  if (blobCache.has(u)) return blobCache.get(u);
  const p = fetch(u)
    .then(async (r) => {
      if (!r.ok) throw new Error('bad status');
      const b = await r.blob();
      const url = URL.createObjectURL(b);
      blobCache.set(u, url);
      return url;
    })
    .catch(() => {
      blobCache.delete(u); // never cache a failure — let later passes retry
      return null;
    });
  blobCache.set(u, p);
  return p;
}
async function canvasSwap(doc, img, src) {
  const url = await grabBlob(src);
  if (!url) return false;
  const pimg = new Image();
  pimg.src = url;
  await new Promise((res) => { pimg.onload = res; pimg.onerror = res; setTimeout(res, 4000); });
  if (!pimg.naturalWidth) return false;
  const rect = img.getBoundingClientRect();
  if (!rect.width || !rect.height) return false; // invisible — skip
  const c = doc.createElement('canvas');
  c.width = Math.max(1, Math.round(rect.width));
  c.height = Math.max(1, Math.round(rect.height));
  c.getContext('2d').drawImage(pimg, 0, 0, c.width, c.height);
  c.className = img.className;
  c.setAttribute('style', img.getAttribute('style') || '');
  c.style.width = rect.width + 'px';
  c.style.height = rect.height + 'px';
  img.parentNode.replaceChild(c, img);
  return true;
}
// The pump was a workaround for frames that weren't controlled by the service
// worker (about:blank). Tabs are srcdoc frames now, so it is off by default —
// left on it flattens lazy-loaded images into static canvases.
const USE_PUMP = false;
async function pumpOnce(tab) {
  if (!USE_PUMP) return;
  let doc;
  try { doc = tab.iframe.contentDocument; } catch { return; }
  if (!doc || !doc.body) return;
  const early = !tab._earlyDone;
  const fixed = tab._fixed || (tab._fixed = new WeakSet());
  const tries = tab._tries || (tab._tries = new Map());
  const ctries = tab._ctries || (tab._ctries = new Map());
  const since = tab._imgSeen || (tab._imgSeen = new Map());
  const now = Date.now();
  const cap = early ? 45 : 12;
  const broken = [];
  let failedImg = false;
  for (const img of [...doc.images]) {
    const src = img.getAttribute('src') || '';
    const orig = img.dataset.htSrc || (isProx(src) ? src : '');
    if (!orig) continue;                                  // foreign image
    if (img.complete && img.naturalWidth > 0) { fixed.add(img); continue; }
    if (fixed.has(img)) continue;                         // already swapped/painted
    if (!img.complete) {
      if (!since.has(orig)) { since.set(orig, now); continue; }
      if (now - since.get(orig) < (early ? 1200 : 4000)) continue; // in flight; wait
    }
    broken.push(img);
    failedImg = true;
  }
  const jobs = [];
  for (const img of broken) {
    const orig = img.dataset.htSrc || img.getAttribute('src') || '';
    if (!isProx(orig)) continue;
    if (early) {
      // Phase 1: swap in a blob URL — loads started in the first ~2s still work
      const n = tries.get(orig) || 0;
      if (n >= 2) continue;
      tries.set(orig, n + 1);
      jobs.push(grabBlob(orig).then((url) => {
        if (!url) return;
        img.dataset.htSrc = orig;   // remember the real source for phase 2
        img.src = url;
      }).catch(() => {}));
    } else {
      // Phase 2: paint it — canvas replacement works in fully dead trees
      const n = ctries.get(orig) || 0;
      if (n >= 3) continue;
      ctries.set(orig, n + 1);
      jobs.push(canvasSwap(doc, img, orig).then((ok) => { if (ok) fixed.add(img); }).catch(() => {}));
    }
    if (jobs.length >= cap) break;
  }
  (tab._dbg = tab._dbg || { passes: 0, brokenN: [], canvasCalls: 0, canvasOk: 0, early: null });
  tab._dbg.passes++; tab._dbg.brokenN.push(broken.length); tab._dbg.early = early;
  // scripts + stylesheet links only while the early window is open
  const sseen = tab._sseen || (tab._sseen = new Set());
  if (early && failedImg) {
    for (const s of [...doc.querySelectorAll('script[src]')]) {
      const src = s.getAttribute('src') || '';
      if (!isProx(src) || sseen.has(src)) continue;
      sseen.add(src);
      jobs.push(grabBlob(src).then((url) => {
        if (!url) return;
        const n = doc.createElement('script');
        if (s.type) n.type = s.type;
        n.src = url; // blob-src: preserves order + module imports (already rewritten)
        s.parentNode.replaceChild(n, s);
      }).catch(() => {}));
      if (jobs.length >= cap + 10) break;
    }
  }
  if (jobs.length) await Promise.all(jobs).catch(() => {});
  if (early && !tab._earlyTimer) {
    tab._earlyTimer = setTimeout(() => { tab._earlyDone = true; }, 2500);
  }
}

// Watchdog: Chrome sometimes routes a same-origin child navigation straight to
// the network (skipping the service worker), so the frame lands on the host's
// raw 404 page ("Error response"). Re-driving the exact same URL from the app
// (parent) makes Chrome dispatch it to the service worker again. Also catches
// Bing's anti-bot heartbeat which reloads its own frame with &rdr=1 appended.
// (The old raw-404 watchdog is gone: frames are controlled by the service
// worker now and every navigation is routed through the engine by the runtime.)

function navigate(value) {
  const iv = /^\s*htmltools:\/\/([\w-]*)/i.exec(value || '');
  if (iv) {
    const name = (iv[1] || 'newtab').toLowerCase();
    const t0 = activeTab() || createTab('about:blank');
    if (!PAGES[name]) { toast('htmltools://' + name + ' does not exist.'); return; }
    showInternal(t0, name);
    return;
  }
  if (/^\s*about:blank\s*$/i.test(value || '')) { const t1 = activeTab() || createTab('about:blank'); showInternal(t1, 'newtab'); return; }
  const target = normalize(value);
  if (!target) return;
  let t = activeTab();
  if (!t) t = createTab('about:blank');
  loadIntoFrame(t, enc(target));
  t.title = 'Loading\u2026';
  t.el.querySelector('.t').textContent = t.title;
  try { bar.blur(); } catch (e) {}
}

// Proxied pages route ALL of their navigations through us (clicks, forms,
// window.open) — parent-initiated iframe navigation is the reliable path
// through the engine; frame-initiated ones can silently bypass it.
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  // pages send either path-only (/~/…) or fully-resolved (http(s)://…/~/…) URLs
  const isProxiedHere = (u) =>
    typeof u === 'string' &&
    (u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0);

  // the sender may be a NESTED frame (ad/embed) — walk up to the tab's frame
  const tabByWindow = () => {
    let w = e.source;
    for (let i = 0; w && i < 8; i++) {
      const t = tabs.find((x) => x.iframe.contentWindow === w);
      if (t) return t;
      if (w.parent === w) break;
      w = w.parent;
    }
    return null;
  };

  if (d.__htNewTab && isProxiedHere(d.url)) {
    createTab(d.url);
  } else if (d.__htNav) {
    // runtime posts { __htNav: "<proxied url>" }; older builds posted
    // { __htNav: true, url } — accept both shapes
    const navUrl = typeof d.__htNav === 'string' ? d.__htNav : d.url;
    if (!isProxiedHere(navUrl)) return;
    const t = tabByWindow() || activeTab();
    if (t) loadIntoFrame(t, navUrl).catch(() => {});
  } else if (d.__htNavPost && typeof d.__htNavPost === 'object') {
    // runtime posts { __htNavPost: { url, fields: [[k,v],…], newTab } }
    const p = d.__htNavPost;
    if (!isProxiedHere(p.url)) return;
    const body = new URLSearchParams();
    const f = p.fields;
    if (Array.isArray(f)) for (const kv of f) body.append(kv[0], kv[1]);
    else if (f && typeof f === 'object') for (const k of Object.keys(f)) body.append(k, f[k]);
    const t = p.newTab ? createTab('about:blank') : (tabByWindow() || activeTab());
    if (t) loadIntoFrame(t, p.url, { method: 'POST', body }).catch(() => {});
  } else if (typeof d.__htUrl === 'string' && /^https?:/i.test(d.__htUrl)) {
    // a single-page app changed its route (pushState/replaceState/popstate)
    const t = tabByWindow();
    if (!t) return;
    t.realUrl = d.__htUrl;
    t._want = enc(d.__htUrl);
    pushHist(t, t._want);
    try {
      const title = t.iframe.contentDocument.title;
      if (title) { t.title = title.slice(0, 60); t.el.querySelector('.t').textContent = t.title; }
    } catch {}
    t.el.title = t.realUrl;
    if (t.id === activeId) bar.value = t.realUrl;
  }
});

// ── boot ─────────────────────────────────────────────────────────────────
async function init() {
  // Host lock: this browser only runs on htmltools.me (see ALLOWED_HOSTS in the build).
  if (typeof hostAllowed === 'function' && !hostAllowed()) {
    try { (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister()); } catch (e) {}
    document.body.innerHTML =
      '<div style="font:16px system-ui;color:#e6edf3;background:#0d1117;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">' +
      '<div><h2 style="margin:0 0 8px">HTMLTools Browser</h2>' +
      '<p style="margin:0;color:#8b949e">This browser only runs on <b>htmltools.me</b>.<br><a style="color:#58a6ff" href="https://htmltools.me/Browser/">Open it there</a></p></div></div>';
    return;
  }
  if (!('serviceWorker' in navigator)) {
    banner('This browser has no service worker support \u2014 the engine can\u2019t run here.');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (engineWasDown) scheduleEngineRetry();
    });

    // ── stale-engine self-heal ───────────────────────────────────────────
    // Chrome can keep an OLD service worker running through many reloads
    // after new files ship. Ask the active worker its version; if it is not
    // this build's version, pull the new one and reload exactly once.
    const expectSw = window.__HT_EXPECT_SW__ || '';
    if (reg.active && expectSw) {
      const askVersion = (w) => new Promise((res) => {
        const ch = new MessageChannel();
        const to = setTimeout(() => res('(no reply)'), 2000);
        ch.port1.onmessage = (m) => { clearTimeout(to); res((m.data && m.data.version) || '(no reply)'); };
        w.postMessage({ type: 'version' }, [ch.port2]);
      });
      const running = await askVersion(reg.active);
      if (running !== expectSw) {
        banner('Updating HTMLTools engine\u2026');
        let reloaded = false;
        const once = () => {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        };
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'activated') once(); });
        });
        navigator.serviceWorker.addEventListener('controllerchange', once);
        reg.update().catch(() => {});
        // claim() on an already-activated worker doesn't fire controllerchange
        // if we were uncontrolled — fall back to a timed check
        setTimeout(async () => {
          if (reloaded) return;
          const nowActive = (await navigator.serviceWorker.getRegistrations())[0];
          if (nowActive && nowActive.active) {
            const v2 = await askVersion(nowActive.active);
            if (v2 === expectSw) once();
          }
        }, 4000);
      }
    }
  } catch (e) {
    banner('Service worker failed to register: ' + e.message);
    return;
  }
  initChrome();
  createTab('about:blank');
  pushExtConf();
  navigator.serviceWorker.addEventListener('controllerchange', pushExtConf);

  $('#go').addEventListener('submit', (e) => {
    e.preventDefault();
    hideSuggest();
    navigate(bar.value);
  });
  window.__htDbg = () => tabs.map((t) => ({
    want: (t._want || '').slice(0, 36),
    early: t._earlyDone === undefined ? 'undef' : t._earlyDone,
    dbg: t._dbg || null,
    seen: t._pumped ? t._pumped.size : 0,
    tries: t._tries ? [...t._tries.values()].reduce((a, b) => a + b, 0) : 0,
  }));

  // Deep links: /Browser/?search=some words  (or ?q=…, or ?url=https://site.com)
  const sp = new URLSearchParams(location.search);
  const deep = sp.get('search') || sp.get('q') || sp.get('url');
  if (deep && deep.trim()) {
    navigate(deep.trim());
    try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (e) {}
  }

  checkServerVersion();
  banner('Engine ready', false);
}

init();

</script>
</body>
</html>
