  <script>
// HTMLTools Browser — app (auto-built single file)
window.__HT_EXPECT_SW__ = "v1.9.0";
const BACKEND = "https://htmltools-browser-nqv1xw3k6rph.htmltools-browser.deno.net";
const KEY = "htmltools-change-me-9f2k";
const SEARCH = "https://www.bing.com/search?q=";
// HTMLTools Browser — URL codec.
// A proxied URL looks like:  <prefix>~/<base64url(xor-scrambled URL)>
// Example (site root):       /~/aHR0cHM6...  (well, scrambled, not plain b64)
// The XOR keeps the encoding compact and hides the destination from casual
// URL inspection. The service worker decodes it before calling the backend.


function xorStr(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    out += String.fromCharCode(s.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length));
  }
  return out;
}

function b64urlEncode(s) {
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(s) {
  let b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  return atob(b);
}

/**
 * Encode an absolute http(s) URL into a proxied path.
 * @param {string} url    absolute URL, e.g. https://example.com/page
 * @param {string} prefix base path of the app, e.g. '/' or '/browser/'
 */
function encodeUrl(url, prefix = '/') {
  const p = prefix.endsWith('/') ? prefix : prefix + '/';
  return p + '~/' + b64urlEncode(xorStr(encodeURIComponent(url)));
}

/**
 * Decode a proxied path back into the target URL.
 * Tolerates any prefix; returns null for non-proxied paths.
 * Self-heals double-wrapped URLs (~/~/…) that buggy site scripts produce:
 * if the decoded value is itself a proxied path, unwrap again (max 3x).
 */
function decodeUrl(part) {
  const i = part.indexOf('~/');
  if (i === -1) return null;
  return decodeBlob(part.slice(i + 2));
}

/** Decode a raw blob (the part after ~/). Query-string form uses this. */
function decodeBlob(tail) {
  if (!tail) return null;
  if (!tail) return null;
  let out = null;
  for (let n = 0; n < 3 && tail; n++) {
    try {
      out = decodeURIComponent(xorStr(b64urlDecode(tail)));
    } catch {
      return null;
    }
    if (typeof out !== 'string' || !/^https?:/i.test(out)) return out === null ? null : out;
    // already a clean http(s) URL that is NOT itself wrapped? done.
    const j = out.indexOf('/~/');
    if (j === -1) return out;
    // Looks double-wrapped: try peeling one layer; if the peel doesn't
    // decode cleanly, treat the original as legit (sites CAN contain /~/).
    const peeled = out.slice(j + 3);
    let inner = null;
    try {
      inner = decodeURIComponent(xorStr(b64urlDecode(peeled)));
    } catch {
      return out;
    }
    if (typeof inner !== 'string' || !/^https?:/i.test(inner)) return out;
    tail = peeled;
  }
  return out;
}

/**
 * Query-string form: path stays short (/~/?u=…) so the browser's service
 * worker never skips the request for URL-length reasons on navigations.
 */
function encodeUrlQ(url, prefix = '/') {
  const p = prefix.endsWith('/') ? prefix : prefix + '/';
  return p + '~/?u=' + b64urlEncode(xorStr(encodeURIComponent(url)));
}

// HTMLTools Browser — launcher UI with tabs.



const $ = (s) => document.querySelector(s);
const framesEl = $('#frames');
const tabsEl = $('#tabs');
const bar = $('#url');
const statusEl = $('#status');
const BASE = new URL('./', location.href).pathname;
const DEBUG_URL = BASE + '~/__ht/debug';

const PLACEHOLDER = BACKEND.indexOf('htmltools-proxy.deno.dev') !== -1;
const enc = (u) => encodeUrlQ(u, BASE);
const dec = (p) => decodeUrl(p);

function banner(msg, isErr = true) {
  statusEl.textContent = msg;
  statusEl.style.color = isErr ? '#ff7b72' : '#7ee787';
}

function normalize(input) {
  let v = input.trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) || /^localhost(:\d+)?/.test(v)) return 'https://' + v;
  return SEARCH + encodeURIComponent(v);
}

// ── tabs ─────────────────────────────────────────────────────────────────
let tabs = [];
let activeId = null;
let tabSeq = 0;

function currentBackend() {
  return localStorage.getItem('ht-backend') || BACKEND;
}
function backendConfigured() {
  return !!localStorage.getItem('ht-backend') || !PLACEHOLDER;
}

// Chrome does NOT hand the service worker to about:blank iframes, so every
// request made by a page painted into one (CSS, JS, images) bypassed the proxy
// and hit the host's 404 page. srcdoc frames ARE controlled, so tabs use them.
const BLANK_DOC = '<!doctype html><meta charset="utf-8"><title>New tab</title><body style="margin:0;background:#fff">';
function armFrame(tab) {
  tab.ready = new Promise((res) => {
    const h = () => { tab.iframe.removeEventListener('load', h); res(); };
    tab.iframe.addEventListener('load', h);
    setTimeout(res, 3000);
  });
  tab.iframe.srcdoc = BLANK_DOC;
}

function createTab(src, activate = true) {
  const id = 't' + ++tabSeq;
  const iframe = document.createElement('iframe');
  iframe.title = 'tab ' + id;
  iframe.name = 'htframe-' + id; // target for parent-initiated POST navigation
  framesEl.appendChild(iframe);

  const el = document.createElement('div');
  el.className = 'tab';
  el.innerHTML = '<span class="t">New tab</span><button class="x" title="Close tab">\u00d7</button>';
  tabsEl.appendChild(el);

  const tab = { id, iframe, el, title: 'New tab', realUrl: src && src !== 'about:blank' ? dec(new URL(src, location.href).pathname) : '' };
  tabs.push(tab);
  tab.hist = []; tab.hidx = -1;
  armFrame(tab);
  if (src && src !== 'about:blank') queueMicrotask(() => loadIntoFrame(tab, src));

  el.addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('x')) return;
    activateTab(id);
  });
  el.querySelector('.x').addEventListener('click', () => closeTab(id));
  iframe.addEventListener('load', () => onFrameLoad(tab));

  if (activate) activateTab(id);
  return tab;
}

function activateTab(id) {
  activeId = id;
  for (const t of tabs) {
    const on = t.id === id;
    t.iframe.style.display = on ? '' : 'none';
    t.el.classList.toggle('active', on);
  }
  const t = tabs.find((x) => x.id === id);
  bar.value = t && t.realUrl ? t.realUrl : '';
}

function closeTab(id) {
  const i = tabs.findIndex((t) => t.id === id);
  if (i === -1) return;
  const t = tabs[i];
  t.iframe.remove();
  t.el.remove();
  tabs.splice(i, 1);
  if (!tabs.length) {
    createTab('about:blank');
    return;
  }
  if (activeId === id) activateTab(tabs[Math.max(0, i - 1)].id);
}

function activeTab() {
  return tabs.find((t) => t.id === activeId);
}

function onFrameLoad(tab) {
  let real = '';
  let title = '';
  try {
    const href = tab.iframe.contentWindow.location.href;
    // real navigations decode from the frame URL; painted frames (doc.write)
    // sit on the app's own URL, so fall back to the last URL we painted
    real = (tab._want ? decodeProxiedUrl(tab._want) : '') || decodeProxiedUrl(href);
    if (real) {
      try { title = tab.iframe.contentDocument.title || ''; } catch {}
    }
  } catch {}
  tab.realUrl = real;
  if (!title && real) {
    try { title = new URL(real).hostname.replace(/^www\./, ''); } catch {}
  }
  tab.title = title || 'New tab';
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = real || tab.title;
  if (tab.id === activeId) bar.value = real;
}



// Does this URL point at our proxied engine (path or query form)?
function isProx(u) {
  if (typeof u !== 'string') return false;
  return u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0;
}

// Decode a proxied URL (path or ?u= form) back to its real address,
// carrying any foreign outer params (form fields) into the result.
function decodeProxiedUrl(str) {
  try {
    const u = new URL(str, location.href);
    let real = dec(u.pathname) || decodeBlob(u.searchParams.get('u') || '') || '';
    if (real) {
      const extra = [...u.searchParams].filter(([k]) => k !== 'u' && k !== 'rdr' && k !== 'rdrig');
      if (extra.length) {
        try {
          const ru = new URL(real);
          for (const [k, v] of extra) ru.searchParams.set(k, v);
          real = ru.href;
        } catch {}
      }
    }
    return real;
  } catch {
    return '';
  }
}

// Paint a proxied page into a tab WITHOUT navigating the iframe. Chrome stops
// dispatching iframe NAVIGATIONS to the service worker after certain pages
// (Bing) have loaded, but it never stops dispatching fetches — so we fetch the
// proxied URL through the SW and document.write() the result. Sub-resources
// inside still load normally through the SW.
let engineWasDown = false;

// True when a response is our host's own 404 page — i.e. the request slipped
// past a dead/absent engine and the raw site answered. Never paint that page.
function looksLikeHost404(text) {
  const head = text.slice(0, 6000).toUpperCase();
  return head.includes('RETURN HOME') && head.includes('404');
}

// The engine was unreachable. When it comes back (worker claims the page),
// re-drive whatever the tab was trying to load — automatically.
function scheduleEngineRetry() {
  const retry = () => {
    if (!engineWasDown || !navigator.serviceWorker.controller) return;
    const t = activeTab();
    if (t && t._want) {
      engineWasDown = false;
      banner('Engine ready \u2713', false);
      loadIntoFrame(t, t._want).catch(() => {});
    }
  };
  setTimeout(retry, 2500);
  setTimeout(retry, 6000);
}

async function loadIntoFrame(tab, proxiedUrl, opts) {
  tab._want = proxiedUrl;
  const my = tab._loadSeq = (tab._loadSeq || 0) + 1;
  let resp;
  try {
    resp = await fetch(
      proxiedUrl,
      Object.assign({ headers: { 'x-ht-nav': '1' } }, opts || {})
    );
  } catch (e) {
    engineWasDown = true;
    banner('Engine is waking up\u2026 one moment.');
    scheduleEngineRetry();
    return;
  }
  if (my !== tab._loadSeq) return; // a newer navigation superseded this one
  const finalUrl = resp.url || proxiedUrl; // post-redirect address for the bar
  tab._want = finalUrl; // keep the tab's "last painted address" accurate
  const ctype = (resp.headers && resp.headers.get('content-type')) || '';
  const isHTML = /^text\/html|application\/xhtml/i.test(ctype) || ctype === '';
  if (isHTML && !resp.ok) {
    const body = await resp.text();
    if (looksLikeHost404(body)) {
      engineWasDown = true;
      banner('Engine is waking up\u2026 one moment.');
      tab.title = 'Waking up\u2026';
      tab.el.querySelector('.t').textContent = tab.title;
      scheduleEngineRetry();
      return;
    }
    paintHtml(tab, finalUrl, body); // a real 404 page from the target site
    return;
  }
  if (isHTML) {
    paintHtml(tab, finalUrl, await resp.text());
  } else if (/^(text\/|application\/(json|xml|javascript|[\w.+-]*\+(json|xml)))/i.test(ctype) && !/attachment/i.test((resp.headers && resp.headers.get('content-disposition')) || '')) {
    // text-like response (JSON from a POST, plain text, XML, raw JS/CSS): show it inline
    let text = await resp.text();
    if (/json/i.test(ctype)) { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch {} }
    const esc = text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    paintHtml(tab, finalUrl, '<!doctype html><meta charset="utf-8"><title>' + (decodeProxiedUrl(finalUrl) || 'Text').replace(/[<&]/g, '') + '</title>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;margin:14px;color:#111">' + esc + '</pre>');
  } else {
    // image / pdf / download: hand the bytes over as a blob (works for POST results too)
    const blob = await resp.blob();
    const bu = URL.createObjectURL(blob);
    if (/attachment/i.test((resp.headers && resp.headers.get('content-disposition')) || '')) {
      const a = document.createElement('a');
      a.href = bu;
      const m = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(resp.headers.get('content-disposition') || '');
      a.download = m ? decodeURIComponent(m[1]) : 'download';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    const f = await makeFrame(tab);
    if (tab._want !== finalUrl) { f.remove(); return; }
    const old = tab.iframe;
    tab.iframe = f;
    f.addEventListener('load', () => onFrameLoad(tab));
    f.src = bu;
    f.style.visibility = '';
    old.remove();
    tab.realUrl = decodeProxiedUrl(finalUrl) || '';
    if (tab.id === activeId) bar.value = tab.realUrl;
    pushHist(tab, finalUrl);
  }
}

const absUrl = (u) => { try { return new URL(u, location.href).href; } catch { return u; } };
function pushHist(tab, u) {
  u = absUrl(u);
  if (tab.hist[tab.hidx] === u) return;
  tab.hist.splice(tab.hidx + 1);
  tab.hist.push(u);
  tab.hidx = tab.hist.length - 1;
}

// Every page gets a FRESH iframe. Re-using one via document.open() keeps the
// previous page's timers/sockets/globals alive (sites "freeze", the runtime
// never re-initialises, listeners get wiped). A new window = a clean page.
function makeFrame(tab) {
  return new Promise((resolve) => {
    const f = document.createElement('iframe');
    f.title = 'tab ' + tab.id;
    f.name = 'htframe-' + tab.id;
    f.style.display = tab.iframe.style.display;
    f.style.visibility = 'hidden';
    const done = () => { f.removeEventListener('load', done); resolve(f); };
    f.addEventListener('load', done);
    setTimeout(done, 3000);
    f.srcdoc = BLANK_DOC;
    framesEl.appendChild(f);
  });
}

async function paintHtml(tab, finalUrl, html) {
  const f = await makeFrame(tab);
  if (tab._want !== finalUrl || !tabs.includes(tab)) { f.remove(); return; }
  // per-tab history (document.write creates no session-history entries)
  if (tab._histNav) { tab._histNav = false; }
  else pushHist(tab, finalUrl);
  const old = tab.iframe;
  tab.iframe = f;
  f.addEventListener('load', () => onFrameLoad(tab));
  const doc = f.contentDocument;
  doc.open();
  doc.write(html);
  doc.close();
  f.style.visibility = '';
  if (old && old !== f) old.remove();
  const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  let title = m ? m[1].replace(/\s+/g, ' ').trim().slice(0, 60) : '';
  const real = decodeProxiedUrl(finalUrl);
  if (!title && real) { try { title = new URL(real).hostname.replace(/^www\./, ''); } catch {} }
  tab.title = title || 'New tab';
  tab.realUrl = real;
  tab.el.querySelector('.t').textContent = tab.title;
  tab.el.title = real || tab.title;
  if (tab.id === activeId) bar.value = real;
  // Race the taint: pump broken resources immediately after paint.
  setTimeout(() => { if (tab._want === finalUrl) pumpOnce(tab).catch(() => {}); }, 150);
}


// ── resource pump ────────────────────────────────────────────────────────
// In "tainted" frame trees Chrome stops dispatching the FRAME's own requests
// to the service worker, and after a few seconds even blob/data image loads
// inside the frame stop decoding. Two-phase repair:
//   Phase 1 (the race): immediately after paint, re-fetch every broken image
//     from the immune app context and swap in blob URLs — loads that start
//     in the first ~2s still succeed.
//   Phase 2 (canvas): anything still broken afterwards gets PAINTED — the
//     app decodes the image, draws it onto a canvas inside the frame, and
//     the canvas replaces the <img>. Works no matter how tainted the tree.
const blobCache = new Map();
function grabBlob(u) {
  if (blobCache.has(u)) return blobCache.get(u);
  const p = fetch(u)
    .then(async (r) => {
      if (!r.ok) throw new Error('bad status');
      const b = await r.blob();
      const url = URL.createObjectURL(b);
      blobCache.set(u, url);
      return url;
    })
    .catch(() => {
      blobCache.delete(u); // never cache a failure — let later passes retry
      return null;
    });
  blobCache.set(u, p);
  return p;
}
async function canvasSwap(doc, img, src) {
  const url = await grabBlob(src);
  if (!url) return false;
  const pimg = new Image();
  pimg.src = url;
  await new Promise((res) => { pimg.onload = res; pimg.onerror = res; setTimeout(res, 4000); });
  if (!pimg.naturalWidth) return false;
  const rect = img.getBoundingClientRect();
  if (!rect.width || !rect.height) return false; // invisible — skip
  const c = doc.createElement('canvas');
  c.width = Math.max(1, Math.round(rect.width));
  c.height = Math.max(1, Math.round(rect.height));
  c.getContext('2d').drawImage(pimg, 0, 0, c.width, c.height);
  c.className = img.className;
  c.setAttribute('style', img.getAttribute('style') || '');
  c.style.width = rect.width + 'px';
  c.style.height = rect.height + 'px';
  img.parentNode.replaceChild(c, img);
  return true;
}
// The pump was a workaround for frames that weren't controlled by the service
// worker (about:blank). Tabs are srcdoc frames now, so it is off by default —
// left on it flattens lazy-loaded images into static canvases.
const USE_PUMP = false;
async function pumpOnce(tab) {
  if (!USE_PUMP) return;
  let doc;
  try { doc = tab.iframe.contentDocument; } catch { return; }
  if (!doc || !doc.body) return;
  const early = !tab._earlyDone;
  const fixed = tab._fixed || (tab._fixed = new WeakSet());
  const tries = tab._tries || (tab._tries = new Map());
  const ctries = tab._ctries || (tab._ctries = new Map());
  const since = tab._imgSeen || (tab._imgSeen = new Map());
  const now = Date.now();
  const cap = early ? 45 : 12;
  const broken = [];
  let failedImg = false;
  for (const img of [...doc.images]) {
    const src = img.getAttribute('src') || '';
    const orig = img.dataset.htSrc || (isProx(src) ? src : '');
    if (!orig) continue;                                  // foreign image
    if (img.complete && img.naturalWidth > 0) { fixed.add(img); continue; }
    if (fixed.has(img)) continue;                         // already swapped/painted
    if (!img.complete) {
      if (!since.has(orig)) { since.set(orig, now); continue; }
      if (now - since.get(orig) < (early ? 1200 : 4000)) continue; // in flight; wait
    }
    broken.push(img);
    failedImg = true;
  }
  const jobs = [];
  for (const img of broken) {
    const orig = img.dataset.htSrc || img.getAttribute('src') || '';
    if (!isProx(orig)) continue;
    if (early) {
      // Phase 1: swap in a blob URL — loads started in the first ~2s still work
      const n = tries.get(orig) || 0;
      if (n >= 2) continue;
      tries.set(orig, n + 1);
      jobs.push(grabBlob(orig).then((url) => {
        if (!url) return;
        img.dataset.htSrc = orig;   // remember the real source for phase 2
        img.src = url;
      }).catch(() => {}));
    } else {
      // Phase 2: paint it — canvas replacement works in fully dead trees

// Watchdog: Chrome sometimes routes a same-origin child navigation straight to
// the network (skipping the service worker), so the frame lands on the host's
// raw 404 page ("Error response"). Re-driving the exact same URL from the app
// (parent) makes Chrome dispatch it to the service worker again. Also catches
// Bing's anti-bot heartbeat which reloads its own frame with &rdr=1 appended.
// (The old raw-404 watchdog is gone: frames are controlled by the service
// worker now and every navigation is routed through the engine by the runtime.)

function navigate(value) {
  const target = normalize(value);
  if (!target) return;
  let t = activeTab();
  if (!t) t = createTab('about:blank');
  loadIntoFrame(t, enc(target));
  t.title = 'Loading\u2026';
  t.el.querySelector('.t').textContent = t.title;
}

// Proxied pages route ALL of their navigations through us (clicks, forms,
// window.open) — parent-initiated iframe navigation is the reliable path
// through the engine; frame-initiated ones can silently bypass it.
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  // pages send either path-only (/~/…) or fully-resolved (http(s)://…/~/…) URLs
  const isProxiedHere = (u) =>
    typeof u === 'string' &&
    (u.indexOf(BASE + '~/') === 0 || u.indexOf(location.origin + BASE + '~/') === 0);

  // the sender may be a NESTED frame (ad/embed) — walk up to the tab's frame
  const tabByWindow = () => {
    let w = e.source;
    for (let i = 0; w && i < 8; i++) {
      const t = tabs.find((x) => x.iframe.contentWindow === w);
      if (t) return t;
      if (w.parent === w) break;
      w = w.parent;
    }
    return null;
  };

  if (d.__htNewTab && isProxiedHere(d.url)) {
    createTab(d.url);
  } else if (d.__htNav) {
    // runtime posts { __htNav: "<proxied url>" }; older builds posted
    // { __htNav: true, url } — accept both shapes
    const navUrl = typeof d.__htNav === 'string' ? d.__htNav : d.url;
    if (!isProxiedHere(navUrl)) return;
    const t = tabByWindow() || activeTab();
    if (t) loadIntoFrame(t, navUrl).catch(() => {});
  } else if (d.__htNavPost && typeof d.__htNavPost === 'object') {
    // runtime posts { __htNavPost: { url, fields: [[k,v],…], newTab } }
    const p = d.__htNavPost;
    if (!isProxiedHere(p.url)) return;
    const body = new URLSearchParams();
    const f = p.fields;
    if (Array.isArray(f)) for (const kv of f) body.append(kv[0], kv[1]);
    else if (f && typeof f === 'object') for (const k of Object.keys(f)) body.append(k, f[k]);

    const t = tabByWindow();
    if (!t) return;

    pushHist(t, t._want);

      const title = t.iframe.contentDocument.title;
      if (title) { t.title = title.slice(0, 60); t.el.querySelector('.t').textContent = t.title; }

// ── backend settings (gear) ──────────────────────────────────────────────
function openSettings() {
  let ov = $('#ht-settings');
  if (ov) { ov.style.display = 'flex'; const i = $('#ht-backend-input'); i && i.focus(); return; }
  ov = document.createElement('div');
  ov.id = 'ht-settings';
  ov.style.cssText =
    'position:fixed;inset:0;background:rgba(1,4,9,.8);display:flex;align-items:center;justify-content:center;z-index:99';
  ov.innerHTML =
    '<div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;max-width:440px;width:92%">' +
    '<div style="font-weight:700;margin-bottom:6px">Backend URL</div>' +
    '<div style="color:#8b949e;font-size:12.5px;line-height:1.5;margin-bottom:10px">Paste your Deno Deploy URL ' +
    '(the one that shows <code>{"service":"htmltools-proxy"\u2026}</code>). One time only \u2014 it\u2019s remembered.</div>' +
    '<input id="ht-backend-input" type="url" placeholder="https://your-app.deno.dev" spellcheck="false" ' +
    'style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px 10px;font-size:13px;outline:none">' +
    '<div id="ht-backend-err" style="color:#ff7b72;font-size:12px;min-height:16px;margin-top:6px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">' +
    '<button id="ht-backend-cancel" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 14px;cursor:pointer">Cancel</button>' +
    '<button id="ht-backend-save" style="background:#238636;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600">Save</button>' +
    '</div></div>';
  document.body.appendChild(ov);
  const input = $('#ht-backend-input');
  const err = $('#ht-backend-err');
  input.value = localStorage.getItem('ht-backend') || '';
  input.focus();
  $('#ht-backend-cancel').onclick = () => { ov.style.display = 'none'; };
  const save = () => {
    const u = input.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\/[\w.-]+(:\d+)?(\/.*)?$/.test(u)) {
      err.textContent = 'That doesn\u2019t look like a URL \u2014 it should start with https://';
      return;
    }
    localStorage.setItem('ht-backend', u);
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'backend', url: u });
    }
    ov.style.display = 'none';
    banner('Backend saved \u2014 engine ready. Type a URL and hit Enter.', false);
  };
  $('#ht-backend-save').onclick = save;
  input.onkeydown = (e2) => { if (e2.key === 'Enter') save(); };
}

// ── boot ─────────────────────────────────────────────────────────────────
async function init() {

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (engineWasDown) scheduleEngineRetry();

    // after new files ship. Ask the active worker its version; if it is not
    // this build's version, pull the new one and reload exactly once.

      if (running !== expectSw) {
        banner('Updating HTMLTools engine\u2026');
        let reloaded = false;
        const once = () => {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        };
        reg.addEventListener('updatefound', () => {

    }

    banner('Service worker failed to register: ' + e.message);
    return;
  }
  createTab('about:blank');

  $('#go').addEventListener('submit', (e) => {
    e.preventDefault();
    navigate(bar.value);
  });
  $('#back').addEventListener('click', () => {
    const t = activeTab();
    if (t && t.hidx > 0) { t.hidx--; t._histNav = true; loadIntoFrame(t, t.hist[t.hidx]).catch(() => {}); }
  });
  $('#fwd').addEventListener('click', () => {
    const t = activeTab();
    if (t && t.hidx < t.hist.length - 1) { t.hidx++; t._histNav = true; loadIntoFrame(t, t.hist[t.hidx]).catch(() => {}); }
  });
  $('#reload').addEventListener('click', () => {
    const t = activeTab();
    if (t && t._want) { t._histNav = true; loadIntoFrame(t, t._want).catch(() => {}); }
  });
  $('#home').addEventListener('click', () => {
    const t = activeTab();
    if (t) { t._want = ''; t._loadSeq = (t._loadSeq || 0) + 1; armFrame(t); t.realUrl = ''; t.title = 'New tab'; t.el.querySelector('.t').textContent = t.title; bar.value = ''; }
  });
  $('#gear').addEventListener('click', openSettings);
  $('#newtab').addEventListener('click', () => createTab('about:blank'));
  window.__htDbg = () => tabs.map((t) => ({
    want: (t._want || '').slice(0, 36),
    early: t._earlyDone === undefined ? 'undef' : t._earlyDone,
    dbg: t._dbg || null,
    seen: t._pumped ? t._pumped.size : 0,
    tries: t._tries ? [...t._tries.values()].reduce((a, b) => a + b, 0) : 0,
  }));

  const q = new URLSearchParams(location.search).get('q');
  if (q) navigate(q);

  if (!backendConfigured()) {
    banner('One-time setup: click \u2699 and paste your Deno Deploy backend URL.');
    openSettings();
  } else {
    banner('Engine ready \u2014 type a URL and hit Enter.', false);
  }
}
