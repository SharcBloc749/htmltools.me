<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Opening AI Playground</title></head>
<body><p>Opening <a href="/AI-Playground/">AI Playground</a>…</p>
<script>
// Keep the playground's saved-chat deep links working on GitHub Pages.
if (/^\/AI-Playground\/Chat\/[A-Za-z0-9_-]+\/?$/.test(location.pathname) && !/\/index\.html$/.test(location.pathname)) {
  fetch('/AI-Playground/Chat/index.html').then(function(res){
    if (!res.ok) throw new Error('Chat unavailable');
    return res.text();
  }).then(function(page){document.open();document.write(page);document.close();})
    .catch(function(){location.replace('/AI-Playground/');});
} else {
  location.replace('/AI-Playground/');
}
</script></body></html>
