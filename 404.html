<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — HTMLTools</title>
  <link rel="icon" href="/logo3.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .logo { width: 80px; margin-bottom: 32px; filter: invert(1); }
    .code {
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      border-bottom: 2px solid #fff;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .msg { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .sub { font-size: 12px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 48px; }
    .btn {
      display: inline-block;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 28px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: #fff; color: #000; }
  </style>
  <script>
    // Short, lowercase URLs for the current tools directory. Keep these
    // destinations in sync with the URLs in the Tools catalog.
    const routes = {
      // Current tools
      'htmltools-browser': '/Browser',
      'browser': '/Browser',
      'ai-playground': '/AI-Playground',
      'mattube': 'https://mattube.htmltools.me/',
      'html-library': '/Library',
      'library': '/Library',
      'mattok': '/MatTok/',
      'claude-ai': '/Claude',
      'claude': '/Claude',
      'chatgpt': '/ChatGPT',
      'grok': '/Grok',
      'gemini': '/Gemini',
      'make-your-own-ai': 'https://ai.htmltools.me/',
      'ai-image-editor': '/ImageEditorAI',
      'imageeditorai': '/ImageEditorAI',
      'ai-image-generator': '/ImageGeneratorAI',
      'imagegeneratorai': '/ImageGeneratorAI',
      'deepseek': '/Deepseek/',
      'glm': '/GLM/',
      'research-ai': '/Research/',
      'research': '/Research/',
      'past-time': '/Pasttime',
      'past-time-database': '/Pasttime',
      'pasttime': '/Pasttime',
      'website-encryption': '/website-encryption',
      'make-a-website': 'https://sitelaunch.htmltools.me/',
      'sitelaunch': '/SiteLaunch',
      'advanced-html-runner': '/Advanced',
      'advanced': '/Advanced',
      'htmltools-proxy': '/URL',
      'proxy': '/URL',
      'url': '/URL',
      'translator': 'https://translate.htmltools.me/',
      'remove-background': '/Removebg',
      'removebg': '/Removebg',
      'art': '/Art',
      'htmeet': '/Meet/',
      'meet': '/Meet',

      // Existing legacy shortcuts
      'email': '/Email',
      'forgotpassword': '/ForgotPassword',
      'movies': '/Movies',
      'resetpassword': '/ResetPassword',
      'sms': '/SMS'
    };

    const subRoutes = {
      'sitelaunch/discover': '/SiteLaunch/Discover',
      'advanced/download': '/Advanced/Download',
      'library/studio': '/Library/Studio'
    };

    function showNotFound() {
      const root = document.getElementById('nf-root');
      if (root) root.style.display = 'flex';
    }

    function showNotFoundWhenReady() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', showNotFound, { once: true });
      } else {
        showNotFound();
      }
    }

    // Normalize case and optional trailing slashes, so /claude,
    // /CLAUDE/, and similar variants resolve consistently.
    const stripped = window.location.pathname
      .replace(/\/{2,}/g, '/')
      .replace(/^\/+|\/+$/g, '')
      .toLowerCase();

    // Gemini chat URLs must keep their original path because the chat page
    // reads the conversation ID from location.pathname.
    const isGeminiChatRoute = /^gemini\/chat\/[^/]+$/.test(stripped);

    if (isGeminiChatRoute) {
      fetch('/Gemini/Chat/index.html')
        .then(function (res) {
          if (!res.ok) throw new Error('Missing Gemini chat page');
          return res.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();

          // Use an absolute favicon because the URL remains nested under
          // /Gemini/Chat/<id>/.
          document.querySelectorAll('link[rel~="icon"]').forEach(function (el) {
            el.parentNode.removeChild(el);
          });
          const link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/png';
          link.href = '/logo3.png';
          document.head.appendChild(link);
        })
        .catch(showNotFoundWhenReady);
    } else {
      const destination = subRoutes[stripped] || routes[stripped];

      if (destination) {
        const target = new URL(destination, window.location.origin);
        target.search = window.location.search;
        target.hash = window.location.hash;

        // Avoid redirect loops if a mapped destination is itself missing.
        if (target.href !== window.location.href) {
          window.location.replace(target.href);
        } else {
          showNotFoundWhenReady();
        }
      } else {
        showNotFoundWhenReady();
      }
    }
  </script>
</head>
<body>
  <div id="nf-root" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
    <img src="/logo3.png" class="logo" alt="HTMLTools">
    <div class="code">404</div>
    <p class="msg">Page not found</p>
    <p class="sub">The page you're looking for doesn't exist</p>
    <a href="/" class="btn">Return home</a>
  </div>

</body>
</html>
