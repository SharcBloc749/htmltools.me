<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in — Pasttime</title>
<link rel="icon" type="image/png" href="/logo3.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0c;--surface:#111;--panel:#171717;--panel2:#1e1e1e;
  --border:#252525;--border2:#2e2e2e;--borderhi:#404040;
  --tx:#e8e8e8;--tx2:#888;--tx3:#4a4a4a;
  --white:#fff;--wfg:#0c0c0c;
  --green:#16a34a;--greenhi:#22c55e;
  --red:#dc2626;--redhi:#ef4444;
  --r:4px;--r-md:7px;--r-lg:10px;--r-xl:14px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(255,255,255,.12);}
.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:380px;overflow:hidden;}
.auth-hdr{padding:20px 22px 14px;border-bottom:1px solid var(--border);}
.auth-hdr-brand{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.auth-hdr-mark{width:28px;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--border2);}
.auth-hdr-mark img{width:28px;height:28px;object-fit:contain;display:block;}
.auth-hdr h2{font-size:.95rem;font-weight:700;letter-spacing:-.02em;}
.auth-hdr p{font-size:.75rem;color:var(--tx3);margin-top:3px;}
.auth-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px;}
.auth-foot{padding:12px 22px;border-top:1px solid var(--border);font-size:.73rem;color:var(--tx3);text-align:center;}
.auth-foot a{color:var(--tx2);text-decoration:underline;cursor:pointer;}
.auth-foot a:hover{color:var(--tx);}
.auth-err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:8px 10px;font-size:.73rem;color:var(--redhi);display:none;}
.auth-err.show{display:block;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:2px 0;}
.auth-divider span{font-size:.65rem;color:var(--tx3);white-space:nowrap;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-google-btn{width:100%;height:34px;background:var(--panel);border:1px solid var(--border2);color:var(--tx2);border-radius:var(--r);font-family:var(--font);font-size:.78rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .13s;}
.auth-google-btn:hover{border-color:var(--borderhi);color:var(--tx);background:var(--panel2);}
label.lbl{display:block;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:4px;}
input.inp{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.82rem;padding:0 9px;height:34px;border-radius:var(--r);outline:none;transition:border-color .13s;-webkit-appearance:none;}
input.inp:focus{border-color:var(--borderhi);}
input.inp::placeholder{color:var(--tx3);}
.btn{background:var(--panel);border:1px solid var(--border2);color:var(--tx2);padding:0 10px;border-radius:var(--r);font-size:.75rem;font-weight:500;font-family:var(--font);transition:all .13s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;height:27px;}
.btn-prim{background:var(--white);color:var(--wfg);border-color:var(--white);font-weight:600;}
.btn-prim:hover{opacity:.88;background:var(--white);border-color:var(--white);color:var(--wfg);}
.btn-full{width:100%;justify-content:center;height:34px;font-size:.82rem;}
.btn-prim:disabled{opacity:.5;cursor:not-allowed;}
#app-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:.75rem;color:var(--tx3);}
#app-loading.hidden{display:none;}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--tx3);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
footer{padding:8px 14px;font-size:.68rem;color:var(--tx3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);justify-content:center;}
footer strong{color:var(--tx2);font-weight:500;}
footer .dot{color:var(--borderhi);}
.tagline{text-align:center;font-size:.72rem;color:var(--tx3);line-height:1.6;max-width:300px;margin:14px auto 0;}
</style>
</head>
<body>

<div id="app-loading"><div class="spin"></div><span>Loading…</span></div>

<div class="auth-page" id="auth-wrap" style="display:none;">
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="auth-box">
      <div class="auth-hdr">
        <div class="auth-hdr-brand">
          <div class="auth-hdr-mark"><img src="https://htmltools.me/logo3.png" alt="HT"/></div>
          <span style="font-size:.8rem;font-weight:600;color:var(--tx2);">HTML Tools</span>
        </div>
        <h2 id="auth-title">Sign in to Pasttime</h2>
        <p id="auth-subtitle">Tiny realtime databases for your projects</p>
      </div>
      <div class="auth-body">
        <div class="auth-err" id="auth-err"></div>
        <button class="auth-google-btn" id="google-signin-btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or use email</span></div>
        <div>
          <label class="lbl">Email</label>
          <input class="inp" type="email" id="auth-email" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div>
          <label class="lbl">Password</label>
          <input class="inp" type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn btn-prim btn-full" id="auth-submit-btn">Sign in</button>
      </div>
      <div class="auth-foot" id="auth-switch-text">
        Don't have an account? <a id="auth-switch-link">Create one</a>
      </div>
    </div>
    <p class="tagline">Up to 7 free realtime databases. Hand the connection ID to an AI and it'll know exactly what to build.</p>
  </div>
</div>

<footer><strong>HTML Tools</strong><span class="dot">·</span><span>Pasttime</span><span class="dot">·</span><span>built by Matthew</span></footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ── CONFIG ──
// NOTE: uses the SAME Firebase project as Website Encryption is a separate
// concern — Pasttime should use its own Firebase project for auth + project
// ownership records. Replace with your actual Pasttime Firebase config.
var FB_CONFIG = {
  apiKey: "AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s",
  authDomain: "website-encryption-htmltools.firebaseapp.com",
  databaseURL: "https://website-encryption-htmltools-default-rtdb.firebaseio.com",
  projectId: "website-encryption-htmltools",
  storageBucket: "website-encryption-htmltools.firebasestorage.app",
  messagingSenderId: "211271935323",
  appId: "1:211271935323:web:1abb9d416087ea89c0e67e"
};

firebase.initializeApp(FB_CONFIG);
var auth = firebase.auth();

var REDIRECT_TO = "./index.html";

auth.onAuthStateChanged(function(user) {
  document.getElementById('app-loading').classList.add('hidden');
  if (user) {
    window.location.href = REDIRECT_TO;
  } else {
    document.getElementById('auth-wrap').style.display = 'flex';
  }
});

var authMode = 'signin';
function setAuthMode(mode) {
  authMode = mode;
  var errEl = document.getElementById('auth-err');
  errEl.classList.remove('show'); errEl.textContent = '';
  if (mode === 'signup') {
    document.getElementById('auth-title').textContent      = 'Create your account';
    document.getElementById('auth-subtitle').textContent   = 'Start building with Pasttime';
    document.getElementById('auth-submit-btn').textContent = 'Create account';
    document.getElementById('auth-switch-text').innerHTML  = 'Already have an account? <a id="auth-switch-link">Sign in</a>';
  } else {
    document.getElementById('auth-title').textContent      = 'Sign in to Pasttime';
    document.getElementById('auth-subtitle').textContent   = 'Tiny realtime databases for your projects';
    document.getElementById('auth-submit-btn').textContent = 'Sign in';
    document.getElementById('auth-switch-text').innerHTML  = "Don't have an account? <a id=\"auth-switch-link\">Create one</a>";
  }
  document.getElementById('auth-switch-link').addEventListener('click', function(){
    setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
  });
}
document.getElementById('auth-switch-link').addEventListener('click', function(){ setAuthMode(authMode==='signin'?'signup':'signin'); });

document.getElementById('auth-submit-btn').addEventListener('click', async function() {
  var email = document.getElementById('auth-email').value.trim();
  var pass  = document.getElementById('auth-password').value;
  var errEl = document.getElementById('auth-err');
  errEl.classList.remove('show');
  if (!email || !pass) { errEl.textContent='Enter your email and password.'; errEl.classList.add('show'); return; }
  this.disabled = true;
  this.textContent = authMode === 'signup' ? 'Creating account…' : 'Signing in…';
  try {
    if (authMode === 'signup') await auth.createUserWithEmailAndPassword(email, pass);
    else                       await auth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged handles redirect
  } catch(e) {
    var map = {
      'auth/wrong-password':'Incorrect email or password.','auth/user-not-found':'Incorrect email or password.',
      'auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'An account with this email already exists.',
      'auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Please enter a valid email address.',
      'auth/too-many-requests':'Too many attempts. Please wait and try again.'
    };
    errEl.textContent = map[e.code] || 'Authentication failed. Please try again.';
    errEl.classList.add('show');
    this.disabled = false;
    this.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
  }
});
document.getElementById('auth-email').addEventListener('keydown',    function(e){ if(e.key==='Enter') document.getElementById('auth-password').focus(); });
document.getElementById('auth-password').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('auth-submit-btn').click(); });

document.getElementById('google-signin-btn').addEventListener('click', async function() {
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    // onAuthStateChanged handles redirect
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      var errEl = document.getElementById('auth-err');
      errEl.textContent = e.message || 'Google sign-in failed.'; errEl.classList.add('show');
    }
  }
});
</script>
</body>
</html>
