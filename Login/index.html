<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign In · HTMLTools</title>
<link rel="icon" type="image/png" href="/logo3.png?v=2"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0b;--surface:#141416;--panel:#19191c;--panel-2:#212124;--border:#242427;--border-2:#302f34;--border-hi:#4a4a50;--tx:#f3f3f3;--tx-2:#95959b;--tx-3:#5a5a60;--white:#fff;--wfg:#0a0a0b;--green-hi:#22c55e;--red-hi:#f0524a;--r:6px;--r-xl:17px;--font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;--shadow-sm:0 1px 2px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.3);--shadow-md:0 10px 28px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);--shadow-lg:0 24px 70px rgba(0,0,0,.65),0 4px 16px rgba(0,0,0,.4);--grad-surface:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%);}
body.light-mode{--bg:#f6f6f4;--surface:#ffffff;--panel:#f1f1ee;--panel-2:#e8e8e4;--border:#e2e2de;--border-2:#d2d2cc;--border-hi:#a8a8a1;--tx:#171715;--tx-2:#5f5f5a;--tx-3:#98988f;--white:#171715;--wfg:#ffffff;--shadow-sm:0 1px 2px rgba(20,20,15,.05);--shadow-md:0 10px 28px rgba(20,20,15,.08),0 2px 6px rgba(20,20,15,.04);--shadow-lg:0 24px 70px rgba(20,20,15,.14);--grad-surface:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,0) 40%);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);}
body{color:var(--tx);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.001em;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
#login-gate{position:fixed;inset:0;background:var(--bg);z-index:8000;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto;}
#login-gate::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.4;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 65% 55% at 50% 50%,#000 20%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 65% 55% at 50% 50%,#000 20%,transparent 80%);}
#login-gate::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 0%,rgba(255,255,255,.05),transparent 70%);}
.lg-card{position:relative;width:100%;max-width:368px;background:var(--surface);background-image:var(--grad-surface);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:2rem 1.875rem;box-shadow:var(--shadow-lg);}
.lg-logo{width:40px;height:40px;margin:0 auto 1.125rem;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
.lg-h{font-weight:700;font-size:1.15rem;text-align:center;margin-bottom:.25rem;letter-spacing:-.03em;}
.lg-sub{font-size:.79rem;color:var(--tx-3);text-align:center;margin-bottom:1.5rem;}
.lg-tabs{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:1.125rem;}
.lg-tab{flex:1;padding:.45rem;background:transparent;border:none;color:var(--tx-3);font-family:var(--font);font-size:.68rem;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;min-height:32px;}
.lg-tab:hover:not(.active){color:var(--tx-2);}
.lg-tab.active{background:var(--white);color:var(--wfg);box-shadow:var(--shadow-sm);}
.lg-fg{margin-bottom:.8rem;}
.lg-fg label{display:block;font-size:.7rem;color:var(--tx-2);margin-bottom:.375rem;font-weight:500;}
.lg-fg input{width:100%;background:var(--panel);border:1px solid var(--border-2);color:var(--tx);font-family:var(--font);font-size:.85rem;padding:.6rem .8rem;border-radius:var(--r);outline:none;transition:border-color .15s;-webkit-appearance:none;}
.lg-fg input::placeholder{color:var(--tx-3);}
.lg-fg input:focus{border-color:var(--border-hi);}
.lg-btn{width:100%;padding:.68rem;background:var(--white);color:var(--wfg);font-family:var(--font);font-size:.82rem;font-weight:600;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s;margin-top:.5rem;min-height:38px;box-shadow:var(--shadow-sm);}
.lg-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--shadow-md);}
.lg-btn:active{transform:translateY(0);}
.lg-btn:disabled{opacity:.6;cursor:default;transform:none;}
.lg-divider{display:flex;align-items:center;gap:.75rem;margin:.875rem 0;color:var(--tx-3);font-size:.7rem;}
.lg-divider::before,.lg-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.lg-google-btn{width:100%;padding:.62rem;background:var(--panel);color:var(--tx);font-family:var(--font);font-size:.82rem;font-weight:500;border:1px solid var(--border-2);border-radius:var(--r);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:38px;}
.lg-google-btn:hover{background:var(--panel-2);border-color:var(--border-hi);}
.lg-google-btn svg{width:16px;height:16px;flex-shrink:0;}
.lg-forgot{text-align:center;margin-top:.875rem;font-size:.75rem;color:var(--tx-3);}
.lg-forgot span{cursor:pointer;transition:color .15s;}
.lg-forgot span:hover{color:var(--tx);}
.lg-err,.lg-ok{margin-top:.75rem;padding:.6rem .8rem;border-radius:var(--r);font-size:.75rem;display:none;border:1px solid;}
.lg-err{color:var(--red-hi);border-color:rgba(220,38,38,.25);background:rgba(220,38,38,.06);}
.lg-ok{color:var(--green-hi);border-color:rgba(22,163,74,.25);background:rgba(22,163,74,.06);}
.lg-err.show,.lg-ok.show{display:block;}
.lg-lock{display:none;padding:.6rem .85rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);color:var(--tx-2);font-size:.75rem;text-align:center;margin-bottom:.875rem;}
.lg-lock.show{display:block;}
</style>
</head>
<body>
<div id="login-gate">
  <div class="lg-card">
    <div class="lg-logo"><img src="/logo3.png?v=2" style="width:38px;height:38px;object-fit:contain;display:block;" alt="Logo"/></div>
    <div class="lg-h">HTMLTools</div><div class="lg-sub">Sign in to continue</div>
    <div class="lg-tabs"><button class="lg-tab active" id="lg-tab-login" onclick="lgTab('login')">SIGN IN</button><button class="lg-tab" id="lg-tab-register" onclick="lgTab('register')">REGISTER</button></div>
    <div id="lg-locked-login" class="lg-lock"><i class="fas fa-lock" style="margin-right:.4rem"></i>Login is currently disabled.</div>
    <div id="lg-locked-signup" class="lg-lock"><i class="fas fa-lock" style="margin-right:.4rem"></i>New registrations are closed.</div>
    <div id="lg-form-wrap">
      <div class="lg-fg" id="lg-name-group" style="display:none"><label>Display Name</label><input type="text" id="lg-name" placeholder="Your name"/></div>
      <div class="lg-fg"><label>Email</label><input type="email" id="lg-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')lgSubmit()"/></div>
      <div class="lg-fg" id="lg-password-group"><label>Password</label><input type="password" id="lg-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')lgSubmit()"/></div>
      <button class="lg-btn" id="lg-submit-btn" onclick="lgSubmit()">SIGN IN</button>
      <div class="lg-divider">or</div>
      <button class="lg-google-btn" id="lg-google-btn" onclick="lgGoogle()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <div class="lg-forgot" id="lg-forgot"><span onclick="lgForgot()">Forgot password?</span></div>
      <div class="lg-err" id="lg-err"></div><div class="lg-ok" id="lg-success"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Where to send the user once they're successfully signed in.
  const REDIRECT_URL = 'https://htmltools.me/';

  const authConfig = {apiKey:"AIzaSyDke6bGfoJdP4U5lfA9hWHGFFTcDpWNNC8",authDomain:"htmltools-library.firebaseapp.com",databaseURL:"https://htmltools-library-default-rtdb.firebaseio.com",projectId:"htmltools-library",storageBucket:"htmltools-library.firebasestorage.app",messagingSenderId:"973699554480",appId:"1:973699554480:web:7543f6caa2ed6742092f75"};
  const dataConfig = {apiKey:"AIzaSyCAtRRv7hxrBKxeJdh4VsL7j0jh5kf2X1U",authDomain:"htmltools-main.firebaseapp.com",projectId:"htmltools-main",storageBucket:"htmltools-main.firebasestorage.app",messagingSenderId:"692809314189",appId:"1:692809314189:web:c386a54b41af7c867657c4",databaseURL:"https://htmltools-main-default-rtdb.firebaseio.com"};
  const authApp = initializeApp(authConfig,"authApp");
  const dataApp = initializeApp(dataConfig,"dataApp");
  const dbData = getDatabase(dataApp);
  const auth = getAuth(authApp);
  const googleProvider = new GoogleAuthProvider();

  let loginDisabled=false,signupDisabled=false,_lgMode='login';

  onValue(ref(dbData,'siteConfig/matthewLoginDisabled'),s=>{loginDisabled=s.val()||false;updateLgLocked();});
  onValue(ref(dbData,'siteConfig/matthewSignupDisabled'),s=>{signupDisabled=s.val()||false;updateLgLocked();});

  // Already signed in? Bounce straight back to the app.
  onAuthStateChanged(auth,user=>{
    if(user) window.location.href=REDIRECT_URL;
  });

  window.lgTab=function(mode){_lgMode=mode;document.getElementById('lg-tab-login').classList.toggle('active',mode==='login');document.getElementById('lg-tab-register').classList.toggle('active',mode==='register');document.getElementById('lg-name-group').style.display=mode==='register'?'block':'none';document.getElementById('lg-password-group').style.display='block';document.getElementById('lg-submit-btn').textContent=mode==='login'?'SIGN IN':'CREATE ACCOUNT';document.getElementById('lg-forgot').style.display=mode==='login'?'block':'none';document.getElementById('lg-err').classList.remove('show');document.getElementById('lg-success').classList.remove('show');updateLgLocked();};

  function updateLgLocked(){const ll=document.getElementById('lg-locked-login'),ls=document.getElementById('lg-locked-signup'),fw=document.getElementById('lg-form-wrap');if(_lgMode==='login'&&loginDisabled){ll.classList.add('show');ls.classList.remove('show');fw.style.display='none';}else if(_lgMode==='register'&&signupDisabled){ls.classList.add('show');ll.classList.remove('show');fw.style.display='none';}else{ll.classList.remove('show');ls.classList.remove('show');fw.style.display='block';}}

  window.lgSubmit=async function(){
    if(_lgMode==='login'&&loginDisabled||_lgMode==='register'&&signupDisabled)return;
    const email=document.getElementById('lg-email').value.trim(),pass=document.getElementById('lg-password').value,name=document.getElementById('lg-name').value.trim(),errEl=document.getElementById('lg-err'),btn=document.getElementById('lg-submit-btn');
    errEl.classList.remove('show');
    if(!email||!pass){errEl.textContent='Fill in all fields';errEl.classList.add('show');return;}
    btn.disabled=true;btn.textContent='...';
    try{
      if(_lgMode==='register'){
        const c=await createUserWithEmailAndPassword(auth,email,pass);
        if(name)await updateProfile(c.user,{displayName:name});
      }else{
        await signInWithEmailAndPassword(auth,email,pass);
      }
      window.location.href=REDIRECT_URL;
    }catch(e){
      errEl.textContent=e.message.replace('Firebase: ','').replace(/\(.*\)/,'').trim();
      errEl.classList.add('show');
      btn.disabled=false;btn.textContent=_lgMode==='login'?'SIGN IN':'CREATE ACCOUNT';
    }
  };

  window.lgForgot=()=>window.location.href='https://htmltools.me/ForgotPassword';

  window.lgGoogle=async function(){
    if(loginDisabled&&signupDisabled)return;
    const errEl=document.getElementById('lg-err'),btn=document.getElementById('lg-google-btn');
    errEl.classList.remove('show');
    btn.disabled=true;
    btn.textContent='Signing in…';
    try{
      await signInWithPopup(auth,googleProvider);
      window.location.href=REDIRECT_URL;
    }catch(e){
      if(e.code!=='auth/popup-closed-by-user'){
        errEl.textContent=e.message.replace('Firebase: ','').replace(/\(.*\)/,'').trim();
        errEl.classList.add('show');
      }
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;flex-shrink:0"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google';
    }
  };
</script>
</body>
</html>
