<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Instant redirection using Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://htmltools.me">
    <title>Redirecting...</title>
    
    <!-- JavaScript fallback redirection -->
    <script>
        window.location.href = "https://htmltools.me";
    </script>
</head>
<body>
    <!-- User fallback link if both methods fail -->
    <p>If you are not redirected automatically, follow this <a href="https://htmltools.me">link to HTMLTools</a>.</p>
</body>
</html>
