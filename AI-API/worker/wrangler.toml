# htmltools.me AI API gateway — Cloudflare Worker configuration.
#
# Deploy from this directory:  npx wrangler deploy
# Secrets are NOT in this file. Set them with `npx wrangler secret put NAME`:
#   KEY_PEPPER            required — salts every API key hash
#   GITHUB_TOKEN          required for the private roster mirror
#   BYOK_ENCRYPTION_KEY   required for user-supplied Groq keys
#   ADMIN_PASSPHRASE      required for the dashboard admin tools
#   KEY_ESCROW_SECRET     required for password-gated key recovery (see README §7)
#
# This Worker intentionally has no route that reaches Workers AI without a valid
# htmltools.me API key or a verified Firebase session. Keep it that way: the AI
# binding draws on the account-wide daily free Neuron allowance.

name = "htmltools-me-ai-api"
main = "src/index.mjs"
compatibility_date = "2026-05-01"
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayState"]

# Workers Logs are optional; enable from the dashboard if your plan includes them.
# `npx wrangler tail` works without this block.

[vars]
# ── identity ────────────────────────────────────────────────────────────────
FIREBASE_PROJECT_ID = "general-database-4cb1c"

# ── private GitHub roster ───────────────────────────────────────────────────
# Owner/name of the PRIVATE repository that stores keys.js and byok.js.
# Leave GITHUB_REPO empty to run without the mirror (Durable Object storage only).
GITHUB_REPO = ""
GITHUB_BRANCH = "main"
GITHUB_KEYS_PATH = "keys.js"
GITHUB_BYOK_PATH = "byok.js"

# ── shared free pool (Workers AI) ───────────────────────────────────────────
# Cloudflare gives 10,000 free Neurons/day. 6,000 leaves headroom for AI Playground
# and for the fact that these counters are estimates. Keep a margin.
FREE_DAILY_NEURONS = "6000"
FREE_DAILY_REQUESTS = "1200"
GLOBAL_RPM = "60"
PER_KEY_RPM = "10"
PER_USER_RPM = "10"
PER_USER_DAILY_REQUESTS = "150"
PER_USER_DAILY_NEURONS = "1200"
MAX_ACTIVE_KEYS = "5"
MAX_KEYS_PER_DAY = "10"
BYOK_DAILY_REQUESTS = "2000"

# ── HTSilo (in-site helper, signed-in users only) ──────────────────────────
HTSILO_ENABLED = "true"
HTSILO_MODEL = "@cf/meta/llama-3.1-8b-instruct"
HTSILO_DAILY_MESSAGES = "15"
HTSILO_RPM = "4"

# ── admin panel (Firebase identity + passphrase) ───────────────────────────
# Comma-separated Firebase UIDs. Find yours in the dashboard after signing in.
ADMIN_UIDS = ""
# Optional: comma-separated emails, honoured only when Firebase marks them verified.
ADMIN_EMAILS = ""

# ── CORS ───────────────────────────────────────────────────────────────────
# The OpenAI-compatible surface stays open so browser-based AI tools can call it
# with a bearer key. Account/admin endpoints accept only the site's own origins.
API_CORS_ORIGINS = "*"
SITE_CORS_ORIGINS = "https://htmltools.me,https://www.htmltools.me"
