name = "siloai"
main = "src/index.mjs"
compatibility_date = "2026-10-31"
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "SiloLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiloLimiter"]

[vars]
FIREBASE_PROJECT_ID = "general-database-4cb1c"
GITHUB_REPO = "SharcBloc749/HTMLTools.me-Database"
GITHUB_DATA_PATH = "SiloAI/sites"
GITHUB_BRANCH = "main"
APP_ORIGINS = "https://htmltools.me,https://www.htmltools.me"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# The Worker secret GITHUB_TOKEN is already configured in Cloudflare.
# Never add a token value to this file. If it must be rotated, use:
#   npx wrangler secret put GITHUB_TOKEN
