<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #4f8cff;
    --user-bubble: #4f8cff;
    --bot-bubble: #23262f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type="text"], input[type="password"] {
    background: #1d212b;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary {
    background: #2a2e38;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #3a2020;
    color: #ff9d9d;
    font-size: 13px;
  }
  .msg .model-tag {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    padding: 4px 14px;
  }

  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    background: #1d212b;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 140px;
    min-height: 42px;
  }
  .setup {
    max-width: 480px;
    margin: 60px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .setup h2 { margin-top: 0; font-size: 17px; }
  .setup label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .setup input { width: 100%; }
  .setup button { margin-top: 18px; width: 100%; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<div id="setupScreen" class="setup">
  <h2>Connect to your Worker</h2>
  <p style="color:var(--muted); font-size:13px;">
    Enter the URL of the Cloudflare Worker you deployed (the one running <code>worker.js</code>
    with your <code>GEMINI_API_KEY</code> secret). This is saved locally in your browser only.
  </p>
  <label for="workerUrlInput">Worker URL</label>
  <input type="text" id="workerUrlInput" placeholder="https://your-worker.workers.dev">
  <div class="hint">Example: https://old-fire-717a.bozhetarnikmatthew.workers.dev</div>
  <button id="saveWorkerUrl">Start chatting</button>
</div>

<div id="appScreen" style="display:none; height:100%; display:none; flex-direction:column;">
  <header>
    <h1>💬 Gemini Chat</h1>
    <div class="controls">
      <select id="modelSelect">
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
      </select>
      <button class="secondary" id="clearBtn">Clear chat</button>
      <button class="secondary" id="settingsBtn">⚙ Worker URL</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <textarea id="input" placeholder="Message Gemini..." rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </footer>
</div>

<script>
(function () {
  const setupScreen = document.getElementById('setupScreen');
  const appScreen = document.getElementById('appScreen');
  const workerUrlInput = document.getElementById('workerUrlInput');
  const saveWorkerUrlBtn = document.getElementById('saveWorkerUrl');
  const settingsBtn = document.getElementById('settingsBtn');
  const clearBtn = document.getElementById('clearBtn');
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');

  const STORAGE_KEY_URL = 'gemini_chat_worker_url';
  const STORAGE_KEY_HISTORY_PREFIX = 'gemini_chat_history_';

  let workerUrl = localStorage.getItem(STORAGE_KEY_URL) || '';
  let history = []; // {role: 'user'|'assistant', text}

  function normalizeWorkerUrl(url) {
    url = url.trim().replace(/\/+$/, '');
    return url;
  }

  function historyKey() {
    return STORAGE_KEY_HISTORY_PREFIX + modelSelect.value;
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(historyKey());
      history = raw ? JSON.parse(raw) : [];
    } catch {
      history = [];
    }
    renderHistory();
  }

  function saveHistory() {
    localStorage.setItem(historyKey(), JSON.stringify(history));
  }

  function renderHistory() {
    chatEl.innerHTML = '';
    history.forEach(m => appendMessage(m.role, m.text, false));
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function appendMessage(role, text, scroll = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : role === 'error' ? 'error' : 'bot');
    div.textContent = text;
    chatEl.appendChild(div);
    if (scroll) chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function showApp() {
    setupScreen.style.display = 'none';
    appScreen.style.display = 'flex';
    loadHistory();
    inputEl.focus();
  }

  function showSetup() {
    setupScreen.style.display = 'block';
    appScreen.style.display = 'none';
    workerUrlInput.value = workerUrl;
  }

  saveWorkerUrlBtn.addEventListener('click', () => {
    const val = normalizeWorkerUrl(workerUrlInput.value);
    if (!val) {
      alert('Please enter your Worker URL.');
      return;
    }
    workerUrl = val;
    localStorage.setItem(STORAGE_KEY_URL, workerUrl);
    showApp();
  });

  settingsBtn.addEventListener('click', showSetup);

  clearBtn.addEventListener('click', () => {
    if (confirm('Clear chat history for this model?')) {
      history = [];
      saveHistory();
      renderHistory();
    }
  });

  modelSelect.addEventListener('change', loadHistory);

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    history.push({ role: 'user', text });
    saveHistory();
    appendMessage('user', text);

    const typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.textContent = modelSelect.options[modelSelect.selectedIndex].text + ' is thinking…';
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch(workerUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: history,
        }),
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok || data.error) {
        appendMessage('error', 'Error: ' + (data.error || res.statusText));
      } else {
        history.push({ role: 'assistant', text: data.reply });
        saveHistory();
        appendMessage('bot', data.reply);
      }
    } catch (err) {
      typingEl.remove();
      appendMessage('error', 'Network error: ' + err.message + ' — check your Worker URL and that it allows CORS.');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // Init
  if (workerUrl) {
    showApp();
  } else {
    showSetup();
  }
})();
</script>
</body>
</html>
