<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Meta Refresh Redirect (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://htmltools.me/Browser">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Immediate JavaScript redirect
        window.location.replace("https://htmltools.me/Browser");
    </script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full border border-gray-700">
        <!-- Spinner Icon -->
        <div class="mb-6 flex justify-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <h1 class="text-2xl font-bold mb-2 text-white">Redirecting You...</h1>
        <p class="text-gray-400 mb-6 text-sm">
            You are being automatically redirected to <span class="font-semibold text-blue-400">htmltools.me/Browser</span>.
        </p>

        <!-- Manual Backup Hyperlink -->
        <div class="border-t border-gray-700 pt-6">
            <p class="text-xs text-gray-400 mb-3">If you are not redirected automatically within a few seconds, click the link below:</p>
            <a 
                href="https://htmltools.me/Browser" 
                class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-6 rounded-xl transition duration-200 ease-in-out shadow-lg hover:shadow-blue-500/25"
            >
                Go to Browser Tools
            </a>
        </div>
    </div>

</body>
</html>
