<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy | htmltools.me</title>
  
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <!-- Load BareMux from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@latest/dist/index.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    .proxy-bar { display: flex; gap: 10px; padding: 12px; background: #1e1e1e; border-bottom: 1px solid #333; }
    .proxy-input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
    .proxy-input:focus { border-color: #0070f3; }
    .proxy-btn { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .proxy-btn:hover { background: #0051a8; }
    .frame-container { width: 100%; height: calc(100vh - 61px); }
    iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <div class="proxy-bar">
    <input 
      type="text" 
      id="target-url" 
      class="proxy-input" 
      placeholder="Enter URL or search term (e.g. youtube.com)" 
      onkeydown="if(event.key === 'Enter') launchProxy()"
    >
    <button class="proxy-btn" onclick="launchProxy()">Go</button>
  </div>

  <div class="frame-container">
    <iframe id="proxy-frame"></iframe>
  </div>

  <script>
    let swPromise = null;

    async function ensureSWActive() {
      if (!swPromise) {
        swPromise = (async () => {
          if (!('serviceWorker' in navigator)) {
            throw new Error('Service workers not supported.');
          }

          // 1. Register Service Worker
          const reg = await navigator.serviceWorker.register(__uv$config.sw, {
            scope: __uv$config.prefix
          });

          // 2. Wait until SW reaches 'activated' state
          if (!(reg.active && reg.active.state === 'activated')) {
            await new Promise((resolve) => {
              const worker = reg.installing || reg.waiting || reg.active;
              if (!worker) return resolve(reg);
              if (worker.state === 'activated') resolve(reg);
              worker.addEventListener('statechange', (e) => {
                if (e.target.state === 'activated') resolve(reg);
              });
            });
          }

          // 3. Initialize BareMux transport dynamically via CDN
          if (typeof BareMux !== 'undefined') {
            try {
              // Fetch worker script from CDN and convert to Blob URL to bypass CORS worker limits
              const workerRes = await fetch('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@latest/dist/worker.js');
              const workerText = await workerRes.text();
              const workerBlobUrl = URL.createObjectURL(new Blob([workerText], { type: 'application/javascript' }));

              const connection = new BareMux.BareMuxConnection(workerBlobUrl);
              const currentTransport = await connection.getTransport();
              if (!currentTransport) {
                await connection.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-client@latest/dist/index.mjs', [__uv$config.bare]);
              }
            } catch (e) {
              console.warn('BareMux CDN init notice:', e);
            }
          }

          return reg;
        })();
      }
      return swPromise;
    }

    // Initialize SW & BareMux on page load
    ensureSWActive().catch(err => console.error('SW activation error:', err));

    async function launchProxy() {
      let input = document.getElementById('target-url').value.trim();
      if (!input) return;

      try {
        await ensureSWActive();
      } catch (err) {
        console.error('Service worker not ready:', err);
        return;
      }

      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://www.duckduckgo.com/?q=' + encodeURIComponent(input);
        }
      }

      const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(input);
      document.getElementById('proxy-frame').src = proxiedUrl;
    }
  </script>
</body>
</html>
