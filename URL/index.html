<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy | htmltools.me</title>
  
  <!-- Load Ultraviolet Core Scripts -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #121212; 
      color: #fff; 
      overflow: hidden; 
    }
    
    /* Top Search Bar */
    .proxy-bar {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    .proxy-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .proxy-input:focus { 
      border-color: #0070f3; 
    }
    .proxy-btn {
      padding: 10px 20px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .proxy-btn:hover { 
      background: #0051a8; 
    }

    /* Embedded Site Frame */
    .frame-container {
      width: 100%;
      height: calc(100vh - 61px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="proxy-bar">
    <input 
      type="text" 
      id="target-url" 
      class="proxy-input" 
      placeholder="Enter URL or search term (e.g. youtube.com)" 
      onkeydown="if(event.key==='Enter') launchProxy()"
    >
    <button class="proxy-btn" onclick="launchProxy()">Go</button>
  </div>

  <div class="frame-container">
    <iframe id="proxy-frame"></iframe>
  </div>

  <script>
    let swReady = false;

    // 1. Register the Service Worker on page load and wait for ready state
    async function initProxySW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/uv/uv.sw.js', {
            scope: __uv$config.prefix
          });
          
          // Ensure the worker is active before allowing requests
          await navigator.serviceWorker.ready;
          console.log('Ultraviolet ServiceWorker registered and ready!');
          swReady = true;
        } catch (err) {
          console.error('ServiceWorker registration failed:', err);
        }
      } else {
        alert('Your browser does not support Service Workers, which are required for this proxy.');
      }
    }
    
    initProxySW();

    // 2. Encode and load the requested URL into the iframe
    function launchProxy() {
      let input = document.getElementById('target-url').value.trim();
      if (!input) return;

      if (!swReady) {
        alert("Proxy engine is starting up... please wait a couple seconds and click Go again!");
        return;
      }

      // Handle search terms vs direct domains
      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://www.duckduckgo.com/?q=' + encodeURIComponent(input);
        }
      }

      // Encode target URL with Ultraviolet XOR codec
      const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(input);

      // Load proxied output into iframe
      document.getElementById('proxy-frame').src = proxiedUrl;
    }
  </script>
</body>
</html>
