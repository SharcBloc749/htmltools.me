<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy | htmltools.me</title>
  
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <!-- BareMux CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@latest/dist/index.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    .proxy-bar { display: flex; gap: 10px; padding: 12px; background: #1e1e1e; border-bottom: 1px solid #333; }
    .proxy-input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
    .proxy-input:focus { border-color: #0070f3; }
    .proxy-btn { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .proxy-btn:hover { background: #0051a8; }
    .frame-container { width: 100%; height: calc(100vh - 61px); }
    iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <div class="proxy-bar">
    <input 
      type="text" 
      id="target-url" 
      class="proxy-input" 
      placeholder="Enter URL or search term (e.g. youtube.com)" 
      onkeydown="if(event.key === 'Enter') launchProxy()"
    >
    <button class="proxy-btn" onclick="launchProxy()">Go</button>
  </div>

  <div class="frame-container">
    <iframe id="proxy-frame"></iframe>
  </div>

  <script>
    console.log("Initializing Proxy script...");

    // 1. Register Service Worker immediately in background
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(__uv$config.sw, {
        scope: __uv$config.prefix
      }).then((reg) => {
        console.log("Service Worker registered on scope:", reg.scope);
      }).catch((err) => {
        console.error("Service Worker registration failed:", err);
      });
    }

    // 2. Initialize BareMux with a 3-second safety fallback so it never hangs the UI
    async function initBareMux() {
      if (typeof BareMux === 'undefined') return;
      
      try {
        console.log("Fetching BareMux worker...");
        const workerRes = await fetch('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@latest/dist/worker.js');
        const workerText = await workerRes.text();
        const workerBlobUrl = URL.createObjectURL(new Blob([workerText], { type: 'application/javascript' }));

        const connection = new BareMux.BareMuxConnection(workerBlobUrl);
        
        const setTransportPromise = connection.setTransport(
          'https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-as-module3@latest/dist/index.mjs',
          [__uv$config.bare]
        );

        // Timeout guard: don't let broken CDN worker hold up execution
        const timeout = new Promise((_, reject) => 
          setTimeout(() => reject(new Error("BareMux transport set timed out")), 3000)
        );

        await Promise.race([setTransportPromise, timeout]);
        console.log("BareMux transport set successfully!");
      } catch (err) {
        console.warn("BareMux init notice:", err.message);
      }
    }

    initBareMux();

    // 3. Directly load iframe on user click
    function launchProxy() {
      console.log("Launch triggered");
      let input = document.getElementById('target-url').value.trim();
      if (!input) return;

      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://www.duckduckgo.com/?q=' + encodeURIComponent(input);
        }
      }

      const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(input);
      console.log("Navigating iframe to:", proxiedUrl);
      document.getElementById('proxy-frame').src = proxiedUrl;
    }
  </script>
</body>
</html>
