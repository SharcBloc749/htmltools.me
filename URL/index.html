<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Web Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      padding: 1rem;
      background-color: #1e293b;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background-color: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background-color: #0369a1; }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      background-color: #1e293b;
    }
    iframe { flex: 1; border: none; width: 100%; background: #fff; }
  </style>

  <!-- Bare-Mux CDN Index -->
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.0.3/dist/index.js"></script>
  <script src="./uv/uv.bundle.js"></script>
  <script src="./uv/uv.config.js"></script>
</head>
<body>
  <div class="header">
    <input type="text" id="url-input" placeholder="Enter URL or search (e.g. https://youtube.com)" />
    <button id="search-btn">Go</button>
  </div>
  <div class="status" id="status-text">Initializing proxy transport...</div>
  <iframe id="proxy-iframe" src="about:blank"></iframe>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('search-btn');
    const iframe = document.getElementById('proxy-iframe');
    const statusText = document.getElementById('status-text');

    async function initProxy() {
      if (!('serviceWorker' in navigator)) {
        statusText.textContent = 'Service Workers not supported.';
        return;
      }

      try {
        if (typeof window.__uv$config === 'undefined') window.__uv$config = {};
        window.__uv$config.prefix = './uv/service/';

        // Blob worker for bare-mux
        const workerBlob = new Blob(
          [`importScripts('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.0.3/dist/worker.js');`],
          { type: 'application/javascript' }
        );
        const workerUrl = URL.createObjectURL(workerBlob);

        const connection = new BareMux.BareMuxConnection(workerUrl);

        await connection.setTransport(
          'https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.3/dist/index.mjs',
          [{ wisp: 'wss://wisp.mercurywork.shop/' }]
        );

        // Register Service Worker with scope covering the directory
        await navigator.serviceWorker.register('./sw.js', {
          scope: './'
        });

        statusText.textContent = 'Status: Connected successfully via Epoxy & Wisp!';
      } catch (err) {
        statusText.textContent = 'Setup failed: ' + err.message;
        console.error(err);
      }
    }

    function processUrl(value) {
      const val = value.trim();
      if (!val) return 'about:blank';
      if (val.startsWith('http://') || val.startsWith('https://')) {
        return val;
      }
      if (val.includes('.')) {
        return 'https://' + val;
      }
      return 'https://www.google.com/search?q=' + encodeURIComponent(val);
    }

    function loadPage() {
      const target = processUrl(input.value);
      iframe.src = window.__uv$config.prefix + window.__uv$config.encodeUrl(target);
    }

    btn.addEventListener('click', loadPage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadPage(); });

    initProxy();
  </script>
</body>
</html>
