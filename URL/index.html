<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>

<script>
let swReady = false;

async function registerProxy() {
    if (!('serviceWorker' in navigator)) {
        console.error('Service Workers not supported in this browser.');
        return;
    }

    try {
        await navigator.serviceWorker.register(__uv$config.sw, {
            scope: __uv$config.prefix
        });

        // Wait until worker is fully active and taking control
        await navigator.serviceWorker.ready;
        swReady = true;
        console.log('Ultraviolet Proxy Engine is active!');
    } catch (err) {
        console.error('Failed to register Ultraviolet ServiceWorker:', err);
    }
}

registerProxy();

function launchUrl(targetUrl) {
    if (!swReady) {
        alert("Proxy engine is starting up... please wait a couple seconds and click Go again!");
        return;
    }

    let url = targetUrl.trim();
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
    }

    const encodedPath = __uv$config.prefix + __uv$config.encodeUrl(url);
    document.getElementById('proxy-iframe').src = encodedPath;
}
</script>
