<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Web Client</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      padding: 1rem;
      background-color: #1e293b;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background-color: #0284c7;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      background-color: #1e293b;
    }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background-color: #ffffff;
    }
  </style>

  <!-- Ultraviolet core bundle scripts -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
</head>
<body>

  <div class="header">
    <input type="text" id="url-input" placeholder="Enter a URL or search query..." />
    <button id="search-btn">Go</button>
  </div>
  <div class="status" id="status-text">Registering Service Worker...</div>
  <iframe id="proxy-iframe" src="about:blank"></iframe>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('search-btn');
    const iframe = document.getElementById('proxy-iframe');
    const statusText = document.getElementById('status-text');

    async function initServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        statusText.textContent = 'Error: Service Workers are not supported in this browser.';
        return;
      }

      try {
        await navigator.serviceWorker.register('/sw.js', {
          scope: __uv$config.prefix
        });
        statusText.textContent = 'Status: Connected to https://my-htmltools-bare.onrender.com/. Ready to browse!';
      } catch (err) {
        statusText.textContent = 'Service Worker registration failed: ' + err.message;
        console.error('SW Error:', err);
      }
    }

    function processUrl(value) {
      if (!value) return 'about:blank';
      if (value.startsWith('http://') || value.startsWith('https://')) {
        return value;
      }
      if (value.includes('.')) {
        return 'https://' + value;
      }
      return 'https://www.google.com/search?q=' + encodeURIComponent(value);
    }

    function loadPage() {
      const rawUrl = input.value.trim();
      if (!rawUrl) return;

      const formattedUrl = processUrl(rawUrl);
      const proxyUrl = __uv$config.prefix + __uv$config.encodeUrl(formattedUrl);
      
      iframe.src = proxyUrl;
    }

    btn.addEventListener('click', loadPage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadPage();
    });

    initServiceWorker();
  </script>
</body>
</html>
