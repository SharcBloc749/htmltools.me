<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Web Client</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      padding: 1rem;
      background-color: #1e293b;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background-color: #0284c7;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      background-color: #1e293b;
    }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background-color: #ffffff;
    }
  </style>

  <!-- Bare-Mux loaded via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.0.1/dist/index.js"></script>
  
  <!-- Local Ultraviolet scripts -->
  <script src="/URL/uv/uv.bundle.js"></script>
  <script src="/URL/uv/uv.config.js?v=7"></script>
</head>
<body>

  <div class="header">
    <input type="text" id="url-input" placeholder="Enter a URL or search query..." />
    <button id="search-btn">Go</button>
  </div>
  <div class="status" id="status-text">Initializing Bare-Mux and Service Worker...</div>
  <iframe id="proxy-iframe" src="about:blank"></iframe>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('search-btn');
    const iframe = document.getElementById('proxy-iframe');
    const statusText = document.getElementById('status-text');

    // Helper to turn remote transport code into a safe same-origin Blob
    async function setCdnTransport(connection, cdnUrl, transportArgs) {
      const response = await fetch(cdnUrl);
      if (!response.ok) throw new Error(`Failed to load CDN transport (${response.status})`);
      
      const scriptText = await response.text();
      const blob = new Blob([scriptText], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);

      await connection.setTransport(blobUrl, transportArgs);
    }

    async function initProxy() {
      if (!('serviceWorker' in navigator)) {
        statusText.textContent = 'Error: Service Workers are not supported in this browser.';
        return;
      }

      try {
        if (typeof window.__uv$config === 'undefined') window.__uv$config = {};
        window.__uv$config.prefix = '/URL/uv/service/';

        // 1. Same-origin Blob worker for Bare-Mux
        const workerBlob = new Blob(
          [`importScripts('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.0.1/dist/worker.js');`],
          { type: 'application/javascript' }
        );
        const workerUrl = URL.createObjectURL(workerBlob);

        // 2. Initialize BareMux Connection
        const connection = new BareMux.BareMuxConnection(workerUrl);

        // 3. Load Epoxy Transport dynamically via same-origin Blob URL using Wisp WebSocket
        await setCdnTransport(
          connection,
          'https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.0.1/dist/index.mjs',
          [{ wisp: 'wss://wisp.mercuryworkshop.sub.id/' }]
        );

        // 4. Register UV Service Worker
        await navigator.serviceWorker.register('/URL/sw.js', {
          scope: '/URL/uv/service/'
        });

        statusText.textContent = 'Status: Connected via Epoxy Transport. Ready to browse!';
      } catch (err) {
        statusText.textContent = 'Setup failed: ' + err.message;
        console.error('Initialization Error:', err);
      }
    }

    function processUrl(value) {
      if (!value) return 'about:blank';
      if (value.startsWith('http://') || value.startsWith('https://')) {
        return value;
      }
      if (value.includes('.')) {
        return 'https://' + value;
      }
      return 'https://www.google.com/search?q=' + encodeURIComponent(value);
    }

    function loadPage() {
      const rawUrl = input.value.trim();
      if (!rawUrl) return;

      const formattedUrl = processUrl(rawUrl);
      const proxyUrl = window.__uv$config.prefix + window.__uv$config.encodeUrl(formattedUrl);
      
      iframe.src = proxyUrl;
    }

    btn.addEventListener('click', loadPage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadPage();
    });

    initProxy();
  </script>
</body>
</html>
