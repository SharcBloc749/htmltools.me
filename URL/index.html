<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy | htmltools.me</title>
  
  <!-- Load Ultraviolet Core Scripts -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    
    /* Search Bar Layout */
    .proxy-bar {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    .proxy-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .proxy-input:focus { border-color: #0070f3; }
    .proxy-btn {
      padding: 10px 20px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .proxy-btn:hover { background: #0051a8; }

    /* Fullscreen Frame Container */
    .frame-container {
      width: 100%;
      height: calc(100vh - 61px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="proxy-bar">
    <input type="text" id="target-url" class="proxy-input" placeholder="Enter URL or search term (e.g. youtube.com)" onkeydown="if(event.key==='Enter') launchProxy()">
    <button class="proxy-btn" onclick="launchProxy()">Go</button>
  </div>

  <div class="frame-container">
    <iframe id="proxy-frame"></iframe>
  </div>

  <script>
    // 1. Register the Service Worker on page load
    async function initProxySW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/uv/uv.sw.js', {
            scope: __uv$config.prefix
          });
          console.log('Ultraviolet ServiceWorker registered successfully!');
        } catch (err) {
          console.error('ServiceWorker registration failed:', err);
        }
      } else {
        alert('Your browser does not support Service Workers, which are required for this proxy.');
      }
    }
    
    initProxySW();

    // 2. Load the proxy URL into the iframe
    function launchProxy() {
      let input = document.getElementById('target-url').value.trim();
      if (!input) return;

      // Treat non-URLs as search queries or add protocol
      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://www.duckduckgo.com/?q=' + encodeURIComponent(input);
        }
      }

      // Encode URL with Ultraviolet
      const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(input);

      // Set iframe source
      document.getElementById('proxy-frame').src = proxiedUrl;
    }
  </script>
</body>
</html>
