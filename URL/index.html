<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Proxy · HTMLTools</title>
<link rel="icon" type="image/png" href="https://htmltools.me/logo3.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
:root{
  --bg:#000000;--surface:#0a0a0a;--panel:#121212;--panel-2:#1a1a1a;
  --border:#232323;--border-2:#333333;--border-hi:#555555;
  --tx:#f5f5f5;--tx-2:#c7c7c7;--tx-3:#7a7a7a;
  --white:#fff;--wfg:#000;
  --accent:#ffffff;--accent-dim:#d0d0d0;
  --red:#e5484d;
  --r:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--nav-h:48px;
  --font:'IBM Plex Sans',arial,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{color:var(--tx);font-family:var(--font);font-size:14px;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3);}

/* NAV */
nav{background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;height:var(--nav-h);gap:8px;flex-shrink:0;}
.nav-brand{display:flex;align-items:center;gap:7px;padding-right:12px;margin-right:4px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:24px;height:24px;background:var(--white);color:var(--wfg);border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.nav-mark img{width:24px;height:24px;object-fit:contain;display:block;filter:grayscale(1) contrast(1.1);}
.nav-name{font-size:.78rem;font-weight:600;color:var(--tx-3);letter-spacing:-.01em;white-space:nowrap;}
.nav-title{font-size:.8rem;font-weight:600;color:var(--tx);white-space:nowrap;}
.nav-sub{font-size:.68rem;color:var(--tx-3);font-family:var(--mono);white-space:nowrap;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--tx-3);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{border-color:var(--border-hi);color:var(--tx);background:var(--panel);}

/* SEARCH BAR ROW */
.bar-row{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.bar-row.show{display:flex;}
.bar-logo-sm{width:32px;height:32px;flex-shrink:0;cursor:pointer;}
.bar-logo-sm img{width:32px;height:32px;object-fit:contain;display:block;filter:grayscale(1) contrast(1.1);}
.bar-nav-btns{display:none;gap:2px;flex-shrink:0;}
.bar-nav-btns.show{display:flex;}
.url-form{flex:1;display:flex;gap:8px;align-items:center;min-width:0;}
.url-row{flex:1;display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:2px 4px 2px 16px;align-items:center;transition:all .13s;min-width:0;height:40px;}
.url-row:hover{background:var(--panel-2);border-color:var(--border-2);}
.url-row:focus-within{background:var(--panel-2);border-color:var(--border-hi);}
.url-row i.lead-icon{color:var(--tx-3);font-size:13px;flex-shrink:0;}
.url-row input{flex:1;background:transparent;border:none;color:var(--tx);font-size:14.5px;outline:none;font-family:var(--font);min-width:0;height:36px;padding:0 10px;}
.url-row input::placeholder{color:var(--tx-3);}
.url-row .row-actions{display:flex;gap:2px;flex-shrink:0;}
.row-icon-btn{background:transparent;border:none;color:var(--tx-3);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .13s;}
.row-icon-btn:hover{background:var(--panel-2);color:var(--tx);}

/* SEARCH TABS */
.search-tabs{display:none;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);gap:2px;flex-shrink:0;}
.search-tabs.show{display:flex;}
.s-tab{display:flex;align-items:center;gap:6px;padding:11px 4px;margin-right:26px;font-size:12.5px;color:var(--tx-3);border-bottom:3px solid transparent;font-weight:500;transition:color .13s;background:transparent;border-top:none;border-left:none;border-right:none;}
.s-tab i{font-size:12px;}
.s-tab:hover{color:var(--tx);}
.s-tab.active{color:var(--tx);border-bottom-color:var(--white);font-weight:600;}

/* VIEWPORT */
.viewport{flex:1;position:relative;overflow:hidden;min-height:0;background:var(--bg);}
.state{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:2rem;text-align:center;}
.state.show{display:flex;}
.state i{font-size:1.8rem;color:var(--tx-3);}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.state h3{font-size:.95rem;font-weight:600;color:var(--tx-2);letter-spacing:-.01em;}
.state p{font-size:.8rem;color:var(--tx-3);max-width:380px;line-height:1.6;}

#frameHost{position:absolute;inset:0;display:none;}
#frameHost.show{display:block;}
#proxyFrame{width:100%;height:100%;border:none;background:#fff;display:block;}

/* HOME */
#stateIdle{gap:0;}
.home-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px;padding-top:min(16vh,140px);}
.home-mark{width:92px;height:92px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
.home-mark img{width:64px;height:64px;object-fit:contain;filter:grayscale(1) contrast(1.1) brightness(1.3);}
.home-title{font-size:2.1rem;font-weight:600;color:var(--tx);letter-spacing:-.02em;margin-bottom:26px;font-family:var(--font);}
.home-search{width:100%;max-width:580px;display:flex;gap:10px;background:var(--panel);border:1px solid var(--border-2);border-radius:26px;padding:6px 8px 6px 20px;align-items:center;transition:all .15s;}
.home-search:hover{border-color:var(--border-hi);}
.home-search:focus-within{border-color:var(--tx-3);}
.home-search i.lead-icon{color:var(--tx-3);font-size:14px;flex-shrink:0;}
.home-search input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-size:15px;font-family:var(--font);height:40px;padding:0 8px;min-width:0;}
.home-search input::placeholder{color:var(--tx-3);}
.home-search button.mic-btn{background:transparent;border:none;color:var(--tx-3);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.home-btn-row{display:flex;gap:10px;margin-top:26px;}
.home-btn{background:var(--panel);border:1px solid var(--border-2);color:var(--tx-2);font-size:13px;padding:9px 16px;border-radius:6px;transition:all .13s;}
.home-btn:hover{border-color:var(--tx-3);color:var(--tx);background:var(--panel-2);}
.home-hint{margin-top:40px;font-size:11.5px;color:var(--tx-3);display:flex;align-items:center;gap:6px;}
.home-hint kbd{background:var(--panel);border:1px solid var(--border-2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:10px;color:var(--tx-2);}

/* SEARCH RESULTS */
#searchHost{position:absolute;inset:0;display:none;overflow-y:auto;}
#searchHost.show{display:block;}
.search-wrap{max-width:660px;margin:0 auto;padding:18px 20px 60px;}
.search-meta{font-size:12px;color:var(--tx-3);margin-bottom:18px;}

.pinned-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;cursor:pointer;transition:all .13s;}
.pinned-card:hover{background:var(--panel-2);border-color:var(--border-hi);}
.pinned-fav{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:var(--tx);overflow:hidden;}
.pinned-fav img{width:20px;height:20px;object-fit:contain;}
.pinned-title{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.pinned-url{font-size:11.5px;color:var(--tx-3);font-family:var(--mono);}
.pinned-badge{margin-left:auto;font-size:9.5px;color:var(--tx-3);border:1px solid var(--border-2);border-radius:10px;padding:2px 8px;flex-shrink:0;letter-spacing:.03em;}

.result-card{display:flex;gap:12px;margin-bottom:20px;cursor:pointer;}
.result-fav{width:28px;height:28px;border-radius:6px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;margin-top:1px;}
.result-fav img{width:16px;height:16px;object-fit:contain;}
.result-fav i{font-size:12px;color:var(--tx-3);}
.result-body{min-width:0;flex:1;}
.result-url{font-size:12px;color:var(--tx-3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);}
.result-title{font-size:16px;color:var(--tx);margin-bottom:4px;letter-spacing:-.01em;font-weight:500;}
.result-card:hover .result-title{text-decoration:underline;}
.result-snippet{font-size:13px;color:var(--tx-2);line-height:1.55;}

.load-more-row{display:flex;justify-content:center;margin-top:18px;}
.load-more-btn{background:var(--panel);border:1px solid var(--border-2);color:var(--tx-2);font-size:12.5px;font-weight:500;padding:9px 20px;border-radius:20px;transition:all .13s;display:flex;align-items:center;gap:8px;}
.load-more-btn:hover{border-color:var(--tx-3);color:var(--tx);background:var(--panel-2);}
.load-more-btn:disabled{opacity:.5;cursor:default;}

/* IMAGES GRID */
.img-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.img-strip a{display:block;position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--panel);transition:all .15s;aspect-ratio:1;}
.img-strip a:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.5);}
.img-strip img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s;}
.img-strip a:hover img{transform:scale(1.04);}
.img-skel{width:100%;height:100%;background:linear-gradient(100deg,var(--panel) 30%,var(--panel-2) 50%,var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* VIDEOS PANEL */
.video-jump{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:60px 20px;}
.video-jump i{font-size:2.4rem;color:var(--tx-3);}
.video-jump h3{font-size:1.1rem;font-weight:600;color:var(--tx);}
.video-jump p{font-size:13px;color:var(--tx-3);max-width:420px;line-height:1.6;}
.video-jump .go-mattube{background:var(--white);color:var(--wfg);border:none;padding:11px 22px;border-radius:22px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;transition:opacity .13s;}
.video-jump .go-mattube:hover{opacity:.85;}

footer{padding:8px 16px;font-size:10.5px;color:var(--tx-3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);letter-spacing:.01em;}
footer strong{color:var(--tx-2);font-weight:500;}
footer .f-dot{color:var(--border-2);}
footer a{color:var(--tx-2);}
footer a:hover{color:var(--tx);}

@media(max-width:639px){
  .nav-title,.nav-sub{display:none;}
  .home-title{font-size:1.5rem;}
  .home-mark{width:64px;height:64px;}
  .home-mark img{width:44px;height:44px;}
  .search-tabs{overflow-x:auto;}
  .img-strip{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-mark"><img src="https://htmltools.me/logo3.png?v=2" alt="HT"/></div>
    <span class="nav-name">HTML Tools</span>
  </div>
  <span class="nav-title">Proxy</span>
  <span class="nav-sub">/ browse &amp; search</span>
  <div class="nav-right">
    <a class="icon-btn" href="https://htmltools.me/" title="Back to HTMLTools"><i class="fas fa-home"></i></a>
  </div>
</nav>

<div class="bar-row" id="barRow">
  <div class="bar-logo-sm" id="logoHome" title="Home"><img src="https://htmltools.me/logo3.png?v=2" alt="HT"/></div>
  <div class="bar-nav-btns" id="frameNavBtns">
    <button class="icon-btn" id="btnBack" title="Back"><i class="fas fa-arrow-left"></i></button>
    <button class="icon-btn" id="btnFwd" title="Forward"><i class="fas fa-arrow-right"></i></button>
    <button class="icon-btn" id="btnReload" title="Reload"><i class="fas fa-redo"></i></button>
  </div>
  <form class="url-form" id="mainForm">
    <div class="url-row">
      <i class="fas fa-search lead-icon" id="barIcon"></i>
      <input type="text" id="mainInput" placeholder="Search or enter a URL" autocomplete="off" inputmode="url"/>
      <div class="row-actions">
        <button type="submit" class="row-icon-btn" title="Go"><i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
  </form>
</div>

<div class="search-tabs" id="searchTabs">
  <button class="s-tab active" data-tab="all" onclick="setTab('all')"><i class="fas fa-globe"></i> All</button>
  <button class="s-tab" data-tab="images" onclick="setTab('images')"><i class="fas fa-image"></i> Images</button>
  <button class="s-tab" data-tab="videos" onclick="setTab('videos')"><i class="fab fa-youtube"></i> Videos</button>
</div>

<div class="viewport" id="viewport">

  <div class="state show" id="stateIdle">
    <div class="home-wrap">
      <div class="home-mark"><img src="https://htmltools.me/logo3.png?v=2" alt="HT"/></div>
      <div class="home-title">Search or browse</div>
      <form class="home-search" id="homeForm">
        <i class="fas fa-search lead-icon"></i>
        <input type="text" id="homeInput" placeholder="Search the web or enter a URL" autocomplete="off"/>
      </form>
      <div class="home-btn-row">
        <button type="button" class="home-btn" id="homeSearchBtn">HTMLTools Search</button>
        <button type="button" class="home-btn" id="homeLuckyBtn">I'm Feeling Lucky</button>
      </div>
      <div class="home-hint">Tip: type a website name (like <kbd>youtube.com</kbd>) to open it directly</div>
    </div>
  </div>

  <div class="state" id="stateLoading">
    <i class="fas fa-circle-notch spin"></i>
    <h3 id="loadingLabel">Loading…</h3>
  </div>

  <div class="state" id="stateError">
    <i class="fas fa-triangle-exclamation" style="color:var(--red)"></i>
    <h3>Couldn't load that</h3>
    <p id="errorDetail">Something went wrong.</p>
  </div>

  <div id="searchHost">
    <div class="search-wrap" id="searchResults"></div>
  </div>

  <div id="frameHost">
    <iframe id="proxyFrame"></iframe>
  </div>

</div>

<footer><strong>HTML Tools</strong><span class="f-dot">·</span><span>Proxy</span><span class="f-dot">·</span><a href="https://htmltools.me/">htmltools.me</a></footer>

<script>
// ── CONFIG ──
const WORKER_ORIGIN = 'https://restless-hill-0a7b.bozhetarnikmatthew.workers.dev';
const MATTUBE_ORIGIN = 'https://mattube.htmltools.me';

let currentTab = 'all';
let frameHistory = [];
let frameHistoryIdx = -1;

let currentQuery = '';
let resultsOffset = 0;
let allResults = [];
let hasMoreResults = false;

let imagesLoaded = false;
let imagesOffset = 0;
let allImages = [];
let hasMoreImages = false;

const PAGE_SIZE_RESULTS = 10;
const PAGE_SIZE_IMAGES = 12;

function showState(which){
  ['stateIdle','stateLoading','stateError','searchHost','frameHost'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
  document.getElementById(which).classList.add('show');
  document.getElementById('frameNavBtns').classList.toggle('show', which==='frameHost');
  document.getElementById('barRow').classList.toggle('show', which!=='stateIdle');
  document.getElementById('searchTabs').classList.toggle('show', which==='searchHost');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function faviconFor(u){
  try{
    const h = new URL(u).hostname;
    return 'https://www.google.com/s2/favicons?domain=' + h + '&sz=64';
  }catch(e){ return ''; }
}

// ── URL vs search detection ──
const TLDS = /\.(com|org|net|io|dev|app|co|me|gg|tv|edu|gov|us|uk|ca|de|fr|jp|ai|xyz|info|biz|online|store|tech|site|club|live|news|blog|shop)(\/|$|\?|#|:)/i;

function looksLikeUrl(raw){
  const s = raw.trim();
  if(!s) return false;
  if(/\s/.test(s)) return false;
  if(/^https?:\/\//i.test(s)) return true;
  if(/^[a-z0-9.-]+\.[a-z]{2,}(:\d+)?(\/[^\s]*)?$/i.test(s) && TLDS.test(s)) return true;
  if(/^localhost(:\d+)?(\/.*)?$/i.test(s)) return true;
  return false;
}

function normalizeUrl(raw){
  let u = raw.trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{ new URL(u); return u; }catch(e){ return null; }
}

function routeInput(raw, pushHistory){
  const val = raw.trim();
  if(!val) return;
  if(looksLikeUrl(val)){
    openUrl(val, pushHistory !== false);
  } else {
    runSearch(val);
  }
}

document.getElementById('mainForm').addEventListener('submit', function(e){
  e.preventDefault();
  routeInput(document.getElementById('mainInput').value);
});
document.getElementById('homeForm').addEventListener('submit', function(e){
  e.preventDefault();
  const val = document.getElementById('homeInput').value;
  document.getElementById('mainInput').value = val;
  routeInput(val);
});
document.getElementById('homeSearchBtn').addEventListener('click', function(){
  const val = document.getElementById('homeInput').value;
  if(!val.trim()) return;
  document.getElementById('mainInput').value = val;
  runSearch(val);
});
document.getElementById('homeLuckyBtn').addEventListener('click', function(){
  const val = document.getElementById('homeInput').value;
  if(!val.trim()) return;
  document.getElementById('mainInput').value = val;
  luckySearch(val);
});
document.getElementById('logoHome').addEventListener('click', function(){
  showState('stateIdle');
  document.getElementById('mainInput').value = '';
  document.getElementById('homeInput').value = '';
  document.getElementById('homeInput').focus();
});

// ── TABS ──
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')===tab));
  if(tab === 'videos'){
    openMatTube(currentQuery);
    renderCurrentTabView();
    return;
  }
  if(tab === 'images' && !imagesLoaded){
    loadImages(true);
  }
  renderCurrentTabView();
}

function openMatTube(query){
  const q = query && query.trim() ? query.trim() : '';
  const link = MATTUBE_ORIGIN + '/?search=' + encodeURIComponent(q);
  window.open(link, '_blank', 'noopener');
}

// ── SEARCH (web results) ──
async function runSearch(query){
  showState('stateLoading');
  document.getElementById('loadingLabel').textContent = 'Searching…';

  currentQuery = query;
  currentTab = 'all';
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')==='all'));
  resultsOffset = 0;
  allResults = [];
  hasMoreResults = false;
  imagesLoaded = false;
  imagesOffset = 0;
  allImages = [];
  hasMoreImages = false;

  try{
    const data = await fetchResultsPage(query, 0);
    allResults = data.results || [];
    resultsOffset = allResults.length;
    hasMoreResults = !!data.has_more_results;
    renderCurrentTabView();
    showState('searchHost');
  }catch(err){
    showState('stateError');
    document.getElementById('errorDetail').textContent = err.message || 'Search failed.';
  }
}

async function luckySearch(query){
  showState('stateLoading');
  document.getElementById('loadingLabel').textContent = 'Feeling lucky…';
  try{
    const data = await fetchResultsPage(query, 0);
    const results = data.results || [];
    if(results.length){
      openUrl(results[0].url, true);
    } else {
      runSearch(query);
    }
  }catch(err){
    showState('stateError');
    document.getElementById('errorDetail').textContent = err.message || 'Search failed.';
  }
}

async function fetchResultsPage(query, offset){
  const params = new URLSearchParams({ q: query, offset: String(offset), limit: String(PAGE_SIZE_RESULTS) });
  const resp = await fetch(WORKER_ORIGIN + '/api/search?' + params.toString());
  const data = await resp.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadMoreResults(){
  const btn = document.getElementById('loadMoreResultsBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spin"></i> Loading…'; }
  try{
    const data = await fetchResultsPage(currentQuery, resultsOffset);
    const more = data.results || [];
    allResults = allResults.concat(more);
    resultsOffset += more.length;
    hasMoreResults = !!data.has_more_results;
    renderCurrentTabView();
  }catch(err){
    if(btn){ btn.disabled = false; btn.innerHTML = 'More results'; }
  }
}

// ── IMAGES ──
async function fetchImagesPage(query, offset){
  const params = new URLSearchParams({ q: query, offset: String(offset), limit: String(PAGE_SIZE_IMAGES) });
  const resp = await fetch(WORKER_ORIGIN + '/api/images?' + params.toString());
  const data = await resp.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadImages(first){
  if(first){
    showState('stateLoading');
    document.getElementById('loadingLabel').textContent = 'Loading images…';
  }
  try{
    const data = await fetchImagesPage(currentQuery, 0);
    allImages = data.images || [];
    imagesOffset = allImages.length;
    hasMoreImages = !!data.has_more_images;
    imagesLoaded = true;
    renderCurrentTabView();
    showState('searchHost');
  }catch(err){
    showState('stateError');
    document.getElementById('errorDetail').textContent = err.message || 'Could not load images.';
  }
}

async function loadMoreImages(){
  const btn = document.getElementById('loadMoreImagesBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spin"></i> Loading…'; }
  try{
    const data = await fetchImagesPage(currentQuery, imagesOffset);
    const more = data.images || [];
    allImages = allImages.concat(more);
    imagesOffset += more.length;
    hasMoreImages = !!data.has_more_images;
    renderCurrentTabView();
  }catch(err){
    if(btn){ btn.disabled = false; btn.innerHTML = 'More images'; }
  }
}

// ── RENDER ──
function renderCurrentTabView(){
  if(currentTab === 'all') renderAllTab();
  else if(currentTab === 'images') renderImagesTab();
  else if(currentTab === 'videos') renderVideosTab();
}

function renderAllTab(){
  const host = document.getElementById('searchResults');
  let html = '<div class="search-meta">Results for "' + esc(currentQuery) + '"</div>';

  if(allResults.length){
    allResults.forEach(r=>{
      const fav = faviconFor(r.url);
      if(r.pinned){
        let host2;
        try{ host2 = new URL(r.url).hostname.replace(/^www\./,''); }catch(e){ host2 = r.url; }
        html += '<div class="pinned-card" data-url="'+esc(r.url)+'">'
          + '<div class="pinned-fav">'+(fav?'<img src="'+esc(fav)+'" alt="" onerror="this.parentElement.innerHTML=\'<i class=&quot;fas fa-star&quot;></i>\'"/>':'<i class="fas fa-star"></i>')+'</div>'
          + '<div><div class="pinned-title">'+esc(r.title)+'</div><div class="pinned-url">'+esc(host2)+'</div></div>'
          + '<div class="pinned-badge">Official site</div>'
          + '</div>';
      } else {
        html += '<div class="result-card" data-url="'+esc(r.url)+'">'
          + '<div class="result-fav">'+(fav?'<img src="'+esc(fav)+'" alt="" onerror="this.parentElement.innerHTML=\'<i class=&quot;fas fa-globe&quot;></i>\'"/>':'<i class="fas fa-globe"></i>')+'</div>'
          + '<div class="result-body">'
          + '<div class="result-url">'+esc(r.url)+'</div>'
          + '<div class="result-title">'+esc(r.title)+'</div>'
          + '<div class="result-snippet">'+esc(r.snippet||'')+'</div>'
          + '</div></div>';
      }
    });
    if(hasMoreResults){
      html += '<div class="load-more-row"><button type="button" class="load-more-btn" id="loadMoreResultsBtn"><i class="fas fa-plus"></i> More results</button></div>';
    }
  } else {
    html += '<p style="color:var(--tx-3);font-size:13px;">No results found.</p>';
  }

  host.innerHTML = html;

  host.querySelectorAll('.result-card, .pinned-card').forEach(card=>{
    card.addEventListener('click', function(){
      openUrl(this.getAttribute('data-url'), true);
    });
  });
  const lmr = document.getElementById('loadMoreResultsBtn');
  if(lmr) lmr.addEventListener('click', loadMoreResults);
}

function renderImagesTab(){
  const host = document.getElementById('searchResults');
  let html = '<div class="search-meta">Images for "' + esc(currentQuery) + '"</div>';

  if(!imagesLoaded){
    html += '<div class="img-strip">' + Array(8).fill('<a><div class="img-skel"></div></a>').join('') + '</div>';
  } else if(allImages.length){
    html += '<div class="img-strip" id="imgStrip">';
    allImages.forEach(img=>{
      html += '<a href="'+esc(img)+'" class="img-link" data-url="'+esc(img)+'"><img src="'+esc(img)+'" loading="lazy" onerror="this.closest(\'a\').style.display=\'none\'"/></a>';
    });
    html += '</div>';
    if(hasMoreImages){
      html += '<div class="load-more-row"><button type="button" class="load-more-btn" id="loadMoreImagesBtn"><i class="fas fa-plus"></i> More images</button></div>';
    }
  } else {
    html += '<p style="color:var(--tx-3);font-size:13px;">No images found.</p>';
  }

  host.innerHTML = html;

  host.querySelectorAll('.img-link').forEach(link=>{
    link.addEventListener('click', function(e){
      e.preventDefault();
      openUrl(this.getAttribute('data-url'), true);
    });
  });
  const lmi = document.getElementById('loadMoreImagesBtn');
  if(lmi) lmi.addEventListener('click', loadMoreImages);
}

function renderVideosTab(){
  const host = document.getElementById('searchResults');
  const link = MATTUBE_ORIGIN + '/?search=' + encodeURIComponent(currentQuery||'');
  host.innerHTML =
    '<div class="video-jump">'
    + '<i class="fab fa-youtube"></i>'
    + '<h3>Opened in MatTube</h3>'
    + '<p>Video results for "'+esc(currentQuery)+'" just opened in a new tab on MatTube.</p>'
    + '<button type="button" class="go-mattube" id="reopenMatTube"><i class="fas fa-arrow-up-right-from-square"></i> Open again</button>'
    + '</div>';
  const btn = document.getElementById('reopenMatTube');
  if(btn) btn.addEventListener('click', function(){ openMatTube(currentQuery); });
}

// ── URL PROXY ──
function openUrl(raw, pushHistory){
  const url = normalizeUrl(raw);
  if(!url){
    showState('stateError');
    document.getElementById('errorDetail').textContent = 'That doesn\'t look like a valid URL.';
    return;
  }
  showState('stateLoading');
  document.getElementById('loadingLabel').textContent = 'Loading page…';

  const frame = document.getElementById('proxyFrame');
  const proxied = WORKER_ORIGIN + '/view?u=' + encodeURIComponent(url);

  frame.onload = function(){
    showState('frameHost');
  };
  frame.onerror = function(){
    showState('stateError');
    document.getElementById('errorDetail').textContent = 'The proxy could not load this page.';
  };
  frame.src = proxied;

  if(pushHistory){
    frameHistory = frameHistory.slice(0, frameHistoryIdx + 1);
    frameHistory.push(url);
    frameHistoryIdx = frameHistory.length - 1;
  }

  document.getElementById('mainInput').value = url;
}

document.getElementById('btnBack').addEventListener('click', function(){
  if(frameHistoryIdx > 0){
    frameHistoryIdx--;
    openUrl(frameHistory[frameHistoryIdx], false);
  }
});
document.getElementById('btnFwd').addEventListener('click', function(){
  if(frameHistoryIdx < frameHistory.length - 1){
    frameHistoryIdx++;
    openUrl(frameHistory[frameHistoryIdx], false);
  }
});
document.getElementById('btnReload').addEventListener('click', function(){
  const frame = document.getElementById('proxyFrame');
  if(frame.src) frame.src = frame.src;
});

window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'htmltools-proxy-nav' && e.data.url){
    document.getElementById('mainInput').value = e.data.url;
    frameHistory = frameHistory.slice(0, frameHistoryIdx + 1);
    if(frameHistory[frameHistoryIdx] !== e.data.url){
      frameHistory.push(e.data.url);
      frameHistoryIdx = frameHistory.length - 1;
    }
    showState('frameHost');
  }
});

// ── Deep-link support ──
window.addEventListener('load', function(){
  const params = new URLSearchParams(window.location.search);
  const website = params.get('website');
  const q = params.get('q');
  if(website){
    document.getElementById('mainInput').value = website;
    openUrl(website, true);
  } else if(q){
    document.getElementById('mainInput').value = q;
    runSearch(q);
  } else {
    document.getElementById('homeInput').focus();
  }
});
