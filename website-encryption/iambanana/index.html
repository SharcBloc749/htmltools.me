
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Groq AI Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --user-msg: #0284c7;
      --ai-msg: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    
    header { padding: 1rem; background: var(--card); border-bottom: 1px solid #334155; display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
    select, button, input { font: inherit; color: inherit; background: #0f172a; border: 1px solid #475569; padding: 0.5rem 0.8rem; border-radius: 6px; }
    
    #chat-box { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 12px; line-height: 1.5; word-break: break-word; }
    .message.user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background: var(--ai-msg); border-bottom-left-radius: 2px; }
    .message pre { background: #0f172a; padding: 0.5rem; border-radius: 4px; overflow-x: auto; margin-top: 0.5rem; }

    #input-area { padding: 1rem; background: var(--card); border-top: 1px solid #334155; display: flex; gap: 0.5rem; }
    #user-input { flex: 1; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h2>HTMLTools AI Assistant</h2>
    <div>
      <label for="model-select">Model:</label>
      <select id="model-select">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Recommended)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fastest)</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
      </select>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const vaultFetch = (function () {
      const BASE = "https://website-encryption.bozhetarnikmatthew.workers.dev/proxy/matthewbozh3e@gmail.com/b4s7crns7vydrhesbizd";
      return function (path, init) { return fetch(BASE + path, init); };
    })();

    const messages = [];

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const modelSelect = document.getElementById("model-select");
      const sendBtn = document.getElementById("send-btn");
      const text = input.value.trim();
      if (!text) return;

      // Update UI
      input.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text);

      messages.push({ role: "user", content: text });

      try {
        const res = await vaultFetch("/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: messages
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.choices[0].message.content;

        messages.push({ role: "assistant", content: reply });
        appendMessage("assistant", reply);

      } catch (err) {
        appendMessage("assistant", `**Error:** ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      msgDiv.innerHTML = marked.parse(text);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
