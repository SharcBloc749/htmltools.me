<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeepSeek Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px;
    background: #fafafa;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  select, button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; }
  button { cursor: pointer; background: #222; color: #fff; border: none; }
  button:hover { background: #444; }
  button:disabled { background: #999; cursor: not-allowed; }
  #chat {
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    padding: 12px;
    height: 60vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg { margin: 10px 0; display: flex; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 80%;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: #2563eb; color: #fff; }
  .msg.assistant .bubble { background: #f0f0f0; color: #111; }
  .msg.system .bubble { background: #fff3cd; color: #664d03; font-size: 13px; }
  .input-row { display: flex; gap: 8px; }
  #prompt {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    resize: none;
    height: 48px;
  }
  #status { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>

<div class="top-row">
  <h1>DeepSeek Chat</h1>
  <div>
    <select id="model">
      <option value="deepseek.v3.1" selected>DeepSeek V3.1</option>
      <option value="deepseek.v3.2">DeepSeek V3.2</option>
    </select>
    <button onclick="clearChat()">New chat</button>
  </div>
</div>

<div id="chat"></div>

<div class="input-row">
  <textarea id="prompt" placeholder="Type a message..."></textarea>
  <button id="sendBtn" onclick="send()">Send</button>
</div>
<div id="status"></div>

<script>
// --- Worker connection config ---
const WORKER_URL = "https://super-sun-9573.bozhetarnikmatthew.workers.dev/";
// The Bedrock API key lives only in the Cloudflare Worker's secrets —
// this page never sends or needs one.
// --------------------------------

let history = []; // { role: "user"|"assistant", content: string }

const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');

promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

function renderMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function clearChat() {
  history = [];
  chatEl.innerHTML = '';
  statusEl.textContent = '';
}

async function send() {
  const text = promptEl.value.trim();
  if (!text) return;

  const model = document.getElementById('model').value;

  history.push({ role: 'user', content: text });
  renderMessage('user', text);
  promptEl.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'Thinking...';

  try {
    const headers = { "Content-Type": "application/json" };

    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers,
      body: JSON.stringify({
        model,
        messages: history,
        max_tokens: 1024,
        temperature: 0.7
      })
    });

    const data = await res.json();

    if (!res.ok) {
      renderMessage('system', 'Error: ' + (data.error || JSON.stringify(data)));
      statusEl.textContent = '';
      sendBtn.disabled = false;
      return;
    }

    const reply = data.reply || '(no reply returned)';
    history.push({ role: 'assistant', content: reply });
    renderMessage('assistant', reply);
  } catch (e) {
    renderMessage('system', 'Request failed: ' + e.message);
  }

  statusEl.textContent = '';
  sendBtn.disabled = false;
  promptEl.focus();
}
</script>

</body>
</html>
