<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeepSeek Bedrock Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 100px; font-family: inherit; font-size: 14px; }
  select, input, button { font-size: 14px; padding: 6px; margin: 4px 0; }
  #output { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; margin-top: 16px; min-height: 60px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h1>DeepSeek Bedrock Worker Test</h1>

<label for="workerUrl">Worker URL</label>
<input type="text" id="workerUrl" style="width:100%"
       value="https://super-sun-9573.bozhetarnikmatthew.workers.dev/">

<label for="apiKey">API Key (only if you set one on the worker)</label>
<input type="text" id="apiKey" style="width:100%" placeholder="optional">

<label for="model">Model</label>
<select id="model">
  <option value="deepseek.v3.1" selected>DeepSeek V3.1 (default)</option>
  <option value="deepseek.v3.2">DeepSeek V3.2</option>
</select>

<label for="prompt">Message</label>
<textarea id="prompt">Say hello and tell me which model you are.</textarea>

<button onclick="send()">Send</button>

<div id="output">Response will appear here...</div>

<script>
async function send() {
  const output = document.getElementById('output');
  output.textContent = "Loading...";

  const workerUrl = document.getElementById('workerUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value;
  const prompt = document.getElementById('prompt').value;

  const headers = { "Content-Type": "application/json" };
  if (apiKey) headers["x-api-key"] = apiKey;

  try {
    const res = await fetch(workerUrl, {
      method: "POST",
      headers,
      body: JSON.stringify({
        model,
        messages: [{ role: "user", content: prompt }],
        max_tokens: 512,
        temperature: 0.7
      })
    });

    const data = await res.json();

    if (!res.ok) {
      output.textContent = "Error: " + JSON.stringify(data, null, 2);
      return;
    }

    output.textContent = (data.reply || "(no reply field, showing raw)") +
      "\n\n--- raw response ---\n" + JSON.stringify(data.raw, null, 2);
  } catch (e) {
    output.textContent = "Request failed: " + e.message;
  }
}
</script>

</body>
</html>
