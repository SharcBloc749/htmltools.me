<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grok — HTMLTools</title>
<link rel="icon" type="image/png" href="https://htmltools.me/logo3.png"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000;--surface:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;
  --border:#232323;--border2:#2c2c2c;--borderhi:#3e3e3e;
  --tx:#ececec;--tx2:#9a9a9a;--tx3:#5c5c5c;
  --white:#fff;--wfg:#000;
  --accent:#ececec;
  --red:#dc2626;--redhi:#ef4444;
  --r:8px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-full:999px;
  --nav-h:60px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 6px 24px rgba(0,0,0,.45);
  --shadow-pop:0 10px 40px rgba(0,0,0,.6);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(255,255,255,.15);}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--borderhi);}

/* ── NAV ── */
nav{height:var(--nav-h);background:#000;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:8px;flex-shrink:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:11px;padding-right:18px;margin-right:8px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:30px;height:30px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.06);background:#fff;display:flex;align-items:center;justify-content:center;}
.nav-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.nav-name{font-size:.98rem;font-weight:600;color:var(--tx);letter-spacing:-.01em;}
.nav-spacer{flex:1;}
.nav-user{display:flex;align-items:center;gap:14px;font-size:.84rem;color:var(--tx3);}
.nav-user-email{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);}

.sidebar-toggle-btn{width:36px;height:36px;border-radius:8px;background:transparent;border:none;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.sidebar-toggle-btn:hover{background:var(--panel2);color:var(--tx);}

/* ── LAYOUT ── */
.viewport{flex:1;display:flex;overflow:hidden;position:relative;}
.sidebar{width:284px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;transition:margin-left .19s ease,opacity .15s;}
.sidebar.collapsed{margin-left:-284px;opacity:0;pointer-events:none;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

.sb-search{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-md);color:var(--tx2);font-size:.92rem;cursor:pointer;transition:all .13s;margin-bottom:2px;}
.sb-search:hover{background:var(--panel);color:var(--tx);}
.sb-search svg{flex-shrink:0;}

.sb-new{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-md);background:transparent;color:var(--tx2);border:none;font-family:var(--font);font-size:.92rem;font-weight:500;cursor:pointer;transition:all .13s;margin-bottom:12px;}
.sb-new:hover{background:var(--panel);color:var(--tx);}
.sb-new svg{flex-shrink:0;}

.sb-section{font-size:.71rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin:10px 0 4px;padding:0 8px;}
.sb-conv{padding:10px 11px;border-radius:var(--r);font-size:.88rem;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .13s;border:1px solid transparent;user-select:none;position:relative;}
.sb-conv:hover{background:var(--panel);color:var(--tx);}
.sb-conv:hover .sb-conv-del{display:flex;}
.sb-conv.active{background:var(--panel2);border-color:var(--border2);color:var(--tx);}
.sb-conv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.sb-conv-del{display:none;align-items:center;justify-content:center;width:23px;height:23px;border-radius:6px;background:transparent;border:none;color:var(--tx3);flex-shrink:0;transition:all .13s;}
.sb-conv-del svg{pointer-events:none;}
.sb-conv-del:hover{background:rgba(220,38,38,.15);color:var(--redhi);}
.sb-empty{color:var(--tx3);font-size:.85rem;font-style:italic;padding:8px 8px;}

.btn{background:var(--panel);border:1px solid var(--border2);color:var(--tx2);padding:0 14px;border-radius:var(--r);font-size:.85rem;font-weight:500;font-family:var(--font);transition:all .13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:34px;}
.btn:hover{background:var(--panel2);border-color:var(--borderhi);color:var(--tx);}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-prim{background:var(--white);color:var(--wfg);border-color:var(--white);font-weight:600;}
.btn-prim:hover{opacity:.88;background:var(--white);border-color:var(--white);color:var(--wfg);}
.btn-danger{color:var(--redhi);border-color:rgba(220,38,38,.2);background:transparent;}
.btn-danger:hover{background:rgba(220,38,38,.08);border-color:var(--redhi);}
.btn-full{width:100%;justify-content:center;height:40px;font-size:.89rem;}

/* ── AUTH ── */
.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#000;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:432px;overflow:hidden;box-shadow:var(--shadow-pop);}
.auth-hdr{padding:28px 30px 20px;border-bottom:1px solid var(--border);}
.auth-hdr-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.auth-hdr-mark{width:34px;height:34px;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#fff;display:flex;align-items:center;justify-content:center;}
.auth-hdr-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.auth-hdr h2{font-size:1.26rem;font-weight:700;letter-spacing:-.02em;}
.auth-hdr p{font-size:.88rem;color:var(--tx3);margin-top:5px;}
.auth-body{padding:24px 30px;display:flex;flex-direction:column;gap:15px;}
.auth-foot{padding:17px 30px;border-top:1px solid var(--border);font-size:.83rem;color:var(--tx3);text-align:center;}
.auth-foot a{color:var(--tx);text-decoration:none;cursor:pointer;font-weight:600;}
.auth-foot a:hover{text-decoration:underline;}
.auth-err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:10px 12px;font-size:.83rem;color:var(--redhi);display:none;}
.auth-err.show{display:block;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:2px 0;}
.auth-divider span{font-size:.75rem;color:var(--tx3);white-space:nowrap;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-google-btn{width:100%;height:42px;background:var(--panel);border:1px solid var(--border2);color:var(--tx2);border-radius:var(--r);font-family:var(--font);font-size:.87rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .13s;}
.auth-google-btn:hover{border-color:var(--borderhi);color:var(--tx);background:var(--panel2);}
.auth-google-btn svg{flex-shrink:0;}
label.lbl{display:block;font-size:.73rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:6px;}
input.inp,textarea.inp{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.92rem;padding:0 12px;height:40px;border-radius:var(--r);outline:none;transition:border-color .13s,box-shadow .13s;-webkit-appearance:none;}
input.inp:focus,textarea.inp:focus{border-color:var(--borderhi);box-shadow:0 0 0 3px rgba(255,255,255,.05);}
input.inp::placeholder,textarea.inp::placeholder{color:var(--tx3);}

/* ── CHAT ── */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chat-scroll{flex:1;overflow-y:auto;}
.chat-inner{max-width:920px;margin:0 auto;padding:40px 28px 20px;display:flex;flex-direction:column;gap:34px;}
.msg{display:flex;flex-direction:column;gap:8px;max-width:100%;}
.msg-user{align-items:flex-end;}
.msg-bot{align-items:flex-start;}
.msg-bubble{border-radius:var(--r-lg);padding:14px 19px;font-size:1.02rem;line-height:1.7;}
.msg-user .msg-bubble{background:var(--panel2);border:1px solid var(--border2);color:var(--tx);max-width:75%;box-shadow:var(--shadow-sm);}
.msg-user-img{max-width:260px;border-radius:var(--r-lg);border:1px solid var(--border2);margin-bottom:2px;display:block;}
.msg-bot .msg-bubble{background:transparent;color:var(--tx);padding:2px 2px;max-width:100%;}
.msg-bubble p{margin:0 0 12px;}
.msg-bubble p:last-child{margin-bottom:0;}
.msg-bubble strong{color:var(--white);font-weight:600;}
.msg-bubble em{font-style:italic;}
.msg-bubble code{font-family:var(--mono);font-size:.9em;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:#d0d0d0;}
.msg-bubble ul,.msg-bubble ol{margin:0 0 12px;padding-left:24px;}
.msg-bubble li{margin-bottom:4px;}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{font-weight:700;margin:18px 0 10px;letter-spacing:-.01em;}
.msg-bubble h1{font-size:1.27rem;}
.msg-bubble h2{font-size:1.16rem;}
.msg-bubble h3{font-size:1.06rem;}
.msg-bubble h1:first-child,.msg-bubble h2:first-child,.msg-bubble h3:first-child{margin-top:0;}
.msg-bubble hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.msg-bubble table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:.95rem;border-radius:var(--r);overflow:hidden;}
.msg-bubble th,.msg-bubble td{border:1px solid var(--border2);padding:8px 12px;text-align:left;}
.msg-bubble th{background:var(--panel2);font-weight:600;color:var(--tx);}
.msg-bubble a{color:#9fc7ff;text-decoration:underline;text-underline-offset:2px;}

.code-block{position:relative;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-md);margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow-sm);}
.code-block-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px 9px 17px;background:var(--panel2);border-bottom:1px solid var(--border);}
.code-block-lang{font-family:var(--mono);font-size:.79rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;}
.code-block-actions{display:flex;gap:4px;}
.code-action-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--tx2);font-size:.79rem;font-family:var(--font);font-weight:500;padding:6px 11px;border-radius:6px;transition:all .13s;}
.code-action-btn:hover{background:var(--panel);border-color:var(--border2);color:var(--tx);}
.code-action-btn svg{flex-shrink:0;}
.code-action-btn.copied{color:#9fe0b8;}
.code-block pre{background:transparent;border:none;border-radius:0;padding:16px 18px;overflow-x:auto;margin:0;}
.code-block pre code{background:none;border:none;padding:0;font-size:.87rem;line-height:1.7;color:var(--tx2);font-family:var(--mono);}

.msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
.msg:hover .msg-actions{opacity:1;}
.msg-action-btn{width:31px;height:31px;border-radius:7px;background:transparent;border:none;color:var(--tx3);display:flex;align-items:center;justify-content:center;transition:all .13s;}
.msg-action-btn:hover{background:var(--panel2);color:var(--tx);}
.msg-action-btn svg{pointer-events:none;}
.msg-role-icon{width:25px;height:25px;border-radius:6px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.msg-role-icon img{width:100%;height:100%;object-fit:contain;display:block;}
.msg-bot-hdr{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.msg-bot-hdr span{font-size:.82rem;font-weight:600;color:var(--tx3);}

.thinking-dots{display:grid;grid-template-columns:repeat(3,3px);grid-template-rows:repeat(3,3px);gap:2px;padding:6px 2px;}
.thinking-dots span{width:3px;height:3px;border-radius:1px;background:var(--border2);animation:dotpulse 1.4s infinite ease-in-out;}
.thinking-dots span:nth-child(1){animation-delay:0s;}
.thinking-dots span:nth-child(2){animation-delay:.07s;}
.thinking-dots span:nth-child(3){animation-delay:.14s;}
.thinking-dots span:nth-child(4){animation-delay:.07s;}
.thinking-dots span:nth-child(5){animation-delay:.14s;}
.thinking-dots span:nth-child(6){animation-delay:.21s;}
.thinking-dots span:nth-child(7){animation-delay:.14s;}
.thinking-dots span:nth-child(8){animation-delay:.21s;}
.thinking-dots span:nth-child(9){animation-delay:.28s;}
@keyframes dotpulse{
  0%,60%,100%{background:var(--border2);transform:scale(1);}
  30%{background:#e8e8e8;transform:scale(1.15);}
}

.suggestions{display:flex;flex-direction:column;gap:2px;margin-top:8px;}
.sugg-item{display:flex;align-items:center;gap:9px;padding:9px 6px;color:var(--tx2);font-size:.94rem;cursor:pointer;border-radius:var(--r);transition:all .13s;width:fit-content;}
.sugg-item:hover{color:var(--tx);background:var(--panel);}
.sugg-item svg{flex-shrink:0;opacity:.6;}

.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:40px;}
.empty-chat-brand{display:flex;align-items:center;gap:16px;margin-bottom:40px;}
.empty-chat-mark{height:64px;flex-shrink:0;display:flex;align-items:center;}
.empty-chat-mark img{height:100%;width:auto;object-fit:contain;display:block;}
.empty-composer-wrap{width:100%;max-width:780px;}

.composer-wrap{border-top:1px solid var(--border);padding:20px 24px 22px;flex-shrink:0;background:#000;}
.composer-wrap.floating{border-top:none;background:transparent;padding:0;}
.composer-inner{max-width:920px;margin:0 auto;}
.composer{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-xl);display:flex;flex-direction:column;padding:14px 16px;transition:border-color .13s,box-shadow .13s;}
.composer:focus-within{border-color:var(--borderhi);box-shadow:0 0 0 3px rgba(255,255,255,.04);}
.composer-image-preview{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r-md);padding:8px 10px;width:fit-content;}
.composer-image-preview img{width:42px;height:42px;object-fit:cover;border-radius:6px;}
.composer-image-preview span{font-size:.81rem;color:var(--tx2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.composer-image-remove{width:23px;height:23px;border-radius:5px;background:transparent;border:none;color:var(--tx3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.composer-image-remove:hover{background:rgba(220,38,38,.15);color:var(--redhi);}
.composer-row{display:flex;align-items:flex-end;gap:10px;}
.composer textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--tx);font-family:var(--font);font-size:1.02rem;line-height:1.5;max-height:200px;padding:8px 3px;}
.composer textarea::placeholder{color:var(--tx3);}
.composer-attach-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid var(--border2);color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.composer-attach-btn:hover{background:var(--panel2);color:var(--tx);border-color:var(--borderhi);}
.composer-attach-btn.disabled{opacity:.35;cursor:not-allowed;}

.mode-select{position:relative;flex-shrink:0;}
.mode-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--tx2);padding:0 13px;height:38px;border-radius:var(--r-full);font-size:.86rem;font-weight:500;transition:all .13s;}
.mode-btn:hover{background:var(--panel2);color:var(--tx);border-color:var(--borderhi);}
.mode-menu{position:fixed;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);min-width:250px;padding:6px;display:none;z-index:500;}
.mode-menu.open{display:block;}
.mode-opt{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:var(--r);cursor:pointer;transition:all .13s;}
.mode-opt:hover{background:var(--panel);}
.mode-opt-txt strong{display:block;font-size:.89rem;font-weight:600;color:var(--tx);}
.mode-opt-txt small{font-size:.79rem;color:var(--tx3);}
.mode-opt-check{opacity:0;flex-shrink:0;margin-top:2px;}
.mode-opt.selected .mode-opt-check{opacity:1;}

.composer-send{
  width:38px;height:38px;border-radius:50%;
  border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .13s,color .13s,transform .13s;
  background:var(--panel2);
  color:var(--tx3);
}
.composer-send:not(:disabled){
  background:var(--white);
  color:var(--wfg);
}
.composer-send:not(:disabled):hover{opacity:.85;transform:scale(1.04);}
.composer-send:disabled{cursor:not-allowed;}
.composer-send-spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--tx);border-radius:50%;animation:composer-send-spin .6s linear infinite;display:block;}
@keyframes composer-send-spin{to{transform:rotate(360deg)}}
.composer-hint{text-align:center;font-size:.77rem;color:var(--tx3);margin-top:11px;}
.err-banner{max-width:920px;margin:0 auto 10px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:10px 14px;font-size:.85rem;color:var(--redhi);}

#app-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:.83rem;color:var(--tx3);}
#app-loading.hidden{display:none;}
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--tx);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

footer{padding:8px 20px;font-size:.77rem;color:var(--tx3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);}
footer strong{color:var(--tx2);font-weight:500;}
footer .dot{color:var(--borderhi);}

@media(max-width:720px){
  .sidebar{position:fixed;left:0;top:var(--nav-h);bottom:0;z-index:90;box-shadow:2px 0 24px rgba(0,0,0,.55);}
  .sidebar.collapsed{margin-left:-284px;}
  .msg-user .msg-bubble{max-width:88%;}
  .empty-chat-mark{height:48px;}
  .chat-inner{padding:26px 16px 16px;}
}
</style>
</head>
<body>

<div id="app-loading"><div class="spin"></div><span>Loading…</span></div>

<nav id="main-nav" style="display:none;">
  <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle sidebar">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
  </button>
  <div class="nav-brand">
    <div class="nav-mark"><img src="https://htmltools.me/logo3.png" alt="HTMLTools"/></div>
    <span class="nav-name">Grok</span>
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-user">
    <span class="nav-user-email" id="nav-email"></span>
    <button class="btn btn-danger" id="signout-btn" style="height:32px;font-size:.81rem;">Sign out</button>
  </div>
</nav>

<!-- AUTH PAGE -->
<div id="auth-page" style="display:none;flex:1;overflow:hidden;">
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-hdr">
        <div class="auth-hdr-brand">
          <div class="auth-hdr-mark"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/grok-icon.png" alt="Grok"/></div>
          <span style="font-size:.92rem;font-weight:600;color:var(--tx2);">Grok</span>
        </div>
        <h2 id="auth-title">Sign in</h2>
        <p id="auth-subtitle">Continue to your conversations</p>
      </div>
      <div class="auth-body">
        <div class="auth-err" id="auth-err"></div>
        <button class="auth-google-btn" id="google-signin-btn">

// ── MARKDOWN RENDERER ──
var _codeStore = {};
var _codeStoreSeq = 0;

function renderMarkdown(src) {
  if (!src) return '';

  var codeBlocks = [];
  var withoutCode = src.replace(/```([a-zA-Z0-9+#]*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    var idx = codeBlocks.length;
    codeBlocks.push({ lang: (lang || '').toLowerCase(), code: code.replace(/\n$/, '') });
    return '\u0000CODEBLOCK' + idx + '\u0000';
  });

  var text = esc(withoutCode);
  text = text.replace(/&lt;br\s*\/?&gt;/gi, '\n');

  var lines = text.split('\n');
  var html = [];
  var i = 0;
  var inList = null;
  var tableBuf = [];

  function closeList() {
    if (inList) { html.push('</' + inList + '>'); inList = null; }
  }
  function flushTable() {
    if (!tableBuf.length) return;
    var rows = tableBuf.filter(function(r){ return !/^\s*\|?[\s:|-]+\|?\s*$/.test(r); });
    var out = '<table>';
    rows.forEach(function(r, ri) {
      var cells = r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){ return inlineFmt(c.trim()); });
      out += '<tr>' + cells.map(function(c){ return (ri===0?'<th>':'<td>') + c + (ri===0?'</th>':'</td>'); }).join('') + '</tr>';
    });
    out += '</table>';
    html.push(out);
    tableBuf = [];
  }
  function inlineFmt(s) {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  for (i = 0; i < lines.length; i++) {
    var line = lines[i];

    var cbMatch = line.trim().match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if (cbMatch) {
      closeList(); flushTable();
      var idx = parseInt(cbMatch[1]);
      html.push(renderCodeBlock(codeBlocks[idx].lang, codeBlocks[idx].code));
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line)) {
      tableBuf.push(line);
      continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (/^\s*---+\s*$/.test(line) || /^\s*\*\*\*+\s*$/.test(line)) {
      closeList();
      html.push('<hr>');
      continue;
    }

    var h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      closeList();
      var lvl = h[1].length;
      html.push('<h' + lvl + '>' + inlineFmt(h[2]) + '</h' + lvl + '>');
      continue;
    }

    var ol = line.match(/^\s*\d+\.\s+(.*)$/);
    var ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); html.push('<ol>'); inList = 'ol'; }
      html.push('<li>' + inlineFmt(ol[1]) + '</li>');
      continue;
    }
    if (ul) {
      if (inList !== 'ul') { closeList(); html.push('<ul>'); inList = 'ul'; }
      html.push('<li>' + inlineFmt(ul[1]) + '</li>');
      continue;
    }
    closeList();

    if (line.trim() === '') {
      html.push('');
      continue;
    }

    html.push('<p>' + inlineFmt(line) + '</p>');
  }
  closeList(); flushTable();

  return html.filter(function(l){ return l !== ''; }).join('\n');
}

function renderCodeBlock(lang, code) {
  var storeId = 'cb' + (_codeStoreSeq++);
  _codeStore[storeId] = code;
  var ext = LANG_EXT[lang] || (lang ? lang : 'txt');
  var label = lang ? lang : 'text';
  return (
    '<div class="code-block" data-store-id="'+storeId+'">' +
      '<div class="code-block-hdr">' +
        '<span class="code-block-lang">'+esc(label)+'</span>' +
        '<div class="code-block-actions">' +
          '<button class="code-action-btn code-copy-btn" data-store-id="'+storeId+'" title="Copy">' +
            ICON_COPY +
            '<span>Copy</span>' +
          '</button>' +
          '<button class="code-action-btn code-download-btn" data-store-id="'+storeId+'" data-ext="'+esc(ext)+'" title="Download">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            '<span>Download</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<pre><code>' + esc(code) + '</code></pre>' +
    '</div>'
  );
}

function userPath() { return 'grok_users/' + currentUser.uid + '/conversations'; }

async function loadConversations() {
  try {
    var snap = await db.ref(userPath()).get();
    conversations = [];
    if (snap.exists()) snap.forEach(function(c){
      var v = c.val();
      v.messages = v.messages || [];
      conversations.push(v);
    });
    conversations.sort(function(a,b){ return (b.updated||b.created||0)-(a.updated||a.created||0); });
    renderSidebar();
    showEmptyChat();
  } catch(e) { console.error('Failed to load conversations', e); }
}

async function persistConversation(conv) {
  var toSave = {
    id: conv.id,
    title: conv.title || 'New chat',
    messages: conv.messages || [],
    created: conv.created || Date.now(),
    updated: Date.now(),
    uid: currentUser.uid
  };
  await db.ref(userPath() + '/' + conv.id).set(toSave);
  var i = conversations.findIndex(function(c){return c.id===conv.id;});
  if (i>=0) conversations[i]=toSave; else conversations.unshift(toSave);
  conversations.sort(function(a,b){ return (b.updated||b.created||0)-(a.updated||a.created||0); });
  return toSave;
}

  if (!items.length) { list.innerHTML='<div class="sb-empty">No conversations yet.</div>'; return; }
  list.innerHTML = items.map(function(c){
    return '<div class="sb-conv'+(c.id===activeConvId?' active':'')+'" data-id="'+c.id+'">' +
      '<span class="sb-conv-name">'+esc(c.title||'New chat')+'</span>' +
      '<button class="sb-conv-del" data-id="'+c.id+'" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.sb-conv').forEach(function(el){
    el.addEventListener('click', function(e){
      if (e.target.closest('.sb-conv-del')) return;
      var c = conversations.find(function(x){return x.id===el.dataset.id;});
      if (c) { activeConvId=c.id; renderSidebar(); showConversation(c); }
    });
  });
  list.querySelectorAll('.sb-conv-del').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      var id = btn.dataset.id;
      if (!confirm('Delete this conversation?')) return;
      try {
        await db.ref(userPath()+'/'+id).remove();
        conversations = conversations.filter(function(c){return c.id!==id;});
        if (activeConvId === id) { activeConvId = null; showEmptyChat(); }
        renderSidebar();
      } catch(err) { console.error(err); }
    });
  });
}

// ── COMPOSER (shared, moved between empty-state and bottom-bar) ──
//
// ROOT CAUSE OF THE BROKEN SEND BUTTON (fixed here):
// Both the empty-state composer slot (#empty-composer-slot) and the
// bottom-of-chat composer slot (#composer-mount-bottom) can render a
// composer cloned from the same <template>, and every clone reuses the
// SAME ids (id="composer-input", id="composer-send", etc). If both slots
// ever contain a composer at the same time — which used to happen because
// switching from the empty state to a conversation only *hid* the empty
// state via CSS instead of clearing its contents — then the document has
// two elements with id="composer-send" simultaneously. wireComposer()
// always looks elements up via document.getElementById(), which returns
// whichever matching element comes FIRST in the DOM. Since the empty
// composer slot sits earlier in the markup than the bottom composer slot,
// wireComposer() kept wiring click/keydown listeners onto the invisible,
// orphaned composer instead of the one actually on screen — so clicking
// the visible Send button did nothing.
//
// Fix: mountComposer() always fully owns its target slot, and we now make
// sure the *other* slot is emptied out any time we mount into one of them
// (see mountComposerBottom() and showEmptyChat() below), so there is only
// ever a single #composer-input / #composer-send pair in the document.
function mountComposer(targetEl) {
  var tpl = document.getElementById('composer-template');
  var node = tpl.content.cloneNode(true);
  targetEl.innerHTML = '';
  targetEl.appendChild(node);
  wireComposer();
}

function wireComposer() {
  var composerInput = document.getElementById('composer-input');
  var composerSend  = document.getElementById('composer-send');
  var attachBtn     = document.getElementById('composer-attach-btn');
  var fileInput     = document.getElementById('composer-file-input');
  var imgPreview    = document.getElementById('composer-image-preview');
  var imgThumb      = document.getElementById('composer-image-thumb');
  var imgName       = document.getElementById('composer-image-name');
  var imgRemove     = document.getElementById('composer-image-remove');
  var modeBtn       = document.getElementById('mode-btn');
  var modeMenu      = document.getElementById('mode-menu');
  var modeLabel     = document.getElementById('mode-btn-label');

  function refreshSendState() {
    if (!composerInput || !composerSend) return;
    var hasText = composerInput.value.trim().length > 0;
    // Deliberately does NOT factor in isSending. The button's enabled/
    // disabled state now only ever reflects "is there something to
    // send" — nothing else. Double-submission is prevented separately,
    // inside sendMessage() itself, so a stray isSending flag can never
    // leave this button stuck.
    composerSend.disabled = !hasText && !pendingImage;
  }

  ['input','keyup','paste','cut','change'].forEach(function(evt){
    composerInput.addEventListener(evt, function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
      refreshSendState();
    });
  });

  // Enter-to-send no longer depends on the button's disabled attribute —
  // it checks the live textarea value / pendingImage / isSending directly,
  // so a stale disabled flag on the button can never block sending.
  composerInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isSending && (this.value.trim() || pendingImage)) sendMessage();
    }
  });
  composerSend.addEventListener('click', function() {
    if (!isSending && (composerInput.value.trim() || pendingImage)) sendMessage();
  });

  attachBtn.addEventListener('click', function() {
    if (pendingImage) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', function() {
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      pendingImage = {
        base64: reader.result.split(',')[1],
        mediaType: file.type,
        name: file.name,
        dataUrl: reader.result
      };
      imgThumb.src = reader.result;
      imgName.textContent = file.name;
      imgPreview.style.display = 'flex';
      attachBtn.classList.add('disabled');
      refreshSendState();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });
  imgRemove.addEventListener('click', function() {
    pendingImage = null;
    imgPreview.style.display = 'none';
    attachBtn.classList.remove('disabled');
    refreshSendState();
  });

  function positionModeMenu() {
    var r = modeBtn.getBoundingClientRect();
    var menuWidth = 250;
    var gap = 8;
    var left = r.right - menuWidth;
    if (left < 8) left = 8;
    modeMenu.style.left = left + 'px';
    modeMenu.style.bottom = (window.innerHeight - r.top + gap) + 'px';
    modeMenu.style.top = 'auto';
  }

  modeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    var willOpen = !modeMenu.classList.contains('open');
    if (willOpen) positionModeMenu();
    modeMenu.classList.toggle('open', willOpen);
  });
  // These listeners were previously attached fresh to `document`/`window`
  // on every wireComposer() call (i.e. every remount) and never removed,
  // stacking up duplicates over a long session. Scope them to this mount
  // via AbortController so old ones are cleaned up automatically.
  if (window.__composerAbort) {
    try { window.__composerAbort.abort(); } catch(e) {}
  }
  var composerAbort = new AbortController();
  window.__composerAbort = composerAbort;

  document.addEventListener('click', function() { modeMenu.classList.remove('open'); }, { signal: composerAbort.signal });
  window.addEventListener('resize', function(){ modeMenu.classList.remove('open'); }, { signal: composerAbort.signal });
  window.addEventListener('scroll', function(){ modeMenu.classList.remove('open'); }, { signal: composerAbort.signal, capture: true });
  modeMenu.addEventListener('click', function(e){ e.stopPropagation(); }, { signal: composerAbort.signal });
  modeMenu.querySelectorAll('.mode-opt').forEach(function(opt) {
    opt.addEventListener('click', function(e) {
      e.stopPropagation();
      currentMode = opt.dataset.mode;
      modeLabel.textContent = opt.querySelector('strong').textContent;
      modeMenu.classList.remove('open');
      updateModeSelection();
    }, { signal: composerAbort.signal });
  });
  updateModeSelection();
  // NOTE: this function must NOT unconditionally reset isSending. It runs
  // on every composer mount, including mid-send (sendMessage() remounts
  // the composer for a brand-new conversation while its request is still
  // in flight). Only sendMessage() should own isSending's lifecycle; here
  // we just sync the button's visual state to whatever isSending already is.
  refreshSendState();
  composerInput.focus();
}

function updateModeSelection() {
  var menu = document.getElementById('mode-menu');
  if (!menu) return;
  menu.querySelectorAll('.mode-opt').forEach(function(opt) {
    opt.classList.toggle('selected', opt.dataset.mode === currentMode);
  });
  var label = document.getElementById('mode-btn-label');
  if (label) {
    var map = { fast: 'Fast', auto: 'Auto', expert: 'Expert' };
    label.textContent = map[currentMode] || 'Fast';
  }
}

// ── CHAT VIEW ──
function showEmptyChat() {
  document.getElementById('empty-chat').style.display = 'flex';
  document.getElementById('chat-inner').style.display = 'none';
  document.getElementById('chat-inner').innerHTML = '';
  document.getElementById('composer-slot-bottom').style.display = 'none';
  // Only clear the composer MOUNT sub-container here, never the whole
  // #composer-slot-bottom wrapper — that wrapper permanently owns
  // #err-banner, and wiping it would delete that node from the document
  // for good (see the big note above mountComposer()).
  var bottomMount = document.getElementById('composer-mount-bottom');
  if (bottomMount) bottomMount.innerHTML = '';
  hideChatError();
  mountComposer(document.getElementById('empty-composer-slot'));
}

function showConversation(conv) {
  document.getElementById('empty-chat').style.display = 'none';
  var inner = document.getElementById('chat-inner');
  inner.style.display = 'flex';
  inner.style.flexDirection = 'column';
  inner.innerHTML = '';
  (conv.messages || []).forEach(function(m) {
    appendMessageEl(m.role, m.content, m.imageDataUrl, null);
  });
  mountComposerBottom();
  scrollChatToBottom();
}

function mountComposerBottom() {
  // Always clear out the empty-state slot first so we never end up with
  // two elements sharing id="composer-input"/"composer-send" at once —
  // that duplicate-id situation was the actual cause of the Send button
  // silently doing nothing (see the note above mountComposer()).
  var emptySlot = document.getElementById('empty-composer-slot');
  if (emptySlot) emptySlot.innerHTML = '';
  document.getElementById('composer-slot-bottom').style.display = 'block';
  mountComposer(document.getElementById('composer-mount-bottom'));
}

function scrollChatToBottom() {
  var sc = document.getElementById('chat-scroll');
  sc.scrollTop = sc.scrollHeight;
}

function buildSuggestionsEl(suggestions) {
  var suggWrap = document.createElement('div');
  suggWrap.className = 'suggestions';
  suggestions.forEach(function(s) {
    var item = document.createElement('div');
    item.className = 'sugg-item';
    item.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg><span>'+esc(s)+'</span>';
    item.addEventListener('click', function() {
      var ci = document.getElementById('composer-input');
      if (!ci) return;
      ci.value = s;
      ci.dispatchEvent(new Event('input'));
      if (!isSending) sendMessage();
    });
    suggWrap.appendChild(item);
  });
  return suggWrap;
}

function appendMessageEl(role, content, imageDataUrl, suggestions) {
  var inner = document.getElementById('chat-inner');
  inner.style.display = 'flex';
  document.getElementById('empty-chat').style.display = 'none';

  var msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-bot');

  if (role === 'assistant') {
    var hdr = document.createElement('div');
    hdr.className = 'msg-bot-hdr';
    hdr.innerHTML = '<div class="msg-role-icon"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/grok-icon.png" alt=""/></div><span>Grok</span>';
    msg.appendChild(hdr);
  }

  if (role === 'user' && imageDataUrl) {
    var img = document.createElement('img');
    img.className = 'msg-user-img';
    img.src = imageDataUrl;
    msg.appendChild(img);
  }

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (content) bubble.innerHTML = renderMarkdown(content);
  msg.appendChild(bubble);

  var actions = document.createElement('div');
  actions.className = 'msg-actions';
  var copyBtn = document.createElement('button');
  copyBtn.className = 'msg-action-btn';
  copyBtn.title = 'Copy';
  copyBtn.innerHTML = ICON_COPY;
  copyBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(content || '').then(function(){
      copyBtn.innerHTML = ICON_CHECK;
      setTimeout(function(){ copyBtn.innerHTML = ICON_COPY; }, 1200);
    }).catch(function(){});
  });
  actions.appendChild(copyBtn);
  msg.appendChild(actions);

  if (role === 'assistant' && suggestions && suggestions.length) {
    msg.appendChild(buildSuggestionsEl(suggestions));
  }

  inner.appendChild(msg);
  return { msg: msg, bubble: bubble };
}

function appendThinkingIndicator() {
  var inner = document.getElementById('chat-inner');
  var msg = document.createElement('div');
  msg.className = 'msg msg-bot';
  msg.id = 'thinking-indicator';
  var dots = '';
  for (var i = 0; i < 9; i++) dots += '<span></span>';
  msg.innerHTML =
    '<div class="msg-bot-hdr"><div class="msg-role-icon"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/grok-icon.png" alt=""/></div><span>Grok</span></div>' +
    '<div class="thinking-dots">'+dots+'</div>';
  inner.appendChild(msg);
  scrollChatToBottom();
}
function removeThinkingIndicator() {
  var el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function streamTextIntoBubble(bubble, fullText, onDone) {
  var words = fullText.split(/(\s+)/);
  var i = 0;
  var acc = '';
  function step() {
    if (i >= words.length) { bubble.innerHTML = renderMarkdown(fullText); if (onDone) onDone(); return; }
    var chunk = 2;
    for (var k = 0; k < chunk && i < words.length; k++, i++) acc += words[i];
    bubble.innerHTML = renderMarkdown(acc);
    scrollChatToBottom();
    setTimeout(step, 28);
  }
  step();
}

function showChatError(text) {
  var el = document.getElementById('err-banner');
  if (!el) return;
  el.textContent = text;
  el.style.display = 'block';
}
function hideChatError() {
  var el = document.getElementById('err-banner');
  if (el) el.style.display = 'none';
}

// ── NEW CHAT ──
document.getElementById('btn-new-chat').addEventListener('click', function() {
  activeConvId = null;
  pendingImage = null;
  isSending = false;
  renderSidebar();
  showEmptyChat();
});

// ── SEND MESSAGE ──
async function sendMessage() {
  if (isSending) return;
  var composerInput = document.getElementById('composer-input');
  var text = composerInput.value.trim();
  if (!text && !pendingImage) return;
  hideChatError();

  var attachedImage = pendingImage;
  pendingImage = null;

  composerInput.value = '';
  composerInput.style.height = 'auto';
  composerInput.dispatchEvent(new Event('input'));
  isSending = true;
  setSendButtonSending(document.getElementById('composer-send'), true);

  var isNewConv = !activeConvId;
  var conv;
  if (isNewConv) {
    conv = {
      id: genId(20),
      title: 'New chat',
      messages: [],
      created: Date.now()
    };
    activeConvId = conv.id;
  } else {
    conv = conversations.find(function(c){ return c.id === activeConvId; });
  }

  var userMsgContent = text || '(image attached)';
  conv.messages.push({ role: 'user', content: userMsgContent, imageDataUrl: attachedImage ? attachedImage.dataUrl : null, ts: Date.now() });

  if (isNewConv) {
    document.getElementById('empty-chat').style.display = 'none';
    document.getElementById('chat-inner').style.display = 'flex';
    document.getElementById('chat-inner').style.flexDirection = 'column';
    mountComposerBottom();
    setSendButtonSending(document.getElementById('composer-send'), true);
  }

  appendMessageEl('user', userMsgContent, attachedImage ? attachedImage.dataUrl : null, null);
  scrollChatToBottom();
  appendThinkingIndicator();

  try {
    try {
      conv = await withTimeout(persistConversation(conv), 8000, 'Save timed out');
    } catch(e) {
      // Don't let a hung/slow Firebase write block sending the message —
      // this previously could leave isSending stuck true (and the send
      // button permanently disabled) if the write never resolved.
      console.error('Save failed', e);
    }
    renderSidebar();

    var history = conv.messages.map(function(m){ return { role: m.role, content: m.content }; });
    var needsTitle = conv.messages.filter(function(m){return m.role==='user';}).length === 1;

    var payload = {
      messages: history,
      mode: currentMode,
      needsTitle: needsTitle
    };
    if (attachedImage) {
      payload.imageBase64 = attachedImage.base64;
      payload.imageMediaType = attachedImage.mediaType;
    }

    var res = await withTimeout(
      fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }),
      45000,
      'The request timed out. The assistant may be slow to respond right now — please try again.'
    );
    var data = await res.json();
    removeThinkingIndicator();

    if (!res.ok || data.error) {
      showChatError(typeof data.error === 'string' ? data.error : ('Request failed (' + res.status + ')'));
      return;
    }

    var reply = data.reply || '';
    var suggestions = data.suggestions || [];
    if (!reply) {
      showChatError('The assistant returned an empty response. Try again.');
      return;
    }

    if (needsTitle && data.title) {
      conv.title = data.title;
    }

    conv.messages.push({ role: 'assistant', content: reply, ts: Date.now() });

    var built = appendMessageEl('assistant', '', null, null);
    scrollChatToBottom();
    streamTextIntoBubble(built.bubble, reply, function() {
      if (suggestions && suggestions.length) {
        built.msg.appendChild(buildSuggestionsEl(suggestions));
        scrollChatToBottom();
      }
    });

    try {
      conv = await withTimeout(persistConversation(conv), 8000, 'Save timed out');
    } catch(e) {
      console.error('Save failed', e);
    }
    renderSidebar();
  } catch(err) {
    removeThinkingIndicator();
    showChatError('Network error: ' + (err && err.message ? err.message : String(err)));
  } finally {
    // This is now UNCONDITIONAL — it runs no matter which branch above
    // executed (success, API error, empty reply, timeout, or thrown
    // exception), so the send button can never be left stuck again.
    isSending = false;
    var liveInput = document.getElementById('composer-input');
    var liveSend = document.getElementById('composer-send');
    setSendButtonSending(liveSend, false);
    refreshSendStateFor(liveInput, liveSend);
  }
}

var SEND_ARROW_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';

function setSendButtonSending(sendEl, sending) {
  if (!sendEl) return;
  if (sending) {
    sendEl.disabled = true;
    sendEl.innerHTML = '<span class="composer-send-spinner"></span>';
  } else {
    sendEl.innerHTML = SEND_ARROW_ICON;
  }
}

function refreshSendStateFor(inputEl, sendEl) {
  if (!inputEl || !sendEl) return;
  sendEl.disabled = !(inputEl.value.trim() || pendingImage);
}
