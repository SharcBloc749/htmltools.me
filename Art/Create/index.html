<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Art — HTMLTools</title>
<link rel="icon" type="image/png" href="/logo3.png?v=2"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0c;--surface:#111;--panel:#171717;--panel2:#1e1e1e;
  --border:#252525;--border2:#2e2e2e;--borderhi:#404040;
  --tx:#e8e8e8;--tx2:#888;--tx3:#4a4a4a;
  --white:#fff;--wfg:#0c0c0c;
  --green:#16a34a;--greenhi:#22c55e;
  --red:#dc2626;--redhi:#ef4444;
  --r:4px;--r-md:7px;--r-lg:10px;--r-xl:14px;
  --nav-h:48px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden;}
body{display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* NAV */
nav{height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:7px;padding-right:10px;margin-right:2px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:24px;height:24px;border-radius:5px;overflow:hidden;flex-shrink:0;}
.nav-mark img{width:24px;height:24px;object-fit:contain;display:block;}
.nav-name{font-size:.78rem;font-weight:600;color:var(--tx2);white-space:nowrap;}
@media(max-width:560px){.nav-name{display:none;}}
.room-name-wrap{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
.room-name{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.room-badge{font-family:var(--mono);font-size:.6rem;padding:2px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--border2);color:var(--tx3);flex-shrink:0;white-space:nowrap;}
.room-badge.public{color:var(--greenhi);border-color:rgba(34,197,94,.25);}
.room-badge.private{color:#fbbf24;border-color:rgba(202,138,4,.25);}
.nav-spacer{flex:1;}
.presence-stack{display:flex;align-items:center;margin-right:4px;}
.presence-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);margin-left:-7px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0;}
.presence-dot:first-child{margin-left:0;}
.btn{background:var(--panel);border:1px solid var(--border2);color:var(--tx2);padding:0 10px;border-radius:var(--r);font-size:12px;font-weight:500;font-family:var(--font);transition:all .13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:28px;}
.btn:hover{background:var(--panel2);border-color:var(--borderhi);color:var(--tx);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-prim{background:var(--white);color:var(--wfg);border-color:var(--white);font-weight:600;}
.btn-prim:hover{opacity:.88;background:var(--white);color:var(--wfg);border-color:var(--white);}
.btn-icon{width:28px;padding:0;justify-content:center;}
.btn-sm{height:25px;font-size:11px;padding:0 8px;}

/* LAYOUT */
.workspace{flex:1;display:flex;min-height:0;overflow:hidden;position:relative;}
.canvas-area{flex:1;position:relative;overflow:hidden;background:
  linear-gradient(45deg,#1a1a1a 25%,transparent 25%),
  linear-gradient(-45deg,#1a1a1a 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#1a1a1a 75%),
  linear-gradient(-45deg,transparent 75%,#1a1a1a 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0px;background-color:#141414;
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
#draw-canvas,#cursor-canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;}
#cursor-canvas{pointer-events:none;}

/* TOOLBAR (bottom floating, both modes) */
.toolbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);padding:7px;display:flex;align-items:center;gap:5px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:50;max-width:94vw;overflow-x:auto;}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0;}
.tb-btn{width:32px;height:32px;border-radius:var(--r-md);background:transparent;border:1px solid transparent;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;font-size:.85rem;}
.tb-btn:hover{background:var(--panel);color:var(--tx);}
.tb-btn.active{background:var(--white);color:var(--wfg);}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;transition:transform .1s;cursor:pointer;}
.swatch:hover{transform:scale(1.1);}
.swatch.active{border-color:var(--white);transform:scale(1.12);}
.custom-color-wrap{position:relative;width:26px;height:26px;flex-shrink:0;}
.custom-color-wrap input[type=color]{position:absolute;inset:0;width:100%;height:100%;border:none;padding:0;border-radius:50%;cursor:pointer;background:transparent;}
.size-pop{display:flex;align-items:center;gap:6px;padding:0 6px;}
.size-pop input[type=range]{width:70px;accent-color:var(--white);}
.size-label{font-family:var(--mono);font-size:10px;color:var(--tx3);min-width:20px;text-align:center;}

/* SIDEBAR (color palette for pixel mode / layers info) */
.side-panel{width:0;background:var(--surface);border-left:1px solid var(--border);flex-shrink:0;overflow:hidden;transition:width .18s;display:flex;flex-direction:column;}
.side-panel.open{width:230px;}
.side-panel-inner{padding:14px;display:flex;flex-direction:column;gap:14px;width:230px;overflow-y:auto;flex:1;}
.sp-title{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);}
.palette-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.palette-grid .swatch{width:100%;height:0;padding-bottom:100%;border-radius:6px;}
.chat-box{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:80px;max-height:180px;}
.chat-msg{font-size:.72rem;line-height:1.5;}
.chat-msg b{color:var(--tx2);}
.chat-input-row{display:flex;gap:5px;}
.chat-input-row input{flex:1;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-size:.75rem;padding:0 8px;height:28px;border-radius:var(--r);outline:none;}

.mobile-panel-toggle{display:none;}
@media(max-width:820px){
  .side-panel{position:fixed;right:0;top:var(--nav-h);bottom:0;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.5);}
  .mobile-panel-toggle{display:flex;}
}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);width:100%;max-width:400px;overflow:hidden;animation:pop .16s cubic-bezier(.22,1,.36,1);}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.modal-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-hdr h3{font-size:.85rem;font-weight:600;}
.modal-close-btn{background:transparent;border:none;color:var(--tx3);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:3px;line-height:1;}
.modal-close-btn:hover{color:var(--tx);background:var(--panel);}
.modal-body{padding:14px;display:flex;flex-direction:column;gap:11px;}
.modal-foot{padding:9px 14px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end;}
label.lbl{display:block;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:4px;}
input.inp{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.82rem;padding:0 9px;height:32px;border-radius:var(--r);outline:none;}
input.inp:focus{border-color:var(--borderhi);}
.size-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.size-tile{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px;cursor:pointer;transition:all .13s;text-align:center;}
.size-tile:hover{border-color:var(--borderhi);}
.size-tile.active{border-color:var(--white);background:var(--panel2);}
.size-tile b{display:block;font-size:.8rem;}
.size-tile span{font-size:.65rem;color:var(--tx3);}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border2);padding:7px 14px;border-radius:var(--r-md);font-size:.78rem;font-weight:500;z-index:9999;opacity:0;transition:all .2s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#app-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:.75rem;color:var(--tx3);}
#app-loading.hidden{display:none;}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--tx3);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app-loading"><div class="spin"></div><span>Loading room…</span></div>

<nav>
  <div class="nav-brand">
    <a href="/Art"><div class="nav-mark"><img src="https://htmltools.me/logo3.png" alt="HT"/></div></a>
    <span class="nav-name">Art</span>
  </div>
  <div class="room-name-wrap">
    <span class="room-name" id="room-name-label">Loading…</span>
    <span class="room-badge" id="room-badge"></span>
  </div>
  <div class="nav-spacer"></div>
  <div class="presence-stack" id="presence-stack"></div>
  <button class="btn btn-icon" id="btn-share" title="Share"><i class="fas fa-link"></i></button>
  <button class="btn btn-icon mobile-panel-toggle" id="btn-panel-toggle" title="Palette & chat"><i class="fas fa-palette"></i></button>
  <button class="btn btn-icon" id="btn-download" title="Download PNG"><i class="fas fa-download"></i></button>
</nav>

<div class="workspace">
  <div class="canvas-area" id="canvas-area">
    <canvas id="draw-canvas"></canvas>
    <canvas id="cursor-canvas"></canvas>

    <div class="toolbar" id="toolbar">
      <!-- populated per mode -->
    </div>
  </div>

  <div class="side-panel" id="side-panel">
    <div class="side-panel-inner">
      <div>
        <div class="sp-title" style="margin-bottom:8px;">Palette</div>
        <div class="palette-grid" id="palette-grid"></div>
      </div>
      <div class="chat-box">
        <div class="sp-title">Room chat</div>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Say something…" maxlength="200"/>
          <button class="btn btn-sm" id="chat-send">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NEW ROOM SETUP MODAL (pixel size etc) -->
<div class="modal-bg" id="setup-modal">
  <div class="modal">
    <div class="modal-hdr"><h3>Set up your room</h3></div>
    <div class="modal-body">
      <div>
        <label class="lbl">Room name</label>
        <input class="inp" type="text" id="setup-name" placeholder="My drawing"/>
      </div>
      <div id="setup-pixel-size">
        <label class="lbl">Grid size</label>
        <div class="size-grid">
          <div class="size-tile" data-size="16"><b>16 &times; 16</b><span>Tiny, chunky pixels</span></div>
          <div class="size-tile active" data-size="32"><b>32 &times; 32</b><span>Classic size</span></div>
          <div class="size-tile" data-size="48"><b>48 &times; 48</b><span>More detail</span></div>
          <div class="size-tile" data-size="64"><b>64 &times; 64</b><span>Large canvas</span></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-prim" id="setup-go" style="width:100%;justify-content:center;">Start drawing</button>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-bg" id="share-modal">
  <div class="modal">
    <div class="modal-hdr"><h3>Share this room</h3><button class="modal-close-btn" data-close="share-modal">&times;</button></div>
    <div class="modal-body">
      <input class="inp" id="share-url" readonly style="font-family:var(--mono);font-size:.72rem;"/>
      <button class="btn btn-prim" id="share-copy" style="width:100%;justify-content:center;height:32px;">Copy link</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ── FIREBASE ──
var FB_CONFIG = {
  apiKey:"AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s",
  authDomain:"website-encryption-htmltools.firebaseapp.com",
  databaseURL:"https://website-encryption-htmltools-default-rtdb.firebaseio.com",
  projectId:"website-encryption-htmltools",
  storageBucket:"website-encryption-htmltools.firebasestorage.app",
  messagingSenderId:"211271935323",
  appId:"1:211271935323:web:1abb9d416087ea89c0e67e"
};
firebase.initializeApp(FB_CONFIG);
var db = firebase.database();
var auth = firebase.auth();

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function genId(len){var chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',s='';var arr=new Uint8Array(len||16);crypto.getRandomValues(arr);for(var i=0;i<len;i++)s+=chars[arr[i]%chars.length];return s;}
var _toastTimer;
function showToast(msg,dur){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){t.classList.remove('show');},dur||2200);}
var USER_COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#06b6d4','#84cc16'];
function colorForUid(uid){var h=0;for(var i=0;i<uid.length;i++)h=uid.charCodeAt(i)+((h<<5)-h);return USER_COLORS[Math.abs(h)%USER_COLORS.length];}

// ── URL PARAMS ──
var params = new URLSearchParams(window.location.search);
var MODE = params.get('mode')==='freehand' ? 'freehand' : 'pixel';
var ROOM_ID = params.get('room') || ('public-'+MODE);
var IS_NEW = params.get('new')==='1';
var VIS = params.get('vis') || 'public';
var ROOM_NAME_PARAM = params.get('name') || 'Untitled';

// ── AUTH (anonymous fallback so everyone can draw) ──
var currentUser = null, myUid = null, myName = 'Guest';
var PALETTE = ['#0c0c0c','#e8e8e8','#ef4444','#f59e0b','#facc15','#22c55e','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#78350f','#78716c','#ffffff','#fde68a','#fca5a5'];

auth.onAuthStateChanged(function(user){
  if(user){
    currentUser=user; myUid=user.uid;
    myName = user.isAnonymous ? ('Guest-'+user.uid.slice(0,4)) : (user.displayName||user.email||'User');
    initRoom();
  }else{
    auth.signInAnonymously().catch(function(e){ showToast('Could not connect: '+e.message); });
  }
});

// ── ROOM STATE ──
var roomData = null;
var GRID = 32; // pixel mode grid size
var canvas = document.getElementById('draw-canvas');
var cursorCanvas = document.getElementById('cursor-canvas');
var ctx = canvas.getContext('2d');
var cctx = cursorCanvas.getContext('2d');

function initRoom(){
  document.getElementById('app-loading').classList.add('hidden');
  document.getElementById('room-name-label').textContent = ROOM_NAME_PARAM;
  var badge = document.getElementById('room-badge');
  badge.textContent = VIS==='public' ? 'Public' : 'Private';
  badge.className = 'room-badge '+VIS;
  document.getElementById('share-url').value = window.location.href;

  if(IS_NEW){
    // Show setup modal to configure before creating
    document.getElementById('setup-name').value = ROOM_NAME_PARAM==='Untitled Room' ? '' : ROOM_NAME_PARAM;
    document.getElementById('setup-pixel-size').style.display = MODE==='pixel' ? 'block' : 'none';
    document.getElementById('setup-modal').classList.add('open');
  } else {
    loadOrCreateRoom();
  }
}

document.querySelectorAll('.size-tile').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.size-tile').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    GRID = parseInt(t.dataset.size);
  });
});

document.getElementById('setup-go').addEventListener('click',function(){
  var name = document.getElementById('setup-name').value.trim() || 'Untitled Room';
  ROOM_NAME_PARAM = name;
  document.getElementById('room-name-label').textContent = name;
  document.getElementById('setup-modal').classList.remove('open');
  createRoom(name);
});

function createRoom(name){
  roomData = {
    id: ROOM_ID, name: name, mode: MODE, visibility: VIS,
    gridSize: MODE==='pixel' ? GRID : null,
    owner: myUid, created: Date.now(), views: 0
  };
  db.ref('art_rooms/'+ROOM_ID).set(roomData).then(function(){
    setupCanvasForMode();
    attachRealtimeListeners();
    startPresence();
  }).catch(function(e){ showToast('Failed to create room.'); });
}

function loadOrCreateRoom(){
  db.ref('art_rooms/'+ROOM_ID).once('value').then(function(snap){
    if(snap.exists()){
      roomData = snap.val();
      MODE = roomData.mode || MODE;
      GRID = roomData.gridSize || 32;
      VIS = roomData.visibility || VIS;
      document.getElementById('room-name-label').textContent = roomData.name || ROOM_NAME_PARAM;
      var badge = document.getElementById('room-badge');
      badge.textContent = VIS==='public' ? 'Public' : 'Private';
      badge.className = 'room-badge '+VIS;
      db.ref('art_rooms/'+ROOM_ID+'/views').transaction(function(v){ return (v||0)+1; });
    } else {
      // public canvas doesn't exist yet - create it
      roomData = { id:ROOM_ID, name:ROOM_NAME_PARAM, mode:MODE, visibility:VIS, gridSize: MODE==='pixel'?GRID:null, owner:myUid, created:Date.now(), views:1 };
      db.ref('art_rooms/'+ROOM_ID).set(roomData);
    }
    setupCanvasForMode();
    attachRealtimeListeners();
    startPresence();
  });
}

// ══════════════════════════ CANVAS SETUP ══════════════════════════
var displayW=0, displayH=0; // CSS pixel size of canvas element
var cellPx=0; // pixel-mode: size of one grid cell in canvas-resolution pixels
var DPR = Math.max(1, window.devicePixelRatio||1);

function setupCanvasForMode(){
  buildToolbar();
  buildPalette();
  sizeCanvasToContainer();
  window.addEventListener('resize', debounce(sizeCanvasToContainer, 150));
  if(MODE==='pixel'){
    initPixelInteractions();
  } else {
    initFreehandInteractions();
  }
  redrawAll();
}

function debounce(fn,ms){var t;return function(){clearTimeout(t);var a=arguments,c=this;t=setTimeout(function(){fn.apply(c,a);},ms);};}

function sizeCanvasToContainer(){
  var area = document.getElementById('canvas-area');
  var maxW = area.clientWidth - 24;
  var maxH = area.clientHeight - 24;

  if(MODE==='pixel'){
    // square canvas, fit within container, resolution = GRID x GRID pixels (1 px per cell) upscaled via CSS
    var side = Math.min(maxW, maxH, 640);
    displayW = side; displayH = side;
    cellPx = displayW / GRID;
    canvas.width = GRID; canvas.height = GRID; // internal resolution = 1px per cell
    canvas.style.width = displayW+'px'; canvas.style.height = displayH+'px';
    cursorCanvas.width = Math.round(displayW*DPR); cursorCanvas.height = Math.round(displayH*DPR);
    cursorCanvas.style.width = displayW+'px'; cursorCanvas.style.height = displayH+'px';
    ctx.imageSmoothingEnabled = false;
  } else {
    // freehand: large fixed logical canvas (1200x800) scaled to fit
    var LOGICAL_W = 1200, LOGICAL_H = 800;
    var scale = Math.min(maxW/LOGICAL_W, maxH/LOGICAL_H, 1);
    displayW = LOGICAL_W*scale; displayH = LOGICAL_H*scale;
    if(canvas.width !== Math.round(LOGICAL_W*DPR)){
      // preserve existing drawing when resizing display (internal buffer stays same resolution)
      var prevData = null;
      if(canvas.width>0){ try{ prevData = ctx.getImageData(0,0,canvas.width,canvas.height);}catch(e){} }
      canvas.width = Math.round(LOGICAL_W*DPR); canvas.height = Math.round(LOGICAL_H*DPR);
      ctx.scale(DPR,DPR);
      ctx.lineCap='round'; ctx.lineJoin='round';
      if(prevData){ /* strokes are replayed from Firebase anyway */ }
    }
    canvas.style.width = displayW+'px'; canvas.style.height = displayH+'px';
    cursorCanvas.width = Math.round(displayW*DPR); cursorCanvas.height = Math.round(displayH*DPR);
    cursorCanvas.style.width = displayW+'px'; cursorCanvas.style.height = displayH+'px';
  }
  redrawAll();
}

// Convert a pointer event to LOGICAL canvas coordinates (0..GRID for pixel, 0..1200/800 for freehand)
function eventToLogicalPoint(e){
  var rect = canvas.getBoundingClientRect(); // CSS box of the canvas element
  var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  var xRatio = (clientX - rect.left) / rect.width;   // 0..1 across the displayed box
  var yRatio = (clientY - rect.top) / rect.height;
  xRatio = Math.min(1, Math.max(0, xRatio));
  yRatio = Math.min(1, Math.max(0, yRatio));
  if(MODE==='pixel'){
    return { x: Math.min(GRID-1, Math.floor(xRatio*GRID)), y: Math.min(GRID-1, Math.floor(yRatio*GRID)) };
  } else {
    return { x: xRatio*1200, y: yRatio*800 };
  }
}

// ══════════════════════════ PIXEL MODE ══════════════════════════
var pixelData = {}; // "x_y" -> color
var currentColor = PALETTE[0];
var isPointerDown = false;

function buildToolbar(){
  var tb = document.getElementById('toolbar');
  if(MODE==='pixel'){
    tb.innerHTML =
      '<div class="custom-color-wrap"><input type="color" id="pixel-color-picker" value="'+currentColor+'"/></div>'+
      '<div class="tb-sep"></div>'+
      '<div id="quick-swatches" style="display:flex;gap:5px;"></div>';
    renderQuickSwatches();
    document.getElementById('pixel-color-picker').addEventListener('input',function(){
      currentColor = this.value;
      renderQuickSwatches();
      highlightPaletteSelection();
    });
  } else {
    tb.innerHTML =
      '<button class="tb-btn active" id="tool-pen" title="Pen"><i class="fas fa-pen"></i></button>'+
      '<button class="tb-btn" id="tool-eraser" title="Eraser"><i class="fas fa-eraser"></i></button>'+
      '<div class="tb-sep"></div>'+
      '<div class="custom-color-wrap"><input type="color" id="fh-color-picker" value="'+currentColor+'"/></div>'+
      '<div class="tb-sep"></div>'+
      '<div class="size-pop"><i class="fas fa-circle" style="font-size:5px;color:var(--tx3)"></i><input type="range" id="brush-size" min="1" max="40" value="6"/><span class="size-label" id="brush-size-label">6</span></div>'+
      '<div class="tb-sep"></div>'+
      '<button class="tb-btn" id="tool-clear" title="Clear canvas"><i class="fas fa-trash"></i></button>';

    document.getElementById('tool-pen').addEventListener('click',function(){ fhTool='pen'; toggleFhTool(); });
    document.getElementById('tool-eraser').addEventListener('click',function(){ fhTool='eraser'; toggleFhTool(); });
    document.getElementById('fh-color-picker').addEventListener('input',function(){ currentColor=this.value; });
    document.getElementById('brush-size').addEventListener('input',function(){ brushSize=parseInt(this.value); document.getElementById('brush-size-label').textContent=brushSize; });
    document.getElementById('tool-clear').addEventListener('click',function(){
      if(confirm('Clear the whole canvas for everyone? This cannot be undone.')){
        db.ref('art_strokes/'+ROOM_ID).remove();
        ctx.clearRect(0,0,canvas.width,canvas.height);
      }
    });
  }
}
function toggleFhTool(){
  document.getElementById('tool-pen').classList.toggle('active', fhTool==='pen');
  document.getElementById('tool-eraser').classList.toggle('active', fhTool==='eraser');
}

function renderQuickSwatches(){
  var el = document.getElementById('quick-swatches');
  if(!el) return;
  var quick = ['#0c0c0c','#e8e8e8','#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];
  el.innerHTML = quick.map(function(c){
    return '<div class="swatch'+(c.toLowerCase()===currentColor.toLowerCase()?' active':'')+'" style="background:'+c+'" data-c="'+c+'"></div>';
  }).join('');
  el.querySelectorAll('.swatch').forEach(function(s){
    s.addEventListener('click',function(){
      currentColor = s.dataset.c;
      document.getElementById('pixel-color-picker').value = currentColor;
      renderQuickSwatches();
      highlightPaletteSelection();
    });
  });
}

function buildPalette(){
  var grid = document.getElementById('palette-grid');
  grid.innerHTML = PALETTE.map(function(c){
    return '<div class="swatch" style="background:'+c+'" data-c="'+c+'" title="'+c+'"></div>';
  }).join('');
  grid.querySelectorAll('.swatch').forEach(function(s){
    s.addEventListener('click',function(){
      currentColor = s.dataset.c;
      if(document.getElementById('pixel-color-picker')) document.getElementById('pixel-color-picker').value = currentColor;
      if(document.getElementById('fh-color-picker')) document.getElementById('fh-color-picker').value = currentColor;
      renderQuickSwatches();
      highlightPaletteSelection();
    });
  });
  highlightPaletteSelection();
}
function highlightPaletteSelection(){
  document.querySelectorAll('#palette-grid .swatch').forEach(function(s){
    s.classList.toggle('active', s.dataset.c.toLowerCase()===currentColor.toLowerCase());
  });
}

function paintPixel(x,y,color,skipRemote){
  var key = x+'_'+y;
  pixelData[key] = color;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
  if(!skipRemote){
    db.ref('art_pixels/'+ROOM_ID+'/'+key).set({ c: color, uid: myUid, ts: firebase.database.ServerValue.TIMESTAMP });
  }
}

function initPixelInteractions(){
  function handleDown(e){
    e.preventDefault();
    isPointerDown = true;
    var p = eventToLogicalPoint(e);
    paintPixel(p.x, p.y, currentColor);
    updateMyCursorFirebase(p.x, p.y, true);
  }
  function handleMove(e){
    var raw = eventToLogicalPoint(e);
    updateMyCursorFirebase(raw.x, raw.y, isPointerDown);
    if(!isPointerDown) return;
    e.preventDefault();
    paintPixel(raw.x, raw.y, currentColor);
  }
  function handleUp(){ isPointerDown = false; }

  canvas.addEventListener('mousedown', handleDown);
  canvas.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleUp);
  canvas.addEventListener('touchstart', handleDown, {passive:false});
  canvas.addEventListener('touchmove', handleMove, {passive:false});
  window.addEventListener('touchend', handleUp);
}

// ══════════════════════════ FREEHAND MODE ══════════════════════════
var fhTool = 'pen';
var brushSize = 6;
var currentStroke = null; // {points:[], color, size, uid}
var allStrokes = {}; // strokeId -> stroke object (for redraw)

function initFreehandInteractions(){
  ctx.lineCap='round'; ctx.lineJoin='round';

  function handleDown(e){
    e.preventDefault();
    isPointerDown = true;
    var p = eventToLogicalPoint(e);
    currentStroke = { points:[[p.x,p.y]], color: fhTool==='eraser' ? '__ERASER__' : currentColor, size: brushSize, uid: myUid, name: myName };
    drawStrokeSegment(currentStroke, p.x, p.y, true);
  }
  function handleMove(e){
    var p = eventToLogicalPoint(e);
    updateMyCursorFirebase(p.x, p.y, isPointerDown);
    if(!isPointerDown || !currentStroke) return;
    e.preventDefault();
    currentStroke.points.push([p.x,p.y]);
    drawStrokeSegment(currentStroke, p.x, p.y, false);
  }
  function handleUp(){
    if(isPointerDown && currentStroke && currentStroke.points.length>0){
      var strokeId = genId(14);
      db.ref('art_strokes/'+ROOM_ID+'/'+strokeId).set({
        points: currentStroke.points, color: currentStroke.color, size: currentStroke.size,
        uid: myUid, name: myName, ts: firebase.database.ServerValue.TIMESTAMP
      });
      allStrokes[strokeId] = currentStroke;
    }
    isPointerDown = false;
    currentStroke = null;
  }

  canvas.addEventListener('mousedown', handleDown);
  canvas.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleUp);
  canvas.addEventListener('touchstart', handleDown, {passive:false});
  canvas.addEventListener('touchmove', handleMove, {passive:false});
  window.addEventListener('touchend', handleUp);
}

function drawStrokeSegment(stroke, x, y, isFirst){
  ctx.lineWidth = stroke.size;
  ctx.globalCompositeOperation = (stroke.color==='__ERASER__') ? 'destination-out' : 'source-over';
  ctx.strokeStyle = (stroke.color==='__ERASER__') ? 'rgba(0,0,0,1)' : stroke.color;
  var pts = stroke.points;
  if(isFirst || pts.length<2){
    ctx.beginPath();
    ctx.arc(x,y,stroke.size/2,0,Math.PI*2);
    ctx.fillStyle = ctx.strokeStyle;
    if(stroke.color!=='__ERASER__') ctx.fill();
    else { ctx.globalCompositeOperation='destination-out'; ctx.fill(); }
  } else {
    var prev = pts[pts.length-2];
    ctx.beginPath();
    ctx.moveTo(prev[0], prev[1]);
    ctx.lineTo(x,y);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFullStroke(stroke){
  if(!stroke.points || stroke.points.length===0) return;
  ctx.lineWidth = stroke.size;
  ctx.globalCompositeOperation = (stroke.color==='__ERASER__') ? 'destination-out' : 'source-over';
  ctx.strokeStyle = (stroke.color==='__ERASER__') ? 'rgba(0,0,0,1)' : stroke.color;
  ctx.fillStyle = ctx.strokeStyle;
  if(stroke.points.length===1){
    ctx.beginPath();
    ctx.arc(stroke.points[0][0], stroke.points[0][1], stroke.size/2, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(stroke.points[0][0], stroke.points[0][1]);
    for(var i=1;i<stroke.points.length;i++) ctx.lineTo(stroke.points[i][0], stroke.points[i][1]);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function redrawAll(){
  if(MODE==='pixel'){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    Object.keys(pixelData).forEach(function(key){
      var parts = key.split('_');
      ctx.fillStyle = pixelData[key];
      ctx.fillRect(parseInt(parts[0]), parseInt(parts[1]), 1, 1);
    });
  } else {
    ctx.clearRect(0,0,canvas.width/DPR,canvas.height/DPR);
    Object.keys(allStrokes).forEach(function(id){ drawFullStroke(allStrokes[id]); });
  }
}

// ══════════════════════════ REALTIME SYNC ══════════════════════════
function attachRealtimeListeners(){
  if(MODE==='pixel'){
    db.ref('art_pixels/'+ROOM_ID).on('child_added', function(snap){
      var key = snap.key, val = snap.val();
      if(!val) return;
      pixelData[key] = val.c;
      var parts = key.split('_');
      ctx.fillStyle = val.c;
      ctx.fillRect(parseInt(parts[0]), parseInt(parts[1]), 1, 1);
    });
    db.ref('art_pixels/'+ROOM_ID).on('child_changed', function(snap){
      var key = snap.key, val = snap.val();
      if(!val) return;
      pixelData[key] = val.c;
      var parts = key.split('_');
      ctx.fillStyle = val.c;
      ctx.fillRect(parseInt(parts[0]), parseInt(parts[1]), 1, 1);
    });
  } else {
    db.ref('art_strokes/'+ROOM_ID).on('child_added', function(snap){
      var stroke = snap.val();
      if(!stroke) return;
      allStrokes[snap.key] = stroke;
      drawFullStroke(stroke);
    });
    db.ref('art_strokes/'+ROOM_ID).on('child_removed', function(snap){
      delete allStrokes[snap.key];
      redrawAll();
    });
    db.ref('art_strokes/'+ROOM_ID).on('value', function(snap){
      if(!snap.exists()){ allStrokes={}; ctx.clearRect(0,0,canvas.width/DPR,canvas.height/DPR); }
    });
  }

  // Chat
  db.ref('art_chat/'+ROOM_ID).limitToLast(50).on('child_added', function(snap){
    appendChatMsg(snap.val());
  });
}

function appendChatMsg(msg){
  var el = document.getElementById('chat-msgs');
  var div = document.createElement('div');
  div.className='chat-msg';
  div.innerHTML = '<b style="color:'+colorForUid(msg.uid||'x')+'">'+esc(msg.name||'Guest')+':</b> '+esc(msg.text||'');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', function(e){ if(e.key==='Enter') sendChat(); });
function sendChat(){
  var inp = document.getElementById('chat-input');
  var text = inp.value.trim();
  if(!text) return;
  db.ref('art_chat/'+ROOM_ID).push({ uid: myUid, name: myName, text: text, ts: firebase.database.ServerValue.TIMESTAMP });
  inp.value='';
}

// ══════════════════════════ PRESENCE (live cursors) ══════════════════════════
var presenceUsers = {};
var lastCursorSend = 0;
function updateMyCursorFirebase(x,y,drawing){
  var now = Date.now();
  if(now - lastCursorSend < 60) return; // throttle
  lastCursorSend = now;
  db.ref('art_presence/'+ROOM_ID+'/'+myUid).set({ name: myName, x:x, y:y, drawing: !!drawing, ts: firebase.database.ServerValue.TIMESTAMP });
}
function startPresence(){
  var myRef = db.ref('art_presence/'+ROOM_ID+'/'+myUid);
  myRef.onDisconnect().remove();
  db.ref('art_presence/'+ROOM_ID).on('value', function(snap){
    var val = snap.val() || {};
    var now = Date.now();
    var active = {};
    Object.keys(val).forEach(function(uid){
      if(uid===myUid) return;
      if(now - (val[uid].ts||0) > 15000) return; // stale
      active[uid] = val[uid];
    });
    presenceUsers = active;
    renderPresenceStack();
    renderRemoteCursors();
  });
  // Heartbeat so I stay "present" even if idle
  setInterval(function(){
    db.ref('art_presence/'+ROOM_ID+'/'+myUid+'/ts').set(firebase.database.ServerValue.TIMESTAMP);
  }, 8000);
}

function renderPresenceStack(){
  var stack = document.getElementById('presence-stack');
  var uids = Object.keys(presenceUsers).slice(0,5);
  stack.innerHTML = uids.map(function(uid){
    var u = presenceUsers[uid];
    var initial = (u.name||'?').charAt(0).toUpperCase();
    return '<div class="presence-dot" style="background:'+colorForUid(uid)+'" title="'+esc(u.name||'Guest')+'">'+initial+'</div>';
  }).join('');
}

function renderRemoteCursors(){
  cctx.clearRect(0,0,cursorCanvas.width, cursorCanvas.height);
  var scaleX = (cursorCanvas.width/DPR) / (MODE==='pixel' ? GRID : 1200);
  var scaleY = (cursorCanvas.height/DPR) / (MODE==='pixel' ? GRID : 800);
  cctx.save();
  cctx.scale(DPR,DPR);
  Object.keys(presenceUsers).forEach(function(uid){
    var u = presenceUsers[uid];
    if(u.x==null||u.y==null) return;
    var px = u.x*scaleX, py = u.y*scaleY;
    if(MODE==='pixel'){ px = (u.x+0.5)*scaleX; py=(u.y+0.5)*scaleY; }
    cctx.beginPath();
    cctx.arc(px,py, u.drawing?6:4, 0, Math.PI*2);
    cctx.fillStyle = colorForUid(uid);
    cctx.globalAlpha = u.drawing?0.9:0.55;
    cctx.fill();
    cctx.globalAlpha=1;
    cctx.font = '600 10px IBM Plex Sans, sans-serif';
    cctx.fillStyle = colorForUid(uid);
    cctx.fillText(u.name||'Guest', px+8, py-6);
  });
  cctx.restore();
}
setInterval(renderRemoteCursors, 100);

// ══════════════════════════ MISC UI ══════════════════════════
document.getElementById('btn-share').addEventListener('click', function(){
  document.getElementById('share-modal').classList.add('open');
});
document.querySelectorAll('[data-close]').forEach(function(b){
  b.addEventListener('click', function(){ document.getElementById(b.dataset.close).classList.remove('open'); });
});
document.getElementById('share-copy').addEventListener('click', function(){
  var inp = document.getElementById('share-url');
  inp.select();
  navigator.clipboard.writeText(inp.value).then(function(){ showToast('Link copied!'); }).catch(function(){
    document.execCommand('copy'); showToast('Link copied!');
  });
});
document.getElementById('btn-panel-toggle').addEventListener('click', function(){
  document.getElementById('side-panel').classList.toggle('open');
});
if(window.innerWidth>820) document.getElementById('side-panel').classList.add('open');

document.getElementById('btn-download').addEventListener('click', function(){
  var a = document.createElement('a');
  a.download = (roomData?roomData.name:'art')+'.png';
  if(MODE==='pixel'){
    // export at higher resolution for pixel mode so it's not a tiny image
    var exportCanvas = document.createElement('canvas');
    var scale = 16;
    exportCanvas.width = GRID*scale; exportCanvas.height = GRID*scale;
    var ectx = exportCanvas.getContext('2d');
    ectx.imageSmoothingEnabled = false;
    ectx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
    a.href = exportCanvas.toDataURL('image/png');
  } else {
    a.href = canvas.toDataURL('image/png');
  }
  a.click();
  showToast('Downloaded!');
});
</script>
