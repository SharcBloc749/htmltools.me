<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Museum — HTMLTools Art</title>
<link rel="icon" type="image/png" href="/logo3.png?v=2"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0c;--surface:#111;--panel:#171717;--panel2:#1e1e1e;
  --border:#252525;--border2:#2e2e2e;--borderhi:#404040;
  --tx:#e8e8e8;--tx2:#888;--tx3:#4a4a4a;
  --white:#fff;--wfg:#0c0c0c;
  --green:#16a34a;--greenhi:#22c55e;
  --red:#dc2626;--redhi:#ef4444;
  --gold:#fbbf24;
  --r:4px;--r-md:7px;--r-lg:10px;--r-xl:14px;
  --nav-h:48px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;min-height:100%;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(255,255,255,.12);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--borderhi);}

nav{height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:7px;padding-right:12px;margin-right:4px;border-right:1px solid var(--border);flex-shrink:0;}
.nav-mark{width:24px;height:24px;border-radius:5px;overflow:hidden;flex-shrink:0;}
.nav-mark img{width:24px;height:24px;object-fit:contain;display:block;}
.nav-name{font-size:.78rem;font-weight:600;color:var(--tx2);}
.nav-tab{padding:5px 10px;border-radius:var(--r);font-size:12.5px;font-weight:500;color:var(--tx3);cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid transparent;user-select:none;min-height:29px;background:transparent;}
.nav-tab:hover{color:var(--tx2);background:var(--panel);}
.nav-tab.active{color:var(--tx);background:var(--panel);border-color:var(--border);}
.nav-spacer{flex:1;}
.nav-user-email{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;color:var(--tx3);}
.admin-pill{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);padding:2px 7px;border-radius:20px;display:none;align-items:center;gap:4px;}
.btn{background:var(--panel);border:1px solid var(--border2);color:var(--tx2);padding:0 11px;border-radius:var(--r);font-size:12px;font-weight:500;font-family:var(--font);transition:all .13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:28px;}
.btn:hover{background:var(--panel2);border-color:var(--borderhi);color:var(--tx);}
.btn-prim{background:var(--white);color:var(--wfg);border-color:var(--white);font-weight:600;}
.btn-prim:hover{opacity:.88;background:var(--white);color:var(--wfg);border-color:var(--white);}
.btn-danger{color:var(--redhi);border-color:rgba(220,38,38,.2);background:transparent;}
.btn-danger:hover{background:rgba(220,38,38,.06);border-color:var(--redhi);}
.btn-sm{height:25px;font-size:11px;padding:0 8px;}

/* HERO / STATS */
.hero{padding:44px 20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);background-size:26px 26px;mask-image:radial-gradient(ellipse 60% 70% at 50% 20%,#000 0%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 20%,#000 0%,transparent 75%);opacity:.6;pointer-events:none;}
.hero-badge{position:relative;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);background:var(--panel);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}
.hero h1{position:relative;font-size:clamp(1.9rem,5vw,2.9rem);font-weight:700;letter-spacing:-.04em;line-height:1.05;}
.hero p{position:relative;font-size:.88rem;color:var(--tx2);max-width:460px;line-height:1.6;}
.stats-row{position:relative;display:flex;gap:26px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.stat b{font-family:var(--mono);font-size:1.3rem;font-weight:600;}
.stat span{font-size:.65rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;}

/* CONTROLS */
.controls-wrap{max-width:1080px;margin:0 auto;width:100%;padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.search-input-wrap{position:relative;flex:1;min-width:200px;}
.search-input-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:.8rem;}
input.search-input{width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.82rem;padding:0 10px 0 30px;height:34px;border-radius:var(--r-md);outline:none;transition:border-color .13s;}
input.search-input:focus{border-color:var(--borderhi);}
input.search-input::placeholder{color:var(--tx3);}
select.sel{background:var(--surface);border:1px solid var(--border2);color:var(--tx);font-family:var(--font);font-size:.78rem;padding:0 10px;height:34px;border-radius:var(--r-md);outline:none;cursor:pointer;}
.seg{display:flex;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-md);padding:2px;gap:2px;}
.seg button{background:transparent;border:none;color:var(--tx3);padding:6px 10px;border-radius:5px;font-size:.75rem;font-weight:600;font-family:var(--font);transition:all .13s;}
.seg button.active{background:var(--white);color:var(--wfg);}

/* GRID */
.gallery-wrap{max-width:1080px;margin:0 auto;width:100%;padding:14px 20px 70px;flex:1;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:860px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.gallery-grid{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:all .15s;}
.card:hover{border-color:var(--borderhi);transform:translateY(-2px);}
.card-thumb{width:100%;aspect-ratio:4/3;background:#141414;position:relative;overflow:hidden;
  background-image:linear-gradient(45deg,#1a1a1a 25%,transparent 25%),linear-gradient(-45deg,#1a1a1a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1a1a 75%),linear-gradient(-45deg,transparent 75%,#1a1a1a 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;
}
.card-thumb canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
.card-thumb .mode-tag{position:absolute;top:7px;left:7px;font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;background:rgba(12,12,12,.75);border:1px solid var(--border2);color:var(--tx2);padding:2px 7px;border-radius:20px;backdrop-filter:blur(4px);}
.card-thumb .thumb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:1.2rem;}
.card-body{padding:11px 12px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-title{font-size:.85rem;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-meta{display:flex;align-items:center;justify-content:space-between;font-size:.68rem;color:var(--tx3);}
.contributors{display:flex;align-items:center;}
.contrib-dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;flex-shrink:0;}
.contrib-dot:first-child{margin-left:0;}
.contrib-names{font-size:.68rem;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-left:6px;}
.card-foot{display:flex;gap:6px;align-items:center;padding-top:2px;}
.like-btn{background:transparent;border:1px solid var(--border2);color:var(--tx3);border-radius:20px;padding:0 9px;height:26px;font-size:.7rem;display:inline-flex;align-items:center;gap:5px;transition:all .13s;}
.like-btn:hover{border-color:var(--redhi);color:var(--redhi);}
.like-btn.liked{color:var(--redhi);border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.06);}
.card-foot .btn{flex:1;justify-content:center;}
.admin-row{display:flex;gap:6px;padding:0 12px 11px;}
.admin-row button{flex:1;justify-content:center;font-size:.68rem;height:25px;}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 20px;text-align:center;color:var(--tx3);}
.empty-state i{font-size:1.8rem;opacity:.4;}
.empty-state span{font-size:.82rem;}

footer{padding:6px 14px;font-size:.68rem;color:var(--tx3);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);}
footer strong{color:var(--tx2);font-weight:500;}
footer .dot{color:var(--borderhi);}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border2);padding:7px 14px;border-radius:var(--r-md);font-size:.78rem;font-weight:500;z-index:9999;opacity:0;transition:all .2s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <a href="/Art"><div class="nav-mark"><img src="https://htmltools.me/logo3.png" alt="HT"/></div></a>
    <span class="nav-name">HTML Tools</span>
  </div>
  <a href="/Art" class="nav-tab">Art</a>
  <div class="nav-tab active">Museum</div>
  <div class="nav-spacer"></div>
  <span class="admin-pill" id="admin-pill"><i class="fas fa-shield-halved"></i> Curator</span>
  <span class="nav-user-email" id="nav-email"></span>
  <button class="btn btn-sm" id="signin-btn">Sign in</button>
  <button class="btn btn-sm btn-danger" id="signout-btn" style="display:none;">Sign out</button>
</nav>

<div class="hero">
  <span class="hero-badge">PUBLIC GALLERY</span>
  <h1>The Museum</h1>
  <p>Every public canvas anyone has drawn on, saved and browsable. Open a piece to keep adding to it, or start something new from the Art tab.</p>
  <div class="stats-row">
    <div class="stat"><b id="stat-rooms">—</b><span>Pieces</span></div>
    <div class="stat"><b id="stat-artists">—</b><span>Artists</span></div>
    <div class="stat"><b id="stat-views">—</b><span>Views</span></div>
  </div>
</div>

<div class="controls-wrap">
  <div class="search-input-wrap">
    <i class="fas fa-magnifying-glass"></i>
    <input class="search-input" id="search-input" placeholder="Search by name or artist…"/>
  </div>
  <div class="seg" id="mode-filter">
    <button class="active" data-m="all">All</button>
    <button data-m="pixel">Pixel</button>
    <button data-m="freehand">Freehand</button>
  </div>
  <select class="sel" id="sort-select">
    <option value="new">Newest</option>
    <option value="views">Most viewed</option>
    <option value="likes">Most loved</option>
    <option value="artists">Most artists</option>
  </select>
</div>

<div class="gallery-wrap">
  <div class="gallery-grid" id="gallery-grid">
    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><span>Loading the gallery…</span></div>
  </div>
</div>

<footer><strong>HTML Tools</strong><span class="dot">&middot;</span><span>Museum</span><span class="dot">&middot;</span><span>built by Matthew</span></footer>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
var FB_CONFIG = {
  apiKey:"AIzaSyD5a8c91a66S6DeTbXN_ltfA8kwqoenl7s",
  authDomain:"website-encryption-htmltools.firebaseapp.com",
  databaseURL:"https://website-encryption-htmltools-default-rtdb.firebaseio.com",
  projectId:"website-encryption-htmltools",
  storageBucket:"website-encryption-htmltools.firebasestorage.app",
  messagingSenderId:"211271935323",
  appId:"1:211271935323:web:1abb9d416087ea89c0e67e"
};
firebase.initializeApp(FB_CONFIG);
var db = firebase.database();
var auth = firebase.auth();
var ADMIN_EMAIL = 'matthewbozhe@gmail.com';

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var _toastTimer;
function showToast(msg,dur){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){t.classList.remove('show');},dur||2200);}
var USER_COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#06b6d4','#84cc16'];
function colorForUid(uid){var h=0;for(var i=0;i<uid.length;i++)h=uid.charCodeAt(i)+((h<<5)-h);return USER_COLORS[Math.abs(h)%USER_COLORS.length];}
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  var m=Math.floor(s/60); if(m<60) return m+'m ago';
  var h=Math.floor(m/60); if(h<24) return h+'h ago';
  var d=Math.floor(h/24); if(d<30) return d+'d ago';
  var mo=Math.floor(d/30); if(mo<12) return mo+'mo ago';
  return Math.floor(mo/12)+'y ago';
}

// ── AUTH ──
var myUid = null, myName = 'Guest', isAdmin = false;
auth.onAuthStateChanged(function(user){
  if(user){
    myUid = user.uid;
    myName = user.isAnonymous ? ('Guest-'+user.uid.slice(0,4)) : (user.displayName||user.email||'User');
    isAdmin = !user.isAnonymous && user.email===ADMIN_EMAIL;
    document.getElementById('nav-email').textContent = user.isAnonymous ? '' : myName;
    document.getElementById('signin-btn').style.display = user.isAnonymous ? 'inline-flex' : 'none';
    document.getElementById('signout-btn').style.display = user.isAnonymous ? 'none' : 'inline-flex';
    document.getElementById('admin-pill').style.display = isAdmin ? 'inline-flex' : 'none';
    loadRooms();
  } else {
    auth.signInAnonymously().catch(function(e){ showToast('Could not connect: '+e.message); });
  }
});
document.getElementById('signin-btn').addEventListener('click', async function(){
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); showToast('Signed in!'); }
  catch(e){ if(e.code!=='auth/popup-closed-by-user') showToast('Sign in failed.'); }
});
document.getElementById('signout-btn').addEventListener('click', async function(){
  await auth.signOut();
  auth.signInAnonymously();
  showToast('Signed out.');
});

// ── LOAD ROOMS ──
var allRooms = [];
var thumbCache = {};
var rendered = false;

function loadRooms(){
  db.ref('art_rooms').on('value', function(snap){
    var val = snap.val() || {};
    allRooms = Object.keys(val).map(function(id){
      var r = val[id]; r.id = id; return r;
    }).filter(function(r){ return r.visibility==='public'; });
    renderStats();
    applyFiltersAndRender();
  });
}

function renderStats(){
  var artists = {};
  var totalViews = 0;
  allRooms.forEach(function(r){
    totalViews += (r.views||0);
    Object.keys(r.contributors||{}).forEach(function(uid){ artists[uid]=true; });
  });
  document.getElementById('stat-rooms').textContent = allRooms.length;
  document.getElementById('stat-artists').textContent = Object.keys(artists).length;
  document.getElementById('stat-views').textContent = totalViews;
}

// ── FILTER / SORT ──
var filterMode = 'all', sortBy = 'new', searchQ = '';
document.getElementById('mode-filter').querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(){
    document.getElementById('mode-filter').querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    filterMode = b.dataset.m;
    applyFiltersAndRender();
  });
});
document.getElementById('sort-select').addEventListener('change', function(){ sortBy=this.value; applyFiltersAndRender(); });
document.getElementById('search-input').addEventListener('input', function(){ searchQ=this.value.trim().toLowerCase(); applyFiltersAndRender(); });

function applyFiltersAndRender(){
  var list = allRooms.slice();
  if(filterMode!=='all') list = list.filter(function(r){ return r.mode===filterMode; });
  if(searchQ){
    list = list.filter(function(r){
      var names = Object.values(r.contributors||{}).join(' ').toLowerCase();
      return (r.name||'').toLowerCase().indexOf(searchQ)>-1 || names.indexOf(searchQ)>-1;
    });
  }
  list.sort(function(a,b){
    if(sortBy==='views') return (b.views||0)-(a.views||0);
    if(sortBy==='likes') return Object.keys(b.likes||{}).length - Object.keys(a.likes||{}).length;
    if(sortBy==='artists') return Object.keys(b.contributors||{}).length - Object.keys(a.contributors||{}).length;
    return (b.created||0)-(a.created||0);
  });
  renderGallery(list);
}

// ── RENDER GALLERY ──
function renderGallery(list){
  var grid = document.getElementById('gallery-grid');
  if(list.length===0){
    grid.innerHTML = '<div class="empty-state"><i class="fas fa-panorama"></i><span>No public art matches yet. Go start something on the Art tab.</span></div>';
    return;
  }
  grid.innerHTML = list.map(function(r){ return cardHtml(r); }).join('');

  list.forEach(function(r){
    var likeBtn = grid.querySelector('.like-btn[data-id="'+r.id+'"]');
    if(likeBtn) likeBtn.addEventListener('click', function(){ toggleLike(r.id); });
    var openBtn = grid.querySelector('.open-btn[data-id="'+r.id+'"]');
    if(openBtn) openBtn.addEventListener('click', function(){ openRoom(r); });
    if(isAdmin){
      var privBtn = grid.querySelector('.priv-btn[data-id="'+r.id+'"]');
      if(privBtn) privBtn.addEventListener('click', function(){ togglePrivate(r); });
      var delBtn = grid.querySelector('.del-btn[data-id="'+r.id+'"]');
      if(delBtn) delBtn.addEventListener('click', function(){ deleteRoom(r); });
    }
    renderThumb(r);
  });
}

function cardHtml(r){
  var contributors = r.contributors || {};
  var uids = Object.keys(contributors);
  var dots = uids.slice(0,4).map(function(uid){
    var nm = contributors[uid] || '?';
    return '<div class="contrib-dot" style="background:'+colorForUid(uid)+'" title="'+esc(nm)+'">'+esc(nm.charAt(0).toUpperCase())+'</div>';
  }).join('');
  var names = uids.map(function(uid){ return contributors[uid]; }).filter(Boolean).join(', ') || 'No artists yet';
  var likedByMe = !!(r.likes && r.likes[myUid]);
  var likeCount = Object.keys(r.likes||{}).length;

  return '' +
    '<div class="card" data-id="'+r.id+'">' +
      '<div class="card-thumb" id="thumb-'+r.id+'">' +
        '<div class="mode-tag">'+(r.mode==='pixel'?'Pixel':'Freehand')+'</div>' +
        '<div class="thumb-loading"><i class="fas fa-spinner fa-spin"></i></div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-title" title="'+esc(r.name||'Untitled')+'">'+esc(r.name||'Untitled')+'</div>' +
        '<div class="card-meta"><span>'+timeAgo(r.created)+'</span><span><i class="fas fa-eye" style="opacity:.6;margin-right:3px;"></i>'+(r.views||0)+'</span></div>' +
        '<div style="display:flex;align-items:center;">' +
          '<div class="contributors">'+dots+'</div>' +
          '<div class="contrib-names">'+esc(names)+'</div>' +
        '</div>' +
        '<div class="card-foot">' +
          '<button class="like-btn'+(likedByMe?' liked':'')+'" data-id="'+r.id+'"><i class="fa'+(likedByMe?'s':'r')+' fa-heart"></i> <span>'+likeCount+'</span></button>' +
          '<button class="btn btn-prim open-btn" data-id="'+r.id+'">Open</button>' +
        '</div>' +
      '</div>' +
      (isAdmin ? (
        '<div class="admin-row">' +
          '<button class="btn priv-btn" data-id="'+r.id+'"><i class="fas fa-lock"></i> Make private</button>' +
          '<button class="btn btn-danger del-btn" data-id="'+r.id+'"><i class="fas fa-trash"></i> Delete</button>' +
        '</div>'
      ) : '') +
    '</div>';
}

function openRoom(r){
  var params = new URLSearchParams();
  params.set('mode', r.mode);
  params.set('room', r.id);
  params.set('name', r.name||'Untitled');
  params.set('vis', 'public');
  window.location.href = '/Art/Create?'+params.toString();
}

function toggleLike(id){
  var ref = db.ref('art_rooms/'+id+'/likes/'+myUid);
  ref.once('value').then(function(snap){
    if(snap.exists()) ref.remove(); else ref.set(true);
  });
}

function togglePrivate(r){
  if(!isAdmin) return;
  var newVis = r.visibility==='private' ? 'public' : 'private';
  if(!confirm((newVis==='private' ? 'Hide' : 'Un-hide')+' "'+(r.name||'Untitled')+'" from the public museum?')) return;
  db.ref('art_rooms/'+r.id+'/visibility').set(newVis).then(function(){
    showToast(newVis==='private' ? 'Made private' : 'Made public');
  });
}

function deleteRoom(r){
  if(!isAdmin) return;
  if(!confirm('Permanently delete "'+(r.name||'Untitled')+'"? This removes all pixels/strokes and cannot be undone.')) return;
  Promise.all([
    db.ref('art_rooms/'+r.id).remove(),
    db.ref('art_pixels/'+r.id).remove(),
    db.ref('art_strokes/'+r.id).remove(),
    db.ref('art_chat/'+r.id).remove(),
    db.ref('art_presence/'+r.id).remove()
  ]).then(function(){ showToast('Deleted'); });
}

// ── THUMBNAILS ──
function renderThumb(r){
  var host = document.getElementById('thumb-'+r.id);
  if(!host) return;
  if(thumbCache[r.id]){ paintThumb(host, r, thumbCache[r.id]); return; }

  if(r.mode==='pixel'){
    db.ref('art_pixels/'+r.id).once('value').then(function(snap){
      var data = snap.val() || {};
      thumbCache[r.id] = data;
      paintThumb(host, r, data);
    }).catch(function(){ removeLoading(host); });
  } else {
    db.ref('art_strokes/'+r.id).once('value').then(function(snap){
      var data = snap.val() || {};
      thumbCache[r.id] = data;
      paintThumb(host, r, data);
    }).catch(function(){ removeLoading(host); });
  }
}
function removeLoading(host){ var l = host.querySelector('.thumb-loading'); if(l) l.remove(); }

function paintThumb(host, r, data){
  removeLoading(host);
  var cv = document.createElement('canvas');
  host.appendChild(cv);
  var gctx = cv.getContext('2d');

  if(r.mode==='pixel'){
    var grid = r.gridSize || 32;
    cv.width = grid; cv.height = grid;
    gctx.imageSmoothingEnabled = false;
    Object.keys(data).forEach(function(key){
      var parts = key.split('_');
      var val = data[key];
      if(!val || !val.c) return;
      gctx.fillStyle = val.c;
      gctx.fillRect(parseInt(parts[0]), parseInt(parts[1]), 1, 1);
    });
    if(Object.keys(data).length===0){
      gctx.fillStyle = 'rgba(255,255,255,.04)';
      gctx.fillRect(0,0,grid,grid);
    }
  } else {
    var W=300, H=225, scale=W/1200;
    cv.width = W; cv.height = H;
    gctx.lineCap='round'; gctx.lineJoin='round';
    var keys = Object.keys(data);
    if(keys.length===0){
      gctx.fillStyle = 'rgba(255,255,255,.04)';
      gctx.fillRect(0,0,W,H);
    }
    keys.forEach(function(id){
      var stroke = data[id];
      if(!stroke || !stroke.points || !stroke.points.length) return;
      gctx.lineWidth = Math.max(1, stroke.size*scale);
      gctx.globalAlpha = stroke.alpha==null?1:stroke.alpha;
      gctx.globalCompositeOperation = (stroke.color==='__ERASER__') ? 'destination-out' : 'source-over';
      gctx.strokeStyle = (stroke.color==='__ERASER__') ? 'rgba(0,0,0,1)' : stroke.color;
      gctx.fillStyle = gctx.strokeStyle;
      if(stroke.points.length===1){
        gctx.beginPath();
        gctx.arc(stroke.points[0][0]*scale, stroke.points[0][1]*scale, (stroke.size*scale)/2, 0, Math.PI*2);
        gctx.fill();
      } else {
        gctx.beginPath();
        gctx.moveTo(stroke.points[0][0]*scale, stroke.points[0][1]*scale);
        for(var i=1;i<stroke.points.length;i++) gctx.lineTo(stroke.points[i][0]*scale, stroke.points[i][1]*scale);
        gctx.stroke();
      }
      gctx.globalCompositeOperation='source-over';
      gctx.globalAlpha=1;
    });
  }
}
